<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ink Animal Studio · FEI TeamArt</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

<!-- Art GPS access control (loaded before this page's script so FEIAccess is available) -->
<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<!-- Ink Animal Studio's own data + course-specific purchase check -->
<script src="../../../core/ink-animal-lessons.js"></script>
<script src="../../../core/ink-animal-access.js"></script>

<style>
:root {
  --ink: #1a1a1a;
  --charcoal: #4a4a48;
  --charcoal-soft: #74716c;
  --paper: #f5f0e4;
  --paper-soft: #ece3d1;
  --ochre: #b8935a;
  --vermilion: #b8401f;
  --border: rgba(26,26,26,0.12);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--paper);
  /* Subtle paper-fiber texture — cheap CSS, no image asset. */
  background-image:
    repeating-linear-gradient(0deg, rgba(26,26,26,0.025) 0px, rgba(26,26,26,0.025) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(26,26,26,0.02) 0px, rgba(26,26,26,0.02) 1px, transparent 1px, transparent 3px);
  color: var(--ink);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
.hanzi { font-family: 'Noto Serif SC', serif; }

/* ── Topbar (same shell every step uses) ───────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  background: rgba(245,240,228,0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.back-link {
  text-decoration: none; color: var(--ink); font-weight: 800; font-size: 13px;
  font-family: 'Montserrat', sans-serif;
}
.topbar-title {
  font-weight: 800; font-size: 13px; letter-spacing: 0.3px;
  color: var(--charcoal-soft);
}

.content-wrap { max-width: 480px; margin: 0 auto; padding: 20px 20px 80px; }
@media (min-width: 768px) { .content-wrap { max-width: 640px; padding: 32px 32px 100px; } }

.screen { display: none; }
.screen.active { display: block; animation: stepFadeIn .35s ease; }
@keyframes stepFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Shared building blocks ─────────────────────────────────── */
.card {
  background: #fff; border-radius: var(--radius-lg);
  padding: 22px; box-shadow: 0 4px 20px rgba(26,26,26,0.06);
  margin-bottom: 16px;
}
.step-title { font-weight: 900; font-size: 20px; margin-bottom: 6px; line-height: 1.2; }
.step-sub { font-size: 13px; color: var(--charcoal-soft); line-height: 1.5; margin-bottom: 16px; }
.btn {
  display: block; width: 100%; text-align: center; padding: 15px 18px;
  border-radius: var(--radius-md); font-weight: 800; font-size: 14px;
  cursor: pointer; border: none; text-decoration: none; color: inherit;
  -webkit-tap-highlight-color: transparent; transition: transform .15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-ink { background: var(--ink); color: #fff; }
.btn-vermilion { background: var(--vermilion); color: #fff; }
.btn-ghost { background: rgba(26,26,26,0.05); color: var(--ink); }

/* ── COURSE ENTRANCE — ink drop on paper ────────────────────── */
.entrance-stage {
  height: 46vh; min-height: 260px; max-height: 380px;
  display: flex; align-items: center; justify-content: center;
  position: relative; margin-bottom: 22px;
}
.ink-drop-svg { width: 180px; height: 180px; }
.ink-drop-core {
  transform-origin: center; transform-box: fill-box;
  animation: inkDropCore 1.8s ease-out forwards;
}
.ink-drop-ring {
  transform-origin: center; transform-box: fill-box;
  opacity: 0;
  animation: inkDropRing 1.8s ease-out forwards;
}
.ink-drop-ring.r2 { animation-delay: .15s; }
.ink-drop-ring.r3 { animation-delay: .3s; }
@keyframes inkDropCore {
  0%   { transform: scale(0); opacity: 0; }
  35%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes inkDropRing {
  0%   { transform: scale(0.2); opacity: 0.55; }
  100% { transform: scale(3.2); opacity: 0; }
}
.entrance-headline {
  text-align: center; font-weight: 900; font-size: 26px; line-height: 1.25;
  margin-bottom: 10px; opacity: 0; animation: entranceTextIn .6s ease forwards; animation-delay: 1.1s;
}
.entrance-sub {
  text-align: center; font-size: 13.5px; color: var(--charcoal-soft); line-height: 1.7;
  max-width: 360px; margin: 0 auto 26px;
  opacity: 0; animation: entranceTextIn .6s ease forwards; animation-delay: 1.35s;
}
@keyframes entranceTextIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.entrance-cta { opacity: 0; animation: entranceTextIn .6s ease forwards; animation-delay: 1.6s; }

/* ── ARTIST INTRO — flip cards + expression picker ──────────────── */
.artist-cards-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 20px;
}
.artist-flip-card {
  perspective: 900px; height: 148px; cursor: pointer;
  opacity: 0; animation: entranceTextIn .5s ease forwards;
}
.artist-flip-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
}
.artist-flip-card.flipped .artist-flip-inner { transform: rotateY(180deg); }
.artist-flip-front, .artist-flip-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius-md); padding: 14px 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; box-shadow: 0 4px 16px rgba(26,26,26,0.08);
}
.artist-flip-front { background: #fff; border: 1.5px solid var(--border); }
.artist-flip-back { background: var(--ink); color: #fff; transform: rotateY(180deg); }
.artist-flip-icon { font-size: 26px; margin-bottom: 8px; }
.artist-flip-q { font-weight: 800; font-size: 12.5px; line-height: 1.35; }
.artist-flip-a { font-size: 11.5px; line-height: 1.55; }
.artist-flip-hint { font-size: 9px; letter-spacing: .5px; text-transform: uppercase; opacity: .5; margin-top: 6px; }

.artist-ref-slot {
  display: flex; align-items: center; gap: 12px;
  background: var(--paper-soft); border: 1.5px dashed var(--ochre);
  border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 20px;
}
.artist-ref-icon { font-size: 22px; flex-shrink: 0; }
.artist-ref-label { font-weight: 800; font-size: 12.5px; color: var(--ink); }
.artist-ref-note { font-size: 10.5px; color: var(--charcoal-soft); margin-top: 2px; }

.expression-prompt { text-align: center; margin-bottom: 12px; }
.expression-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.expression-btn {
  position: relative; width: 54px; height: 54px; border-radius: 50%;
  background: #fff; border: 2px solid var(--border); font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .2s ease, border-color .2s ease, background .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.expression-btn.picked { border-color: var(--vermilion); background: rgba(184,64,31,0.08); animation: expressionBounce .5s ease; }
@keyframes expressionBounce { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.expression-splash {
  position: absolute; inset: -10px; border-radius: 50%;
  background: radial-gradient(circle, rgba(184,64,31,0.35) 0%, transparent 70%);
  opacity: 0; pointer-events: none;
  animation: splashOut .55s ease forwards;
}
@keyframes splashOut { 0% { opacity: .9; transform: scale(0.3); } 100% { opacity: 0; transform: scale(1.6); } }
.expression-reaction { text-align: center; font-size: 12.5px; color: var(--charcoal-soft); min-height: 18px; margin-bottom: 18px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../">← Studio</a>
  <div class="topbar-title" id="topbar-title">Ink Animal Studio</div>
  <div style="width:60px;"></div>
</div>

<div class="content-wrap">
  <div id="step-content"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// INK ANIMAL STUDIO — course-level flow (shown once). Per-animal steps
// (BuildAnAnimal, TeacherLesson, upload, stamp) live in lesson/index.html
// instead, driven generically by core/ink-animal-lessons.js — that's
// what lets animals 02-10 be added as pure content later.
// ═══════════════════════════════════════════════════════════════════

const COURSE_STEPS = [
  { type: 'courseEntrance' },
  { type: 'artistIntro' },
  { type: 'artworkObservation' },
  { type: 'inkExperiment' },
  { type: 'ricePaperExperiment' },
  { type: 'inkPlayground' },
  { type: 'courseScroll' }
];

let currentStepIndex = 0;

function renderCourseStep() {
  const step = COURSE_STEPS[currentStepIndex];
  const el = document.getElementById('step-content');
  switch (step.type) {
    case 'courseEntrance':      el.innerHTML = renderCourseEntrance(); break;
    case 'artistIntro':         el.innerHTML = renderArtistIntro(); break;
    case 'artworkObservation':  el.innerHTML = renderComingNext('Look Like an Artist', 'artworkObservation'); break;
    case 'inkExperiment':       el.innerHTML = renderComingNext('More Ink, More Water', 'inkExperiment'); break;
    case 'ricePaperExperiment': el.innerHTML = renderComingNext('Drop the Ink', 'ricePaperExperiment'); break;
    case 'inkPlayground':       el.innerHTML = renderComingNext('Ink Playground', 'inkPlayground'); break;
    case 'courseScroll':        el.innerHTML = renderComingNext('Choose Your Animal', 'courseScroll'); break;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNextCourseStep() {
  if (currentStepIndex < COURSE_STEPS.length - 1) {
    currentStepIndex++;
    renderCourseStep();
  }
}

// ─── 1. COURSE ENTRANCE — ink drop on paper ───────────────────────
function renderCourseEntrance() {
  return `
    <div class="entrance-stage">
      <svg class="ink-drop-svg" viewBox="0 0 200 200">
        <circle class="ink-drop-ring r3" cx="100" cy="100" r="30" fill="none" style="stroke: var(--ink);" stroke-width="1.5"/>
        <circle class="ink-drop-ring r2" cx="100" cy="100" r="30" fill="none" style="stroke: var(--ink);" stroke-width="1.5"/>
        <circle class="ink-drop-ring" cx="100" cy="100" r="30" fill="none" style="stroke: var(--ink);" stroke-width="1.5"/>
        <circle class="ink-drop-core" cx="100" cy="100" r="26" style="fill: var(--ink);"/>
      </svg>
    </div>
    <h1 class="entrance-headline">Welcome to the<br>Ink Animal Studio</h1>
    <p class="entrance-sub">One drop of ink. One sheet of paper. Ten animals waiting to be found — starting with the rabbit.</p>
    <div class="entrance-cta">
      <button class="btn btn-ink" onclick="goNextCourseStep()">Begin</button>
    </div>
  `;
}

// ─── 2. ARTIST INTRO — Meet Huang Yongyu ───────────────────────────
const ARTIST_CARDS = [
  {
    icon: '🖌️', q: 'Who was he?',
    a: 'Huang Yongyu was a real Chinese artist. He loved ink and animals his whole life, and he never stopped drawing.'
  },
  {
    icon: '🐰', q: 'What did he love to draw?',
    a: "Animals — rabbits, roosters, tigers, and more. He even painted animals for real Chinese postage stamps!"
  },
  {
    icon: '😄', q: 'Why do his animals feel different?',
    a: "They aren't perfectly neat. They're funny and a little wobbly — like they could wink at you."
  },
  {
    icon: '🤫', q: 'His secret',
    a: "He never tried to make his animals look 'correct.' He let the ink go where it wanted — that's what made them feel alive."
  }
];

const EXPRESSIONS = [
  { key: 'funny', icon: '😆', label: 'Funny' },
  { key: 'proud', icon: '😌', label: 'Proud' },
  { key: 'sleepy', icon: '😴', label: 'Sleepy' },
  { key: 'shy', icon: '🙈', label: 'Shy' },
  { key: 'silly', icon: '🤪', label: 'Silly' }
];
const EXPRESSION_REACTIONS = {
  funny: 'A funny ink animal makes YOU smile too.',
  proud: 'A proud ink animal stands nice and tall.',
  sleepy: 'A sleepy ink animal has soft, droopy lines.',
  shy: 'A shy ink animal hides part of its face.',
  silly: 'A silly ink animal is never afraid to look a little strange.'
};

function renderArtistIntro() {
  const cardsHtml = ARTIST_CARDS.map((c, i) => `
    <div class="artist-flip-card" style="animation-delay:${0.05 * i}s" onclick="toggleArtistCard(${i})" id="artist-card-${i}">
      <div class="artist-flip-inner">
        <div class="artist-flip-front">
          <div class="artist-flip-icon">${c.icon}</div>
          <div class="artist-flip-q">${c.q}</div>
          <div class="artist-flip-hint">Tap</div>
        </div>
        <div class="artist-flip-back">
          <div class="artist-flip-a">${c.a}</div>
        </div>
      </div>
    </div>
  `).join('');

  const expressionsHtml = EXPRESSIONS.map(e => `
    <div class="expression-btn" id="expr-${e.key}" onclick="pickExpression('${e.key}')" title="${e.label}">
      ${e.icon}
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="step-title">Meet Huang Yongyu</div>
      <div class="step-sub">Every animal you paint in this studio follows in his footsteps. Tap each card to learn about him.</div>

      <div class="artist-cards-grid">${cardsHtml}</div>

      <div class="artist-ref-slot">
        <div class="artist-ref-icon">🖼️</div>
        <div>
          <div class="artist-ref-label">See a real example →</div>
          <div class="artist-ref-note">Reference link coming soon</div>
        </div>
      </div>

      <div class="expression-prompt">
        <div class="step-sub" style="margin-bottom:10px;">If YOUR ink animal could make a face, which one would it make?</div>
        <div class="expression-row">${expressionsHtml}</div>
        <div class="expression-reaction" id="expression-reaction"></div>
      </div>

      <button class="btn btn-ink" onclick="goNextCourseStep()">Continue</button>
    </div>
  `;
}

function toggleArtistCard(i) {
  const card = document.getElementById('artist-card-' + i);
  if (card) card.classList.toggle('flipped');
}

function pickExpression(key) {
  EXPRESSIONS.forEach(e => {
    const btn = document.getElementById('expr-' + e.key);
    if (btn) {
      btn.classList.remove('picked');
      const oldSplash = btn.querySelector('.expression-splash');
      if (oldSplash) oldSplash.remove();
    }
  });
  const picked = document.getElementById('expr-' + key);
  if (picked) {
    picked.classList.add('picked');
    const splash = document.createElement('div');
    splash.className = 'expression-splash';
    picked.appendChild(splash);
  }
  const reactionEl = document.getElementById('expression-reaction');
  if (reactionEl) reactionEl.textContent = EXPRESSION_REACTIONS[key] || '';
}

// Placeholder for not-yet-built steps — keeps the flow walkable while
// components 2+ are built one at a time (per the build order given).
function renderComingNext(title, key) {
  return `
    <div class="card" style="text-align:center; padding:40px 24px;">
      <div style="font-size:34px; margin-bottom:12px;">🖌️</div>
      <div class="step-title">${title}</div>
      <div class="step-sub">This part of the studio is being built next (${key}).</div>
      <button class="btn btn-ghost" onclick="goNextCourseStep()">Skip for now →</button>
    </div>
  `;
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'ink-animal-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  renderCourseStep();
}

init();
</script>
</body>
</html>
