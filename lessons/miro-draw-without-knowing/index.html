<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7ecd8;
  --paper-deep:#efe0c2;
  --black:#211d16;
  --red:#d9432c;
  --yellow:#f2c14e;
  --blue:#3f6fb0;
  --green:#4f8a52;
  --ink-soft:rgba(33,29,22,.66);
  --ink-faint:rgba(33,29,22,.42);
  --line:rgba(33,29,22,.16);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Mulish',sans-serif;background:var(--paper);color:var(--black);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden;
}
.display{font-family:'Kalam',cursive;}
button{font-family:'Mulish',sans-serif;}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;position:sticky;top:0;z-index:500;
  background:linear-gradient(var(--paper) 78%, transparent);
}
.back-link{font-size:12px;color:var(--blue);text-decoration:none;font-weight:800;letter-spacing:.2px;}
.map-btn{
  border:2px solid var(--black);background:var(--paper);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;color:var(--black);
}
.map-btn:active{transform:scale(.95);}
.zone-pill{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:#fff;background:var(--red);padding:4px 9px;border-radius:999px;}

/* ---------- Screens ---------- */
.screen{display:none;max-width:640px;margin:0 auto;padding:6px 20px 40px;position:relative;}
@media(min-width:700px){.screen{max-width:820px;}}
@media(min-width:1000px){.screen{max-width:960px;}}
.screen.active{display:block;animation:markIn .4s ease;}
@keyframes markIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);text-align:center;font-weight:800;margin-bottom:6px;}
.s-title{font-family:'Kalam',cursive;font-weight:700;font-size:2rem;text-align:center;margin:0 0 6px;color:var(--black);}
.s-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.dw-btn{
  font-weight:800;font-size:13.5px;padding:11px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--black);background:transparent;color:var(--black);transition:transform .12s ease;
}
.dw-btn:active{transform:scale(.96);}
.dw-btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.dw-btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;}
.dw-btn:disabled{opacity:.3;cursor:not-allowed;}
.dw-btn.wide{width:100%;text-align:center;display:block;text-decoration:none;}
.gate-counter{text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:700;margin-top:8px;}

.video-embed-wrap{margin:14px 0 8px;border-radius:8px;overflow:hidden;box-shadow:0 12px 28px rgba(33,29,22,.24);}

/* ---------- Course map ---------- */
.map-header{text-align:center;margin:6px 0 22px;}
.map-header h1{font-size:2.1rem;margin:4px 0 4px;}
.map-header p{font-size:13px;color:var(--ink-soft);margin:0;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(min-width:480px){.zone-grid{grid-template-columns:repeat(4,1fr);}}
.zone-tile{
  background:#fff;border:2.5px solid var(--black);border-radius:14px;
  padding:20px 10px 16px;text-align:center;cursor:pointer;box-shadow:4px 5px 0 rgba(33,29,22,.14);
  transition:transform .15s ease;
}
.zone-tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(33,29,22,.14);}
.zone-tile .zt-icon{font-size:1.8rem;}
.zone-tile .zt-label{font-family:'Kalam',cursive;font-weight:700;font-size:1.05rem;margin-top:6px;color:var(--black);}
.zone-tile .zt-count{font-size:10px;color:var(--ink-faint);margin-top:2px;font-weight:700;}

/* ---------- Screen 01 — Don't Think Yet ---------- */
.hero-01{text-align:center;padding-top:4px;}
.hero-anim{width:100%;max-width:320px;margin:0 auto 6px;}
.hero-anim svg{width:100%;height:auto;display:block;}
.hero-line{fill:none;stroke:var(--black);stroke-width:3;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:dwDrawLine 2.2s ease forwards;}
.hero-dot{fill:var(--red);opacity:0;transform-origin:center;animation:dwPopIn .5s ease forwards .9s;}
.hero-blob{fill:var(--yellow);opacity:0;transform-origin:center;animation:dwGrowBlob 1.1s cubic-bezier(.2,.9,.3,1.3) forwards 1.3s;}
@keyframes dwDrawLine{to{stroke-dashoffset:0;}}
@keyframes dwPopIn{from{opacity:0;transform:scale(0);}to{opacity:1;transform:scale(1);}}
@keyframes dwGrowBlob{from{opacity:0;transform:scale(0);}to{opacity:1;transform:scale(1);}}
.hero-title{font-family:'Kalam',cursive;font-weight:700;font-size:2.4rem;line-height:1.08;margin:6px 0 2px;}
.hero-artist{font-style:italic;color:var(--red);font-weight:700;font-size:14px;margin:0 0 26px;}
.hero-question{font-weight:800;font-size:1.15rem;line-height:1.6;letter-spacing:.3px;margin:0 0 8px;}

/* ---------- Screen 02 — Look First ---------- */
.artwork-frame{position:relative;max-width:480px;margin:8px auto 10px;aspect-ratio:4/3;background:var(--paper-deep);border-radius:14px;overflow:hidden;}
.wobble-frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.artwork-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.img-missing-note{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:13px;color:var(--ink-faint);font-weight:700;text-align:center;padding:20px;}
.artwork-frame.img-missing .img-missing-note{display:flex;}
.hotspot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid var(--black);background:rgba(247,236,216,.92);font-size:15px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 0 rgba(33,29,22,.18);padding:0;}
.hotspot:active{transform:translate(-50%,-50%) scale(.9);}
.artwork-caption{text-align:center;font-weight:800;font-size:11.5px;letter-spacing:.6px;color:var(--red);margin:0 0 4px;text-transform:uppercase;}
.reveal-box{margin:12px auto 0;max-width:420px;background:#fff;border:2px solid var(--black);border-radius:10px;padding:10px 14px;text-align:center;font-size:13.5px;box-shadow:3px 4px 0 rgba(33,29,22,.14);}
.reveal-emoji{font-size:16px;margin-right:4px;}

/* ---------- Screen 03 — Meet Joan Miró ---------- */
.idea-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 12px;}
.idea-chip{background:var(--black);color:var(--paper);font-weight:800;font-size:11.5px;letter-spacing:.8px;padding:7px 14px;border-radius:999px;}
.artist-mark{width:110px;margin:6px auto 14px;}
.artist-mark svg{width:100%;height:auto;}
.formula-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:14px 0 6px;font-weight:800;font-size:12px;letter-spacing:.3px;}
.formula-row span:not(.formula-arrow){background:#fff;border:2px solid var(--black);border-radius:8px;padding:6px 10px;}
.formula-arrow{color:var(--red);font-weight:900;font-size:15px;border:none !important;background:none !important;padding:0 !important;}
.tiny-line{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin:0 0 18px;}
.ref-mentions{text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:14px;line-height:1.6;}

/* ---------- Screens 04-07 — Digital Automatism Canvas ---------- */
.mat-picker{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0;}
.mat-btn{font-weight:800;font-size:10.5px;letter-spacing:.3px;padding:8px 12px;border-radius:999px;border:2px solid var(--black);background:#fff;color:var(--black);cursor:pointer;}
.mat-btn.active{background:var(--black);color:var(--paper);}
.automatism-canvas-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:480px;margin:10px auto;background:#fffdf7;border:3px solid var(--black);border-radius:16px;overflow:hidden;touch-action:none;box-shadow:5px 6px 0 rgba(33,29,22,.14);}
#automatismCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.floating-prompt{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--black);border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:800;letter-spacing:.2px;pointer-events:none;opacity:0;white-space:nowrap;z-index:4;}
.floating-prompt.show{animation:dwFloatFade 1.8s ease forwards;}
@keyframes dwFloatFade{
  0%{opacity:0;transform:translate(-50%,-100%) scale(.8);}
  15%{opacity:1;transform:translate(-50%,-118%) scale(1);}
  78%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-136%) scale(1);}
}
.canvas-tools-row{display:flex;justify-content:center;margin-top:8px;}
.sugg-chip-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0 4px;}
.sugg-chip{font-weight:800;font-size:11px;letter-spacing:.2px;padding:8px 12px;border-radius:999px;border:2px solid var(--black);background:var(--yellow);color:var(--black);cursor:pointer;}
.worked-examples-row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:8px 0 16px;}
.worked-ex{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;text-align:center;}
.worked-ex-pair{display:flex;align-items:center;gap:3px;}
.worked-ex-pair svg{width:38px;height:38px;}
.worked-ex-arrow{font-weight:900;color:var(--red);font-size:13px;}
.worked-ex-label{font-size:9px;font-weight:800;letter-spacing:.2px;line-height:1.3;}
.snapshot-frame{max-width:380px;margin:10px auto;border:3px solid var(--black);border-radius:14px;overflow:hidden;background:#fffdf7;}
.automatism-snapshot{width:100%;display:block;}
.automatism-snapshot-empty{height:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:24px;}
.mind-chip-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0 4px;}
.mind-chip{font-weight:800;font-size:11.5px;letter-spacing:.2px;padding:8px 14px;border-radius:999px;border:2px solid var(--black);background:#fff;color:var(--black);cursor:pointer;}
.mind-chip.active{background:var(--red);border-color:var(--red);color:#fff;}

/* ---------- Materials + Studio Steps ---------- */
.materials-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0;}
@media(min-width:480px){.materials-grid{grid-template-columns:repeat(3,1fr);}}
.mat-tile{background:#fff;border:2px solid var(--black);border-radius:12px;padding:16px 8px;text-align:center;box-shadow:3px 4px 0 rgba(33,29,22,.14);}
.mt-icon{font-size:1.8rem;}
.mt-label{font-size:11px;font-weight:800;margin-top:6px;line-height:1.3;}
.mat-tile-pending{opacity:.55;border-style:dashed;}

/* ---------- Screen 09 — Your Turn ---------- */
.your-turn-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 10px;}
.tool-chip{font-weight:800;font-size:11.5px;letter-spacing:.3px;padding:9px 16px;border-radius:999px;border:2px solid var(--black);background:#fff;color:var(--black);cursor:pointer;}
.tool-chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* ---------- Screen 10 — Share ---------- */
.upload-slot-wrap{display:flex;justify-content:center;margin:14px 0 4px;}
.upload-slot{width:220px;height:220px;border:3px dashed var(--black);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:#fffdf7;}
.upload-slot.saving{border-color:var(--blue);border-style:solid;}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-slot .slot-plus{font-size:30px;color:var(--red);}
.upload-slot .slot-label{font-size:10.5px;font-weight:800;color:var(--ink-soft);margin-top:6px;padding:0 16px;text-align:center;}
.share-frame-wrap{position:relative;max-width:300px;margin:16px auto 6px;}
.share-frame-svg{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);pointer-events:none;}
.share-frame{position:relative;border-radius:10px;overflow:hidden;}
.share-frame img{width:100%;display:block;}
.answer-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0 6px;}
.answer-chip{font-weight:800;font-size:12.5px;padding:9px 20px;border-radius:999px;border:2px solid var(--black);background:#fff;color:var(--black);cursor:pointer;}
.answer-chip.active{background:var(--yellow);border-color:var(--black);}
.share-final-line{text-align:center;font-family:'Kalam',cursive;font-weight:700;font-size:1.2rem;margin:24px 0 6px;}
.share-credit{text-align:center;font-size:10px;color:var(--ink-faint);margin:2px 0 0;}
</style>
</head>

<div id="app">

<script>
/* ============================================================
   DATA — screen copy is verbatim from MIRO_AUTOMATISM_LESSON_SPEC.md.

const ZONES = [
  { id:'look',    label:'LOOK' },
  { id:'think',   label:'THINK' },
  { id:'make',    label:'MAKE' },

// Stroke-count gate for screen 04 — defined once, referenced wherever
// checked (see Commit 3). Not a magic number sprinkled through the code.
const AUTOMATISM_MIN_STROKES = 5;

const STAGES = [
  { id:'dont-think-yet',       title:"Don't Think Yet",              zone:'look',    render:renderDontThinkYet },
  { id:'look-first',           title:'Look First',                   zone:'look',    render:renderLookFirst },
  { id:'meet-miro',            title:'Meet Joan Miró',                zone:'look',    render:renderMeetMiro },
  { id:'try-automatism',       title:"Don't Think. Just Move.",      zone:'think',   render:renderTryAutomatism, gated:true, afterRender:() => mountAutomatismCanvas('automatismCanvas', { drawable:true }) },
  { id:'stop-and-look',        title:'Stop & Look',                  zone:'think',   render:renderStopAndLook, afterRender:() => mountAutomatismCanvas('automatismCanvas', { drawable:false }) },
  { id:'make-it-become',       title:'Now Let Your Imagination In.', zone:'think',   render:renderMakeItBecome, afterRender:() => mountAutomatismCanvas('automatismCanvas', { drawable:true }) },
  { id:'what-did-you-find',    title:'What Did Your Mind Find?',      zone:'think',   render:renderWhatDidYouFind },
  { id:'now-watch-mrs-dawn',   title:"Let's Draw Together",           zone:'make',    render:renderNowWatchMrsDawn },
  { id:'materials-ready',      title:'Get Your Materials Ready',      zone:'make',    render:renderMaterials },
  { id:'step-1-colors-flow',   title:'Let the Colors Flow',           zone:'make',    render:() => renderStudioStep(0) },
  { id:'step-2-shapes-appear', title:'Let Shapes Appear',             zone:'make',    render:() => renderStudioStep(1) },
  { id:'step-3-lines-wander',  title:'Let Your Lines Wander',         zone:'make',    render:() => renderStudioStep(2) },
  { id:'step-4-color-sparks',  title:'Add Color Sparks',              zone:'make',    render:() => renderStudioStep(3) },
  { id:'your-turn',            title:'Now Make Your Version.',        zone:'make',    render:renderYourTurn },
  { id:'share',                title:'What Did Your Imagination Find?', zone:'reflect', render:renderShare }
];

// Discovery hotspot chips on Mrs. Dawn's artwork (screen 02). Positions
// are re-checked against the real photo (Addendum 3, 2026-08-28) — each
// left/top was read directly off the actual artwork (see assets/README.md
// for the source image) rather than left as generic/spread placeholders.
// Responses are deliberately ambiguous for several of these by design,
// not a gap to fill in later.
// Mrs. Dawn's finished Miró-inspired watercolor piece (Addendum 3,
// 2026-08-28) — hosted on Faye's own Cloudflare Images delivery URL,
// referenced directly the same way STUDIO_STEPS' videoSrc values
// reference Cloudflare Stream directly rather than being downloaded
// into assets/.

const LOOK_FIRST_CHIPS = [
  { id:'eye',      emoji:'👁',  label:'EYE',              left:50, top:54, reveal:'MAYBE.' },
  { id:'star',     emoji:'⭐', label:'STAR',              left:15, top:17, reveal:'MAYBE.' },
  { id:'line',     emoji:'〰', label:'LINE',              left:44, top:13, reveal:'WHAT DO YOU THINK?' },

  { id:'strange',  emoji:'🌀', label:'SOMETHING STRANGE?', left:42, top:34, reveal:'WHAT DO YOU THINK?' }
];

const MIRO_IDEAS = ['DREAMS', 'THE UNCONSCIOUS', 'AUTOMATIC DRAWING'];

// 5 materials for the digital canvas (screens 04-07) — see Commit 3 for
// the actual per-material rendering technique.
const AUTOMATISM_MATERIALS = [
  { id:'watercolor', label:'WATERCOLOR' },
  { id:'marker',      label:'MARKER' },
  { id:'pencil',      label:'PENCIL' },
  { id:'ink',         label:'INK' },
  { id:'acrylic',     label:'ACRYLIC-LIKE BRUSH' }
];

const AUTOMATISM_FLOATING_PROMPTS = [
  'KEEP MOVING.', "DON'T ERASE IT.", 'TRY A CURVE.', 'TRY A DOT.', 'CHANGE DIRECTION.', 'LET IT BE WEIRD.'
];

const SUGGESTION_CHIPS = [
  { id:'eyes',      emoji:'👁',  label:'ADD EYES' },
  { id:'legs',      emoji:'🦵', label:'ADD LEGS' },
  { id:'wings',     emoji:'🪽', label:'ADD WINGS' },
  { id:'face',      emoji:'👄', label:'ADD A FACE' },

const MIND_FOUND_CHIPS = ['CREATURE', 'FACE', 'ANIMAL', 'PLANT', 'PLACE', 'DREAM', "I DON'T KNOW"];

// Screen 06's three worked examples: original hand-authored before/after
// marks (deliberately NOT biomorphic Miró-style blobs — plain geometric
// shapes + simple added features) illustrating AUTOMATIC MARK →

const WORKED_EXAMPLES = [
  {
    label: 'STRANGE CREATURE',
    before: '<path d="M15,35 C10,20 30,12 40,22 C50,32 45,50 30,50 C18,50 18,45 15,35 Z" fill="none" stroke="var(--black)" stroke-width="3"/>',
    after: '<path d="M15,35 C10,20 30,12 40,22 C50,32 45,50 30,50 C18,50 18,45 15,35 Z" fill="none" stroke="var(--black)" stroke-width="3"/><circle cx="24" cy="28" r="2.4" fill="var(--black)"/><circle cx="34" cy="26" r="2.4" fill="var(--black)"/><line x1="22" y1="50" x2="20" y2="58" stroke="var(--black)" stroke-width="2.5" stroke-linecap="round"/><line x1="32" y1="50" x2="34" y2="58" stroke="var(--black)" stroke-width="2.5" stroke-linecap="round"/>'
  },
  {

    before: '<path d="M8,45 C20,15 40,55 52,20" fill="none" stroke="var(--black)" stroke-width="3" stroke-linecap="round"/>',

  },
  {
    label: 'WHO IS THIS?',
    before: '<circle cx="30" cy="32" r="18" fill="none" stroke="var(--black)" stroke-width="3"/>',
    after: '<circle cx="30" cy="32" r="18" fill="none" stroke="var(--black)" stroke-width="3"/><circle cx="24" cy="28" r="2" fill="var(--black)"/><circle cx="36" cy="28" r="2" fill="var(--black)"/><path d="M22,38 Q30,44 38,38" fill="none" stroke="var(--black)" stroke-width="2.2" stroke-linecap="round"/>'
  }

/* ============================================================
   IndexedDB — physical-artwork photo storage (Screen 10).

   The spec's own copy assumes "the platform's existing Supabase upload
   flow/component" and "existing gallery mechanism" — neither exists
   anywhere in this codebase (confirmed by search before this build
   started). Every shipped course (Kandinsky, Yōkai, Surrealism) instead
   uses this same per-course IndexedDB pattern, with "Add to Gallery"
   simply linking back to the Studio. This lesson follows that real,
   established pattern rather than the spec's assumed one.
============================================================ */
const DB_NAME = 'fei_miro_draw_without_knowing_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const PIECE_ID = 'piece_001';
const MAX_EDGE = 1400;
const JPEG_QUALITY = 0.87;
let _dbPromise = null;
function isStorageSupported(){ return !!window.indexedDB; }
function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}
function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileOrBlob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      const longestEdge = Math.max(width, height);
      if (longestEdge > MAX_EDGE) {
        const scale = MAX_EDGE / longestEdge;
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
    img.src = url;
  });
}
async function saveArtwork(pieceId, fileOrBlob){
  const compressed = await compressImage(fileOrBlob);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId + '::' + Date.now(), pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => { const rows = req.result || []; rows.sort((a, b) => b.savedAt - a.savedAt); resolve(rows); };
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================
   DIGITAL AUTOMATISM CANVAS ENGINE (screens 04-06 mount it; screen 07
   only displays the snapshot taken on the way out of screen 06).

   Model: AUTOMATISM_STATE.strokes holds the full stroke history
   ({tool, points:[{x,y,pressure}]}). Every (re)mount — which happens on
   every screen swap, since renderCurrentStage() replaces the DOM and
   therefore the <canvas> element itself — replays the entire stack from
   scratch via redrawAutomatismCanvasFull(). This is what lets the same
   in-memory drawing survive screens 04→05→06 even though each screen is
   a brand-new canvas element, and it's what makes undo-last-stroke a
   simple pop-and-redraw rather than needing per-pixel undo history.
============================================================ */
let automatismCanvasEl = null;
let automatismCtx = null;
let automatismCurrentStroke = null;
let automatismLastTapPoint = null;

function mountAutomatismCanvas(canvasId, opts){
  opts = opts || {};
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  automatismCanvasEl = canvas;
  automatismCurrentStroke = null;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssW = rect.width || canvas.clientWidth || 320;
  const cssH = rect.height || canvas.clientHeight || 320;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  automatismCtx = canvas.getContext('2d');
  automatismCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawAutomatismCanvasFull();

  if (opts.drawable !== false) {
    canvas.addEventListener('pointerdown', onAutomatismPointerDown);
    canvas.addEventListener('pointermove', onAutomatismPointerMove);
    canvas.addEventListener('pointerup', onAutomatismPointerUp);
    canvas.addEventListener('pointercancel', onAutomatismPointerUp);
  } else {
    // Screen 05 (Stop & Look): the canvas is inspect-only — tapping
    // records a point for suggestion-chip placement but never draws.
    canvas.addEventListener('pointerdown', onAutomatismInspectTap);
  }
}

function automatismPos(e){
  const rect = automatismCanvasEl.getBoundingClientRect();
  const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
  return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure };
}

function onAutomatismInspectTap(e){
  automatismLastTapPoint = automatismPos(e);
}

function onAutomatismPointerDown(e){
  e.preventDefault();
  if (automatismCanvasEl.setPointerCapture) {
    try { automatismCanvasEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
  automatismCurrentStroke = { tool: AUTOMATISM_STATE.tool, points: [automatismPos(e)] };
}
function onAutomatismPointerMove(e){
  if (!automatismCurrentStroke) return;
  const pts = automatismCurrentStroke.points;
  pts.push(automatismPos(e));
  if (pts.length > 1) drawLiveSegment(automatismCtx, pts[pts.length - 2], pts[pts.length - 1], automatismCurrentStroke.tool);
}
function onAutomatismPointerUp(){
  const stroke = automatismCurrentStroke;
  automatismCurrentStroke = null;
  if (!stroke || stroke.points.length < 2) return; // a plain tap isn't a mark
  AUTOMATISM_STATE.strokes.push(stroke);
  redrawAutomatismCanvasFull();
  onAutomatismStrokesChanged();
  // Sparse floating prompts — occasional, never on every stroke.
  if (Math.random() < 0.5) {
    const text = AUTOMATISM_FLOATING_PROMPTS[Math.floor(Math.random() * AUTOMATISM_FLOATING_PROMPTS.length)];
    showFloatingPromptAt(text, stroke.points[stroke.points.length - 1]);
  }
}

function onAutomatismStrokesChanged(){
  const counter = document.getElementById('gateCounter');
  if (counter) counter.textContent = `${AUTOMATISM_STATE.strokes.length} of ${AUTOMATISM_MIN_STROKES} marks`;
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) {
    const stage = STAGES.find(s => s.id === currentStageId);
    if (stage) nextBtn.disabled = !canAdvance(stage);
  }
}

function undoLastStroke(){
  AUTOMATISM_STATE.strokes.pop();
  redrawAutomatismCanvasFull();
  onAutomatismStrokesChanged();
}

function selectAutomatismTool(id){
  AUTOMATISM_STATE.tool = id;

function showFloatingPromptAt(text, pt){
  const label = document.getElementById('floatingPrompt');
  if (!label || !pt) return;
  label.textContent = text;
  label.style.left = pt.x + 'px';
  label.style.top = pt.y + 'px';

function captureAutomatismSnapshot(){

/* ---- Per-material stroke rendering — five genuinely different
   techniques, not color/width variants of one line (see plan). ---- */
function drawLiveSegment(ctx, p0, p1, tool){
  const live = {
    watercolor: { a:.35, w:15 }, marker: { a:1, w:10 }, pencil: { a:.5, w:2 },
    ink: { a:1, w:5 }, acrylic: { a:.9, w:13 }
  }[tool] || { a:1, w:6 };
  ctx.save();
  ctx.globalAlpha = live.a;
  ctx.strokeStyle = AUTOMATISM_COLORS[tool] || '#211d16';
  ctx.lineWidth = live.w;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  ctx.restore();
}

function strokePath(ctx, pts){
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();
}

function drawStrokeWatercolor(ctx, pts){
  ctx.save();
  ctx.strokeStyle = AUTOMATISM_COLORS.watercolor;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.32; ctx.lineWidth = 16; strokePath(ctx, pts);
  ctx.globalAlpha = 0.14; ctx.lineWidth = 27; strokePath(ctx, pts);
  ctx.restore();
}
function drawStrokeMarker(ctx, pts){
  ctx.save();
  ctx.strokeStyle = AUTOMATISM_COLORS.marker;
  ctx.globalAlpha = 1; ctx.lineWidth = 10;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokePath(ctx, pts);
  ctx.restore();
}
function drawStrokePencil(ctx, pts){
  ctx.save();
  ctx.strokeStyle = AUTOMATISM_COLORS.pencil;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const avgPressure = pts.reduce((s, p) => s + (p.pressure || 0.5), 0) / pts.length;
  for (let pass = 0; pass < 3; pass++) {
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = (1.3 + avgPressure * 1.2) + Math.random() * 0.6;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const jx = p.x + (Math.random() - 0.5) * 0.7;
      const jy = p.y + (Math.random() - 0.5) * 0.7;
      i === 0 ? ctx.moveTo(jx, jy) : ctx.lineTo(jx, jy);
    });
    ctx.stroke();
  }
  ctx.restore();
}
function drawStrokeInk(ctx, pts){
  ctx.save();
  ctx.strokeStyle = AUTOMATISM_COLORS.ink;
  ctx.globalAlpha = 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = pts.length;
  const taper = Math.max(1, Math.floor(n * 0.15));
  for (let i = 1; i < n; i++) {
    let width = 5.5;
    if (i < taper) width = 5.5 * (i / taper);
    else if (i > n - taper) width = 5.5 * ((n - i) / taper);
    ctx.lineWidth = Math.max(1, width);
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  ctx.restore();
}
function drawStrokeAcrylic(ctx, pts){
  ctx.save();
  ctx.strokeStyle = AUTOMATISM_COLORS.acrylic;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.92; ctx.lineWidth = 13; strokePath(ctx, pts);
  ctx.globalAlpha = 0.22; ctx.lineWidth = 2;
  [-4, 0, 4].forEach(off => {
    ctx.beginPath();
    pts.forEach((p, i) => {
      const ox = p.x + off, oy = p.y + off * 0.4;
      i === 0 ? ctx.moveTo(ox, oy) : ctx.lineTo(ox, oy);
    });
    ctx.stroke();
  });
  ctx.restore();
}
const AUTOMATISM_DRAW_FNS = {
  watercolor: drawStrokeWatercolor, marker: drawStrokeMarker, pencil: drawStrokePencil,
  ink: drawStrokeInk, acrylic: drawStrokeAcrylic
};

function redrawAutomatismCanvasFull(){
  if (!automatismCtx || !automatismCanvasEl) return;
  const cssW = automatismCanvasEl.clientWidth || automatismCanvasEl.getBoundingClientRect().width || 320;
  const cssH = automatismCanvasEl.clientHeight || automatismCanvasEl.getBoundingClientRect().height || 320;
  automatismCtx.clearRect(0, 0, cssW, cssH);
  AUTOMATISM_STATE.strokes.forEach(s => {
    const fn = AUTOMATISM_DRAW_FNS[s.tool] || drawStrokeMarker;
    fn(automatismCtx, s.points);
  });
}

  return `

}
function revealLookFirst(id){
  const chip = LOOK_FIRST_CHIPS.find(c => c.id === id);
  if (!chip) return;
  if (!STATE.lookFirstFound.includes(id)) { STATE.lookFirstFound.push(id); saveState(); }
  const box = document.getElementById('lookFirstReveal');
  if (box) {
    box.style.display = 'block';
    box.innerHTML = `<span class="reveal-emoji">${chip.emoji}</span><strong>${chip.label}</strong> — ${chip.reveal}`;
  }
}

/* ============================================================
   SCREEN 10 — Share (Reflect)
============================================================ */
function triggerUpload(){ document.getElementById('fileInput').click(); }
async function onFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please choose an image file (JPG or PNG).'); return; }
  saving = true;
  refreshUploadUI();
  try {
    const record = await saveArtwork(PIECE_ID, file);
    artworkRecord = record;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(record.blob);
  } catch (e) {
    console.warn('[share] saveArtwork failed', e);
    alert("Couldn't save that photo — want to try a different one?");
  }
  saving = false;
  refreshUploadUI();
}
function shareFrameMarkup(src){
  return `<div class="share-frame-wrap">
    <svg class="share-frame-svg" viewBox="0 0 300 300" preserveAspectRatio="none">
      <rect x="8" y="8" width="284" height="284" rx="18" fill="none" stroke="var(--black)" stroke-width="5" filter="url(#rough)"/>
    </svg>
    <div class="share-frame"><img src="${src}" alt="Your finished watercolor artwork"></div>
  </div>`;
}
function refreshUploadUI(){
  const wrap = document.getElementById('uploadSlotWrap');
  const frameWrap = document.getElementById('shareFrameWrap');
  if (!wrap) return;
  if (saving) {
    wrap.innerHTML = `<div class="upload-slot saving"><div class="slot-plus">⏳</div><div class="slot-label">Saving…</div></div>`;
  } else if (artworkRecord) {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><img src="${objectUrl}" alt="Your finished watercolor artwork"></div>`;
    if (frameWrap) frameWrap.innerHTML = shareFrameMarkup(objectUrl);
  } else {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><div class="slot-plus">+</div><div class="slot-label">Upload My Artwork</div></div>`;
    if (frameWrap) frameWrap.innerHTML = '';
  }
}
function selectShareAnswer(ans){
  STATE.shareAnswer = ans;
  saveState();
  renderCurrentStage();
}
function renderShare(){
  const answers = SHARE_QUESTION_OPTIONS.map(a =>
    `<button class="answer-chip ${STATE.shareAnswer === a ? 'active' : ''}" onclick="selectShareAnswer('${a}')">${a}</button>`
  ).join('');
  return `
    ${screenHeader('REFLECT', 'What Did Your Imagination Find?')}
    <div class="upload-slot-wrap" id="uploadSlotWrap"></div>
    <div id="shareFrameWrap"></div>
    <p class="s-sub">DID YOU KNOW WHAT YOU WERE DRAWING WHEN YOU STARTED?</p>
    <div class="answer-row">${answers}</div>
    <a class="dw-btn blue wide" href="../../creation/">Add to Gallery</a>
    <p class="share-final-line display">YOU DIDN'T NEED THE ANSWER BEFORE YOU STARTED.</p>
    <p class="share-credit">FEI TeamArt · Creation · Learn from Masters — Led by Mrs. Dawn Wang</p>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
async function renderCurrentStage(){
  const contentEl = document.getElementById('screen-content');
  const zonePill = document.getElementById('zonePill');

  if (currentStageId === 'screen-map') {
    zonePill.textContent = '';
    contentEl.innerHTML = `<div class="screen active">${renderMap()}</div>`;
    window.scrollTo(0, 0);
    return;
  }

  const stage = STAGES.find(s => s.id === currentStageId);
  if (!stage) { goMap(); return; }
  zonePill.textContent = ZONES.find(z => z.id === stage.zone).label;

  // Screen 10 (Share): check for a previously-saved artwork before
  // painting, so a returning student sees their photo already in place.
  if (stage.id === 'share' && !artworkRecord && isStorageSupported()) {
    try {
      const rows = await listArtworks(PIECE_ID);
      if (rows.length) { artworkRecord = rows[0]; objectUrl = URL.createObjectURL(artworkRecord.blob); }
    } catch (e) { console.warn('[share] listArtworks failed', e); }
  }

  // Each stage's render() owns its full header markup (kicker/title or a
  // bespoke hero, e.g. Screen 01) — matching the pattern already used by
  // Kandinsky/Yōkai, rather than forcing one generic header shape on
  // every screen.
  contentEl.innerHTML = `<div class="screen active">
    ${stage.render()}
    ${renderNav(stage)}
  </div>`;
  if (stage.afterRender) stage.afterRender();
  if (stage.id === 'share') refreshUploadUI();
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'miro-draw-without-knowing');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  await renderCurrentStage();
}

init();
</script>
