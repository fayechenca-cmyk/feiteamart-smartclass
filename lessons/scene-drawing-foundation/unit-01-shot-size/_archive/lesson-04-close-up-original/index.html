<html lang="en">

<!--
  All 13 stages wired (2026-09-05), per the real "Scene Drawing
  Foundation · Unit 01 · Lesson 04 / Close-Up: Show Emotion — Spec
  v1.0" pasted in full in the build prompt itself (no missing-spec gap).

  This is a content-swap build, not component work: reuses Lesson 03's
  exact dispatcher shell and all three shared components from
  ../../_shared/ with zero forking — no new shared-component
  capabilities needed. Reference implementation:
  lessons/scene-drawing-foundation/unit-01-shot-size/lesson-03-medium-
  shot/index.html.

  ASSET NOTE: every image is still an inline placeholder SVG, same as
  Lessons 01-03 — see lesson-data.js's own note.

  ACCESS CONTROL: deliberately not wired. Faye has not yet confirmed a
  free/paid rule for this course — see the TODO near init() below.
-->

<script type="application/json" id="lessonMeta">
{
  "title": "Close-Up",
  "subtitle": "Scene Drawing Foundation · Unit 01: Shot Size",
  "path": ["Scene Drawing Foundation", "Unit 01 · Shot Size", "Close-Up"],

  "stageCount": 13
}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a22;
  --ink-soft:rgba(28,26,34,.66);
  --ink-faint:rgba(28,26,34,.42);
  --accent:#2d5fa8;
  --accent-deep:#1f4076;
  --line:rgba(28,26,34,.14);
  --paper:#faf8f5;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;position:sticky;top:0;z-index:500;
  background:linear-gradient(var(--paper) 78%, transparent);
}
.back-link{font-size:12px;color:var(--accent-deep);text-decoration:none;font-weight:700;letter-spacing:.2px;}
.map-btn{
  border:2px solid var(--ink);background:var(--paper);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
}
.map-btn:active{transform:scale(.95);}
.zone-pill{font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:#fff;background:var(--accent);padding:4px 9px;border-radius:999px;}

.screen{display:none;max-width:640px;margin:0 auto;padding:6px 20px 40px;position:relative;}
@media(min-width:700px){.screen{max-width:820px;}}
.screen.active{display:block;animation:stageIn .4s ease;}
@keyframes stageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:6px;}
.s-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.7rem;text-align:center;margin:0 0 8px;color:var(--accent-deep);}
.s-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

.placeholder-card{
  background:#fff;border:1.5px dashed var(--line);border-radius:14px;
  padding:26px 18px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:1.6;
}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.sd-btn{
  font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--ink);background:transparent;color:var(--ink);transition:transform .12s ease;
}
.sd-btn:active{transform:scale(.96);}
.sd-btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.sd-btn:disabled{opacity:.3;cursor:not-allowed;}

.map-header{text-align:center;margin:6px 0 22px;}
.map-header h1{font-size:1.9rem;margin:4px 0 4px;}
.map-header p{font-size:13px;color:var(--ink-soft);margin:0;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(min-width:480px){.zone-grid{grid-template-columns:1fr 1fr 1fr;}}
.zone-tile{
  background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:20px 10px 16px;text-align:center;cursor:pointer;
  box-shadow:4px 5px 0 rgba(28,26,34,.14);transition:transform .15s ease;
}
.zone-tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(28,26,34,.14);}
.zone-tile .zt-icon{font-size:1.9rem;}
.zone-tile .zt-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;margin-top:6px;color:var(--accent-deep);}
.zone-tile .zt-count{font-size:10px;color:var(--ink-faint);margin-top:2px;font-weight:700;}

/* ---------- Stage 1: Welcome ---------- */
.welcome-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 10px 26px rgba(28,26,34,.16);}
.welcome-hero img{display:block;width:100%;height:auto;}
.welcome-cloud{
  position:absolute;background:rgba(255,255,255,.75);border-radius:50%;
  filter:blur(1px);pointer-events:none;
}
.welcome-cloud::before, .welcome-cloud::after{
  content:'';position:absolute;background:inherit;border-radius:50%;
}
.wc-1{width:70px;height:24px;top:14%;left:-15%;animation:cloudDrift1 26s linear infinite;}
.wc-1::before{width:36px;height:36px;top:-16px;left:8px;}
.wc-1::after{width:26px;height:26px;top:-10px;left:38px;}
.wc-2{width:50px;height:18px;top:28%;left:-12%;animation:cloudDrift1 34s linear infinite;animation-delay:-10s;}
.wc-2::before{width:26px;height:26px;top:-11px;left:6px;}
@keyframes cloudDrift1{from{transform:translateX(0);}to{transform:translateX(480px);}}
.welcome-character{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
  font-size:1.6rem;animation:breathe 2.6s ease-in-out infinite;transform-origin:bottom center;
}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.06);}}
.start-btn-wrap{text-align:center;}
.start-btn-wrap .sd-btn.primary{animation:btnBreathe 2s ease-in-out infinite;}
@keyframes btnBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

/* ---------- Stage 2: Video intro ---------- */
.video-embed-wrap{margin:14px 0 8px;border-radius:10px;overflow:hidden;box-shadow:0 12px 28px rgba(28,26,34,.22);}

/* ---------- Stage 3: Connect: You ---------- */
.connect-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.connect-option{
  flex:1 1 0;min-width:100px;max-width:160px;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
  transition:border-color .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent;
}
.connect-option:active{transform:scale(.96);}
.connect-option.picked{border-color:var(--accent);background:rgba(45,95,168,.06);}
.connect-option .co-icon{font-size:1.7rem;}
.connect-option .co-label{font-size:11.5px;font-weight:700;margin-top:6px;color:var(--ink-soft);}
.connect-bubble{
  text-align:center;font-size:13.5px;font-weight:600;color:var(--accent-deep);
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px;
  opacity:0;transform:scale(.8);height:0;padding-top:0;padding-bottom:0;margin-top:0;overflow:hidden;
  transition:opacity .2s ease,transform .2s ease;
}
.connect-bubble.show{
  opacity:1;transform:scale(1);height:auto;padding-top:12px;padding-bottom:12px;margin-top:16px;overflow:visible;
}

/* ---------- Stage 4: Transition question ---------- */
.transition-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.transition-btn{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:16px 22px;
  border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;
}
.transition-btn:active{transform:scale(.96);}
.transition-btn.picked{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.transition-line{
  text-align:center;font-size:13.5px;font-weight:600;color:var(--accent-deep);margin-top:16px;
  opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .25s ease;
}
.transition-line.show{opacity:1;transform:translateY(0);}

/* ---------- Stage 5/6: ABChoiceCard host ---------- */
.abc-host{margin-top:14px;}

/* ---------- Stage 7/8: CameraZoomSlider + term reveal ---------- */
.typewriter-text{
  text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:600;
  color:var(--accent-deep);min-height:2.6em;margin:6px 0 16px;line-height:1.4;
}
.term-labels{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px;}
.term-label{
  font-size:11px;font-weight:800;letter-spacing:1.5px;color:#fff;background:var(--accent);
  padding:5px 12px;border-radius:999px;opacity:0;transform:translateY(6px);
  transition:opacity .3s ease,transform .3s ease;
}
.term-label.show{opacity:1;transform:translateY(0);}
.term-reveal{
  text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.6rem;
  color:var(--accent-deep);margin-top:14px;opacity:0;transition:opacity .5s ease;
}
.term-reveal.show{opacity:1;}
.term-subtitle{
  text-align:center;font-size:13px;color:var(--ink-soft);margin-top:4px;
  opacity:0;transition:opacity .5s ease;
}
.term-subtitle.show{opacity:1;}

/* ---------- Stage 9: Real examples ---------- */
.examples-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;}
@media(max-width:480px){.examples-grid{grid-template-columns:1fr;}}
.example-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(28,26,34,.1);cursor:zoom-in;}
.example-card img{display:block;width:100%;height:auto;}
.example-card .example-label{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);padding:8px;}

.lightbox-overlay{
  position:fixed;inset:0;background:rgba(28,26,34,.82);z-index:700;
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.lightbox-overlay.show{opacity:1;pointer-events:auto;}
.lightbox-overlay img{max-width:100%;max-height:80vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
.lightbox-close{position:absolute;top:18px;right:20px;background:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:16px;font-weight:800;cursor:pointer;}

/* ---------- Stage 10: Let's Draw Together ---------- */
.disclaimer-line{text-align:center;font-size:11.5px;font-style:italic;color:var(--ink-faint);margin-top:12px;line-height:1.5;}

/* ---------- Stage 11: Draw It ---------- */
.progress-dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px;}
.progress-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.progress-dot.done{background:var(--accent);}
.progress-dot.current{background:var(--accent);transform:scale(1.4);}
.task-label{text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--accent-deep);margin-bottom:10px;line-height:1.35;}
.sketch-tool-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.sketch-color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);}
.sketch-color-dot.picked{box-shadow:0 0 0 2.5px var(--accent);transform:scale(1.1);}
.sketch-canvas-wrap{
  width:100%;max-width:360px;aspect-ratio:4/3;margin:0 auto 10px;border-radius:14px;overflow:hidden;
  border:2.5px solid var(--ink);box-shadow:5px 6px 0 rgba(28,26,34,.14);touch-action:none;
}
.sketch-canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair;}
.sketch-clear-wrap{text-align:center;margin-bottom:14px;}
.sketch-clear-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;}
.done-scene-btn{display:block;width:100%;max-width:360px;margin:0 auto;padding:13px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
.done-scene-btn:active{transform:scale(.98);}
.celebrate-toast{
  position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.7);
  background:#fff;border:2.5px solid var(--accent);border-radius:16px;padding:18px 26px;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--accent-deep);
  box-shadow:0 14px 34px rgba(28,26,34,.25);opacity:0;pointer-events:none;z-index:600;
  transition:opacity .25s ease,transform .25s cubic-bezier(.3,1.6,.4,1);
}
.celebrate-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ---------- Stage 12: See Other Ideas ---------- */
.tab-row{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.tab-btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.tab-btn.active{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.tab-viewport{overflow:hidden;border-radius:14px;}
.tab-panel{width:100%;transition:transform .2s ease,opacity .2s ease;}
.tab-panel img{display:block;width:100%;border-radius:12px;}
.tab-panel-label{text-align:center;font-weight:700;margin-top:8px;color:var(--ink-soft);font-size:13px;}

/* ---------- Stage 13: Reflect ---------- */
#reflectHost{margin-top:8px;}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <a class="back-link" href="../../">← Scene Drawing Foundation</a>
    <span class="zone-pill" id="zonePill"></span>
    <button class="map-btn" onclick="goMap()">◐ Map</button>
  </div>
  <div id="screen-content"></div>
</div>

<div class="celebrate-toast" id="celebrateToast"></div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="../../../../core/auth.js"></script>
<script src="../../../../core/access.js"></script>
<!-- JournalStorage — used by ReflectionJournal (Stage 13). Reused as-is,
     not duplicated; see reflection-journal.js's own top-of-file note
     on why this is a bare-identifier global, not window.JournalStorage. -->
<script src="../../../../core/scene-drawing-platform-bridge.js"></script>
<script src="lesson-data.js"></script>
<script src="../../_shared/ab-choice-card.js"></script>
<script src="../../_shared/camera-zoom-slider.js"></script>
<script src="../../_shared/reflection-journal.js"></script>

<script>
/* ============================================================
   DATA — stage list + zone grouping, same shape as Lessons 01-03.
============================================================ */
const ZONES = [
  { id:'welcome', label:'WELCOME' },
  { id:'look',    label:'LOOK' },
  { id:'think',   label:'THINK' },
  { id:'make',    label:'MAKE' },
  { id:'reflect', label:'REFLECT' }
];
const ZONE_ICONS = { welcome:'👋', look:'👀', think:'💭', make:'🎨', reflect:'🖼' };

const STAGES = [
  { id:'welcome',             title:'Welcome',                zone:'welcome', render:renderWelcome },
  { id:'video_intro',         title:'What is a Close-Up?',    zone:'look',    render:renderVideoIntro },
  { id:'connect_you',         title:"It's About You!",        zone:'look',    render:renderConnectYou, afterRender:afterRenderConnectYou },
  { id:'transition_question', title:'What Should We Show?',   zone:'look',    render:renderTransitionQuestion },
  { id:'story_a',             title:'Story A',                zone:'think',   render:renderStoryA, afterRender:afterRenderStoryA },
  { id:'story_b',             title:'Story B',                zone:'think',   render:renderStoryB, afterRender:afterRenderStoryB },
  { id:'big_idea',            title:'The Big Idea',           zone:'think',   render:renderBigIdea, afterRender:afterRenderBigIdea },
  { id:'meet_term',           title:'Meet the Term',          zone:'think',   render:renderMeetTerm, afterRender:afterRenderMeetTerm },
  { id:'real_examples',       title:'Real Examples',          zone:'think',   render:renderRealExamples },
  { id:'demo_video',          title:"Let's Draw Together",    zone:'make',    render:renderDemoVideo },
  { id:'draw_task',           title:'Draw It',                zone:'make',    render:renderDrawTask, afterRender:afterRenderDrawTask },
  { id:'see_ideas',           title:"See Other Ideas",        zone:'make',    render:renderSeeIdeas, afterRender:afterRenderSeeIdeas },
  { id:'reflect',             title:'Reflect',                zone:'reflect', render:renderReflect, afterRender:afterRenderReflect }
];

let STATE = {
  connectChoice: null,
  transitionChoice: null,
  cameraPosition: 0.5,
  drawTaskIndex: 0,
  drawTaskDone: [false, false, false]
};

/* ============================================================
   SHARED HELPER — typewriter reveal (same as Lessons 01-03)
============================================================ */
let typewriterTimer = null;
function typewriterInto(elId, text, totalDurationMs){
  clearInterval(typewriterTimer);
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = '';
  const perCharMs = Math.max(20, Math.floor((totalDurationMs || 1800) / text.length));
  let i = 0;
  typewriterTimer = setInterval(() => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(typewriterTimer);
  }, perCharMs);
}

/* ============================================================
   SHARED HELPER — video embed (Cloudflare Stream, with the
   established "coming soon" fallback). Same helper as Lessons 01-03.
============================================================ */
const CF_STREAM_CUSTOMER = 'customer-a78os4oj56dr67ab.cloudflarestream.com';
function cfStreamSrc(streamId){
  const poster = encodeURIComponent(`https://${CF_STREAM_CUSTOMER}/${streamId}/thumbnails/thumbnail.jpg?time=&height=600`);
  return `https://${CF_STREAM_CUSTOMER}/${streamId}/iframe?poster=${poster}`;
}
function renderVideoEmbed(src, title){
  if (src) {
    return `<div class="video-embed-wrap"><div style="position:relative;padding-top:56.25%;">
      <iframe src="${src}" loading="lazy" title="${title}"
        style="border:none;position:absolute;top:0;left:0;height:100%;width:100%;"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
    </div></div>`;
  }
  return `<div class="video-embed-wrap"><div style="position:relative;padding-top:56.25%;background:linear-gradient(135deg,var(--accent),var(--accent-deep));">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
      <div style="font-size:2.2rem;">🎥</div><div style="font-size:13px;margin-top:6px;">Video coming soon!</div>
    </div>
  </div></div>`;
}

/* ============================================================
   STAGE 1 — Welcome
============================================================ */
function renderWelcome(){
  const d = LESSON_DATA.welcome;
  return `
    <div class="welcome-hero">
      <img src="${d.heroImage}" alt="A character's face in close-up with a clear expression">
      <span class="welcome-cloud wc-1" aria-hidden="true"></span>
      <span class="welcome-cloud wc-2" aria-hidden="true"></span>
      <span class="welcome-character" aria-hidden="true">🧍</span>
    </div>
    <h1 class="s-title display">${d.title}</h1>
    <p class="s-sub">${d.subtitle}</p>
    <div class="start-btn-wrap">
      <button class="sd-btn primary" onclick="goNext()">${d.startLabel}</button>
    </div>
  `;
}

/* ============================================================
   STAGE 2 — What is a Close-Up? (video)
============================================================ */
function renderVideoIntro(){
  const d = LESSON_DATA.video_intro;
  return `
    <div class="kicker">Look</div>
    <h2 class="s-title">${d.title}</h2>
    ${renderVideoEmbed(d.videoStreamId ? cfStreamSrc(d.videoStreamId) : null, d.videoTitle)}
    <p class="s-sub" style="margin-top:14px;">${d.keySentence}</p>
  `;
}

/* ============================================================
   STAGE 3 — Connect: You (bubble copy reused verbatim from Lesson 01)
============================================================ */
function renderConnectYou(){
  const d = LESSON_DATA.connect_you;
  const options = d.options.map(o => `
    <div class="connect-option${STATE.connectChoice === o.key ? ' picked' : ''}" onclick="pickConnect('${o.key}')">
      <div class="co-icon">${o.icon}</div>
      <div class="co-label">${o.label}</div>
    </div>
  `).join('');
  return `
    <div class="kicker">Look</div>
    <h2 class="s-title">${d.title}</h2>
    <div class="connect-options">${options}</div>
    <div class="connect-bubble" id="connectBubble"></div>
  `;
}
function afterRenderConnectYou(){
  if (!STATE.connectChoice) return;
  const picked = LESSON_DATA.connect_you.options.find(o => o.key === STATE.connectChoice);
  const bubble = document.getElementById('connectBubble');
  bubble.textContent = picked.response;
  requestAnimationFrame(() => bubble.classList.add('show'));
}
function pickConnect(key){
  STATE.connectChoice = key;
  const d = LESSON_DATA.connect_you;
  document.querySelectorAll('.connect-option').forEach((el, i) => el.classList.toggle('picked', d.options[i].key === key));
  const picked = d.options.find(o => o.key === key);
  const bubble = document.getElementById('connectBubble');
  bubble.classList.remove('show');
  bubble.textContent = picked.response;
  requestAnimationFrame(() => bubble.classList.add('show'));
}

/* ============================================================
   STAGE 4 — What Should We Show? (action vs. feeling). Same "show a
   transition line, then auto-advance" behavior as Lessons 02/03.
============================================================ */
function renderTransitionQuestion(){
  const d = LESSON_DATA.transition_question;
  const options = d.options.map(o => `
    <button class="transition-btn${STATE.transitionChoice === o.key ? ' picked' : ''}" onclick="pickTransition('${o.key}')">${o.label}</button>

/* ============================================================
   IndexedDB — finished-drawing storage, same shape as prior lessons'
   own copy. A distinct DB_NAME so this lesson's 3 drawings never
   collide with the other lessons'.
============================================================ */
const DB_NAME = 'fei_scene_drawing_close_up_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const MAX_EDGE = 1200;
const JPEG_QUALITY = 0.85;
let _dbPromise = null;
function isStorageSupported(){ return !!window.indexedDB; }
function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}
function compressCanvas(canvas){
  return new Promise((resolve, reject) => {
    let width = canvas.width, height = canvas.height;
    const longestEdge = Math.max(width, height);
    let source = canvas;
    if (longestEdge > MAX_EDGE) {
      const scale = MAX_EDGE / longestEdge;
      const small = document.createElement('canvas');
      small.width = Math.round(width * scale);
      small.height = Math.round(height * scale);
      small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
      source = small;
    }
    source.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
  });
}
async function saveArtwork(pieceId, canvas){
  const compressed = await compressCanvas(canvas);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId, pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record); // one record per task — overwrite on re-save
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function listAllArtworks(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================

function bumpXP(amount){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return; // no platform profile yet — this lesson's own progress still works standalone
    const profile = JSON.parse(raw);
    profile.totalXP = (profile.totalXP || 0) + amount;
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[bumpXP] failed', e); }
}
function markLessonComplete(){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return;
    const profile = JSON.parse(raw);
    profile.completedLessons = Array.isArray(profile.completedLessons) ? profile.completedLessons : [];
    if (!profile.completedLessons.includes(LESSON_DATA.courseId)) {
      profile.completedLessons.push(LESSON_DATA.courseId);
    }
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[markLessonComplete] failed', e); }
}
function showCelebration(text){
  const el = document.getElementById('celebrateToast');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth; // restart animation
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1400);
}

/* ============================================================
   STAGE 11 — Draw It (in-browser sketch canvas per task, same
   pointer-events + devicePixelRatio pattern as prior lessons' copy)
============================================================ */
const SKETCH_COLORS = ['#1c1a22', '#2d5fa8', '#e85c6e', '#f0b93e', '#3fa8a0', '#7b5ea8'];
let sketchColor = SKETCH_COLORS[0];
let sketchDrawing = false;
let sketchLast = null;

function renderDrawTask(){
  const d = LESSON_DATA.draw_task;
  const idx = STATE.drawTaskIndex;
  const task = d.tasks[idx];
  const dots = d.tasks.map((t, i) => `<span class="progress-dot${STATE.drawTaskDone[i] ? ' done' : ''}${i === idx ? ' current' : ''}"></span>`).join('');
  const colors = SKETCH_COLORS.map(c => `<span class="sketch-color-dot${sketchColor === c ? ' picked' : ''}" data-color="${c}" style="background:${c};" onclick="pickSketchColor('${c}')"></span>`).join('');
  return `
    <div class="kicker">Make</div>
    <h2 class="s-title">${d.title}</h2>
    <div class="progress-dots">${dots}</div>
    <div class="task-label">${idx + 1}/${d.tasks.length} — ${task.label}</div>
    <div class="sketch-tool-row">${colors}</div>
    <div class="sketch-canvas-wrap"><canvas id="sketchCanvas"></canvas></div>
    <div class="sketch-clear-wrap"><button class="sketch-clear-btn" onclick="clearSketch()">Clear</button></div>
    <button class="done-scene-btn" id="doneSceneBtn" onclick="finishDrawTask()">✓ Done — Save This Scene</button>
  `;
}
function paintSketchBackground(ctx, w, h){
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
}
function sketchPos(canvas, e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function pickSketchColor(color){
  sketchColor = color;
  document.querySelectorAll('.sketch-color-dot').forEach(el => el.classList.toggle('picked', el.dataset.color === color));
}
function clearSketch(){
  const canvas = document.getElementById('sketchCanvas');
  if (!canvas) return;
  paintSketchBackground(canvas.getContext('2d'), canvas.width, canvas.height);
}
function initSketchCanvas(){
  const canvas = document.getElementById('sketchCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth || 300;
  const ratio = canvas.clientHeight && canvas.clientWidth ? canvas.clientHeight / canvas.clientWidth : 0.75;
  canvas.width = size * dpr;
  canvas.height = size * ratio * dpr;
  const ctx = canvas.getContext('2d');
  paintSketchBackground(ctx, canvas.width, canvas.height);

  canvas.onpointerdown = (e) => {
    sketchDrawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    sketchLast = sketchPos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!sketchDrawing) return;
    const p = sketchPos(canvas, e);
    ctx.strokeStyle = sketchColor;
    ctx.lineWidth = 4 * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sketchLast.x, sketchLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    sketchLast = p;
  };
  canvas.onpointerup = () => { sketchDrawing = false; };
  canvas.onpointercancel = () => { sketchDrawing = false; };
}
function afterRenderDrawTask(){
  sketchColor = SKETCH_COLORS[0];
  initSketchCanvas();
}
async function finishDrawTask(){
  const d = LESSON_DATA.draw_task;
  const idx = STATE.drawTaskIndex;
  const task = d.tasks[idx];
  const canvas = document.getElementById('sketchCanvas');
  const btn = document.getElementById('doneSceneBtn');
  if (!canvas) return;
  btn.disabled = true;
  try {
    await saveArtwork(task.key, canvas);
    STATE.drawTaskDone[idx] = true;
    bumpXP(d.xpPerScene);
    showCelebration('⭐ +' + d.xpPerScene + ' XP — Scene saved!');
  } catch (e) {
    console.warn('[draw_task] saveArtwork failed', e);
    alert("Couldn't save that drawing — want to try again?");
    btn.disabled = false;
    return;
  }
  if (idx < d.tasks.length - 1) {
    STATE.drawTaskIndex = idx + 1;
    setTimeout(() => renderCurrentStage(), 700);
  } else {
    setTimeout(() => goNext(), 900);
  }
}

function switchSeeIdeasTab(key){
  if (seeIdeasTab === key) return;
  const tabs = LESSON_DATA.see_ideas.tabs;
  const dir = tabs.findIndex(t => t.key === key) > tabs.findIndex(t => t.key === seeIdeasTab) ? 1 : -1;
  seeIdeasTab = key;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.key === key));
  const panel = document.getElementById('tabPanel');
  panel.style.transform = `translateX(${dir * 24}px)`;
  panel.style.opacity = '0';
  setTimeout(() => {
    panel.innerHTML = tabPanelHtml(key);
    panel.style.transition = 'none';
    panel.style.transform = `translateX(${-dir * 24}px)`;
    requestAnimationFrame(() => {
      panel.style.transition = 'transform .2s ease, opacity .2s ease';
      panel.style.transform = 'translateX(0)';
      panel.style.opacity = '1';

/* ============================================================
   NAVIGATION (same shape as Lessons 01-03)
============================================================ */
let currentStageId = 'welcome';
function stageIndex(id){ return STAGES.findIndex(s => s.id === id); }
function goStage(id){ currentStageId = id; renderCurrentStage(); }
function goNext(){ const i = stageIndex(currentStageId); if (i > -1 && i < STAGES.length - 1) goStage(STAGES[i + 1].id); }
function goPrev(){ const i = stageIndex(currentStageId); if (i > 0) goStage(STAGES[i - 1].id); }
function goMap(){ currentStageId = 'screen-map'; renderCurrentStage(); }
function goZoneFirst(zoneId){ const first = STAGES.find(s => s.zone === zoneId); if (first) goStage(first.id); }

function renderNav(stage){
  const idx = stageIndex(stage.id);
  const isFirst = idx === 0;
  const isLast = idx === STAGES.length - 1;
  return `
    <div class="nav-footer">
      <button class="sd-btn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>← Back</button>
      ${isLast ? '<span></span>' : `<button class="sd-btn primary" onclick="goNext()">Next →</button>`}
    </div>
  `;
}

/* ============================================================
   COURSE MAP
============================================================ */
function renderMap(){
  const tiles = ZONES.map(z => {
    const count = STAGES.filter(s => s.zone === z.id).length;
    return `
      <div class="zone-tile" onclick="goZoneFirst('${z.id}')">
        <div class="zt-icon">${ZONE_ICONS[z.id]}</div>
        <div class="zt-label">${z.label}</div>
        <div class="zt-count">${count} stop${count > 1 ? 's' : ''}</div>

    `;
  }).join('');
  return `

      <h1 class="display">Close-Up</h1>
      <p>Scene Drawing Foundation · Unit 01: Shot Size</p>
    </div>
    <div class="zone-grid">${tiles}</div>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
function renderCurrentStage(){
  const contentEl = document.getElementById('screen-content');
  const zonePill = document.getElementById('zonePill');

  if (currentStageId === 'screen-map') {
    zonePill.textContent = '';
    contentEl.innerHTML = `<div class="screen active">${renderMap()}</div>`;
    window.scrollTo(0, 0);
    return;
  }

  const stage = STAGES.find(s => s.id === currentStageId);
  if (!stage) { goMap(); return; }
  zonePill.textContent = ZONES.find(z => z.id === stage.zone).label;

  contentEl.innerHTML = `<div class="screen active">${stage.render()}${renderNav(stage)}</div>`;
  window.scrollTo(0, 0);
  if (stage.afterRender) stage.afterRender();
}
