function buildSceneRainyDay(stage) {
  const worldGroup = new THREE.Group();
  stage.scene.add(worldGroup);
  const grass = box3(18, 0.18, 14, 0x5c8f52);
  grass.position.set(0, -0.09, -1);
  worldGroup.add(grass);
  const sidewalk = box3(2.6, 0.02, 12, 0xa9adae, { roughness: 0.35, metalness: 0.05 });
  sidewalk.position.set(0, 0.01, 1);
  worldGroup.add(sidewalk);
  const building = box3(5, 3, 2, 0xc9a15a);
  building.position.set(-3.6, 1.5, -3.5);
  worldGroup.add(building);
  const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.4, 20), new THREE.MeshStandardMaterial({ color: 0x5a9dd6, roughness: 0.15, metalness: 0.3 }));
  puddle.rotation.x = -Math.PI / 2;
  puddle.position.set(0.35, 0.022, 1.6);
  worldGroup.add(puddle);
  // Round 2 — an actual ANIMATED splash at the point of impact (was
  // just static droplets sitting motionless near the puddle, which
  // isn't a splash) — a repeating burst of small droplets that launch
  // outward/up from the puddle center under simple gravity, timed to
  // loop with the stepping kid's foot landing.
  const SPLASH_ORIGIN = { x: 0.35, y: 0.03, z: 1.6 };
  const splashDrops = Array.from({ length: 10 }, () => {
    const d = sphere3(0.018, 0xcfeaf7, 6, 5);
    d.visible = false;
    worldGroup.add(d);
    return { mesh: d, vx: 0, vy: 0, vz: 0, life: 0 };
  });
  function burstSplash() {
    splashDrops.forEach((p, i) => {
      const a = (i / splashDrops.length) * Math.PI * 2;
      p.vx = Math.cos(a) * 0.35;
      p.vz = Math.sin(a) * 0.35;
      p.vy = 0.9 + Math.random() * 0.4;
      p.mesh.position.set(SPLASH_ORIGIN.x, SPLASH_ORIGIN.y, SPLASH_ORIGIN.z);
      p.mesh.visible = true;
      p.life = 0;
    });
  }
  let splashTimer = 0;
  (function animateSplash() {
    let last = performance.now();
    function step(now) {
      if (!stage.state.alive) return;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      splashTimer -= dt;
      if (splashTimer <= 0) { burstSplash(); splashTimer = 2.6; }
      splashDrops.forEach((p) => {
        if (!p.mesh.visible) return;
        p.life += dt;
        p.vy -= 2.4 * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        if (p.mesh.position.y <= SPLASH_ORIGIN.y || p.life > 1) p.mesh.visible = false;
      });
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
  // simple rain — a handful of thin falling lines
  const rainDrops = [];
  for (let i = 0; i < 24; i++) {
    const drop = cyl3(0.007, 0.007, 0.22, 0x9fc8e0);
    drop.material.transparent = true;
    drop.material.opacity = 0.55;
    drop.position.set((Math.random() - 0.5) * 6, 1 + Math.random() * 3, -1 + (Math.random() - 0.5) * 6);
    worldGroup.add(drop);
    rainDrops.push(drop);
  }
  (function animateRain() {
    function step() {
      if (!stage.state.alive) return;
      rainDrops.forEach(d => {
        d.position.y -= 0.06;
        if (d.position.y < 0) d.position.y = 3.5;
      });
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  const umbrella = buildUmbrella3(0xe0574a);
  umbrella.position.set(0.15, 0, 1.75);
  worldGroup.add(umbrella);

  const kidA = buildKid({ skin: 0xf0c49a, hair: 0x6b3e26, shirt: 0x4a90d6, pants: 0x3a3a34, shoe: 0x222222, ponytail: true });
  poseKid(kidA, {
    headTurn: 0.3,
    armR: { shoulder: -1.0, elbow: -0.3 }, armL: { shoulder: 0.2 },
    legL: { thigh: 0.2 }, legR: { thigh: -0.2 }
  });
  kidA.position.set(-0.15, 0, 1.75);
  kidA.rotation.y = 0.15; // faces the camera, not away
  worldGroup.add(kidA);

  const kidB = buildKid({ skin: 0xc9895c, hair: 0x1c1410, shirt: 0xf0c04a, pants: 0x2d5fa8, shoe: 0x2c2c2c });
  poseKid(kidB, {

  // Round 2 — a couple of other students nearby, further down the
  // sidewalk, also caught in the rain (no umbrella of their own).
  [{ x: -0.6, z: 3.1, shirt: 0x5cb85c }, { x: 0.7, z: 3.4, shirt: 0xa15ce0 }].forEach((def, i) => {

    bystander.position.set(def.x, 0, def.z);
    bystander.rotation.y = i ? -0.3 : 0.4;
    bystander.scale.setScalar(0.9);
    worldGroup.add(bystander);
  });

  // Round 2 — a vehicle passing in the background street, beyond the
  // sidewalk (optional per the brief, included for extra life).
  function buildCar3() {
    const cg = new THREE.Group();
    const bodyLow = box3(0.9, 0.28, 0.42, 0xe0574a);
    bodyLow.position.y = 0.28;
    cg.add(bodyLow);
    const cabin = box3(0.5, 0.22, 0.4, 0xdfe6ea, { metalness: 0.1, roughness: 0.3 });
    cabin.position.set(-0.05, 0.52, 0);
    cg.add(cabin);
    [[-0.3, -0.19], [0.3, -0.19], [-0.3, 0.19], [0.3, 0.19]].forEach(([x, z]) => {
      const wheel = cyl3(0.11, 0.11, 0.08, 0x222222, 14);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.13, z);
      cg.add(wheel);
    });
    return cg;
  }
  const car = buildCar3();
  car.position.set(-5, 0, -2.6);
  worldGroup.add(car);
  (function driveCar() {
    const t0 = performance.now();
    function step(now) {
      if (!stage.state.alive) return;
      const t = ((now - t0) / 6000) % 1;
      car.position.x = lerp(-6, 6, t);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  return {
    start: { pos: { x: -3.4, y: 3.2, z: 5.6 }, look: { x: 0.1, y: 1, z: 1 } },
    settle: { pos: { x: 0.1, y: 2.1, z: 3.6 }, look: { x: 0.15, y: 1, z: 1.4 } }

}

  return `
    <div class="step-inner">

function applyDrawStage(){
  const steps = LESSON_DATA.drawing_steps;
  document.querySelectorAll('.dstage').forEach(g => {
    const s = parseInt(g.dataset.stage, 10);
    if (g.classList.contains('guide-lines')) {
      // Round 4 fix: the composition guide grid used to stay at full
      // opacity through every later stage, cluttering the finished
      // drawing (a real, identified cause of illegibility, not just
      // polish) — full only while stage 1 is the CURRENT stage, faint
      // once the drawing has moved past it.
      g.style.opacity = STATE.drawStageIndex === 0 ? '1' : '0.1';
      return;
    }
    g.style.opacity = (s <= STATE.drawStageIndex + 1) ? '1' : '0';
  });
  document.getElementById('drawCaption').textContent = steps[STATE.drawStageIndex].instruction;
  document.getElementById('drawTeachingNote').textContent = steps[STATE.drawStageIndex].teachingNote || '';
  document.getElementById('drawPrevBtn').disabled = STATE.drawStageIndex === 0;
  document.querySelectorAll('.draw-dot').forEach((el, i) => {
    el.classList.toggle('done', i < STATE.drawStageIndex);
    el.classList.toggle('current', i === STATE.drawStageIndex);
  });
  const nextBtn = document.getElementById('drawNextBtn');
  if (STATE.drawStageIndex >= steps.length - 1) {
    nextBtn.textContent = 'Try It Yourself →';
    nextBtn.onclick = () => { STATE.drawPhase = 'practice'; renderCurrentStep(); };
  } else {
    nextBtn.textContent = 'Next Step →';
    nextBtn.onclick = () => drawStep(1);

function drawStep(dir){

function drawReplay(){

  let i = 0;

    i++;
    if (i >= steps.length) { clearInterval(timer); return; }

/* ============================================================
   STEP 5b — "Try It Yourself" homework/artwork submission. Same
   in-browser sketch-canvas + IndexedDB pattern as the live Lesson 01
   (fei_scene_drawing_extreme_wide_shot_storage) — reused verbatim,
   not reinvented, per the standing "don't invent a new storage
   mechanism" instruction. DB name dropped its "_v2_" suffix on
   promotion (2026-09-14) — this is now the one live lesson, not a
   parallel prototype, so there's no longer a separate live store to
   avoid colliding with. No real student data existed under the old
   name to migrate (no real users yet on this lesson).
============================================================ */
const PRACTICE_DB_NAME = 'fei_scene_drawing_wide_shot_storage';
const PRACTICE_DB_VERSION = 1;
const PRACTICE_STORE_NAME = 'artworks';
const PRACTICE_MAX_EDGE = 1200;
const PRACTICE_JPEG_QUALITY = 0.85;
let _practiceDbPromise = null;
function practiceOpenDB(){
  if (_practiceDbPromise) return _practiceDbPromise;
  _practiceDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(PRACTICE_DB_NAME, PRACTICE_DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PRACTICE_STORE_NAME)) {
        db.createObjectStore(PRACTICE_STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _practiceDbPromise;
}
function practiceCompressCanvas(canvas){
  return new Promise((resolve, reject) => {
    let width = canvas.width, height = canvas.height;
    const longestEdge = Math.max(width, height);
    let source = canvas;
    if (longestEdge > PRACTICE_MAX_EDGE) {
      const scale = PRACTICE_MAX_EDGE / longestEdge;
      const small = document.createElement('canvas');
      small.width = Math.round(width * scale);
      small.height = Math.round(height * scale);
      small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
      source = small;
    }
    source.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', PRACTICE_JPEG_QUALITY);
  });
}
async function practiceSaveArtwork(canvas){
  const compressed = await practiceCompressCanvas(canvas);
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readwrite');
    const record = { id: LESSON_DATA.courseId, blob: compressed, savedAt: Date.now() };
    const req = tx.objectStore(PRACTICE_STORE_NAME).put(record); // one record per lesson — overwrite on re-save
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function practiceGetArtwork(){
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readonly');
    const req = tx.objectStore(PRACTICE_STORE_NAME).get(LESSON_DATA.courseId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

const PRACTICE_COLORS = ['#4b473d', '#2d5fa8', '#8a6a4a', '#5b7a96', '#3a3a34'];
const PRACTICE_PAPER = '#faf8f5';
// Round 4 addition: real stroke-style variety, not just one line
// weight — per Faye's explicit ask for watercolor/marker/fineliner
// plus a broad fill-style option suited to blocking in large sky/
// ground areas (this being an Extreme Wide Shot lesson). Eraser
// draws with the paper color rather than true transparency/
// destination-out — the canvas is later compressed to JPEG for
// storage (practiceCompressCanvas), which has no alpha channel, so a
// transparent "erase" would composite to black on save; painting
// with the paper color avoids that entirely and looks identical.
const PRACTICE_TOOLS = {
  fineliner: { label: 'Fineliner', icon: '✒️', width: 2, alpha: 1 },
  marker: { label: 'Marker', icon: '🖊️', width: 8, alpha: 0.88 },
  watercolor: { label: 'Watercolor', icon: '🖌️', width: 20, alpha: 0.24 },
  fill: { label: 'Fill', icon: '🧱', width: 46, alpha: 0.5 },
  eraser: { label: 'Eraser', icon: '🧽', width: 30, alpha: 1, isEraser: true }
};
let practiceColor = PRACTICE_COLORS[0];
let practiceTool = 'fineliner';
let practiceDrawing = false;
let practiceLast = null;

function renderDrawPractice(){
  const colors = PRACTICE_COLORS.map(c => `<span class="practice-color-dot${practiceColor === c ? ' picked' : ''}" data-color="${c}" style="background:${c};" onclick="pickPracticeColor('${c}')"></span>`).join('');
  const tools = Object.keys(PRACTICE_TOOLS).map(key => {
    const t = PRACTICE_TOOLS[key];
    return `<button class="practice-style-btn${practiceTool === key ? ' picked' : ''}" data-tool="${key}" onclick="pickPracticeTool('${key}')">${t.icon} ${t.label}</button>`;
  }).join('');
  return `
    <div class="step-inner wide">
      <div class="step-kicker">Your Turn</div>
      <h2 class="step-title">Try It Yourself</h2>
      <p class="step-sub">Sketch your own version of this scene. Not a finished piece — just your own pass at the same idea.</p>
      <div class="practice-tool-row">${tools}</div>
      <div class="practice-tool-row">${colors}</div>
      <div class="practice-canvas-wrap"><canvas id="practiceCanvas"></canvas></div>
      <div class="draw-controls">
        <button class="draw-btn" onclick="clearPracticeCanvas()">Clear</button>
        <button class="draw-btn primary" id="practiceSaveBtn" onclick="savePracticeDrawing()">Save My Drawing</button>
      </div>
      <div class="practice-saved-note" id="practiceSavedNote">${STATE.ownDrawingSaved ? '✓ Saved — you can keep drawing or continue.' : ''}</div>
    </div>
  `;
}
function practicePos(canvas, e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function pickPracticeColor(color){
  practiceColor = color;
  document.querySelectorAll('.practice-color-dot').forEach(el => el.classList.toggle('picked', el.dataset.color === color));
}
function pickPracticeTool(tool){
  practiceTool = tool;
  document.querySelectorAll('.practice-style-btn').forEach(el => el.classList.toggle('picked', el.dataset.tool === tool));
}
function clearPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function initPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 225;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvas.onpointerdown = (e) => {
    practiceDrawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    practiceLast = practicePos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!practiceDrawing) return;
    const p = practicePos(canvas, e);
    const tool = PRACTICE_TOOLS[practiceTool] || PRACTICE_TOOLS.fineliner;
    ctx.strokeStyle = tool.isEraser ? PRACTICE_PAPER : practiceColor;
    ctx.globalAlpha = tool.alpha;
    ctx.lineWidth = tool.width * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(practiceLast.x, practiceLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    practiceLast = p;
  };
  canvas.onpointerup = () => { practiceDrawing = false; };
  canvas.onpointercancel = () => { practiceDrawing = false; };
}
async function afterRenderDrawPractice(){
  practiceColor = PRACTICE_COLORS[0];
  practiceTool = 'fineliner';
  initPracticeCanvas();
  showContinue('Continue →', nextStep, { ghost: !STATE.ownDrawingSaved });
}
async function savePracticeDrawing(){
  const canvas = document.getElementById('practiceCanvas');
  const btn = document.getElementById('practiceSaveBtn');
  if (!canvas) return;
  btn.disabled = true;
  try {

    document.getElementById('practiceSavedNote').textContent = '✓ Saved — you can keep drawing or continue.';
    showContinue('Continue →', nextStep);
  } catch (e) {
    console.warn('[savePracticeDrawing] failed', e);
    document.getElementById('practiceSavedNote').textContent = "Couldn't save — you can still continue without saving.";
  }
  btn.disabled = false;
}

/* ============================================================
   MY JOURNEY — round 3. Real component, adapted from lesson-1-
   sphere's openMyJourney/closeMyJourney/renderJourneyContent, reading

   finishLesson() (bare global from core/scene-drawing-platform-

   is platform-wide, not scoped to this course, so the stats below
   genuinely aggregate across every course that writes into
   'fei_thinking_journal' — Creation and Foundation together, per
   Faye's own description of what this should show.

   Foundation A's own timeline row assumes every entry carries
   promptText/studentText/inputType/ageGroup (its own reflection-entry
   shape). This lesson's own finishLesson() entry doesn't — and any
   other course's entries may not either — so the row below is
   defensive: it falls back to a synthesized summary instead of
   printing "undefined" for entries that aren't shaped like Foundation
   A's. This isn't cosmetic — it's what a genuinely SHARED cross-
   platform journey view actually needs, not just cover for this one
   lesson's own entries.
============================================================ */
function openMyJourney(){
  renderJourneyModalContent();
  document.getElementById('journeyModalBackdrop').classList.add('show');
}
function closeMyJourney(){
  document.getElementById('journeyModalBackdrop').classList.remove('show');
}
function journeyEscapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function journeyFormatRelativeDate(timestamp){
  const diff = Date.now() - timestamp;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  if (seconds < 60) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
  if (days < 7) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  if (days < 30) return Math.floor(days / 7) + ' week' + (Math.floor(days / 7) > 1 ? 's' : '') + ' ago';
  return new Date(timestamp).toLocaleDateString();
}
// Best-effort summary for entries that don't carry Foundation A's own
// promptText/studentText fields (this lesson's completion entry, or
// any other course's differently-shaped one).
function journeySummarize(e){
  if (e.promptText || e.studentText) {
    return { prompt: e.promptText || '', text: e.studentText || '' };
  }
  if (e.momentKey === 'lesson_complete') {
    const bits = [];
    if (e.storyChoice) bits.push('chose "' + e.storyChoice + '"');
    if (e.sceneChoice) bits.push('chose "' + e.sceneChoice + '"');
    if (Array.isArray(e.checkedConcepts) && e.checkedConcepts.length) bits.push('understood: ' + e.checkedConcepts.join(', '));
    return { prompt: '', text: 'Completed this lesson' + (bits.length ? ' — ' + bits.join('; ') : '') + '.' };
  }
  return { prompt: '', text: 'Saved a moment in this lesson.' };
}
function renderJourneyModalContent(){
  const entries = (typeof JournalStorage !== 'undefined') ? JournalStorage.getAll() : [];
  const statsEl = document.getElementById('journeyStats');
  const timelineEl = document.getElementById('journeyTimeline');

  const totalEntries = entries.length;
  const courseEntries = entries.filter(e => e.courseId === LESSON_DATA.courseId).length;
  const firstEntry = entries[entries.length - 1];
  const daysSinceFirst = firstEntry ? Math.max(1, Math.floor((Date.now() - firstEntry.createdAt) / 86400000)) : 0;
  statsEl.innerHTML = `
    <div class="journey-stat"><div class="journey-stat-number">${totalEntries}</div><div class="journey-stat-label">Thoughts</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${courseEntries}</div><div class="journey-stat-label">This lesson</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${daysSinceFirst}</div><div class="journey-stat-label">Day${daysSinceFirst !== 1 ? 's' : ''} growing</div></div>
  `;

  if (entries.length === 0) {
    timelineEl.innerHTML = `<div class="journey-empty"><div class="journey-empty-icon">💭</div><div>No thoughts yet — your journey starts when you save your first moment.</div></div>`;
    return;
  }
  timelineEl.innerHTML = entries.map(e => {
    const summary = journeySummarize(e);
    return `
      <div class="journey-entry">
        <button class="journey-entry-delete" onclick="deleteJourneyEntry('${e.id}')" title="Delete this thought">🗑</button>
        <div class="journey-entry-meta">
          <span class="journey-entry-lesson">${journeyEscapeHtml(e.lessonId || e.courseId || 'lesson')}</span>
          ${e.momentKey ? `<span class="journey-entry-moment">${journeyEscapeHtml(e.momentKey)}</span>` : ''}
          <span class="journey-entry-date">${journeyFormatRelativeDate(e.createdAt)}</span>
        </div>
        ${summary.prompt ? `<div class="journey-entry-prompt">${journeyEscapeHtml(summary.prompt)}</div>` : ''}
        <div class="journey-entry-text">${journeyEscapeHtml(summary.text)}</div>
      </div>
    `;
  }).join('');
}
function deleteJourneyEntry(entryId){
  if (!confirm('Delete this thought? This cannot be undone.')) return;
  JournalStorage.remove(entryId);
  renderJourneyModalContent();
}

// clean it up before swapping away — needed for Step 2's Three.js
// renderer/requestAnimationFrame loop, which would otherwise keep
// running in the background (a real, growing leak) every time the
// student navigates off Step 2, in either direction.
let _liveStep = null;
function renderCurrentStep(){
  hideContinue();
  if (_liveStep && _liveStep.cleanup) {
    try { _liveStep.cleanup(); } catch (e) { console.warn('[cleanup] failed', e); }
  }
  const step = STEPS[STATE.stepIndex];
  const stageEl = document.getElementById('stage');
  stageEl.innerHTML = `<div class="step">${step.render()}</div>`;
  renderRail();
  window.scrollTo(0, 0);
  _liveStep = step;
  if (step.afterRender) step.afterRender();
}
// Step-transition chime — round 3. Reuses the exact same synthesized-
// tone mechanism Foundation Skill lessons already use for lightweight
// UI feedback (artchiPlayTone, ported verbatim from Foundation A's own
// playTone() in core/scene-drawing-archi.js — no new sound asset).
// 880Hz/0.12s matches that codebase's existing single-ding feedback
// calls (e.g. lesson-1-sphere's own `playTone(880, 0.1)`), not the
// multi-note ascending sequences reserved for bigger celebrations.
// Lives in the shared nav functions below so it covers every lesson-
// level step-to-step move uniformly — Step 1's video and Step 2's
// automatic camera reveal only reach these functions once each
// sequence has already finished on its own, so the chime marks the
// discrete navigation action, never layers over the video's own audio
// or the reveal animation itself.
function playStepAdvanceTone(){
  if (typeof artchiPlayTone === 'function') artchiPlayTone(880, 0.12);
}
function nextStep(){
  if (STATE.stepIndex < STEPS.length - 1) { playStepAdvanceTone(); STATE.stepIndex++; renderCurrentStep(); }
}
// Global Previous. Carries forward the exact fix Lesson 01's round 5
// needed for the SAME issue: naively decrementing stepIndex treats
// "guided_drawing" as one flat step, but it has its own internal
// sub-sequence (5 reference stages, then a practice phase) tracked in
// STATE.drawStageIndex/drawPhase that a plain stepIndex-- knows
// nothing about — Previous from "Try It Yourself" would jump straight
// past all 5 drawing stages to Choose Your Scene. Fix: when the
// CURRENT step is guided_drawing and there's still sub-stage room to
// go back through, step backward ONE sub-stage (matching drawStep's
// own forward stepping) instead of leaving the step entirely — only
// once already at the very first reference stage does Previous fall
// through to the normal top-level behavior. See pickScene()'s own
// reset for the other half of this same pattern (re-picking a scene
// after this landed back on Choose Your Scene starts fresh, not
// mid-way). Step 3's six scenes need NONE of this special-casing —
// they're flat top-level STEPS entries (see STORY_SCENE_STEPS's own
// comment), so plain stepIndex++/-- is already correct for them.
function prevStep(){
  const current = STEPS[STATE.stepIndex];
  if (current && current.id === 'guided_drawing') {
    if (STATE.drawPhase === 'practice') {
      playStepAdvanceTone();
      STATE.drawPhase = 'reference';
      renderCurrentStep(); // same step, now showing the last reference stage
      return;
    }
    if (STATE.drawStageIndex > 0) {
      playStepAdvanceTone();
      drawStep(-1);
      return;
    }
    // else: already at the first reference stage — fall through below.
  }
  if (STATE.stepIndex > 0) { playStepAdvanceTone(); STATE.stepIndex--; renderCurrentStep(); }
}
function goToStep(i){
  playStepAdvanceTone();
  STATE.stepIndex = Math.max(0, Math.min(STEPS.length - 1, i));
  renderCurrentStep();
}

/* ============================================================
   ARTCHI — mounted lazily, starting at Step 2, NOT on init(). Step 1
   is the full-screen intro video and must stay completely free of
   chrome; showArtchi()'s own first-visit onboarding is a full-
   viewport blocking modal (core/scene-drawing-style.css
   .artchi-onboard-backdrop), so firing it during the video would trap
   the whole lesson behind a popup before the student sees anything —
   caught live in a Playwright pass, not by inspection. Archi's first
   real appearance now lines up with her first bubble line anyway
   (Step 2's "Try stepping back."), matching the brief's "only very
   short moments" instruction.
============================================================ */
let artchiMounted = false;
function ensureArtchiMounted(){
  if (artchiMounted) return;
  artchiMounted = true;
  document.getElementById('artchi-mount').innerHTML = artchiMarkup();
  initArtchiDrag();
  // Reveal only — deliberately NOT calling the shared showArtchi(),
  // which also triggers either a full-screen onboarding modal (first
  // platform visit) or a generic idle bubble a few hundred ms later.
  // Both would collide with this lesson's own deliberate, sparse
  // bubble cues (the brief's "should NOT constantly speak" rule), and
  // the onboarding modal specifically is a full-viewport popup that
  // would block the Learning Canvas mid-interaction — caught live in
  // a Playwright pass, not by inspection. Everything else (markup,
  // drag, bubble, chat) is the same shared component, untouched.
  const character = document.getElementById('artchi-character');
  const label = document.getElementById('artchi-label');
  if (character) character.classList.remove('hidden');
  if (label) label.classList.remove('hidden');
  resetArtchiSleep();
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      // Deliberately ungated — matches the live sibling lesson's own
      // unresolved TODO on Scene Drawing's free/paid rule.
    } catch (e) { console.warn('[init] FEIAccess.init failed, continuing', e); }
  }
  renderCurrentStep();
}
init();
</script>
