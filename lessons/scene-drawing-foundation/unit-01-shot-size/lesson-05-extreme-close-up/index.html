<style>
:root{
  --ink:#1c1a22;
  --ink-soft:rgba(28,26,34,.66);
  --ink-faint:rgba(28,26,34,.42);
  --accent:#2d5fa8;
  --accent-deep:#1f4076;
  --line:rgba(28,26,34,.14);
  --paper:#faf8f5;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;position:sticky;top:0;z-index:500;
  background:linear-gradient(var(--paper) 78%, transparent);
}
.back-link{font-size:12px;color:var(--accent-deep);text-decoration:none;font-weight:700;letter-spacing:.2px;}
.map-btn{
  border:2px solid var(--ink);background:var(--paper);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
}
.map-btn:active{transform:scale(.95);}
.zone-pill{font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:#fff;background:var(--accent);padding:4px 9px;border-radius:999px;}

.screen{display:none;max-width:640px;margin:0 auto;padding:6px 20px 40px;position:relative;}
@media(min-width:700px){.screen{max-width:820px;}}
.screen.active{display:block;animation:stageIn .4s ease;}
@keyframes stageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:6px;}
.s-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.7rem;text-align:center;margin:0 0 8px;color:var(--accent-deep);}
.s-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

.placeholder-card{
  background:#fff;border:1.5px dashed var(--line);border-radius:14px;
  padding:26px 18px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:1.6;
}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.sd-btn{
  font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--ink);background:transparent;color:var(--ink);transition:transform .12s ease;
}
.sd-btn:active{transform:scale(.96);}
.sd-btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.sd-btn:disabled{opacity:.3;cursor:not-allowed;}

.map-header{text-align:center;margin:6px 0 22px;}
.map-header h1{font-size:1.9rem;margin:4px 0 4px;}
.map-header p{font-size:13px;color:var(--ink-soft);margin:0;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(min-width:480px){.zone-grid{grid-template-columns:1fr 1fr 1fr;}}
.zone-tile{
  background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:20px 10px 16px;text-align:center;cursor:pointer;
  box-shadow:4px 5px 0 rgba(28,26,34,.14);transition:transform .15s ease;
}
.zone-tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(28,26,34,.14);}
.zone-tile .zt-icon{font-size:1.9rem;}
.zone-tile .zt-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;margin-top:6px;color:var(--accent-deep);}
.zone-tile .zt-count{font-size:10px;color:var(--ink-faint);margin-top:2px;font-weight:700;}

/* ---------- Stage 1: Welcome ---------- */
.welcome-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 10px 26px rgba(28,26,34,.16);}
.welcome-hero img{display:block;width:100%;height:auto;}
.welcome-cloud{
  position:absolute;background:rgba(255,255,255,.75);border-radius:50%;
  filter:blur(1px);pointer-events:none;
}
.welcome-cloud::before, .welcome-cloud::after{
  content:'';position:absolute;background:inherit;border-radius:50%;
}
.wc-1{width:70px;height:24px;top:14%;left:-15%;animation:cloudDrift1 26s linear infinite;}
.wc-1::before{width:36px;height:36px;top:-16px;left:8px;}
.wc-1::after{width:26px;height:26px;top:-10px;left:38px;}
.wc-2{width:50px;height:18px;top:28%;left:-12%;animation:cloudDrift1 34s linear infinite;animation-delay:-10s;}
.wc-2::before{width:26px;height:26px;top:-11px;left:6px;}
@keyframes cloudDrift1{from{transform:translateX(0);}to{transform:translateX(480px);}}
.welcome-character{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
  font-size:1.6rem;animation:breathe 2.6s ease-in-out infinite;transform-origin:bottom center;
}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.06);}}
.start-btn-wrap{text-align:center;}
.start-btn-wrap .sd-btn.primary{animation:btnBreathe 2s ease-in-out infinite;}
@keyframes btnBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

/* ---------- Stage 2: Video intro ---------- */
.video-embed-wrap{margin:14px 0 8px;border-radius:10px;overflow:hidden;box-shadow:0 12px 28px rgba(28,26,34,.22);}

/* ---------- Stage 3: Connect: You ---------- */
.connect-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.connect-option{
  flex:1 1 0;min-width:100px;max-width:160px;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
  transition:border-color .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent;
}
.connect-option:active{transform:scale(.96);}
.connect-option.picked{border-color:var(--accent);background:rgba(45,95,168,.06);}
.connect-option .co-icon{font-size:1.7rem;}
.connect-option .co-label{font-size:11.5px;font-weight:700;margin-top:6px;color:var(--ink-soft);}
.connect-bubble{
  text-align:center;font-size:13.5px;font-weight:600;color:var(--accent-deep);
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px;
  opacity:0;transform:scale(.8);height:0;padding-top:0;padding-bottom:0;margin-top:0;overflow:hidden;
  transition:opacity .2s ease,transform .2s ease;
}
.connect-bubble.show{
  opacity:1;transform:scale(1);height:auto;padding-top:12px;padding-bottom:12px;margin-top:16px;overflow:visible;
}

/* ---------- Stage 4: Transition question ---------- */
.transition-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.transition-btn{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:16px 22px;
  border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;
}
.transition-btn:active{transform:scale(.96);}
.transition-btn.picked{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.transition-line{
  text-align:center;font-size:13.5px;font-weight:600;color:var(--accent-deep);margin-top:16px;
  opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .25s ease;
}
.transition-line.show{opacity:1;transform:translateY(0);}

/* ---------- Stage 5/6: ABChoiceCard host ---------- */
.abc-host{margin-top:14px;}

/* ---------- Stage 7/8: CameraZoomSlider + term reveal ---------- */
.typewriter-text{
  text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:600;
  color:var(--accent-deep);min-height:2.6em;margin:6px 0 16px;line-height:1.4;
}
.term-labels{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px;}
.term-label{
  font-size:11px;font-weight:800;letter-spacing:1.5px;color:#fff;background:var(--accent);
  padding:5px 12px;border-radius:999px;opacity:0;transform:translateY(6px);
  transition:opacity .3s ease,transform .3s ease;
}
.term-label.show{opacity:1;transform:translateY(0);}
.term-reveal{
  text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.6rem;
  color:var(--accent-deep);margin-top:14px;opacity:0;transition:opacity .5s ease;
}
.term-reveal.show{opacity:1;}
.term-subtitle{
  text-align:center;font-size:13px;color:var(--ink-soft);margin-top:4px;
  opacity:0;transition:opacity .5s ease;
}
.term-subtitle.show{opacity:1;}

/* ---------- Stage 9: Real examples ---------- */
.examples-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;}
@media(max-width:480px){.examples-grid{grid-template-columns:1fr;}}
.example-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(28,26,34,.1);cursor:zoom-in;}
.example-card img{display:block;width:100%;height:auto;}
.example-card .example-label{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);padding:8px;}

.lightbox-overlay{
  position:fixed;inset:0;background:rgba(28,26,34,.82);z-index:700;
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.lightbox-overlay.show{opacity:1;pointer-events:auto;}
.lightbox-overlay img{max-width:100%;max-height:80vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
.lightbox-close{position:absolute;top:18px;right:20px;background:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:16px;font-weight:800;cursor:pointer;}
</style>

  <img id="lightboxImg" src="" alt="">

<script>
/* ============================================================
   DATA — stage list + zone grouping, same shape as Lessons 01-04.
============================================================ */
const ZONES = [
  { id:'welcome', label:'WELCOME' },
  { id:'look',    label:'LOOK' },
  { id:'think',   label:'THINK' },
  { id:'make',    label:'MAKE' },
  { id:'reflect', label:'REFLECT' }
];
const ZONE_ICONS = { welcome:'👋', look:'👀', think:'💭', make:'🎨', reflect:'🖼' };

const STAGES = [
  { id:'welcome',             title:'Welcome',                zone:'welcome', render:renderWelcome },
  { id:'video_intro',         title:'What is an Extreme Close-Up?', zone:'look', render:renderVideoIntro },
  { id:'connect_you',         title:"It's About You!",        zone:'look',    render:renderConnectYou, afterRender:afterRenderConnectYou },
  { id:'transition_question', title:'What Should We Show?',   zone:'look',    render:renderTransitionQuestion },
  { id:'story_a',             title:'Story A',                zone:'think',   render:renderStoryA, afterRender:afterRenderStoryA },
  { id:'story_b',             title:'Story B',                zone:'think',   render:renderStoryB, afterRender:afterRenderStoryB },
  { id:'big_idea',            title:'The Big Idea',           zone:'think',   render:renderBigIdea, afterRender:afterRenderBigIdea },
  { id:'meet_term',           title:'Meet the Term',          zone:'think',   render:renderMeetTerm, afterRender:afterRenderMeetTerm },
  { id:'real_examples',       title:'Real Examples',          zone:'think',   render:renderRealExamples },
  { id:'demo_video',          title:"Let's Draw Together",    zone:'make',    render:() => renderPlaceholder('demo_video') },
  { id:'draw_task',           title:'Draw It',                zone:'make',    render:() => renderPlaceholder('draw_task') },
  { id:'see_ideas',           title:"See Everyone's Ideas",   zone:'make',    render:() => renderPlaceholder('see_ideas') },
  { id:'reflect',             title:'Reflect',                zone:'reflect', render:() => renderPlaceholder('reflect') }
];

let STATE = {
  connectChoice: null,
  transitionChoice: null,
  cameraPosition: 0.5
};

/* ============================================================
   SHARED HELPER — typewriter reveal (same as Lessons 01-04)
============================================================ */
let typewriterTimer = null;
function typewriterInto(elId, text, totalDurationMs){
  clearInterval(typewriterTimer);
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = '';
  const perCharMs = Math.max(20, Math.floor((totalDurationMs || 1800) / text.length));
  let i = 0;
  typewriterTimer = setInterval(() => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(typewriterTimer);
  }, perCharMs);
}

/* ============================================================
   SHARED HELPER — video embed (Cloudflare Stream, with the
   established "coming soon" fallback). Same helper as Lessons 01-04.
============================================================ */
const CF_STREAM_CUSTOMER = 'customer-a78os4oj56dr67ab.cloudflarestream.com';
function cfStreamSrc(streamId){
  const poster = encodeURIComponent(`https://${CF_STREAM_CUSTOMER}/${streamId}/thumbnails/thumbnail.jpg?time=&height=600`);
  return `https://${CF_STREAM_CUSTOMER}/${streamId}/iframe?poster=${poster}`;
}
function renderVideoEmbed(src, title){
  if (src) {
    return `<div class="video-embed-wrap"><div style="position:relative;padding-top:56.25%;">
      <iframe src="${src}" loading="lazy" title="${title}"
        style="border:none;position:absolute;top:0;left:0;height:100%;width:100%;"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
    </div></div>`;
  }
  return `<div class="video-embed-wrap"><div style="position:relative;padding-top:56.25%;background:linear-gradient(135deg,var(--accent),var(--accent-deep));">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
      <div style="font-size:2.2rem;">🎥</div><div style="font-size:13px;margin-top:6px;">Video coming soon!</div>
    </div>
  </div></div>`;
}

/* ============================================================
   STAGE 1 — Welcome
============================================================ */
function renderWelcome(){
  const d = LESSON_DATA.welcome;
  return `
    <div class="welcome-hero">
      <img src="${d.heroImage}" alt="A single small detail filling the entire frame">
      <span class="welcome-cloud wc-1" aria-hidden="true"></span>
      <span class="welcome-cloud wc-2" aria-hidden="true"></span>
      <span class="welcome-character" aria-hidden="true">🧍</span>
    </div>
    <h1 class="s-title display">${d.title}</h1>
    <p class="s-sub">${d.subtitle}</p>
    <div class="start-btn-wrap">
      <button class="sd-btn primary" onclick="goNext()">${d.startLabel}</button>
    </div>
  `;
}

/* ============================================================
   STAGE 2 — What is an Extreme Close-Up? (video)
============================================================ */
function renderVideoIntro(){
  const d = LESSON_DATA.video_intro;
  return `
    <div class="kicker">Look</div>
    <h2 class="s-title">${d.title}</h2>
    ${renderVideoEmbed(d.videoStreamId ? cfStreamSrc(d.videoStreamId) : null, d.videoTitle)}
    <p class="s-sub" style="margin-top:14px;">${d.keySentence}</p>
  `;
}

/* ============================================================
   STAGE 3 — Connect: You (bubble copy reused verbatim from Lesson 01)
============================================================ */
function renderConnectYou(){
  const d = LESSON_DATA.connect_you;
  const options = d.options.map(o => `
    <div class="connect-option${STATE.connectChoice === o.key ? ' picked' : ''}" onclick="pickConnect('${o.key}')">
      <div class="co-icon">${o.icon}</div>
      <div class="co-label">${o.label}</div>
    </div>
  `).join('');
  return `
    <div class="kicker">Look</div>
    <h2 class="s-title">${d.title}</h2>
    <div class="connect-options">${options}</div>
    <div class="connect-bubble" id="connectBubble"></div>
  `;
}
function afterRenderConnectYou(){
  if (!STATE.connectChoice) return;
  const picked = LESSON_DATA.connect_you.options.find(o => o.key === STATE.connectChoice);
  const bubble = document.getElementById('connectBubble');
  bubble.textContent = picked.response;
  requestAnimationFrame(() => bubble.classList.add('show'));
}
function pickConnect(key){
  STATE.connectChoice = key;
  const d = LESSON_DATA.connect_you;
  document.querySelectorAll('.connect-option').forEach((el, i) => el.classList.toggle('picked', d.options[i].key === key));
  const picked = d.options.find(o => o.key === key);
  const bubble = document.getElementById('connectBubble');
  bubble.classList.remove('show');
  bubble.textContent = picked.response;
  requestAnimationFrame(() => bubble.classList.add('show'));
}

/* ============================================================
   STAGE 4 — What Should We Show? (whole face vs. one tiny detail).
   Same "show a transition line, then auto-advance" behavior as
   Lessons 02/03/04.
============================================================ */
function renderTransitionQuestion(){
  const d = LESSON_DATA.transition_question;
  const options = d.options.map(o => `
    <button class="transition-btn${STATE.transitionChoice === o.key ? ' picked' : ''}" onclick="pickTransition('${o.key}')">${o.label}</button>
  `).join('');
  return `
    <div class="kicker">Look</div>
    <h2 class="s-title">${d.title}</h2>
    <div class="transition-options">${options}</div>
    <p class="transition-line" id="transitionLine">${d.transitionLine}</p>
  `;
}
function pickTransition(key){
  if (STATE.transitionChoice) return; // no double-advance on a fast second tap
  STATE.transitionChoice = key;
  document.querySelectorAll('.transition-btn').forEach(btn => btn.classList.toggle('picked', btn.textContent === LESSON_DATA.transition_question.options.find(o => o.key === key).label));
  const line = document.getElementById('transitionLine');
  if (line) line.classList.add('show');
  setTimeout(() => goNext(), 1100);
}

/* ============================================================
   STAGE 5 / 6 — story_a / story_b (ABChoiceCard, reusing its existing
   optional `description` field and a question prompt above the cards
   — no component changes)
============================================================ */
function renderStoryA(){
  const d = LESSON_DATA.story_a;
  return `
    <div class="kicker">${d.kicker}</div>
    <h2 class="s-title">${d.prompt}</h2>
    <p class="s-sub">${d.question}</p>
    <div class="abc-host" id="abcStoryA"></div>
  `;
}
function afterRenderStoryA(){
  const d = LESSON_DATA.story_a;
  ABChoiceCard.render('abcStoryA', { optionA: d.optionA, optionB: d.optionB, feedbackDelayMs: 900 }, () => goNext());
}
function renderStoryB(){
  const d = LESSON_DATA.story_b;
  return `
    <div class="kicker">${d.kicker}</div>
    <h2 class="s-title">${d.prompt}</h2>
    <p class="s-sub">${d.question}</p>
    <div class="abc-host" id="abcStoryB"></div>
  `;
}
function afterRenderStoryB(){
  const d = LESSON_DATA.story_b;
  ABChoiceCard.render('abcStoryB', { optionA: d.optionA, optionB: d.optionB, feedbackDelayMs: 900 }, () => goNext());
}

/* ============================================================
   STAGE 7 — The Big Idea (CameraZoomSlider intro auto-animate,
   0.5 -> 0, same mechanism as Lessons 01/02/04)
============================================================ */
function renderBigIdea(){
  return `
    <div class="kicker">Think</div>
    <p class="typewriter-text" id="typewriterText"></p>
    <div id="czsMount"></div>
  `;
}
function afterRenderBigIdea(){
  const d = LESSON_DATA.big_idea;
  typewriterInto('typewriterText', d.title, d.autoAnimateDurationMs);
  CameraZoomSlider.mount('czsMount', {
    defaultPosition: d.autoAnimateFrom,
    autoAnimate: { from: d.autoAnimateFrom, to: d.autoAnimateTo, durationMs: d.autoAnimateDurationMs }
  }, {
    onSettle(pos){ STATE.cameraPosition = pos; }
  });
}

/* ============================================================
   STAGE 8 — Meet the Term (same visual, settled — term reveal)
============================================================ */
function renderMeetTerm(){
  const d = LESSON_DATA.meet_term;
  const labels = d.labels.map((l, i) => `<span class="term-label" id="termLabel${i}">${l}</span>`).join('');
  return `
    <div class="kicker">Think</div>
    <div id="czsMountTerm"></div>
    <div class="term-labels">${labels}</div>
    <h2 class="term-reveal" id="termReveal">${d.term}</h2>
    <p class="term-subtitle" id="termSubtitle">${d.subtitle}</p>
  `;
}
function afterRenderMeetTerm(){
  const d = LESSON_DATA.meet_term;
  // STATE.cameraPosition after Stage 7 settles at the target (0), which
  // is itself falsy — but LESSON_DATA.big_idea.autoAnimateTo is also 0,
  // so the `||` fallback below still resolves to the correct value
  // either way (both sides equal 0 here). Same pattern as Lessons
  // 01/02/04's afterRenderMeetTerm; not touched.
  CameraZoomSlider.mount('czsMountTerm', { defaultPosition: STATE.cameraPosition || LESSON_DATA.big_idea.autoAnimateTo }, {
    onSettle(pos){ STATE.cameraPosition = pos; }
  });
  d.labels.forEach((label, i) => {
    setTimeout(() => {
      const el = document.getElementById('termLabel' + i);
      if (el) el.classList.add('show');
    }, i * 300);
  });
  setTimeout(() => {
    const revealEl = document.getElementById('termReveal');
    const subtitleEl = document.getElementById('termSubtitle');
    if (revealEl) revealEl.classList.add('show');
    if (subtitleEl) subtitleEl.classList.add('show');
  }, d.labels.length * 300 + 200);
}

/* ============================================================
   STAGE 9 — Real Examples
============================================================ */
function renderRealExamples(){
  const d = LESSON_DATA.real_examples;
  const cards = d.examples.map(ex => `
    <div class="example-card" onclick="openLightbox('${ex.image}', '${ex.label}')">
      <img src="${ex.image}" alt="${ex.label}">
      <div class="example-label">${ex.label}</div>
    </div>
  `).join('');
  return `
    <div class="kicker">Think</div>
    <h2 class="s-title">${d.title}</h2>
    <div class="examples-grid">${cards}</div>
  `;
}
function openLightbox(src, alt){
  const overlay = document.getElementById('lightboxOverlay');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  img.alt = alt;
  overlay.classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('show');
}

function renderPlaceholder(stageId){
  return `
    <div class="kicker">Scaffold</div>
    <h2 class="s-title">${STAGES.find(s => s.id === stageId).title}</h2>
    <div class="placeholder-card">
      Stage "<strong>${stageId}</strong>" — content not wired yet.
    </div>
  `;
}

/* ============================================================
   NAVIGATION (same shape as Lessons 01-04)
============================================================ */
let currentStageId = 'welcome';
function stageIndex(id){ return STAGES.findIndex(s => s.id === id); }
function goStage(id){ currentStageId = id; renderCurrentStage(); }
function goNext(){ const i = stageIndex(currentStageId); if (i > -1 && i < STAGES.length - 1) goStage(STAGES[i + 1].id); }
function goPrev(){ const i = stageIndex(currentStageId); if (i > 0) goStage(STAGES[i - 1].id); }
function goMap(){ currentStageId = 'screen-map'; renderCurrentStage(); }
function goZoneFirst(zoneId){ const first = STAGES.find(s => s.zone === zoneId); if (first) goStage(first.id); }

function renderNav(stage){
  const idx = stageIndex(stage.id);
  const isFirst = idx === 0;
  const isLast = idx === STAGES.length - 1;
  return `
    <div class="nav-footer">
      <button class="sd-btn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>← Back</button>
      ${isLast ? '<span></span>' : `<button class="sd-btn primary" onclick="goNext()">Next →</button>`}
    </div>
  `;
}

/* ============================================================
   COURSE MAP
============================================================ */
function renderMap(){
  const tiles = ZONES.map(z => {
    const count = STAGES.filter(s => s.zone === z.id).length;
    return `
      <div class="zone-tile" onclick="goZoneFirst('${z.id}')">
        <div class="zt-icon">${ZONE_ICONS[z.id]}</div>
        <div class="zt-label">${z.label}</div>
        <div class="zt-count">${count} stop${count > 1 ? 's' : ''}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="map-header">
      <h1 class="display">Extreme Close-Up</h1>
      <p>Scene Drawing Foundation · Unit 01: Shot Size</p>
    </div>
    <div class="zone-grid">${tiles}</div>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
function renderCurrentStage(){
  const contentEl = document.getElementById('screen-content');
  const zonePill = document.getElementById('zonePill');

  if (currentStageId === 'screen-map') {
    zonePill.textContent = '';
    contentEl.innerHTML = `<div class="screen active">${renderMap()}</div>`;
    window.scrollTo(0, 0);
    return;
  }

  const stage = STAGES.find(s => s.id === currentStageId);
  if (!stage) { goMap(); return; }
  zonePill.textContent = ZONES.find(z => z.id === stage.zone).label;

  contentEl.innerHTML = `<div class="screen active">${stage.render()}${renderNav(stage)}</div>`;
  window.scrollTo(0, 0);
  if (stage.afterRender) stage.afterRender();
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      // TODO(Faye): confirm the free/paid access rule for Scene Drawing
      // Foundation before wiring FEIAccess.gateLessonPage('creation',
      // 'scene-drawing-foundation-extreme-close-up') here. Deliberately
      // left ungated per the build prompt's explicit "out of scope."
    } catch (e) {
      console.warn('[init] FEIAccess.init failed, continuing', e);
    }
  }
  renderCurrentStage();
}

init();
</script>
