  WHAT THIS IS: a full-screen, low-chrome sequence of learning MOMENTS

  lesson-data.js's LESSON_DATA object so the same shell can carry

  FLAGGED, NOT DECIDED SILENTLY: the artwork-save IndexedDB flow now

  record per lesson, and only saves a record for a story the student

  was actually drawn digitally) is right, or whether paper-choice

  FOLLOW-UP ROUND (same live path, on top of the restructure above):
  - REAL BUG FIXED: Step 3's tap-to-reveal cards went permanently dead

<style>
:root{
  --ink:#1c1a22;
  --ink-soft:rgba(28,26,34,.66);
  --ink-faint:rgba(28,26,34,.42);
  --ink-muted:rgba(28,26,34,.42);
  --accent:#2d5fa8;
  --accent-deep:#1f4076;
  --line:rgba(28,26,34,.14);
  --border:rgba(28,26,34,.14);
  --paper:#faf8f5;
  --purple:#a78bfa;
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:20px;
  /* Round 6 — storyboard/production-panel palette, Step 3 onward only
     (Steps 1-2 keep their current video/colorful-3D treatment; Step 4
     is Faye's own build). Grayscale/off-white and restrained, not the
     platform's blue accent — a deliberate, scoped departure per her
     explicit reference, not a change to the rest of the lesson. */
  --sb-paper:#f2ede0;
  --sb-panel:#faf7ee;
  --sb-ink:#3a352c;
  --sb-ink-soft:rgba(58,53,44,.62);
  --sb-ink-faint:rgba(58,53,44,.4);
  --sb-line:rgba(58,53,44,.3);
  --sb-accent:#8a6a4a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;}

/* ============================================================
   LEARNING CANVAS SHELL — minimal chrome, full-viewport stage.
============================================================ */
#canvas-app{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;position:sticky;top:0;z-index:80;
  background:linear-gradient(var(--paper) 70%, transparent);
  pointer-events:none;
}
#topbar > *{pointer-events:auto;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.exit-link{font-size:12px;color:var(--ink-faint);text-decoration:none;font-weight:700;letter-spacing:.2px;transition:color .15s ease;}
.exit-link:hover{color:var(--accent-deep);}
/* Global Previous control — every step needs a visible way back, per
   Faye's explicit round-2 flag ("real problem, not nitpicking"). One
   control in the topbar covers all 8 steps without each step's own
   render() needing to know about navigation. Step 1 gets it disabled,
   not hidden, so its position stays stable across steps. */
.prev-step-btn{
  font-size:12px;color:var(--ink-soft);background:none;border:1.5px solid var(--line);
  border-radius:999px;padding:5px 13px 5px 10px;font-weight:700;letter-spacing:.2px;
  cursor:pointer;display:flex;align-items:center;gap:3px;transition:border-color .15s ease,color .15s ease;
}
.prev-step-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-deep);}
.prev-step-btn:active:not(:disabled){transform:scale(.96);}
.prev-step-btn:disabled{opacity:.32;cursor:default;}
/* My Journey entry point — round 3. The real component (see the
   ported modal further down) is Foundation A's existing My Journey
   (cross-course JournalStorage stats + timeline), reused as-is, not
   rebuilt. Its usual home elsewhere on the platform is a sticky
   side-panel button inside a two-column desktop grid layout — this
   Learning Canvas is deliberately single-column/full-viewport on
   every step (the original brief's own "avoid multi-column content
   during active learning" rule), so retrofitting that grid would
   fight the rest of the design. Placing the same real entry point in
   this topbar instead keeps it "fixed" (the topbar is already
   position:sticky;top:0 on every step) without importing a layout
   that contradicts the lesson's own design language — a judgment
   call, flagged as such in the round-3 report. */
.journey-btn{
  font-size:12px;color:var(--ink-soft);background:none;border:1.5px solid var(--line);
  border-radius:999px;padding:5px 13px;font-weight:700;letter-spacing:.2px;cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:border-color .15s ease,color .15s ease;
}
.journey-btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.journey-btn:active{transform:scale(.96);}
.rail{display:flex;gap:6px;align-items:center;}
/* Narrow viewports: "← Scene Drawing Foundation" + "‹ Previous" +
   "📖 Journey" together wrapped and crowded the topbar — caught in a
   mobile-viewport screenshot pass, not by inspection. Collapse the
   exit link to just its arrow there, and the Journey button to just
   its icon; the Previous control stays full (it's the one Faye
   specifically flagged as a real usability gap). */
@media(max-width:420px){.exit-link-full{display:none;}.journey-btn-full{display:none;}}
.rail-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s ease,transform .2s ease;}
.rail-dot.done{background:var(--accent);}
.rail-dot.current{background:var(--accent-deep);transform:scale(1.5);}

#stage{flex:1;position:relative;display:flex;flex-direction:column;}
.step{
  flex:1;display:flex;flex-direction:column;
  animation:stepIn .5s ease;
}
@keyframes stepIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.step-inner{
  flex:1;width:100%;max-width:760px;margin:0 auto;
  padding:6px 22px 120px;display:flex;flex-direction:column;justify-content:center;
}
.step-inner.wide{max-width:1040px;}
.step-inner.bleed{max-width:none;padding:0 0 120px;}
/* Content-dense steps (e.g. Look Closer's 6-card grid) can be taller
   than the viewport. justify-content:center (the default, right for
   short single-moment steps) makes overflowing content spill equally
   above AND below the fold, so the true bottom padding that's meant
   to clear the fixed continue-dock never actually sits below the
   last visible row on first paint — the dock still overlaps it. Root
   cause found by measuring boundingBoxes, not by eyeballing the
   screenshot alone. flex-start anchors dense content to the top so
   scrolling to the real end also reaches the reserved clearance. */
.step-inner.dense{justify-content:flex-start;}

.step-kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:10px;}
.step-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);text-align:center;margin:0 0 10px;color:var(--accent-deep);}
.step-sub{text-align:center;font-size:14px;color:var(--ink-soft);margin:0 auto 22px;line-height:1.6;max-width:520px;}

/* ---- Continue dock (quiet, floats in only once a step is "done").
   The scrim behind it keeps the button from visually cutting into
   card text on content-dense steps (e.g. Look Closer's 6-card grid)
   when the viewport is shorter than the content — caught in a live
   screenshot, not by inspection. ---- */
.continue-dock{
  position:fixed;left:0;right:0;bottom:0;padding-bottom:clamp(18px,4vh,34px);
  display:flex;justify-content:center;align-items:flex-end;z-index:70;pointer-events:none;
  height:104px;background:linear-gradient(transparent, var(--paper) 62%);
}
.continue-dock:empty{background:none;}
.continue-btn{
  pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity .35s ease,transform .35s ease;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  padding:13px 28px;border-radius:999px;border:none;background:var(--accent);color:#fff;
  box-shadow:0 10px 28px rgba(28,26,34,.24);cursor:pointer;
}
.continue-btn.ready{opacity:1;transform:translateY(0);pointer-events:auto;}
.continue-btn:active{transform:scale(.96);}
.continue-btn.ghost{background:transparent;color:var(--ink-faint);box-shadow:none;font-weight:600;font-size:12.5px;}

/* ============================================================
   STEP 1 — What Is a Scene? (video)
============================================================ */
.video-stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;}
@media(min-height:640px){.video-stage{max-height:72vh;aspect-ratio:auto;height:min(72vh,62vw);}}
.video-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.video-title-overlay{
  position:absolute;top:0;left:0;right:0;padding:22px 24px 40px;
  background:linear-gradient(rgba(0,0,0,.4),transparent);
  font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;
  font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.92;pointer-events:none;
}
/* Round 4 addition — a short, quiet disclaimer at the bottom of a
   video-stage (used by the new teacher-demo step). Non-wordy per
   Faye's instruction, reusing Lessons 01-05's exact disclaimer text,
   not a new explanation. */
.video-disclaimer-overlay{
  position:absolute;bottom:0;left:0;right:0;padding:30px 24px 18px;
  background:linear-gradient(transparent,rgba(0,0,0,.45));
  font-size:12px;font-style:italic;color:rgba(255,255,255,.88);line-height:1.5;
  text-align:center;pointer-events:none;
}
/* Shown only if unmuted autoplay was actually blocked by the browser
   (see afterRenderIntroVideo) — a direct click here is a guaranteed-
   valid gesture, so playback (with sound) can always start one way
   or another; the video is never silently left on muted-autoplay. */
.video-tap-overlay{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
  padding:16px 30px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(28,26,34,.72);color:#fff;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.video-tap-overlay:active{transform:translate(-50%,-50%) scale(.96);}

/* ============================================================
   STEP 2 — Discover: real 3D scene (Three.js), ported from
   prototypes/3d-camera-explorer-v2/index.html's own Step 2, per
   Faye's round-2 correction away from the round-1 2.5D CSS-transform
   stand-in. Fully automatic camera pull-back, no drag, no narration.
============================================================ */
/* Round 5: full-bleed — was a bordered, rounded, box-shadowed "card"
   capped at 64vh, centered on the page with visible topbar/rail
   chrome around it. flex:1 lets it fill all remaining height inside
   .step-inner.bleed (same shell Step 1's video uses), edge to edge,
   no border-radius/shadow, for real visual impact on this step. */
.camera3d-stage{
  position:relative;width:100%;flex:1;min-height:420px;
  overflow:hidden;
  /* Round 3: a real sky gradient instead of a flat fill — the
   * renderer clears to transparent (see afterRenderDiscover) so this
   * shows through behind the scene. Scoped to this Step 2 environment
   * only, not a change to the platform's own restrained palette. */
  background:linear-gradient(180deg,#7cc0e8 0%,#a9dbe6 45%,#e3ddb3 100%);
}
.camera3d-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s ease;}
.camera3d-stage canvas.visible{opacity:1;}
.camera3d-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 30px;font-size:13px;color:var(--ink-soft);
}
/* Term label lives INSIDE the 3D frame, in its lower third — round-1
   put this below the frame with a track underneath it, leaving the
   bottom of the page empty once the track was removed; anchoring it
   low inside the frame itself balances the composition across the
   full height instead of clustering everything near the top. */
.camera3d-term{
  position:absolute;left:50%;bottom:9%;transform:translate(-50%,8px);
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.35rem;
  color:var(--accent-deep);background:rgba(250,248,245,.92);padding:9px 22px;border-radius:999px;
  opacity:0;transition:opacity .6s ease,transform .6s ease;letter-spacing:.4px;white-space:nowrap;
  box-shadow:0 8px 20px rgba(28,26,34,.12);
}
.camera3d-term.show{opacity:1;transform:translate(-50%,0);}
@media(max-width:480px){.camera3d-term{font-size:1.05rem;padding:7px 16px;}}

/* ============================================================
   STEP 3 — When Would We Use It? (image-led tap-to-reveal cards)
   Round 2: was text-only, per Faye's "some students won't read
   text-first content — lead with imagery" correction. Each card is
   now a small original illustration (SCENE_ART table in the JS,
   keyed by lesson-data.js's sceneKey) on top, one short line below,
   with the tap-to-reveal PLACE/TIME/SCALE/ATMOSPHERE tag kept as-is
   (Faye liked that mechanic).
============================================================ */
/* Round 5: bigger "poker-card" presentation — fewer, larger cards
   with room to breathe, instead of a dense grid — per Faye's explicit
   correction. Portrait-ish image area (was a flat 16/10 strip).

   Round 6: restyled to a storyboard/production-panel aesthetic per
   Faye's reference images (grayscale/off-white, hand-drawn linework,
   thin bordered panels with quiet corner marks) — scoped to the
   PANEL/illustration content itself, not the page chrome around it
   (step titles, topbar, Continue button stay the platform's own
   accent-blue language). This keeps the lesson still reading as the
   same FEI TeamArt Smart Class ecosystem the original brief called
   for, while genuinely shifting the illustrated content's character.
   No image-generation tooling was used — this is styled SVG/vector
   (grayscale fills + the shared #sbSketch displacement filter for a
   hand-drawn wobble), matching what's actually buildable in code. */
.prompt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:10px;}
@media(max-width:820px){.prompt-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.prompt-grid{grid-template-columns:1fr;max-width:340px;margin-left:auto;margin-right:auto;}}
.prompt-instruction{margin-bottom:18px;font-weight:600;}
.prompt-card{
  position:relative;background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:3px;
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:3px 4px 0 rgba(58,53,44,.14);
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
}
.prompt-card:active{transform:scale(.98);}
.prompt-card.revealed{border-color:var(--sb-accent);}
/* aspect-ratio 4/3 (was 3/4 portrait) — round 7: switched to match the
   real supplied illustrations' native landscape framing (496x370) now
   that all 6 cards use them, instead of cropping a wide scene into a
   portrait "poker card" frame. */
.prompt-image{aspect-ratio:4/3;display:block;position:relative;background:var(--sb-paper);}
.prompt-image svg{width:100%;height:100%;display:block;}
.prompt-image img{width:100%;height:100%;display:block;object-fit:cover;}
/* Quiet corner marks, in the spirit of a production panel's own
   corner notes — not literal "CUT 01 / 00:04" labels, just the same
   restrained camera-framing-tick language already used on Step 1's
   poster and elsewhere in this file. */
.prompt-image::before,.prompt-image::after{content:'';position:absolute;width:13px;height:13px;border-color:var(--sb-ink-faint);border-style:solid;pointer-events:none;}
.prompt-image::before{top:7px;left:7px;border-width:1.3px 0 0 1.3px;}
.prompt-image::after{bottom:7px;right:7px;border-width:0 1.3px 1.3px 0;}
.prompt-panel-index{position:absolute;top:7px;right:9px;font-family:'Space Grotesk',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:1.2px;color:var(--sb-ink-faint);}
.prompt-body{padding:16px 18px 18px;}
.prompt-text{font-size:14px;line-height:1.5;color:var(--sb-ink);}
.prompt-reveal{
  display:inline-block;margin-top:12px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;
  color:var(--sb-panel);background:var(--sb-ink);padding:4px 11px;border-radius:2px;
  opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .25s ease;
}
.prompt-card.revealed .prompt-reveal{opacity:1;transform:translateY(0);background:var(--sb-accent);}
/* Listen control — shown only when lesson-data.js's audioSrc is
   populated (real recorded narration, not TTS). Null today, so this
   never renders; left ready for when Faye supplies a file. */
.listen-btn{
  display:flex;align-items:center;gap:6px;margin:0 auto 18px;font-size:12px;font-weight:700;
  color:var(--accent-deep);background:#fff;border:1.5px solid var(--line);border-radius:999px;
  padding:7px 16px;cursor:pointer;
}
.listen-btn:active{transform:scale(.96);}
/* Inline variant — used on Step 5's story cards (round 5), where a
   centered block button would look out of place inside a card's own
   flex column. */
.listen-btn.inline{margin:0 0 14px;align-self:flex-start;padding:5px 12px;font-size:11px;}
.big-idea-line{
  text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.15rem;
  color:var(--accent-deep);margin:26px auto 4px;max-width:440px;line-height:1.45;
  opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;
}
.big-idea-line.show{opacity:1;transform:translateY(0);}

/* ============================================================
   REAL-WORLD REFERENCE FOLD-IN — was its own image-led "Look Closer"
   step (2x2 card grid, --sb-* storyboard tokens). Now a single
   collapsed resource callout at the bottom of Step 3, text/link only
   — no images, not even the original FEI-inspired preview
   illustrations the old step used (see index.html's
   renderResourceCallout for why: a derivative illustration is still
   a derivative, so the same copyright caution now extends to those).
============================================================ */
.resource-callout{margin:30px auto 0;max-width:640px;}
.resource-callout-toggle{
  display:block;width:100%;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;
  padding:13px 20px;border-radius:12px;border:1.5px solid var(--sb-ink);background:var(--sb-panel);
  color:var(--sb-ink);cursor:pointer;text-align:center;transition:border-color .15s ease,background .15s ease;
}
.resource-callout-toggle:hover{border-color:var(--sb-accent);}
.resource-callout-toggle:active{transform:scale(.98);}
.resource-callout-panel{margin-top:14px;}
.resource-callout-intro{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 16px;text-align:center;}
.resource-list{display:flex;flex-direction:column;gap:14px;}
.resource-row{background:var(--sb-panel);border:1.5px solid var(--sb-line);border-radius:8px;padding:14px 16px;}
.resource-row-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px;}
.resource-row-cat{font-size:9px;font-weight:800;letter-spacing:1.4px;color:var(--sb-accent);}
.resource-row-title{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;color:var(--sb-ink);}
.resource-row-creator{font-size:11px;color:var(--sb-ink-faint);}
.resource-row-observation{font-size:12.5px;color:var(--sb-ink-soft);line-height:1.5;margin:0 0 8px;}
.resource-row-link{
  display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  color:var(--sb-panel);background:var(--sb-ink);padding:5px 12px;border-radius:2px;text-decoration:none;
}
.resource-row-link:hover{background:var(--sb-accent);}

/* ============================================================
   STEP 4 — Practice Intro (two-card intro before Story A). Renumbered
   from 4b to 4 — the old Step 4 "Look Closer" is gone, folded into
   Step 3 as a resource callout (see that step's own comment).
============================================================ */
.intro-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:56vh;gap:10px;}
.intro-card-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,6vw,2.9rem);color:var(--accent-deep);}
.intro-card-line{font-size:16px;color:var(--ink-soft);max-width:480px;line-height:1.65;margin:0;}

/* ============================================================
   STEP 5 — Story Practice: the pre-round reveal (label, typed
   storyline, countdown) plus the two-panel guided-drawing round.
   Reveal styled with the same warm --sb-* storyboard tokens as Steps
   3/5/6/7 elsewhere in this file — a plain full-screen card, not a
   dark scrim (unlike Lesson 02's per-scene reveal, there's no 3D
   canvas here to mask underneath).
============================================================ */
.practice-reveal-stage{
  position:relative;width:100%;flex:1;min-height:420px;display:flex;align-items:center;justify-content:center;
  background:var(--sb-paper);overflow:hidden;
}
.practice-reveal{text-align:center;padding:0 24px;max-width:640px;}
.practice-reveal-label{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--sb-accent);margin-bottom:14px;}
.practice-reveal-line{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.3rem,4vw,2rem);color:var(--sb-ink);line-height:1.5;min-height:2.4em;}
.practice-reveal-countdown{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:3.4rem;color:var(--sb-accent);margin-top:20px;min-height:1.3em;}
.practice-reveal-countdown.pulse{animation:practiceCountdownPulse .7s ease;}
@keyframes practiceCountdownPulse{0%{transform:scale(1.5);opacity:0;}30%{opacity:1;}100%{transform:scale(1);opacity:1;}}
.practice-story-label{text-align:center;font-size:13px;color:var(--ink-faint);margin-bottom:14px;}

/* The two-panel round itself — teacher's guide (LEFT) + student's own
   canvas (RIGHT), same size, side by side on desktop, stacked on
   narrow viewports. */
.practice-two-panel{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
@media(max-width:820px){.practice-two-panel{grid-template-columns:1fr;}}
.practice-panel{background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;padding:18px 16px 20px;position:relative;}
.practice-panel-label{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--sb-accent);text-align:center;margin-bottom:10px;}
/* Round 3 (quick-sketch redesign) — the framing line under the
   teacher panel's title, telling the student this is a fast idea
   sketch (not a formal tutorial) and that they can sketch quickly too. */
.practice-panel-hint{font-size:11.5px;color:var(--sb-ink-soft);text-align:center;line-height:1.5;margin:-2px 0 14px;}
/* Real teacher video in the teacher panel (Story A) — .video-stage's
   own min-height media query sizes its height off 62vw, tuned for
   Step 1's full-viewport-width video; inside this narrower ~half-
   width panel that formula would make the video far taller than the
   panel is wide, so it's overridden back to plain aspect-ratio
   sizing here, scoped to this context only. */
.practice-panel-video{padding:14px;}
.practice-panel-video .video-stage{aspect-ratio:16/9;max-height:none;height:auto;border-radius:3px;overflow:hidden;}
.practice-panel-student.locked .practice-canvas-wrap,
.practice-panel-student.locked .practice-tool-row,
.practice-panel-student.locked .draw-controls,
.practice-panel-student.locked .prefer-paper-btn{opacity:.25;pointer-events:none;}
.practice-lock-overlay{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:0 24px;
  font-size:13px;color:var(--sb-ink-soft);font-weight:600;background:rgba(250,247,238,.6);z-index:3;border-radius:4px;
}
.practice-panel-student.locked .practice-lock-overlay{display:flex;}
.prefer-paper-btn{display:block;margin:14px auto 0;background:none;border:none;font-size:12.5px;font-weight:700;color:var(--sb-ink-soft);text-decoration:underline;cursor:pointer;}
.prefer-paper-btn.picked{color:var(--sb-accent);}

/* Round 6: storyboard panel frame, matching Steps 3/5 — warm paper,
   ink-toned border, quiet corner marks. "large" (the practice-section
   restructure): both panels now match in size and sit slightly larger
   than the old single-panel 520px cap, since the fixed Continue dock
   no longer competes with a full-width practice canvas below it. */
.draw-canvas-wrap{
  position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:4/3;
  border-radius:3px;overflow:hidden;background:var(--sb-paper);border:1.5px solid var(--sb-ink);
  box-shadow:4px 5px 0 rgba(58,53,44,.14);
}
.draw-canvas-wrap.large{max-width:100%;}
.draw-canvas-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
.draw-canvas-wrap::before,.draw-canvas-wrap::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--sb-ink-faint);border-style:solid;pointer-events:none;z-index:1;}
.draw-canvas-wrap::before{top:9px;left:9px;border-width:1.5px 0 0 1.5px;}
.draw-canvas-wrap::after{bottom:9px;right:9px;border-width:0 1.5px 1.5px 0;}
.dstage{transition:opacity .5s ease;}
/* .draw-caption/.draw-teaching-note/.draw-progress/.draw-dot (the old
   per-stage caption, teaching note, and progress dots) were removed
   in the round-3 quick-sketch redesign along with the manual Prev/
   Replay/Next controls they went with — see playQuickSketchDemo's own
   comment. .draw-controls/.draw-btn below stay: the student panel's
   Clear/Save buttons still use them. */
.draw-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.draw-btn{
  font-weight:700;font-size:13px;padding:10px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--ink);background:transparent;color:var(--ink);
}
.draw-btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.draw-btn:disabled{opacity:.3;cursor:not-allowed;}
.draw-btn:active{transform:scale(.96);}

/* ---- Round 2 addition: homework/artwork submission. Same in-browser
   sketch-canvas + IndexedDB pattern already used by the live
   lesson-01-extreme-wide-shot and the Kandinsky lesson template
   (openDB/compressCanvas/saveArtwork/listArtworks) — reused, not
   reinvented, per Faye's explicit instruction. Own DB name (see the
   JS comment) so this prototype never writes into the live lesson's
   real student data. ---- */
.practice-tool-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.practice-color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);}
.practice-color-dot.picked{box-shadow:0 0 0 2.5px var(--accent);transform:scale(1.1);}
/* Round 4 addition: stroke-style tool row (fineliner/marker/
   watercolor/fill/eraser), separate from the color row above it. */
.practice-style-btn{
  display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-soft);
  background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;
}
.practice-style-btn.picked{border-color:var(--accent);background:rgba(45,95,168,.08);color:var(--accent-deep);}
.practice-style-btn:active{transform:scale(.96);}
/* Practice-section restructure: was max-width:720px on a full-width
   standalone step; now lives in the RIGHT panel of a two-column
   round, matched to the teacher's panel (draw-canvas-wrap.large)
   rather than sized independently — fills its own panel's width. */
.practice-canvas-wrap{
  width:100%;max-width:100%;aspect-ratio:4/3;margin:0 auto 10px;border-radius:14px;overflow:hidden;
  border:2px solid var(--ink);box-shadow:5px 6px 0 rgba(28,26,34,.12);touch-action:none;background:var(--paper);
}
.practice-canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair;}
.practice-clear-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;}
.practice-saved-note{text-align:center;font-size:12.5px;color:var(--accent-deep);font-weight:700;margin-top:10px;}

/* ============================================================
   STEP 6 — Student Artwork Community (renamed from "Same Idea.
   Different Scenes." — the old Teacher/Student reference compare-
   cards this section used to lead with are gone, see the file header
   for why). Round 6 storyboard/production-panel treatment carried
   forward — warm paper, ink-toned dashed borders where a card reads
   as "placeholder."
============================================================ */
.community-section{margin-top:8px;padding-top:26px;border-top:1.5px solid var(--sb-line);}
.community-kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:8px;}
.community-lead{font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.55;max-width:420px;margin:0 auto 18px;}
/* Practice-section restructure: up to THREE own-work cards now (one
   per story) instead of one — own-work-grid wraps them; own-work-card
   itself is unchanged, own-work-note-card is the plain-text variant
   for a story done on paper or not completed. */
.own-work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:600px){.own-work-grid{grid-template-columns:1fr;}}
.own-work-card{background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;padding:16px 12px;text-align:center;}
.own-work-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.85rem;color:var(--sb-ink);margin-bottom:10px;}
.own-work-img{max-width:100%;width:100%;border-radius:2px;border:1.5px solid var(--sb-ink-faint);display:block;margin:0 auto;}
.own-work-note-card{border-style:dashed;}
.own-work-note{font-size:12px;color:var(--sb-ink-faint);}
.community-submit-note{text-align:center;font-size:12.5px;color:var(--accent-deep);font-weight:700;margin-top:10px;min-height:1.4em;}
.gallery-section{margin-top:22px;}
.gallery-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--sb-ink);text-align:center;margin-bottom:4px;}
.gallery-subtitle{font-size:12px;color:var(--sb-ink-faint);text-align:center;margin-bottom:16px;}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.gallery-grid{grid-template-columns:1fr 1fr;}}
.gallery-card{
  aspect-ratio:1;background:repeating-linear-gradient(135deg,var(--sb-panel),var(--sb-panel) 8px,var(--sb-paper) 8px,var(--sb-paper) 16px);
  border-radius:4px;border:1.5px dashed var(--sb-ink-faint);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--sb-ink-faint);filter:grayscale(1);opacity:.85;
}

/* ============================================================
   STEP 7 — Complete
============================================================ */
.check-chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 4px;}
.check-chip{
  font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;
  border:2px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .15s ease;
}
.check-chip.picked{border-color:var(--accent);background:rgba(45,95,168,.08);color:var(--accent-deep);}
.complete-btn{
  display:block;margin:26px auto 0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  padding:14px 30px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 10px 26px rgba(28,26,34,.2);
}
.complete-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;}
.complete-btn:active{transform:scale(.97);}
.complete-done{text-align:center;}
.complete-check{display:flex;justify-content:center;margin-bottom:4px;}
.complete-badge-note{font-size:12px;color:var(--accent-deep);font-weight:700;margin-top:10px;}
.complete-exit{display:inline-block;margin-top:22px;font-size:13px;color:var(--accent-deep);text-decoration:none;font-weight:700;}

/* ---- Round 2 addition: next-lesson chaining + badge progress ---- */
.next-lesson-card{
  display:block;text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:16px;
  padding:16px 20px;margin:26px auto 0;max-width:360px;box-shadow:4px 5px 0 rgba(28,26,34,.12);
  transition:transform .15s ease;
}
.next-lesson-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(28,26,34,.12);}
.next-lesson-kicker{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--accent);text-transform:uppercase;}
.next-lesson-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--accent-deep);margin-top:4px;}
.next-lesson-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
/* Badge card — adapted from core/scene-drawing-style.css's own
   .course-badge-card (same class names, same real renderCourseBadgeCard()
   output), re-tokened to this file's own palette instead of linking
   that shared stylesheet wholesale (which defines a conflicting
   :root and page-background — see the round-1 Artchi CSS porting note
   for why lesson pages copy in just the classes they need). */
.course-badge-card{background:linear-gradient(135deg,#f3f0fc 0%,#eaf6f8 100%);border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin:26px auto 0;max-width:360px;}
.course-badge-row{display:flex;align-items:center;gap:12px;}
.course-badge-emoji{font-size:32px;flex-shrink:0;opacity:.5;}
.course-badge-emoji.unlocked{opacity:1;}
.course-badge-info{flex:1;text-align:left;}
.course-badge-name{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.course-badge-meta{font-size:11px;color:var(--ink-muted);}
.course-badge-progress-bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden;}
.course-badge-progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:3px;}

/* ============================================================
   ARTCHI (ported as-is from core/scene-drawing-style.css — see
   core/scene-drawing-archi.js's own header for why this stays a
   true port, not a new mascot). Kept quiet: only 2-3 short bubble
   moments fire across the whole lesson — see JS below.
============================================================ */
.artchi-mascot{position:fixed;right:18px;bottom:18px;width:64px;height:64px;cursor:grab;z-index:60;user-select:none;transition:transform .3s;filter:drop-shadow(0 6px 20px rgba(167,139,250,.45));}
.artchi-mascot:active{cursor:grabbing;}
.artchi-mascot.awake{animation:artchiBreathe 3s ease-in-out infinite;}
.artchi-mascot.excited{animation:artchiBounce .6s ease-in-out 3;}
.artchi-mascot.sleep .artchi-eye{transform:scaleY(.1);transform-origin:center;}
.artchi-mascot.sleep::after{content:'z';position:absolute;top:-4px;right:-6px;font-size:16px;color:var(--ink-muted);font-weight:900;animation:artchiZzz 2s ease-in-out infinite;font-style:italic;font-family:'Space Grotesk',sans-serif;}
.artchi-mascot.hidden{display:none;}
.artchi-mascot.awake::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.18) 0%,transparent 70%);z-index:-1;animation:artchiHalo 2.8s ease-in-out infinite;pointer-events:none;}
@keyframes artchiHalo{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:.85;transform:scale(1.1);}}
@keyframes artchiBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes artchiBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-13px) rotate(-5deg);}}
@keyframes artchiZzz{0%,100%{opacity:0;transform:translateY(0);}50%{opacity:1;transform:translateY(-6px);}}
/* pointer-events:none on the bubble itself — found live: its fixed
   position (right:20px; bottom:96px, taller once text wraps) reaches
   up over the right portion of Step 2's drag track, and being a real
   bordered/backgrounded box, it was SILENTLY SWALLOWING pointerdown
   events meant for the track underneath — a student dragging toward
   "Far" right when the "Try stepping back." bubble appears (~500ms
   into the step) would find the drag stop responding, with no visual
   sign why. Caught by scripted repeat-click testing, not by a single
   click or by inspection. Re-enabled only on the close "×", the one
   part of the bubble meant to be clickable. */
.artchi-bubble{position:fixed;right:20px;bottom:96px;max-width:190px;background:#fff;padding:9px 11px;border-radius:var(--radius-md);font-size:11.5px;color:var(--ink);line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1.5px solid var(--border);z-index:59;font-weight:600;display:none;pointer-events:none;}
.artchi-bubble::after{content:'';position:absolute;bottom:-7px;right:24px;width:11px;height:11px;background:#fff;transform:rotate(45deg);border-right:1.5px solid var(--border);border-bottom:1.5px solid var(--border);}
.artchi-bubble.show{display:block;animation:artchiBubblePop .3s ease;}
.artchi-bubble-close{position:absolute;top:3px;right:7px;color:var(--ink-muted);font-size:12px;cursor:pointer;font-weight:800;pointer-events:auto;}
@keyframes artchiBubblePop{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
.artchi-label{position:fixed;right:20px;bottom:2px;background:var(--purple);color:#fff;padding:4px 10px;border-radius:11px;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;z-index:61;pointer-events:none;box-shadow:0 4px 14px rgba(167,139,250,.4);white-space:nowrap;transition:opacity .3s ease;}
.artchi-label.hidden{display:none;}
.artchi-label.muted{opacity:0;visibility:hidden;}
.artchi-onboard-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.artchi-onboard-backdrop.show{display:flex;animation:artchiFadeIn .35s ease;}
.artchi-onboard-card{background:#fff;border-radius:var(--radius-lg);padding:26px 22px;max-width:280px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:artchiSlideUp .4s ease;}
.artchi-onboard-svg-wrap{margin:0 auto 12px;width:76px;}
.artchi-onboard-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.artchi-onboard-sub{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
@keyframes artchiFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes artchiSlideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.artchi-chat{display:none;position:fixed;bottom:18px;right:18px;width:calc(100vw - 36px);max-width:300px;background:#fff;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.18);z-index:200;overflow:hidden;border:.5px solid var(--border);}
.artchi-chat.show{display:block;animation:artchiSlideUp .35s ease;}
.artchi-chat-head{padding:13px 15px;background:linear-gradient(135deg,var(--ink) 0%,#374151 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;}
.artchi-chat-head-info b{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;}
.artchi-chat-head-info span{font-family:'Space Grotesk',sans-serif;font-size:9px;color:#67e8f9;letter-spacing:1px;text-transform:uppercase;display:block;margin-top:2px;}
.artchi-chat-close{color:rgba(255,255,255,.7);font-size:19px;font-weight:700;cursor:pointer;padding:2px 8px;}
.artchi-chat-body{padding:13px;max-height:200px;overflow-y:auto;background:var(--paper);}

<script>
/* ============================================================
   STEP LIST — generic dispatcher. Each entry's render() returns
   the step's HTML; afterRender() (optional) wires up interaction
   once that HTML is in the DOM. Nothing here is Lesson-01-specific
   beyond which render functions are plugged in — the shell itself
   (topbar, rail, continue dock, transitions) has no lesson content
   baked in, so Lessons 02-26 can reuse it with a different STEPS
   array and a different lesson-data.js.
============================================================ */
// The three stories are THREE separate top-level STEPS entries
// (story_spring/story_forest/story_newworld), not one step with
// internal sub-stage state — same deliberate flat-not-nested
// architecture Lesson 02 adopted for its six scenes, for the exact
// same reason: a step that tracks its own sub-stages in STATE needs
// prevStep/nextStep to know about that tracking specially, which is
// exactly the class of bug round 5 found and fixed here originally
// (see prevStep's own comment below). Flat entries mean the plain
// stepIndex++/-- is correct for all three with zero special-casing
// beyond the one shared "story_" id-prefix check prevStep already
// needs for stepping back through a story's own teacher-guide stages.
const STORY_PRACTICE_STEPS = LESSON_DATA.story_choices.map((s, i) => ({
  id: 'story_' + s.id,
  render: () => renderStoryPractice(s, i),
  afterRender: () => afterRenderStoryPractice(s, i),
  cleanup: cleanupStoryPractice
}));
// "look_closer" is gone as its own step — folded into when_use as a
// text/link resource callout (see renderResourceCallout). Removing a
// step here needs no other change anywhere: renderRail/nextStep/
// prevStep/goToStep all key off STEPS.length dynamically, and the
// only hardcoded stepIndex comparison in the file (disabling Previous
// on the very first step) is index-0-relative, not count-relative —
// checked, not assumed.
const STEPS = [
  { id:'intro_video',     render:renderIntroVideo,     afterRender:afterRenderIntroVideo },
  { id:'discover',        render:renderDiscover,        afterRender:afterRenderDiscover, cleanup:cleanupDiscover },
  { id:'when_use',        render:renderWhenUse },
  { id:'practice_intro',  render:renderPracticeIntro,   afterRender:afterRenderPracticeIntro },
  ...STORY_PRACTICE_STEPS,
  { id:'compare',         render:renderCompare,          afterRender:afterRenderCompare },
  { id:'complete',        render:renderComplete }
];

let STATE = {
  stepIndex: 0,
  promptsRevealed: [],     // indices into story_prompts.items
  drawStageIndex: 0,       // current story's teacher-guide stage (reset per story)
  reachedEnd: false,       // has the teacher's guide reached its last stage THIS story (unlocks the student's canvas)
  storyResults: [null, null, null], // per story: null (not yet resolved) | 'digital' | 'paper'
  checkedConcepts: [],
  lessonSaved: false
};

/* ============================================================
   SHARED HELPERS
============================================================ */
const CF_STREAM_CUSTOMER = 'customer-a78os4oj56dr67ab.cloudflarestream.com';
// Round 3: autoplay=true added, muted stays explicit false. This is a
// deliberately-produced video with its own sound (not ambient
// narration) — per Faye's correction, it should play automatically
// WITH sound, not sit muted or wait for an extra click on top of the
// click that already brought the student into this lesson. See
// afterRenderIntroVideo for the real-gesture verification and the
// tap-to-play fallback for when a browser blocks it anyway.
// Round 4: accepts an optional custom poster URL — the CF-generated
// auto-thumbnail (a raw video frame) reads as a generic video-player
// thumbnail, not a designed cover; Faye asked for a real poster with
// the title baked in. Falls back to the auto-thumbnail when no custom
// poster is supplied (so lessons without a designed cover still work).
function cfStreamSrc(streamId, posterUrl){
  const poster = encodeURIComponent(posterUrl || `https://${CF_STREAM_CUSTOMER}/${streamId}/thumbnails/thumbnail.jpg?time=&height=600`);
  return `https://${CF_STREAM_CUSTOMER}/${streamId}/iframe?poster=${poster}&autoplay=true&muted=false&preload=auto`;
}
// Extended from the platform's established renderVideoEmbed convention:
// full-bleed, minimal-chrome (no big traditional player card), an
// iframe id so afterRender can attach the Stream Player SDK for a real
// 'ended' event — per the brief's "on completion, transition directly
// into next step," not a manual-only Continue.
// disclaimer (round 4, optional) — a short, quiet line pinned to the
// bottom of the frame. Used by the new teacher-demo step; Step 1 never
// passes one.
function renderVideoStage(streamId, title, iframeId, posterUrl, disclaimer){
  const disclaimerHtml = disclaimer ? `<div class="video-disclaimer-overlay">${disclaimer}</div>` : '';
  if (streamId) {
    // posterUrl must be absolute — the iframe lives on a different
    // origin (the Cloudflare Stream customer subdomain) and can't
    // resolve a relative path against ITS OWN origin back to ours.
    const absolutePoster = posterUrl ? new URL(posterUrl, window.location.href).href : null;
    return `<div class="video-stage">
      <iframe id="${iframeId}" src="${cfStreamSrc(streamId, absolutePoster)}" loading="lazy" title="${title}"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
      <div class="video-title-overlay">${title}</div>
      ${disclaimerHtml}
      <button class="video-tap-overlay" id="videoTapOverlay" hidden>🔊 Tap to Play</button>
    </div>`;
  }
  return `<div class="video-stage" style="background:linear-gradient(135deg,var(--accent),var(--accent-deep));">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
      <div style="font-size:2.2rem;">🎥</div><div style="font-size:13px;margin-top:6px;">Video coming soon!</div>
    </div>
    ${disclaimerHtml}
  </div>`;
}
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function clamp01(n){ return Math.max(0, Math.min(1, n)); }

function showContinue(label, onClick, opts){
  const dock = document.getElementById('continueDock');
  opts = opts || {};
  dock.innerHTML = `<button class="continue-btn${opts.ghost ? ' ghost' : ''}" id="continueBtn">${label}</button>`;
  const btn = document.getElementById('continueBtn');
  btn.onclick = onClick;
  requestAnimationFrame(() => btn.classList.add('ready'));
}
function hideContinue(){
  document.getElementById('continueDock').innerHTML = '';
}

/* ============================================================
   PROFILE / XP — direct sessionStorage read-write, matching the
   live sibling lesson's own bumpXP/markLessonComplete exactly (the
   real, verified fei_user_profile convention — sessionStorage, not
   localStorage; see that file's own comment on the Safari-iframe fix
   this depends on). core/scene-drawing-platform-bridge.js's
   SceneDrawingProfileBridge uses localStorage instead and is NOT the
   convention actually used by any live lesson page, so it is
   deliberately not used here for profile/XP — only for JournalStorage.
============================================================ */
function bumpXP(amount){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return;
    const profile = JSON.parse(raw);
    profile.totalXP = (profile.totalXP || 0) + amount;
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[bumpXP] failed', e); }
}
function markLessonComplete(){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return;
    const profile = JSON.parse(raw);
    profile.completedLessons = Array.isArray(profile.completedLessons) ? profile.completedLessons : [];
    if (!profile.completedLessons.includes(LESSON_DATA.courseId)) {
      profile.completedLessons.push(LESSON_DATA.courseId);
    }
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[markLessonComplete] failed', e); }
}

/* ============================================================
   STEP 1 — WHAT IS A SCENE? (real Cloudflare Stream video)
============================================================ */
function renderIntroVideo(){
  const d = LESSON_DATA.intro_video;
  return `
    <div class="step-inner bleed">
      ${renderVideoStage(d.videoStreamId, d.title, 'introVideoFrame', d.posterUrl)}
    </div>
  `;
}
// Round 5: removed the manual Continue button entirely for a
// configured video — per Faye, "the student must not be able to skip
// past it or continue before it's done." The ONLY way forward is now
// the Stream Player SDK's real 'ended' event; the tap-to-play overlay
// (if autoplay-with-sound was blocked) STARTS the video, it doesn't
// skip it. The one remaining Continue button lives in
// showVideoFailureContinue(), fired only on a genuine technical
// failure (SDK script didn't load, or threw attaching to the iframe)
// — a real error state is different from "hasn't finished watching
// yet," and leaving zero escape hatch there would trap a student on a
// broken step with no recourse.
function afterRenderIntroVideo(){
  const d = LESSON_DATA.intro_video;
  if (!d.videoStreamId) { showContinue('Continue →', nextStep); return; }
  let advanced = false;
  const advanceOnce = () => { if (advanced) return; advanced = true; nextStep(); };
  function showVideoFailureContinue(){
    showContinue('Continue →', advanceOnce, { ghost: true });
  }

  const sdk = document.createElement('script');
  sdk.src = 'https://embed.cloudflarestream.com/embed/sdk.latest.js';
  sdk.onload = () => {
    try {
      const iframe = document.getElementById('introVideoFrame');
      const player = window.Stream && iframe ? window.Stream(iframe) : null;
      if (!player) { showVideoFailureContinue(); return; }
      player.addEventListener('ended', advanceOnce);

      // The iframe src already requests autoplay=true&muted=false — per
      // Faye, this is a deliberately-produced video with its own sound,
      // not ambient narration, so it should never sit silently on
      // muted-autoplay. A real browser generally allows unmuted
      // autoplay here IF the navigation onto this page was itself
      // triggered by a genuine user click/tap (re-verified live via a
      // real click-through in round 5, not page.goto — see the build
      // notes). If that assumption doesn't hold for some browser/path,
      // playback simply stays paused; a 'play' event never fires, and
      // the tap-to-play button below appears so sound-on playback is
      // still one guaranteed-valid click away — never a silent fallback
      // to muted, and never a way to skip past the video either.
      let started = false;
      player.addEventListener('play', () => {
        started = true;
        const overlay = document.getElementById('videoTapOverlay');
        if (overlay) overlay.hidden = true;
      });
      setTimeout(() => {
        if (started) return;
        const overlay = document.getElementById('videoTapOverlay');
        if (!overlay) return;
        overlay.hidden = false;
        overlay.onclick = () => {
          try { player.muted = false; } catch (e) { /* best-effort */ }
          const playResult = player.play();
          if (playResult && playResult.catch) playResult.catch((e) => console.warn('[intro_video] play() failed', e));
          overlay.hidden = true;
        };
      }, 1200);
    } catch (e) {
      console.warn('[intro_video] Stream SDK attach failed', e);
      showVideoFailureContinue();
    }
  };
  sdk.onerror = () => {
    console.warn('[intro_video] Stream SDK failed to load');
    showVideoFailureContinue();
  };
  document.head.appendChild(sdk);
}

/* ============================================================
   STEP 2 — DISCOVER: real 3D scene, ported directly from
   prototypes/3d-camera-explorer-v2/index.html's own Step 2 (mountains
   + lake + character, camera dolly pull-back, staggered drop-in
   assembly) — per Faye's round-2 correction away from round 1's
   simplified 2.5D CSS-transform stand-in. Two deliberate differences
   from the source prototype, both per Faye's explicit instruction:
     - No narration (no speechSynthesis call anywhere in this step).
     - No look-around drag either — fully automatic/non-interactive,
       camera pulls back on its own start to finish. Still no VP,
       grid, free-orbit, or CAD-like controls, per the original brief.
   Renders into a BOXED container (.camera3d-stage), not the source
   prototype's full-viewport fixed canvas — this lesson's "Learning
   Canvas" keeps every step framed/contained, so the 3D scene is sized
   to its own box, not window.innerWidth/innerHeight.
============================================================ */
let _three3DState = null; // set on mount, cleared by cleanupDiscover()
let _threeLoadPromise = null;
function loadThreeJs(){
  if (window.THREE) return Promise.resolve();
  if (_threeLoadPromise) return _threeLoadPromise;
  _threeLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _threeLoadPromise;
}
function renderDiscover(){
  // Round 5: full-bleed, matching Step 1's video treatment — was a
  // bordered/rounded card centered with visible page chrome around
  // it; per Faye's explicit correction, the scene itself should fill
  // the viewport on this specific reveal step for more visual impact.
  return `
    <div class="step-inner bleed">
      <div class="camera3d-stage" id="camera3dStage">
        <div class="camera3d-term" id="camera3dTerm"></div>
      </div>
    </div>
  `;
}
async function afterRenderDiscover(){
  const stageEl = document.getElementById('camera3dStage');
  const termEl = document.getElementById('camera3dTerm');
  termEl.textContent = LESSON_DATA.interactive_scene.termLabel;

  try {
    await loadThreeJs();
  } catch (e) {
    console.warn('[discover] Three.js failed to load', e);
    stageEl.insertAdjacentHTML('beforeend', `<div class="camera3d-fallback">This scene couldn't load (a required script failed — check your connection and reload). Extreme Wide Shot: the camera pulls far back, showing a huge world around a very small character.</div>`);
    showContinue('Continue →', nextStep);
    return;
  }
  // Step may have been left (cleanup already ran) before the CDN
  // script resolved — don't mount into a stage that's no longer live.
  if (!document.getElementById('camera3dStage')) return;

  const canvas = document.createElement('canvas');
  stageEl.insertBefore(canvas, termEl);

  // alpha:true + a transparent clear color — the CSS sky gradient on
  // .camera3d-stage shows through behind the scene instead of a flat
  // THREE.Color fill (round 3: "improve the sky so it reads as a real
  // environment, not a flat backdrop").
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(55, 4 / 3, 0.1, 300);

  // Round 3: slightly less flat ambient + a warmer, slightly stronger
  // sun reads as richer/more saturated without changing the overall
  // no-fog/ACES approach that already fixed real bugs in the source
  // prototype (see that file's own notes) — lighting-only tuning,
  // scoped to this scene.
  scene.add(new THREE.AmbientLight(0xffffff, 0.48));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(-10, 22, -8);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xdce8f8, 0.28);
  fill.position.set(6, 8, 18);
  scene.add(fill);

  function box(w, h, d, color) {
    return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 }));
  }
  function cyl(rTop, rBottom, h, color, segments) {
    return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, h, segments || 12), new THREE.MeshStandardMaterial({ color: color, roughness: 0.85 }));
  }
  function cone(r, h, color, segments) {
    return new THREE.Mesh(new THREE.ConeGeometry(r, h, segments || 16), new THREE.MeshStandardMaterial({ color: color, roughness: 0.85 }));
  }
  function sphereMesh(r, color, wSeg, hSeg) {
    return new THREE.Mesh(new THREE.SphereGeometry(r, wSeg || 16, hSeg || 12), new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 }));
  }

  // Round 4 palette — same saturated direction as round 3, extended
  // for the new midground/sky elements below.
  const PALETTE = {
    ground: 0x6fae52, lake: 0x3f9fc9, mountainNear: 0x60768a, mountainFar: 0x93aecb,
    charCloak: 0x3568c9, charHead: 0xf0c49a, charLimb: 0x3c4657, charAccent: 0xd6543f,
    houseBody: 0xe8cfa0, houseRoof: 0xb5533c, houseBody2: 0xd8c9a8, houseRoof2: 0x8a5a44,
    houseDoor: 0x5c4630, houseWindow: 0xf6df8a,
    treeCanopyA: 0x3f7a46, treeCanopyB: 0x529155, trunk: 0x6b4a30,
    grass: 0x6fae52, grassLight: 0x82c25f,
    flowerPink: 0xe888b0, flowerYellow: 0xf0d060, flowerWhite: 0xfaf3e6,
    road: 0xcbb389, cloud: 0xfbf8f0, plane: 0x3a4658
  };

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  const ground = box(90, 0.3, 90, PALETTE.ground);
  ground.position.set(0, -0.15, 10);
  worldGroup.add(ground);

  // Round 4: substantially larger + elongated so it reads as a real
  // body of water, not a puddle (Faye's exact critique) — moved off
  // to the side so it doesn't collide with the new road below.
  const lake = new THREE.Mesh(
    new THREE.CircleGeometry(8, 40),
    new THREE.MeshStandardMaterial({ color: PALETTE.lake, roughness: 0.3, metalness: 0.15 })
  );
  lake.scale.set(1.3, 1, 0.85);
  lake.rotation.x = -Math.PI / 2;
  lake.position.set(11, 0.12, 15);
  worldGroup.add(lake);

  // Character — round 4: the cone cloak read as a rough blob rather
  // than a person (Faye's critique). Switched to a cylinder frustum
  // (narrow shoulders, wider hem) — an actual cloak silhouette — and
  // dropped the two leg cylinders entirely: at this scale they sat
  // fully inside the cloak's own footprint and were never visible,
  // just wasted geometry that didn't help "read as a figure."
  const character = new THREE.Group();
  const cloak = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.34, 0.95, 10), new THREE.MeshStandardMaterial({ color: PALETTE.charCloak, roughness: 0.85 }));
  cloak.position.y = 0.475;
  const head = sphereMesh(0.23, PALETTE.charHead, 24, 18);
  head.position.y = 0.95 + 0.17;
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.045, 8, 16), new THREE.MeshStandardMaterial({ color: PALETTE.charAccent, roughness: 0.8 }));
  scarf.rotation.x = Math.PI / 2.3;
  scarf.position.y = 0.93;
  const armL = cyl(0.06, 0.06, 0.5, PALETTE.charLimb);
  armL.position.set(-0.28, 0.62, 0);
  armL.rotation.z = 0.22;
  const armR = armL.clone(); armR.position.x = 0.28; armR.rotation.z = -0.22;
  character.add(cloak, head, scarf, armL, armR);
  character.position.set(0, 0, 1.5);
  worldGroup.add(character);

  // Large foreground figure — round 5 addition: a classic "figure
  // with their back to the viewer, taking in a vast landscape"
  // composition (Rückenfigur), noticeably larger/closer than the
  // small distant character above — per Faye's explicit request,
  // directly reinforcing "how small the character feels." A solid
  // dark silhouette has no front/back of its own, so no facing
  // rotation is needed — positioned between the camera and the rest
  // of the scene, it reads as looking the same direction the camera
  // (and the viewer) is looking.
  function buildForegroundFigure() {
    const g = new THREE.Group();
    const silhouette = new THREE.MeshStandardMaterial({ color: 0x232a30, roughness: 0.95 });
    const bigCloak = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.38, 1.0, 12), silhouette);
    bigCloak.position.y = 0.5;
    const bigHead = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 16), silhouette);
    bigHead.position.y = 1.0 + 0.18;
    const bigArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.55, 8), silhouette);
    bigArmL.position.set(-0.3, 0.65, 0); bigArmL.rotation.z = 0.15;
    const bigArmR = bigArmL.clone(); bigArmR.position.x = 0.3; bigArmR.rotation.z = -0.15;
    g.add(bigCloak, bigHead, bigArmL, bigArmR);
    return g;
  }
  const foregroundFigure = buildForegroundFigure();
  foregroundFigure.scale.setScalar(3.4);
  foregroundFigure.position.set(6, 0, -16);
  foregroundFigure.userData.finalY = 0;
  foregroundFigure.visible = false;
  worldGroup.add(foregroundFigure);

  // House — box body + pyramid roof + door + two warm-glow windows.
  function buildHouse(bodyColor, roofColor) {
    const g = new THREE.Group();
    const body = box(2.2, 1.5, 1.8, bodyColor);
    body.position.y = 0.75;
    const roof = cone(1.75, 1.1, roofColor, 4);
    roof.rotation.y = Math.PI / 4;
    roof.position.y = 1.5 + 0.55;
    const door = box(0.5, 0.85, 0.05, PALETTE.houseDoor);
    door.position.set(0, 0.425, 0.93);
    const win1 = box(0.35, 0.35, 0.05, PALETTE.houseWindow);
    win1.position.set(-0.7, 0.95, 0.93);
    const win2 = win1.clone();
    win2.position.x = 0.7;
    g.add(body, roof, door, win1, win2);
    return g;
  }
  // Round 4: "a small house or two" in the actual midground (much
  // closer than round 3's z=22) — one of Faye's concrete midground
  // asks, alongside the road below.
  const house = buildHouse(PALETTE.houseBody, PALETTE.houseRoof);
  house.position.set(-13, 0, 15);
  house.rotation.y = 0.3;
  house.userData.finalY = 0;
  house.visible = false;
  worldGroup.add(house);
  const house2 = buildHouse(PALETTE.houseBody2, PALETTE.houseRoof2);
  house2.scale.setScalar(0.75);
  house2.position.set(-9.5, 0, 20);
  house2.rotation.y = -0.5;
  house2.userData.finalY = 0;
  house2.visible = false;
  worldGroup.add(house2);

  // Road — round 4 addition: a tapering trapezoid strip (wide near,
  // narrow far), giving the eye something to travel through from
  // foreground to midground — Faye's exact "the middle-ground is
  // currently empty" note.
  function buildRoad(nearWidth, farWidth, nearZ, farZ, color) {
    const geo = new THREE.BufferGeometry();
    const vertices = new Float32Array([
      -nearWidth / 2, 0, nearZ,  nearWidth / 2, 0, nearZ,
       farWidth / 2, 0, farZ,   -farWidth / 2, 0, farZ
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.setIndex([0, 1, 2, 0, 2, 3]);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.95, side: THREE.DoubleSide }));
  }
  // Round 5: the road used to stop at z=3 — still 30+ units short of
  // the camera's own settled position (z≈-30), so the whole gap
  // between the camera and the visible scene stayed bare. Extended
  // deep into the near-foreground (z=-27) so it visibly continues
  // toward the viewer, per Faye's exact correction.
  const road = buildRoad(3.6, 0.5, -27, 38, PALETTE.road);
  road.position.set(-6, 0.02, 0);
  worldGroup.add(road);

  // Trees — ONE consistent conifer style (two-tone stacked cones),
  // only ever varied by scale/position, never by shape — Faye's
  // correction against last round's "sharp vs round, disjointed"
  // mix. Spread across both midground and a few larger foreground
  // trees, which also helps fill the "empty middle of frame."
  function buildTree(scale) {
    const g = new THREE.Group();
    const trunk = cyl(0.09, 0.13, 0.9, PALETTE.trunk);
    trunk.position.y = 0.45;
    const canopyLower = cone(0.6, 1.05, PALETTE.treeCanopyA, 9);
    canopyLower.position.y = 0.9 + 0.48;
    const canopyUpper = cone(0.42, 0.8, PALETTE.treeCanopyB, 9);
    canopyUpper.position.y = 0.9 + 0.96 + 0.34;
    g.add(trunk, canopyLower, canopyUpper);
    g.scale.setScalar(scale);
    return g;
  }
  const treeDefs = [
    { x: -6, z: 12, s: 1.1 }, { x: -8.5, z: 24, s: 0.85 }, { x: 6, z: 10, s: 1.0 },
    { x: 9, z: 16, s: 0.8 }, { x: -2, z: 26, s: 1.15 }, { x: 14, z: 19, s: 0.95 },
    { x: 17, z: 9, s: 1.3 }, { x: -16, z: 8, s: 1.4 }
  ];
  const trees = treeDefs.map((def) => {
    const t = buildTree(def.s);
    t.position.set(def.x, 0, def.z);
    t.userData.finalY = 0;
    t.visible = false;
    worldGroup.add(t);
    return t;
  });

  // Ground-level detail — grass tufts + flowers. Round 4: shortened
  // the blades further and confined them close to the character/lake
  // foreground so they read unmistakably as ground cover, never as
  // small trees (the round-3 confusion Faye actually flagged).
  function buildGrassTuft() {
    const g = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const blade = cone(0.035, 0.16, i % 2 === 0 ? PALETTE.grass : PALETTE.grassLight, 5);
      blade.position.set((i - 1) * 0.06, 0.08, 0);
      blade.rotation.z = (i - 1) * 0.3;
      g.add(blade);
    }
    return g;
  }
  const grassDefs = [
    { x: -2, z: 2.6 }, { x: 1.5, z: 2.2 }, { x: -1, z: 1.4 }, { x: 2.6, z: 1.8 },
    { x: -3.4, z: 3.2 }, { x: 0.2, z: 3.6 }, { x: -4.5, z: 2 }, { x: 3.6, z: 3 }
  ];
  grassDefs.forEach((def) => {
    const tuft = buildGrassTuft();
    tuft.position.set(def.x, 0, def.z);
    worldGroup.add(tuft);
  });
  // Foreground bushes — round 4 addition: larger-scale shrub clusters
  // close to the camera (near z=0), spread toward the frame edges.
  // With the framing now sitting lower (see RISE/LOOK_DOWN above), the
  // nearest ground is genuinely in view and was otherwise still bare —
  // these give it real foreground texture instead of flat color.
  function buildBush(scale) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: PALETTE.treeCanopyA, roughness: 0.9 });
    const b1 = sphereMesh(0.32, PALETTE.treeCanopyA, 9, 7);
    const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.24, 9, 7), new THREE.MeshStandardMaterial({ color: PALETTE.treeCanopyB, roughness: 0.9 }));
    b2.position.set(0.28, -0.04, 0.1);
    const b3 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 9, 7), mat);
    b3.position.set(-0.24, -0.06, -0.05);
    g.add(b1, b2, b3);
    g.position.y = 0.2;
    g.scale.setScalar(scale);
    return g;
  }
  const bushDefs = [
    { x: -6.5, z: -0.5, s: 1.2 }, { x: 6, z: 0, s: 1.0 }, { x: -3.5, z: -1.2, s: 0.85 }
  ];
  bushDefs.forEach((def) => {
    const bush = buildBush(def.s);
    bush.position.x = def.x;
    bush.position.z = def.z;
    worldGroup.add(bush);
  });

  // Foreground scatter, further still — the character/lake/bushes
  // above all sit within a few units of z=0-3, which is still very
  // far from the camera's own settled position (z≈-30 at full pull-
  // back). Perspective means that gap is what actually renders as
  // the empty lower frame, not the content near the horizon — objects
  // genuinely close to the camera are what fill that area. Larger
  // scale here is correct, not a mistake: at this proximity they
  // SHOULD render bigger, the same way real foreground elements do in
  // an establishing shot.
  const foregroundDefs = [
    { x: -16, z: -20, s: 2.2 }, { x: -9, z: -14, s: 1.8 }, { x: 4, z: -22, s: 2.4 },
    { x: 12, z: -12, s: 1.6 }, { x: -3, z: -9, s: 1.4 }, { x: 17, z: -19, s: 2.0 }
  ];
  foregroundDefs.forEach((def) => {
    const bush = buildBush(def.s);
    bush.position.x = def.x;
    bush.position.z = def.z;
    worldGroup.add(bush);
  });

  const flowerColors = [PALETTE.flowerPink, PALETTE.flowerYellow, PALETTE.flowerWhite];
  const flowerDefs = [
    { x: -1.6, z: 2.9 }, { x: 0.9, z: 2.5 }, { x: -2.8, z: 1.9 }, { x: 2.1, z: 3.2 },
    { x: -0.4, z: 1.7 }, { x: 3.2, z: 2.3 }
  ];
  flowerDefs.forEach((def, i) => {
    const flower = sphereMesh(0.055, flowerColors[i % flowerColors.length], 8, 6);
    flower.position.set(def.x, 0.1, def.z);
    worldGroup.add(flower);
  });

  // Mountains — round 4 spread them across a wide horizon span with
  // varied height/radius/segment-count. Round 5: Faye's reference
  // screenshot showed they STILL all read as the same sharp-triangle
  // cutout, just scaled — segment count alone wasn't enough real
  // silhouette variety. Two more changes this round:
  //   - `worn` type peaks use a truncated cylinder (flat-ish top)
  //     instead of ConeGeometry's always-perfect point — an actually
  //     different silhouette shape, not just a narrower/wider version
  //     of the same one. Mixed with `sharp` (the original cone) peaks
  //     for real contrast across the range.
  //   - a small bright "sunlit cap" sits at each peak's tip
  //     (MeshBasicMaterial, unlit — deliberately NOT physically-based
  //     lighting, so the highlight reads consistently regardless of
  //     camera/sun angle rather than relying on subtle Lambertian
  //     shading, which is what read as "flat uniform grey" before).
  function buildMountain(def) {
    const g = new THREE.Group();
    let peak;
    if (def.type === 'worn') {
      peak = new THREE.Mesh(
        new THREE.CylinderGeometry(def.r * 0.3, def.r, def.h, def.seg),
        new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.9 })
      );
    } else {
      peak = cone(def.r, def.h, def.color, def.seg);
    }
    peak.position.y = def.h / 2;
    const cap = new THREE.Mesh(
      new THREE.ConeGeometry(def.type === 'worn' ? def.r * 0.32 : def.r * 0.4, def.h * 0.22, def.seg),
      new THREE.MeshBasicMaterial({ color: 0xf6ecc8, transparent: true, opacity: 0.8 })
    );
    cap.position.y = def.h - (def.h * 0.22) / 2 + 0.02;
    g.add(peak, cap);
    return g;
  }
  const mountainDefs = [
    { x: -40, z: 48, r: 7, h: 13, color: PALETTE.mountainFar, seg: 5, type: 'sharp' },
    { x: -28, z: 38, r: 9.5, h: 18, color: PALETTE.mountainNear, seg: 7, type: 'worn' },
    { x: -15, z: 46, r: 7.5, h: 14, color: PALETTE.mountainFar, seg: 6, type: 'sharp' },
    { x: -1, z: 36, r: 11.5, h: 23, color: PALETTE.mountainNear, seg: 8, type: 'sharp' },
    { x: 13, z: 44, r: 7, h: 12.5, color: PALETTE.mountainFar, seg: 5, type: 'worn' },
    { x: 25, z: 39, r: 10, h: 19.5, color: PALETTE.mountainNear, seg: 7, type: 'sharp' },
    { x: 38, z: 50, r: 8, h: 15, color: PALETTE.mountainFar, seg: 6, type: 'worn' }
  ];
  const mountains = mountainDefs.map((def) => {
    const m = buildMountain(def);
    m.position.set(def.x, 0, def.z);
    m.userData.finalY = 0; // group's own peak mesh already carries the h/2 offset internally
    m.visible = false;
    worldGroup.add(m);
    return m;
  });

  // Sky detail — round 4 addition: a few soft cloud clusters + one
  // small plane silhouette crossing during the reveal (the plane
  // concept is a proven pattern from prototypes/3d-camera-explorer-v2,
  // simplified here — one flyby, not tied to a story beat).
  function buildCloud(scale) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: PALETTE.cloud, roughness: 0.95 });
    const c1 = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), mat);
    const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 8), mat); c2.position.set(1.1, 0.1, 0.1);
    const c3 = new THREE.Mesh(new THREE.SphereGeometry(0.62, 10, 8), mat); c3.position.set(-1.0, 0.05, -0.1);
    g.add(c1, c2, c3);
    g.scale.setScalar(scale);
    return g;
  }
  const cloudDefs = [
    { x: -32, y: 27, z: 40, s: 1.6 }, { x: -6, y: 31, z: 50, s: 2.0 },
    { x: 20, y: 26, z: 42, s: 1.4 }, { x: 36, y: 30, z: 52, s: 1.8 }
  ];
  cloudDefs.forEach((def) => {
    const cloud = buildCloud(def.s);
    cloud.position.set(def.x, def.y, def.z);
    scene.add(cloud);
  });
  const planeMat = new THREE.MeshStandardMaterial({ color: PALETTE.plane, roughness: 0.7 });
  const plane = new THREE.Group();
  const planeBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.14, 0.22), planeMat);
  const planeWing = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 1.1), planeMat);
  planeWing.position.x = 0.1;
  plane.add(planeBody, planeWing);
  plane.visible = false;
  scene.add(plane);
  function flyPlaneAcross(durationMs) {
    plane.visible = true;
    plane.position.set(-34, 24, 46);
    plane.rotation.y = -0.15;
    const start = performance.now();
    function step(now) {
      if (!stageState.alive) return;
      const t = clamp01((now - start) / durationMs);
      plane.position.x = lerp(-34, 34, t);
      plane.position.y = 24 + Math.sin(t * Math.PI) * 2;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // Same 0-1 dolly convention as the rest of Unit 01, used only to
  // animate from a closer starting point to the settled Extreme Wide
  // framing — no drag input in this lesson step.
  const MIN_DIST = 7, MAX_DIST = 34;
  const TARGET = new THREE.Vector3(0, 1.4, 4);
  // Round 4: reduced from 5.5/5.5, then reduced again after a live
  // screenshot still showed a mostly-empty lower half. At the old
  // values the settled camera pitched down ~18°, which combined with
  // far/tall mountains pinned their peaks at the very top edge of the
  // frustum — leaving the entire lower 3/4 of the frame as empty
  // foreground ground with nothing on it (Faye's repeat note:
  // "packed into the top quarter, large flat empty area below").
  // Verified each step empirically via screenshot, not just the angle
  // math, since real framing always needs a live check.
  const RISE_AMOUNT = 2.3, LOOK_DOWN_AMOUNT = 1.8;
  let dollyT = 0.42;

  function applyCameraTransform() {
    const dist = MIN_DIST + (MAX_DIST - MIN_DIST) * dollyT;
    const camY = TARGET.y + dollyT * RISE_AMOUNT;
    camera.position.set(TARGET.x, camY, TARGET.z - dist);
    const lookY = TARGET.y - dollyT * LOOK_DOWN_AMOUNT;
    camera.lookAt(TARGET.x, lookY, TARGET.z);
  }
  applyCameraTransform();

  function dropIn(obj, delayMs, durationMs) {
    const finalY = obj.userData.finalY || 0;
    obj.position.y = finalY + 7;
    obj.visible = true;
    setTimeout(() => {
      const start = performance.now();
      function step(now) {
        const t = clamp01((now - start) / durationMs);
        obj.position.y = lerp(finalY + 7, finalY, easeOutCubic(t));
        if (t < 1 && stageState.alive) requestAnimationFrame(step); else obj.position.y = finalY;
      }
      requestAnimationFrame(step);
    }, delayMs);
  }

  let revealRafId = null;
  function animateReveal(durationMs, onDone) {
    const start = performance.now();
    function step(now) {
      if (!stageState.alive) return;
      const t = clamp01((now - start) / durationMs);
      dollyT = lerp(0.42, 1, easeInOutCubic(t));
      applyCameraTransform();
      if (t < 1) {
        revealRafId = requestAnimationFrame(step);
      } else {
        revealRafId = null;
        if (onDone) onDone();
      }
    }
    revealRafId = requestAnimationFrame(step);
  }

  function resizeToContainer() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resizeToContainer();
  window.addEventListener('resize', resizeToContainer);

  const stageState = { alive: true };
  let renderRafId = null;
  function renderLoop() {
    if (!stageState.alive) return;
    renderer.render(scene, camera);
    renderRafId = requestAnimationFrame(renderLoop);
  }
  renderLoop();

  // Mount fade-in, then auto-play the assembly + camera pull-back —
  // fully automatic, no user gesture required to start.
  requestAnimationFrame(() => canvas.classList.add('visible'));
  setTimeout(() => {
    if (!stageState.alive) return;
    mountains.forEach((m, i) => dropIn(m, 250 + i * 200, 1300));
    trees.forEach((t, i) => dropIn(t, 400 + i * 120, 900));
    dropIn(house, 500, 1000);
    dropIn(house2, 650, 1000);
    dropIn(foregroundFigure, 350, 1100);
    setTimeout(() => flyPlaneAcross(4000), 1200);
    animateReveal(4200, () => {
      termEl.classList.add('show');
      showArtchiBubble('What changes?', 2600);
      showContinue('Continue →', nextStep);
    });
    ensureArtchiMounted();
  }, 500);

  _three3DState = {
    cleanup() {
      stageState.alive = false;
      if (revealRafId) cancelAnimationFrame(revealRafId);
      if (renderRafId) cancelAnimationFrame(renderRafId);
      window.removeEventListener('resize', resizeToContainer);
      renderer.dispose();
    }
  };
}
function cleanupDiscover(){
  if (_three3DState) { _three3DState.cleanup(); _three3DState = null; }
}

/* ============================================================
   STEP 3 — WHEN WOULD WE USE IT? (image-led tap-to-reveal prompts)
   Round 2: original small illustrations, one per situation — small,
   non-photographic, same restrained palette as the rest of the
   lesson (no copyright concern, nothing hotlinked — see Step 4 for
   where that rule actually matters). Swappable for real art later by
   only editing this table, same "data says which scene, presentation
   renders it" split as the rest of the file.
============================================================ */
// Round 6: redrawn as grayscale/sepia ink-line storyboard art, per
// Faye's reference (a real film/animation production storyboard
// frame — hand-drawn linework, restrained color used only sparingly,
// not flat colored illustration). Each uses the shared #sbSketch
// filter (defined once, near the top of <body>) for a hand-drawn
// wobble on otherwise clean paths, warm off-white paper instead of a
// colored sky gradient, and at most one small muted accent touch —
// built as styled SVG since this course's visuals are code, not

function revealPrompt(i){

        story's own line (LESSON_DATA.story_choices[i].title) typed
        out in quotes with a typing sound, then a 3-2-1 countdown.
     2. A two-panel guided-drawing round: LEFT = the teacher's guide
        (the SAME shared 5-stage drawingSvg() sequence as before —
        still ONE shared illustration, not three bespoke ones; see
        lesson-data.js's drawing_steps comment), RIGHT = the
        student's own canvas (formerly the separate "Try It Yourself"

   cleanupStoryPractice (not a bare reset) is this step's cleanup —
   see that function's own comment on why the reveal sequence needs
