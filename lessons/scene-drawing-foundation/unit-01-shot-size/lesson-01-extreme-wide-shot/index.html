   six scenes' reveal sequences.
============================================================ */
// Reused by the typewriter reveal below — reuses the ALREADY-WIRED
// artchiPlayTone (core/scene-drawing-archi.js) for the "typing sound"
// rather than standing up a new Web Audio setup. REAL BUG found while
// testing this: artchiPlayTone opens a brand-new AudioContext on
// EVERY call and never closes it — harmless for its existing callers
// (one call per human-paced click), but calling it on every-other-
// character during a fast typewriter effect creates AudioContext
// instances faster than the browser's live-context limit, and
// genuinely errors ("AudioContext encountered an error from the
// audio device"), confirmed live via Playwright. Fixing
// artchiPlayTone itself is out of scope here — it's a shared platform
// file (core/scene-drawing-archi.js) other lessons also depend on;
// fixing that call pattern belongs to whoever owns that file, not a
// Lesson 01 content restructure. Scoped fix instead: throttle by
// elapsed TIME, not character count, so this call site alone never
// asks for more than a few AudioContexts per second regardless of
// typing speed or line length.
let _lastTypeTickAt = 0;
function playTypeTick(){
  const now = performance.now();
  if (now - _lastTypeTickAt < 160) return;
  _lastTypeTickAt = now;
  if (typeof artchiPlayTone === 'function') artchiPlayTone(1400, 0.025);
}
function typewriterInto(el, text, speed, timers, onDone, onChar){
  el.textContent = '';
  let i = 0;
  function tick(){
    if (i >= text.length) { if (onDone) onDone(); return; }
    el.textContent += text.charAt(i);
    if (onChar) onChar(text.charAt(i));
    i++;
    timers.push(setTimeout(tick, speed));
  }
  tick();
}
// Faye found 3 seconds (the original 3-2-1 spec) wasn't enough time
// to actually read the storyline before it advanced — 5-4-3-2-1 at
// 1000ms per digit gives a real 5-second pause, still a visible
// countdown rather than a silent wait.
function runPracticeCountdown(el, timers, onDone){
  const seq = ['5', '4', '3', '2', '1'];
  let i = 0;
  function tick(){
    if (i >= seq.length) { onDone(); return; }
    el.textContent = seq[i];
    el.classList.remove('pulse');
    void el.offsetWidth; // restart the CSS animation
    el.classList.add('pulse');
    i++;
    timers.push(setTimeout(tick, 1000));
  }
  tick();
}
// If Previous/Next navigates away mid-reveal (before the two-panel
// round has even mounted), the pending typewriter/countdown
// setTimeout chain would otherwise keep firing after the DOM it
// touches is gone — same class of bug Lesson 02's six scenes guard
// against with their own reveal-timer cleanup.
let _storyRevealTimers = [];
function cleanupStoryPractice(){
  _storyRevealTimers.forEach(id => clearTimeout(id));
  _storyRevealTimers = [];
}
// Set at the start of every afterRenderStoryPractice call — lets the
// shared drawStep/applyDrawStage/savePracticeDrawingForStory/

function afterRenderStoryPractice(story, i){
  _currentStory = story;

  _storyRevealTimers = [];

  typewriterInto(lineEl, '“' + story.title + '”', 32, _storyRevealTimers, () => {
    _storyRevealTimers.push(setTimeout(() => {

  function mountTwoPanel(){

// Real teacher video (LEFT panel) for whichever story has one, in
// place of the platform-led drawingSvg() stage sequence — same "no
// skip, the only way forward is the real 'ended' event" convention
// Step 1's intro video already established (see afterRenderIntroVideo
// for the pattern this mirrors), generalized here to "unlock the
// student's own canvas" instead of "advance to the next step" (the
// two-panel round's own equivalent of finishing the teacher's side —
// see applyDrawStage's matching branch for the drawingSvg case).
function attachStoryTeacherVideo(story){
  let unlocked = false;
  const unlockOnce = () => {
    if (unlocked) return;
    unlocked = true;
    STATE.reachedEnd = true;
    unlockStudentPanel();
  };
  const sdk = document.createElement('script');
  sdk.src = 'https://embed.cloudflarestream.com/embed/sdk.latest.js';
  sdk.onload = () => {
    try {
      const iframe = document.getElementById('storyTeacherVideoFrame');
      const player = window.Stream && iframe ? window.Stream(iframe) : null;
      if (!player) { unlockOnce(); return; }
      player.addEventListener('ended', unlockOnce);
      let started = false;
      player.addEventListener('play', () => {
        started = true;
        const overlay = document.getElementById('videoTapOverlay');
        if (overlay) overlay.hidden = true;
      });
      setTimeout(() => {
        if (started) return;
        const overlay = document.getElementById('videoTapOverlay');
        if (!overlay) return;
        overlay.hidden = false;
        overlay.onclick = () => {
          try { player.muted = false; } catch (e) { /* best-effort */ }
          const playResult = player.play();
          if (playResult && playResult.catch) playResult.catch((e) => console.warn('[story_teacher_video] play() failed', e));
          overlay.hidden = true;
        };
      }, 1200);
    } catch (e) {
      console.warn('[story_teacher_video] Stream SDK attach failed', e);
      unlockOnce(); // genuine failure — never leave the student stuck behind a locked canvas
    }
  };
  sdk.onerror = () => {
    console.warn('[story_teacher_video] Stream SDK failed to load');
    unlockOnce();
  };
  document.head.appendChild(sdk);
}
// Redesign (Faye's correction, round 3 on this panel): this LEFT

/* ============================================================
   STEP 5 (shared sub-component) — the platform-led quick-sketch demo
   (drawingSvg's 5 cumulative layers), used for whichever stories don't

   Round 2: substantially more visual craft per stage, each one
   demonstrating a real, nameable technique (composition/horizon
   placement, atmospheric value, scale relationship, overlap for
   depth + cross-hatch shading, selective detail/restraint) instead of
   abstract placeholder shapes — per Faye's "as a student I didn't
   actually learn anything from watching it" correction. Order matches
   the original brief's 5 captions exactly (Start the big world / Build
   the largest shapes / Place the character small / Create depth / Add
   only the details the story needs) — those captions/teachingNotes
   still live in lesson-data.js but are no longer displayed as of the
   round-3 redesign below: this used to be a manual step-by-step
   tutorial (Prev/Replay/Next buttons, one caption per stage, progress
   dots) and that format was wrong for this panel — see
   playQuickSketchDemo's own comment for why and what replaced it.
============================================================ */
function drawingSvg(){
  // Round 6: redrawn as ink-line storyboard sketch art (same
  // #sbSketch hand-drawn filter and warm-paper palette as Steps 3/5),

// Redesign (replaces the old applyDrawStage/drawStep/drawReplay manual
// step-by-step tutorial — Prev/Replay/Next buttons, a caption + a
// progress dot per stage): Faye's correction was that this panel is a
// quick idea sketch, not a formal lesson to click through, and that
// should hold for every story, not just whichever one currently lacks
// a real video. playQuickSketchDemo() now plays the same drawingSvg()
// stages on its own, on a timer, with no buttons/captions/dots visible
// — the same "watch it play, no skipping, then it's your turn"
// contract attachStoryTeacherVideo() already uses for Story A's real
// video, just driven by setInterval instead of an 'ended' event.
// paintDrawStage() is the visual-only half (just fades in the SVG
// layers for the current STATE.drawStageIndex) — no DOM elements left
// to update now that the caption/dots/buttons markup is gone.
function paintDrawStage(){
  document.querySelectorAll('.dstage').forEach(g => {
    const s = parseInt(g.dataset.stage, 10);
    if (g.classList.contains('guide-lines')) {
      // Round 4 fix: the composition guide grid used to stay at full
      // opacity through every later stage, cluttering the finished
      // drawing (a real, identified cause of illegibility, not just
      // polish) — full only while stage 1 is the CURRENT stage, faint
      // once the drawing has moved past it.
      g.style.opacity = STATE.drawStageIndex === 0 ? '1' : '0.1';
      return;
    }
    g.style.opacity = (s <= STATE.drawStageIndex + 1) ? '1' : '0';
  });
}
function playQuickSketchDemo(){
  const steps = LESSON_DATA.drawing_steps;
  STATE.drawStageIndex = 0;
  paintDrawStage();
  let i = 0;
  const timer = setInterval(() => {
    i++;
    STATE.drawStageIndex = Math.min(i, steps.length - 1);
    paintDrawStage();
    if (i >= steps.length - 1) {
      clearInterval(timer);
      if (!STATE.reachedEnd) {
        STATE.reachedEnd = true;
        unlockStudentPanel();
      }
    }
  }, 900);
  // Pushed into the same cleanup bucket afterRenderStoryPractice's
  // reveal timers use (cleanupStoryPractice clears it on Previous/
  // Next away from this story) — clearTimeout and clearInterval share
  // one id space in every browser, so a clearTimeout-based cleanup
  // list safely cancels an interval id too.
  _storyRevealTimers.push(timer);
}

/* ============================================================
   STEP 5 (shared sub-component) — "Your Turn": the right-panel canvas
   formerly Step 6b's separate "Try It Yourself" full-screen step. Same
   in-browser sketch-canvas + IndexedDB pattern already used by the
   pre-redesign version of this lesson (now archived at
   _archive/lesson-01-extreme-wide-shot-original/) and by the
   Kandinsky lesson template — reused verbatim, not reinvented, per
   Faye's standing "don't invent a new storage mechanism" instruction.

   PRACTICE-SECTION RESTRUCTURE: the DB now keys one record PER STORY
   (practiceKeyForStory), not one record per lesson — three possible
   drawings now, not one. Only a story actually drawn digitally gets a
   record; "I would prefer to work on paper" naturally has nothing to
   save. FLAGGED to Faye in the file header as the one thing not to
   decide silently — confirm this default is right.
============================================================ */
const PRACTICE_DB_NAME = 'fei_scene_drawing_extreme_wide_shot_storage';
const PRACTICE_DB_VERSION = 1;
const PRACTICE_STORE_NAME = 'artworks';
const PRACTICE_MAX_EDGE = 1200;
const PRACTICE_JPEG_QUALITY = 0.85;
let _practiceDbPromise = null;
function practiceOpenDB(){
  if (_practiceDbPromise) return _practiceDbPromise;
  _practiceDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(PRACTICE_DB_NAME, PRACTICE_DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PRACTICE_STORE_NAME)) {
        db.createObjectStore(PRACTICE_STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _practiceDbPromise;
}
function practiceCompressCanvas(canvas){
  return new Promise((resolve, reject) => {
    let width = canvas.width, height = canvas.height;
    const longestEdge = Math.max(width, height);
    let source = canvas;
    if (longestEdge > PRACTICE_MAX_EDGE) {
      const scale = PRACTICE_MAX_EDGE / longestEdge;
      const small = document.createElement('canvas');
      small.width = Math.round(width * scale);
      small.height = Math.round(height * scale);
      small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
      source = small;
    }
    source.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', PRACTICE_JPEG_QUALITY);
  });
}
// One record PER STORY now (key = practiceKeyForStory(storyId)), not
// one record per lesson — see the file header's flagged note.
function practiceKeyForStory(storyId){
  return LESSON_DATA.courseId + '_' + storyId;
}
async function practiceSaveArtwork(canvas, key){
  const compressed = await practiceCompressCanvas(canvas);
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readwrite');
    const record = { id: key, blob: compressed, savedAt: Date.now() };
    const req = tx.objectStore(PRACTICE_STORE_NAME).put(record); // one record per story — overwrite on re-save
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function practiceGetArtwork(key){
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readonly');
    const req = tx.objectStore(PRACTICE_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

const PRACTICE_COLORS = ['#4b473d', '#2d5fa8', '#8a6a4a', '#5b7a96', '#3a3a34'];
const PRACTICE_PAPER = '#faf8f5';
// Round 4 addition: real stroke-style variety, not just one line
// weight — per Faye's explicit ask for watercolor/marker/fineliner
// plus a broad fill-style option suited to blocking in large sky/
// ground areas (this being an Extreme Wide Shot lesson). Eraser
// draws with the paper color rather than true transparency/
// destination-out — the canvas is later compressed to JPEG for
// storage (practiceCompressCanvas), which has no alpha channel, so a
// transparent "erase" would composite to black on save; painting
// with the paper color avoids that entirely and looks identical.
const PRACTICE_TOOLS = {
  fineliner: { label: 'Fineliner', icon: '✒️', width: 2, alpha: 1 },
  marker: { label: 'Marker', icon: '🖊️', width: 8, alpha: 0.88 },
  watercolor: { label: 'Watercolor', icon: '🖌️', width: 20, alpha: 0.24 },
  fill: { label: 'Fill', icon: '🧱', width: 46, alpha: 0.5 },
  eraser: { label: 'Eraser', icon: '🧽', width: 30, alpha: 1, isEraser: true }
};
let practiceColor = PRACTICE_COLORS[0];
let practiceTool = 'fineliner';
let practiceDrawing = false;
let practiceLast = null;

// renderDrawPractice (the old standalone "Try It Yourself" full-
// screen step) is gone — its markup now lives inline as the RIGHT
// panel of renderTwoPanelMarkup above. practicePos/pickPracticeColor/
// pickPracticeTool/clearPracticeCanvas/initPracticeCanvas below are
// unchanged, still reused as-is for that panel's canvas.
function practicePos(canvas, e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function pickPracticeColor(color){
  practiceColor = color;
  document.querySelectorAll('.practice-color-dot').forEach(el => el.classList.toggle('picked', el.dataset.color === color));
}
function pickPracticeTool(tool){
  practiceTool = tool;
  document.querySelectorAll('.practice-style-btn').forEach(el => el.classList.toggle('picked', el.dataset.tool === tool));
}
function clearPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function initPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 225;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvas.onpointerdown = (e) => {
    practiceDrawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    practiceLast = practicePos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!practiceDrawing) return;
    const p = practicePos(canvas, e);
    const tool = PRACTICE_TOOLS[practiceTool] || PRACTICE_TOOLS.fineliner;
    ctx.strokeStyle = tool.isEraser ? PRACTICE_PAPER : practiceColor;
    ctx.globalAlpha = tool.alpha;
    ctx.lineWidth = tool.width * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(practiceLast.x, practiceLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    practiceLast = p;
  };
  canvas.onpointerup = () => { practiceDrawing = false; };
  canvas.onpointercancel = () => { practiceDrawing = false; };
}
// Save (digital) or choosePreferPaper (paper) — either way resolves
// STATE.storyResults[_currentStoryIndex] and reveals a real (non-
// ghost) Continue. Both only ever run once the teacher's guide has
// reached its end and unlockStudentPanel() has removed the .locked
// class, so there's no need to re-check that here.
async function savePracticeDrawingForStory(){
  const canvas = document.getElementById('practiceCanvas');
  const btn = document.getElementById('practiceSaveBtn');
  if (!canvas || !_currentStory) return;
  btn.disabled = true;
  try {
    await practiceSaveArtwork(canvas, practiceKeyForStory(_currentStory.id));
    STATE.storyResults[_currentStoryIndex] = 'digital';
    document.getElementById('practiceSavedNote').textContent = '✓ Saved — you can keep drawing or continue.';
    const paperBtn = document.getElementById('preferPaperBtn');
    if (paperBtn) paperBtn.classList.remove('picked');
    showContinue('Continue →', nextStep);
  } catch (e) {
    console.warn('[savePracticeDrawingForStory] failed', e);
    document.getElementById('practiceSavedNote').textContent = "Couldn't save — you can still continue without saving.";
  }
  btn.disabled = false;
}
function choosePreferPaper(){
  if (_currentStoryIndex < 0) return;
  STATE.storyResults[_currentStoryIndex] = 'paper';
  const btn = document.getElementById('preferPaperBtn');
  if (btn) btn.classList.add('picked');
  document.getElementById('practiceSavedNote').textContent = 'No problem — grab a pencil and draw this one on paper.';
  showContinue('Continue →', nextStep);
}

   Faye's own description of what this should show.

   Foundation A's own timeline row assumes every entry carries
   promptText/studentText/inputType/ageGroup (its own reflection-entry
   shape). This lesson's own finishLesson() entry doesn't — and any
   other course's entries may not either — so the row below is
   defensive: it falls back to a synthesized summary instead of
   printing "undefined" for entries that aren't shaped like Foundation
   A's. This isn't cosmetic — it's what a genuinely SHARED cross-
   platform journey view actually needs, not just cover for this one
   lesson's own entries.
============================================================ */
function openMyJourney(){
  renderJourneyModalContent();
  document.getElementById('journeyModalBackdrop').classList.add('show');
}
function closeMyJourney(){
  document.getElementById('journeyModalBackdrop').classList.remove('show');
}
function journeyEscapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function journeyFormatRelativeDate(timestamp){
  const diff = Date.now() - timestamp;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  if (seconds < 60) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
  if (days < 7) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  if (days < 30) return Math.floor(days / 7) + ' week' + (Math.floor(days / 7) > 1 ? 's' : '') + ' ago';
  return new Date(timestamp).toLocaleDateString();
}
// Best-effort summary for entries that don't carry Foundation A's own
// promptText/studentText fields (this lesson's completion entry, or
// any other course's differently-shaped one).
function journeySummarize(e){
  if (e.promptText || e.studentText) {
    return { prompt: e.promptText || '', text: e.studentText || '' };
  }
  if (e.momentKey === 'lesson_complete') {
    const bits = [];
    if (e.storyChoice) bits.push('chose "' + e.storyChoice + '"'); // older entries, pre-restructure — kept for backward compat
    if (Array.isArray(e.storyResults)) {
      const digitalCount = e.storyResults.filter(r => r === 'digital').length;
      if (digitalCount) bits.push('drew ' + digitalCount + ' of 3 stories digitally');
    }
    if (Array.isArray(e.checkedConcepts) && e.checkedConcepts.length) bits.push('understood: ' + e.checkedConcepts.join(', '));
    return { prompt: '', text: 'Completed this lesson' + (bits.length ? ' — ' + bits.join('; ') : '') + '.' };
  }
  if (e.momentKey === 'community_submit') {
    return { prompt: '', text: 'Submitted their work to the Student Artwork Community.' };
  }
  return { prompt: '', text: 'Saved a moment in this lesson.' };
}
function renderJourneyModalContent(){
  const entries = (typeof JournalStorage !== 'undefined') ? JournalStorage.getAll() : [];
  const statsEl = document.getElementById('journeyStats');
  const timelineEl = document.getElementById('journeyTimeline');

  const totalEntries = entries.length;
  const courseEntries = entries.filter(e => e.courseId === LESSON_DATA.courseId).length;
  const firstEntry = entries[entries.length - 1];
  const daysSinceFirst = firstEntry ? Math.max(1, Math.floor((Date.now() - firstEntry.createdAt) / 86400000)) : 0;
  statsEl.innerHTML = `
    <div class="journey-stat"><div class="journey-stat-number">${totalEntries}</div><div class="journey-stat-label">Thoughts</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${courseEntries}</div><div class="journey-stat-label">This lesson</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${daysSinceFirst}</div><div class="journey-stat-label">Day${daysSinceFirst !== 1 ? 's' : ''} growing</div></div>
  `;

  if (entries.length === 0) {
    timelineEl.innerHTML = `<div class="journey-empty"><div class="journey-empty-icon">💭</div><div>No thoughts yet — your journey starts when you save your first moment.</div></div>`;
    return;
  }
  timelineEl.innerHTML = entries.map(e => {
    const summary = journeySummarize(e);
    return `
      <div class="journey-entry">
        <button class="journey-entry-delete" onclick="deleteJourneyEntry('${e.id}')" title="Delete this thought">🗑</button>
        <div class="journey-entry-meta">
          <span class="journey-entry-lesson">${journeyEscapeHtml(e.lessonId || e.courseId || 'lesson')}</span>
          ${e.momentKey ? `<span class="journey-entry-moment">${journeyEscapeHtml(e.momentKey)}</span>` : ''}
          <span class="journey-entry-date">${journeyFormatRelativeDate(e.createdAt)}</span>
        </div>
        ${summary.prompt ? `<div class="journey-entry-prompt">${journeyEscapeHtml(summary.prompt)}</div>` : ''}
        <div class="journey-entry-text">${journeyEscapeHtml(summary.text)}</div>
      </div>
    `;
  }).join('');
}
function deleteJourneyEntry(entryId){
  if (!confirm('Delete this thought? This cannot be undone.')) return;
  JournalStorage.remove(entryId);
  renderJourneyModalContent();
}

/* ============================================================
   NAVIGATION + RAIL
============================================================ */
function renderRail(){
  const dots = STEPS.map((s, i) => `<span class="rail-dot${i < STATE.stepIndex ? ' done' : ''}${i === STATE.stepIndex ? ' current' : ''}"></span>`).join('');
  document.getElementById('rail').innerHTML = dots;
  // Disabled (not hidden) on Step 1 so the control's position never
  // shifts as the student moves through the lesson.
  document.getElementById('prevStepBtn').disabled = STATE.stepIndex === 0;
}
// Set to whichever step is currently live so renderCurrentStep can
// clean it up before swapping away — needed for Step 2's Three.js
// renderer/requestAnimationFrame loop, which would otherwise keep
// running in the background (a real, growing leak) every time the
// student navigates off Step 2, in either direction.
let _liveStep = null;
function renderCurrentStep(){
  hideContinue();
  if (_liveStep && _liveStep.cleanup) {
    try { _liveStep.cleanup(); } catch (e) { console.warn('[cleanup] failed', e); }
  }
  const step = STEPS[STATE.stepIndex];
  const stageEl = document.getElementById('stage');
  stageEl.innerHTML = `<div class="step">${step.render()}</div>`;
  renderRail();
  window.scrollTo(0, 0);
  _liveStep = step;
  if (step.afterRender) step.afterRender();
}
// Step-transition chime — round 3. Reuses the exact same synthesized-
// tone mechanism Foundation Skill lessons already use for lightweight
// UI feedback (artchiPlayTone, ported verbatim from Foundation A's own
// playTone() in core/scene-drawing-archi.js — no new sound asset).
// 880Hz/0.12s matches that codebase's existing single-ding feedback
// calls (e.g. lesson-1-sphere's own `playTone(880, 0.1)`), not the
// multi-note ascending sequences reserved for bigger celebrations.
// Lives in the shared nav functions below so it covers every lesson-
// level step-to-step move uniformly — Step 1's video and Step 2's
// automatic camera reveal only reach these functions once each
// sequence has already finished on its own, so the chime marks the
// discrete navigation action, never layers over the video's own audio
// or the reveal animation itself.
function playStepAdvanceTone(){
  if (typeof artchiPlayTone === 'function') artchiPlayTone(880, 0.12);
}
function nextStep(){
  if (STATE.stepIndex < STEPS.length - 1) { playStepAdvanceTone(); STATE.stepIndex++; renderCurrentStep(); }
}
// Global Previous — added per Faye's round-2 feedback ("no way to go
// back anywhere in the flow... real problem, not nitpicking").
//
// Round 5 BUG FIX (original repro, still the reason this special-case
// exists): naively decrementing stepIndex treats a step with its own
// internal sub-stages as one flat step — pressing Previous from "Try
// It Yourself" used to jump straight past all 5 drawing stages to
// Choose Your Story, because this function only ever thinks in whole
// top-level steps.
//
// PRACTICE-SECTION RESTRUCTURE originally carried this same fix
// forward for the new story_* steps too, special-casing a Previous
// press to step back through the teacher panel's own drawStageIndex
// sub-sequence one frame at a time before leaving the story. That
// special-case is gone as of the round-3 quick-sketch redesign: the
// teacher panel's drawing demo (playQuickSketchDemo) is no longer
// manually stepped by the student at all — it plays on its own, same
// as Story A's video — so there's no sub-stage left for Previous to
// walk back through. Previous from any story_* step now just leaves
// the story via the plain top-level path below; cleanupStoryPractice
// cancels any pending reveal/demo timers. See choosePreferPaper/
// savePracticeDrawingForStory's own STATE.storyResults reset for the
// other half of this pattern (re-entering a story via Previous+Next
// always starts its reveal fresh, never stale mid-way state from an
// earlier pass).
function prevStep(){
  if (STATE.stepIndex > 0) { playStepAdvanceTone(); STATE.stepIndex--; renderCurrentStep(); }
}
function goToStep(i){
  playStepAdvanceTone();
  STATE.stepIndex = Math.max(0, Math.min(STEPS.length - 1, i));
  renderCurrentStep();
}

/* ============================================================
   ARTCHI — mounted lazily, starting at Step 2, NOT on init(). Step 1
   is the full-screen intro video and must stay completely free of
   chrome; showArtchi()'s own first-visit onboarding is a full-
   viewport blocking modal (core/scene-drawing-style.css
   .artchi-onboard-backdrop), so firing it during the video would trap
   the whole lesson behind a popup before the student sees anything —
   caught live in a Playwright pass, not by inspection. Archi's first
   real appearance now lines up with her first bubble line anyway
   (Step 2's "Try stepping back."), matching the brief's "only very
   short moments" instruction.
============================================================ */
let artchiMounted = false;
function ensureArtchiMounted(){
  if (artchiMounted) return;
  artchiMounted = true;
  document.getElementById('artchi-mount').innerHTML = artchiMarkup();
  initArtchiDrag();
  // Reveal only — deliberately NOT calling the shared showArtchi(),
  // which also triggers either a full-screen onboarding modal (first
  // platform visit) or a generic idle bubble a few hundred ms later.
  // Both would collide with this lesson's own deliberate, sparse
  // bubble cues (the brief's "should NOT constantly speak" rule), and
  // the onboarding modal specifically is a full-viewport popup that
  // would block the Learning Canvas mid-interaction — caught live in
  // a Playwright pass, not by inspection. Everything else (markup,
  // drag, bubble, chat) is the same shared component, untouched.
  const character = document.getElementById('artchi-character');
  const label = document.getElementById('artchi-label');
  if (character) character.classList.remove('hidden');
  if (label) label.classList.remove('hidden');
  resetArtchiSleep();
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      // Deliberately ungated — matches the live sibling lesson's own
      // unresolved TODO on Scene Drawing's free/paid rule.
    } catch (e) { console.warn('[init] FEIAccess.init failed, continuing', e); }
  }
  renderCurrentStep();
}
init();
</script>
