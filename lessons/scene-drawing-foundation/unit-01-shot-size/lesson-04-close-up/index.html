// ---- Close-Up scene builders --------------------------------------------
// Each builder populates stage.scene and returns {start,settle}: `start` is
// a somewhat-wider pull-back and `settle` is the actual close-up framing
// the camera pushes into. Composition follows Faye's hand-drawn six-panel
// storyboard sheet (reference-images/lesson04-close-up-storyboard-
// reference.png) — its panels are already labeled with each story's exact
// title/category in written order, so each builder below follows its
// matching panel directly, no mapping ambiguity. Every scene keeps a
// faint trace of its environment (fog + a couple of simple background
// props) behind the close-up subject — never a blank backdrop, per
// Faye's "quieter, not gone" rule — see each builder's own comment for
// what that trace is.

function dimSceneLights(stage, ambient, sun, fill) {
  stage.scene.traverse(o => {
    if (!o.isLight) return;
    if (o.isAmbientLight) o.intensity *= ambient;
    else if (o.isDirectionalLight && o.position.x < 0) o.intensity *= sun;
    else if (o.isDirectionalLight) o.intensity *= fill;
  });
}
function setBackdrop(stage, colorHex, fogNear, fogFar) {
  stage.scene.background = new THREE.Color(colorHex);
  stage.scene.fog = new THREE.Fog(colorHex, fogNear, fogFar);
}
function glow3(r, color) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), new THREE.MeshBasicMaterial({ color: color, fog: false }));
}
function glowBox3(w, h, d, color) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: color, fog: false }));
}
function glassPane3(w, h, color, opacity) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.02),
    new THREE.MeshStandardMaterial({ color: color, transparent: true, opacity: opacity, roughness: 0.08, metalness: 0.1, depthWrite: false }));
}

// ---- A close-up hand/finger rig -------------------------------------
// The standard buildKid() rig's hand is a single sphere — fine at Wide/
// Medium distance, but every story this lesson frames is close enough
// that a bare sphere would read as wrong. This is a small stand-alone
// hand (wrist at local origin, palm/fingers extending along +Z) built
// from the same primitive toolkit, reused across four of the six
// scenes. curl/thumbCurl (poseHand) are the only pose knobs — plenty for
// "gripping," "reaching," "open," at this scale.
function buildHandProp(skin) {
  const g = new THREE.Group();
  // Round 5 (Sept 2026, per Faye): the flat box palm + uniform-radius
  // finger cylinders read as blocky/geometric at close-up range across
  // three stories (Unlocking the Door, Glass of Water, and by extension
  // every other scene sharing this rig). Fixed here once, component-
  // level, instead of patching each scene: a domed palm mound for real
  // volume instead of a flat card, a visible knuckle bump at each
  // finger's base pivot, and a clearer base-to-tip taper.
  const palm = box3(0.1, 0.034, 0.11, skin, { roughness: 0.55 });
  palm.position.set(0, 0, 0.055);
  g.add(palm);
  const palmMound = sphere3(0.052, skin, 14, 10, { roughness: 0.55 });
  palmMound.scale.set(1, 0.42, 0.92);
  palmMound.position.set(0, 0.016, 0.05);
  g.add(palmMound);
  const backRidge = box3(0.09, 0.014, 0.09, skin, { roughness: 0.55 });
  backRidge.position.set(0, 0.021, 0.05);
  g.add(backRidge);
  const fingerDefs = [
    { x: -0.038, len: 0.05 },
    { x: -0.013, len: 0.06 },
    { x: 0.013, len: 0.064 },
    { x: 0.038, len: 0.056 }
  ];
  const fingers = fingerDefs.map(fd => {
    const knuckle = new THREE.Group();
    knuckle.position.set(fd.x, 0.006, 0.108);
    const knuckleBump = sphere3(0.0115, skin, 8, 6);
    knuckle.add(knuckleBump);
    const seg1 = cyl3(0.0115, 0.0095, fd.len * 0.55, skin, 8);
    seg1.position.z = fd.len * 0.55 / 2;
    seg1.rotation.x = Math.PI / 2;
    knuckle.add(seg1);
    const mid = new THREE.Group();
    mid.position.z = fd.len * 0.55;
    const midBump = sphere3(0.0088, skin, 8, 6);
    mid.add(midBump);
    const seg2 = cyl3(0.0088, 0.007, fd.len * 0.45, skin, 8);
    seg2.position.z = fd.len * 0.45 / 2;
    seg2.rotation.x = Math.PI / 2;
    mid.add(seg2);
    const tip = sphere3(0.0075, skin, 8, 6);
    tip.position.z = fd.len * 0.45;
    mid.add(tip);
    knuckle.add(mid);
    g.add(knuckle);
    return { pivot: knuckle, midPivot: mid };
  });
  // Thumb now has two segments + its own mid-joint, matching the
  // fingers' articulation — previously a single rigid cylinder, which
  // read noticeably stiffer/blockier than the fingers next to it,
  // especially when curled for a grip.
  const thumbPivot = new THREE.Group();
  thumbPivot.position.set(0.05, -0.006, 0.036);
  thumbPivot.rotation.y = -0.9;
  thumbPivot.rotation.z = 0.4;
  const thumbBump = sphere3(0.013, skin, 8, 6);
  thumbPivot.add(thumbBump);
  const thumbSeg1 = cyl3(0.0125, 0.0105, 0.026, skin, 8);
  thumbSeg1.position.z = 0.013;
  thumbSeg1.rotation.x = Math.PI / 2;
  thumbPivot.add(thumbSeg1);
  const thumbMid = new THREE.Group();
  thumbMid.position.z = 0.026;
  const thumbMidBump = sphere3(0.0098, skin, 8, 6);
  thumbMid.add(thumbMidBump);
  const thumbSeg2 = cyl3(0.0098, 0.008, 0.024, skin, 8);
  thumbSeg2.position.z = 0.012;
  thumbSeg2.rotation.x = Math.PI / 2;
  thumbMid.add(thumbSeg2);
  const thumbTip = sphere3(0.0085, skin, 8, 6);
  thumbTip.position.z = 0.024;
  thumbMid.add(thumbTip);
  thumbPivot.add(thumbMid);
  g.add(thumbPivot);
  const wrist = cyl3(0.032, 0.036, 0.09, skin, 10);
  wrist.position.set(0, 0, -0.04);
  wrist.rotation.x = Math.PI / 2;
  g.add(wrist);
  g.userData.fingers = fingers;
  g.userData.thumbPivot = thumbPivot;
  g.userData.thumbMid = thumbMid;
  return g;
}
// curl is usually one number applied to all four fingers (unchanged
// behavior for every existing call site), but can be an array of 4
// per-finger values instead — needed for poses like "thumb and index
// grip something, the other two fingers stay loose," which a single
// shared curl can't express. thumbCurl now also drives the thumb's new
// mid-joint (see buildHandProp), at a slightly steeper angle so it
// doesn't uncurl stiffly straight the way a single joint would.
function poseHand(hand, curl, thumbCurl) {
  hand.userData.fingers.forEach((f, i) => {
    const c = Array.isArray(curl) ? curl[i] : curl;
    f.pivot.rotation.x = c;
    f.midPivot.rotation.x = c * 1.15;
  });
  if (thumbCurl != null) {
    hand.userData.thumbPivot.rotation.x = thumbCurl;
    if (hand.userData.thumbMid) hand.userData.thumbMid.rotation.x = thumbCurl * 1.1;
  }
}
// Orients a hand by two DIRECTION VECTORS instead of Euler angles (which
// fought each other badly here — a Y rotation alone can't change which
// side faces the camera). reachDir is where the fingers point (the
// rig's local +Z); palmDir is where the palm/grip side faces (the rig's
// local -Y). The two need only be roughly perpendicular; this
// orthonormalizes palmDir against reachDir and derives the third axis,
// then builds a rotation matrix from that basis — exact, no guessing.
function orientHand(hand, reachDir, palmDir) {
  const z = reachDir.clone().normalize();
  let negY = palmDir.clone().normalize();
  negY = negY.sub(z.clone().multiplyScalar(negY.dot(z)));
  if (negY.lengthSq() < 1e-6) negY.set(0, 1, 0).sub(z.clone().multiplyScalar(z.y));
  negY.normalize();
  const y = negY.clone().negate();
  const x = new THREE.Vector3().crossVectors(y, z).normalize();
  hand.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}
// A forearm sleeve, added as a CHILD of the hand so it always follows
// the hand's orientHand()-derived rotation instead of needing its own
// independently-matched Euler angles.
function attachForearm(hand, color, len) {
  len = len || 0.4;
  const arm = cyl3(0.038, 0.045, len, color, 10);
  arm.rotation.x = Math.PI / 2;
  arm.position.z = -len / 2 - 0.05;
  hand.add(arm);
  return arm;
}

// A simple stylized sneaker — sole, upper, toe cap, laces, heel — for
// the Walking Feet scene, where the standard rig's tiny shoe box isn't
// enough presence at this range. toeColor is optional (per Faye, Round
// 5): when omitted, behaves exactly as before (toe cap same color as
// the body) for every existing call site (background shoes here, and
// the small background pair in the Secret Note scene). Only the
// foreground shoe below passes a contrasting toeColor — without one,
// body+toe+heel were all the same solid color with no seam between
// them, so the whole shoe read as one undifferentiated blob rather
// than a shoe with visible parts.
function buildShoe3(color, scale, toeColor) {
  scale = scale || 1;
  toeColor = toeColor != null ? toeColor : color;
  const g = new THREE.Group();
  const sole = box3(0.13, 0.03, 0.27, 0xf0ece0, { roughness: 0.75 });
  sole.position.y = 0.015;
  g.add(sole);
  const body = box3(0.125, 0.08, 0.18, color);
  body.position.set(0, 0.07, -0.035);
  g.add(body);
  // Round 5 (per Faye): a sphere toe cap, at any angle/size tried,
  // read as a separate ball glued onto the body rather than part of
  // the shoe. This whole lesson's other props (lockers, table, desk)
  // are all flat-shaded boxes, so a toeColor BOX flush against the
  // body's own cross-section — same width/height, just a different
  // color, no shape mismatch to reconcile — reads immediately as a
  // two-tone sneaker toe instead. A small, mostly-embedded sphere at
  // the very front adds just a hint of rounding without becoming its
  // own dominant shape again.
  const toeCap = box3(0.127, 0.079, 0.095, toeColor);
  toeCap.position.set(0, 0.07, 0.095);
  g.add(toeCap);
  const toeRound = sphere3(0.046, toeColor, 12, 8);
  toeRound.scale.set(1.0, 0.5, 0.4);
  toeRound.position.set(0, 0.05, 0.135);
  g.add(toeRound);
  // A thin seam between body and toe cap — visible even when the two
  // are the same color, but especially useful now that they can differ.
  const seam = box3(0.129, 0.082, 0.01, 0x000000, { roughness: 0.9 });
  seam.material.transparent = true; seam.material.opacity = 0.35;
  seam.position.set(0, 0.07, 0.048);
  g.add(seam);
  for (let i = 0; i < 3; i++) {
    const lace = box3(0.086, 0.009, 0.013, 0xffffff);
    lace.position.set(0, 0.105, -0.02 + i * 0.035);
    g.add(lace);
  }
  const heel = box3(0.1, 0.055, 0.07, color);
  heel.position.set(0, 0.05, -0.1);
  g.add(heel);
  g.scale.setScalar(scale);
  return g;
}

// A glass of water with a translucent shell + a shorter "water" fill,
// plus a couple of highlight strips so it reads as glass, not plastic.
function buildGlassCup3(r, h, fillPct) {
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.9, h, 20, 1, true),
    new THREE.MeshStandardMaterial({ color: 0xeaf6fa, transparent: true, opacity: 0.22, roughness: 0.06, metalness: 0.05, side: THREE.DoubleSide, depthWrite: false }));
  glass.position.y = h / 2;
  g.add(glass);
  const water = cyl3(r * 0.92, r * 0.85, h * fillPct, 0x7fc9e0, 16);
  water.material.transparent = true; water.material.opacity = 0.62;
  water.position.y = h * fillPct / 2;
  g.add(water);
  [-0.55, 0.2].forEach(a => {
    const hl = box3(0.006, h * 0.5, 0.001, 0xffffff, { roughness: 0.2 });
    hl.material.transparent = true; hl.material.opacity = 0.5;
    hl.position.set(Math.cos(a) * r * 0.97, h * 0.5, Math.sin(a) * r * 0.97);
    hl.rotation.y = -a;
    g.add(hl);
  });
  const rimBase = cyl3(r, r, 0.006, 0xffffff, 20);
  rimBase.material.transparent = true; rimBase.material.opacity = 0.35;
  rimBase.position.y = h;
  g.add(rimBase);
  return g;
}

// PANEL 1 — Unlocking the Door. Round 2 (per Faye's storyboard v2):
// completely rebuilt — a hand on a round ring-pull door handle (not a
// key in a lock), with a girl's face peeking around the door's edge on
// the right, wearing a fuzzy-collared coat with a bag strap crossing
// her shoulder. Dark interior; a sliver of warm light through the door
// crack (kept faint per the "quieter, not gone" rule, not literally
// blank).
function buildSceneUnlockingDoor(stage) {
  const world = new THREE.Group();
  stage.scene.add(world);
  setBackdrop(stage, 0x0a0e17, 1.8, 6);
  dimSceneLights(stage, 0.3, 0.28, 0.18);
  const warm = new THREE.PointLight(0xffdca0, 0.22, 2.5);
  warm.position.set(-0.3, 0.15, 0.3);
  stage.scene.add(warm);
  // A close light on the handle (kept from the previous round's fix —
  // without it the door read as empty black, near-identical in value
  // to the backdrop).
  const doorLight = new THREE.PointLight(0xffdca0, 0.28, 1.0);
  doorLight.position.set(-0.16, 0.06, 0.28);
  stage.scene.add(doorLight);
  // A second, cooler fill on the girl's side so her face reads as a
  // separate, slightly lit "peeking into the light" area rather than
  // vanishing into the same shadow as the door. Round 2 fix: pixel-
  // sampled the render to find the true cause here — the hairCap WAS
  // rendering, at the right color, but three warm point lights all
  // overlapping this small area pushed skin, hair, coat, and collar all
  // toward the same washed warm-tan value once tone-mapped, crushing
  // the contrast between them (confirmed by sampling: hair and skin
  // pixels landed within ~25/255 of each other). Dimmer lights plus a
  // darker base hair color (below) restores the separation.
  const girlLight = new THREE.PointLight(0xcdd8ea, 0.12, 1.0);
  girlLight.position.set(0.55, 0.32, 0.5);
  stage.scene.add(girlLight);

  // The door fills the left ~2/3 of the frame; its right edge (a
  // visible vertical molding strip) is what the girl peeks around.
  const door = box3(1.5, 3.0, 0.07, 0x2a1f15, { roughness: 0.8 });
  door.position.set(-0.35, 0, -0.03);
  world.add(door);
  const doorEdge = box3(0.035, 3.02, 0.09, 0x1c150f, { roughness: 0.8 });
  doorEdge.position.set(0.13, 0, 0.0);
  world.add(doorEdge);
  // Raised panel frame around the handle — sized to actually fit the
  // settle camera's tight visible window (see the settle comment below)
  // so its molding edge shows instead of filling the whole frame.
  const panelFrame = box3(0.27, 0.23, 0.018, 0x342518, { roughness: 0.75 });
  panelFrame.position.set(-0.35, -0.02, 0.01);
  world.add(panelFrame);
  const panelInset = box3(0.21, 0.17, 0.014, 0x241a10, { roughness: 0.8 });
  panelInset.position.set(-0.35, -0.02, 0.014);
  world.add(panelInset);
  // sliver of light through the crack, at the door's far edge
  const sliver = glowBox3(0.03, 2.8, 0.02, 0xfff0c0);
  sliver.position.set(-1.08, 0, -0.02);
  world.add(sliver);
  const sliverGlow = new THREE.PointLight(0xffdca0, 0.4, 2.0);
  sliverGlow.position.set(-1.03, 0, 0.1);
  stage.scene.add(sliverGlow);

  // Round ring-pull handle (per Faye's drawing: a circular loop on a
  // backplate, not a traditional round knob) — backplate + a torus
  // ring mounted flush, protruding enough for the hand to wrap through.
  const backplate = cyl3(0.062, 0.062, 0.016, 0x9a7d46, 20);
  backplate.material.roughness = 0.35; backplate.material.metalness = 0.45;
  backplate.rotation.x = Math.PI / 2;
  backplate.position.set(-0.35, -0.02, 0.02);
  world.add(backplate);
  const handleRing = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 10, 20),
    new THREE.MeshStandardMaterial({ color: 0xc7ccd1, roughness: 0.3, metalness: 0.5 }));
  handleRing.position.set(-0.35, -0.02, 0.05);
  world.add(handleRing);

  const hand = buildHandProp(0xf0c49a);
  const handPos = new THREE.Vector3(-0.42, -0.08, 0.06);
  hand.position.copy(handPos);
  // fingers wrap through the ring from the left; palm faces the door
  orientHand(hand, new THREE.Vector3(0.75, 0.55, 0.1), new THREE.Vector3(0.3, -0.3, 0.9));
  poseHand(hand, [0.85, 1.0, 1.05, 1.1], 0.9);
  attachForearm(hand, 0xf0c04a, 0.36);
  world.add(hand);

  // The girl, peeking around the door's edge on the right — a simple
  // standalone head (not the full buildKid rig, same approach as
  // buildSceneFrightenedFace) turned toward the handle, one eye/brow
  // visible on her near (camera/handle-facing) side, hair falling over
  // the far side of her face. Fuzzy-collared coat + a bag strap, per
  // Faye's drawing.
  const skin = 0xf0c49a, hair = 0x2e1f12;
  const head = sphere3(0.135, skin, 18, 14);
  head.position.set(0.32, 0.12, 0.18);
  head.rotation.y = -0.5; // turned to look toward the handle/door
  world.add(head);
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62),
    new THREE.MeshStandardMaterial({ color: hair, roughness: 0.9 }));
  hairCap.position.copy(head.position);
  hairCap.rotation.y = 0.55; // hair's fuller side falls over her FAR (+x, away-from-handle) cheek
  world.add(hairCap);
  const visEye = sphere3(0.014, 0x2a2018, 8, 6);
  visEye.position.set(0.245, 0.125, 0.285);
  world.add(visEye);
  const visBrow = box3(0.036, 0.007, 0.012, hair, { roughness: 0.9 });
  visBrow.position.set(0.245, 0.152, 0.285);
  visBrow.rotation.y = -0.5;
  world.add(visBrow);
  const nose = sphere3(0.014, skin, 8, 6);
  nose.scale.set(0.8, 1, 0.9);
  nose.position.set(0.215, 0.095, 0.295);
  world.add(nose);

  // Fuzzy-collared coat: a rounded torso block + a ring of small puffs
  // at the neckline standing in for texture (this lesson's established
  // low-poly way to fake fur/fuzz, same trick as buildShoe3's laces).
  const coat = box3(0.24, 0.3, 0.16, 0x8a5a3c, { roughness: 0.85 });
  coat.position.set(0.32, -0.16, 0.14);
  coat.rotation.y = -0.35;
  world.add(coat);
  const collarPuffColor = 0xb8a488;
  for (let i = 0; i < 6; i++) {
    const a = (i / 5) * Math.PI - Math.PI * 0.15;
    const puff = sphere3(0.024, collarPuffColor, 8, 6);
    puff.position.set(
      0.32 + Math.cos(a) * 0.12 - 0.03,
      -0.01 + (i % 2 === 0 ? 0.012 : -0.008),
      0.14 + Math.sin(a) * 0.1 + 0.04
    );
    world.add(puff);
  }
  // bag + diagonal strap crossing her shoulder
  const strap = box3(0.035, 0.32, 0.012, 0x5a3f28, { roughness: 0.8 });
  strap.position.set(0.34, -0.08, 0.22);
  strap.rotation.z = 0.55;
  world.add(strap);
  const bag = sphere3(0.07, 0x6b4530, 12, 8);
  bag.scale.set(1.2, 0.85, 0.6);
  bag.position.set(0.4, -0.28, 0.2);
  world.add(bag);

  return {
    start: { pos: { x: 0.1, y: 0.08, z: 1.05 }, look: { x: -0.05, y: 0, z: 0.1 } },
    // Close enough that the handle + hand read clearly on the left,
    // with the girl's peeking face + coat/bag in frame on the right —
    // matches Faye's panel putting both subjects in one shot.
    settle: { pos: { x: -0.03, y: 0.04, z: 0.88 }, look: { x: -0.02, y: 0.02, z: 0.12 } },
    focusX: -0.1
  };
}

// PANEL 2 — A Frightened Face. Round 2 (per Faye's storyboard v2):
// rebuilt — hair mostly covers her face (jagged, messy bangs), and she
// holds a cushion up in front of the lower half of her face with both
// hands, peeking over the top with wide, worried eyes. Curtains (a row
// of vertical fabric folds) fill the background on both sides, per her
// drawing — replaces the previous vague wall-edge hint.
function buildSceneFrightenedFace(stage) {
  const world = new THREE.Group();
  stage.scene.add(world);
  setBackdrop(stage, 0x2b2d31, 1.1, 3.4);
  dimSceneLights(stage, 0.55, 0.4, 0.4);
  const rim = new THREE.PointLight(0x8fa6c2, 0.5, 3);
  rim.position.set(-0.6, 0.3, 0.4);
  stage.scene.add(rim);
  // Curtains: a row of vertical fabric folds spanning the background,
  // alternating depth/shade so each fold catches light differently —
  // reads as gathered fabric rather than a flat striped wall.
  const curtainColors = [0x3d4148, 0x363a40, 0x42464d];
  for (let i = -8; i <= 8; i++) {
    const x = i * 0.16;
    if (Math.abs(x) < 0.5) continue; // keep the curtain clear of the head itself
    const fold = box3(0.1, 3.2, 0.05, curtainColors[Math.abs(i) % 3], { roughness: 0.92 });
    fold.position.set(x, 0, -1.2 - (i % 2 === 0 ? 0.08 : 0));
    world.add(fold);
  }

  const skin = 0xf0c49a, hair = 0x3a281c;
  const head = sphere3(0.52, skin, 24, 18);
  world.add(head);
  // Fuller, messier bangs than before — thetaLength pushed back down
  // toward the brow line (per her drawing's jagged, face-covering
  // hair), with a jagged fringe of small cones along the hairline for
  // the "spiky bangs" silhouette instead of a smooth cap edge.
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.545, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.4),
    new THREE.MeshStandardMaterial({ color: hair, roughness: 0.9 }));
  hairCap.position.y = 0.015;
  world.add(hairCap);
  for (let i = -3; i <= 3; i++) {
    const spike = cone3(0.055, 0.16, hair, 6);
    spike.position.set(i * 0.13, 0.24 - Math.abs(i) * 0.015, 0.33);
    spike.rotation.x = Math.PI + 0.15;
    spike.rotation.z = i * 0.06;
    world.add(spike);
  }
  // loose strands framing the sides of the face, falling past the jaw
  [[-0.42, 0.05, 0.32, -0.3], [0.4, 0.02, 0.3, 0.3], [-0.28, -0.1, 0.44, -0.15]].forEach(s => {
    const strand = cone3(0.05, 0.32, hair, 6);
    strand.position.set(s[0], s[1], s[2]);
    strand.rotation.z = s[3];
    strand.rotation.x = 0.3;
    world.add(strand);
  });

  // wide, worried eyes: sclera + iris, angled tense eyebrows above —
  // the only part of her face left uncovered once the cushion is up.
  [-0.19, 0.19].forEach(x => {
    const sclera = sphere3(0.1, 0xfaf8f5, 14, 10);
    sclera.scale.set(1, 1.15, 0.6);
    sclera.position.set(x, 0.06, 0.42);
    world.add(sclera);
    const iris = sphere3(0.052, 0x3a2a20, 10, 8);
    iris.position.set(x, 0.05, 0.49);
    world.add(iris);
    const pupil = sphere3(0.024, 0x140f0c, 8, 6);
    pupil.position.set(x, 0.05, 0.53);
    world.add(pupil);
    const brow = box3(0.16, 0.028, 0.02, hair, { roughness: 0.9 });
    brow.position.set(x, 0.22, 0.44);
    brow.rotation.z = x < 0 ? 0.32 : -0.32;
    world.add(brow);
  });

  // The cushion, held up over the lower face — a rounded, soft-edged
  // block (stacked boxes narrowing toward the top corners stand in for
  // a rounded pillow silhouette) with both hands' fingers curling over
  // its top edge.
  // Round 2 fix: at this settle camera, objects held this close to the
  // lens (z~0.44) get magnified and pushed toward the bottom edge far
  // more than their world-space Y offset suggests — the cushion at
  // y=-0.32 was almost entirely below frame. Raised (and pulled back
  // slightly in Z) so its top edge sits just under the eyes instead.
  // Also given a clearly distinct (cool, muted) color — the original
  // warm salmon tone was too close to the skin tone to read as a
  // separate object once lit, the same under-contrast problem found
  // and fixed in buildSceneUnlockingDoor's hair.
  const cushionColor = 0x5c8299;
  const cushionCore = box3(0.42, 0.34, 0.12, cushionColor, { roughness: 0.75 });
  cushionCore.position.set(0, -0.18, 0.4);
  world.add(cushionCore);
  const cushionTopBevel = box3(0.34, 0.06, 0.12, cushionColor, { roughness: 0.75 });
  cushionTopBevel.position.set(0, 0.01, 0.39);
  world.add(cushionTopBevel);
  const cushionSeam = box3(0.42, 0.012, 0.13, 0x3f5f70, { roughness: 0.8 });
  cushionSeam.position.set(0, -0.02, 0.4);
  world.add(cushionSeam);

  // hands gripping the cushion's top edge, fingers curling down over
  // its front face — kept slightly in FRONT of the cushion (larger Z)
  // so they aren't occluded by it from the camera's side.
  [-1, 1].forEach(side => {
    const hand = buildHandProp(skin);
    hand.scale.setScalar(0.85);
    hand.position.set(side * 0.23, -0.03, 0.44);
    orientHand(hand, new THREE.Vector3(-side * 0.15, -0.8, 0.35), new THREE.Vector3(side * 0.3, 0.2, -0.9));
    poseHand(hand, [1.1, 1.15, 1.15, 1.1], 0.9);
    world.add(hand);
  });

  return {
    start: { pos: { x: 0, y: 0.08, z: 2.6 }, look: { x: 0, y: 0.05, z: 0 } },
    settle: { pos: { x: 0, y: 0.06, z: 1.45 }, look: { x: 0, y: 0.05, z: 0 } }
  };
}

// PANEL 3 — The Glass of Water. Round 2 (per Faye's storyboard v2):
// rebuilt — a hand holds a mug (with a handle) at a table set with a
// plate of food (a wedge of sandwich/toast, two dumplings, chopsticks
// resting across the plate), a kitchen counter with jars and a hanging
// utensil behind. Title/id/category kept exactly as Faye asked — only
// the composition changed.
function buildSceneGlassOfWater(stage) {
  const world = new THREE.Group();
  stage.scene.add(world);
  setBackdrop(stage, 0xe9ddc4, 0.9, 3.2);
  dimSceneLights(stage, 0.95, 0.9, 0.85);

  // Round 2 fix: the mug/plate/table/food were all clustered in the
  // same pale cream range and, under this scene's bright lighting,
  // blended into a nearly single-tone wash. Table darkened to a richer
  // wood tone; mug given a saturated color below — same under-contrast
  // fix as the door/cushion scenes.
  const table = box3(2.4, 0.06, 2.0, 0xa8734a, { roughness: 0.65 });
  table.position.set(0, -0.03, -0.3);
  world.add(table);
  const grain = box3(2.4, 0.003, 2.0, 0x96633e);
  grain.position.set(0, 0.0035, -0.3);
  world.add(grain);

  // kitchen counter behind: a shelf, a couple of jars, a hanging
  // whisk/utensil — the "counter with jars" from Faye's drawing.
  const counterTop = box3(2.4, 0.05, 0.4, 0xc9a476, { roughness: 0.6 });
  counterTop.position.set(0.55, 0.62, -1.35);
  world.add(counterTop);
  [[0.15, 0x5a9dd6], [0.42, 0xe0e0d8]].forEach(j => {
    const jar = cyl3(0.055, 0.05, 0.12, j[1], 10);

// PANEL 4 — Walking Feet. Camera low and close to the ground: one shoe
// large in the foreground, mid-stride, in a school hallway that recedes
// to a doorway at the far end (per Faye's storyboard v2 — her drawing
// shows the hallway/doorway depth composition directly, not the
// side-view alternative she also offered). Lockers + ceiling lights
// recede into the hallway as the background trace.
function buildSceneWalkingFeet(stage) {
  const world = new THREE.Group();
  stage.scene.add(world);
  setBackdrop(stage, 0xdfe6ea, 3.5, 15);
  dimSceneLights(stage, 1.0, 0.95, 0.9);

  const floor = box3(3.4, 0.1, 16, 0xe4e9ec, { roughness: 0.25, metalness: 0.05 });
  floor.position.set(0, -0.05, -6);
  world.add(floor);
  const floorSheen = box3(3.4, 0.001, 16, 0xffffff);
  floorSheen.material.transparent = true; floorSheen.material.opacity = 0.15;
  floorSheen.position.set(0, 0.0006, -6);
  world.add(floorSheen);
  // Round 5 (per Faye): at the low, close settle camera the ceiling
  // lights and most of the locker banks fall outside the frame, so the
  // hallway read was resting entirely on props that aren't reliably
  // visible at this crop. Floor tile seams are always in frame (the
  // floor fills the lower half of the shot) and read as a hallway/
  // institutional floor immediately, receding toward the vanishing
  // point the same way the lockers do.
  for (let i = -6; i < 10; i++) {
    const seamZ = box3(3.4, 0.002, 0.012, 0xc7cdd2);
    seamZ.position.set(0, 0.0012, -i * 1.0);
    world.add(seamZ);
  }
  [-1.13, 1.13].forEach(x => {
    const seamX = box3(0.012, 0.002, 16, 0xc7cdd2);
    seamX.position.set(x, 0.0012, -6);
    world.add(seamX);
  });
  // A visible kickplate strip along the base of each locker bank —
  // still in frame at ankle height even when the lockers' upper body
  // isn't, so the "this is a hallway with lockers" cue survives the
  // tight low crop, not just the floor.
  [-1, 1].forEach(side => {
    const kick = box3(0.5, 0.09, 15.5, 0x5c7592, { roughness: 0.5, metalness: 0.1 });
    kick.position.set(side * 1.75, 0.045, -6.2);
    world.add(kick);
  });

  function lockerBank(side) {
    for (let i = 0; i < 10; i++) {
      const locker = box3(0.42, 1.0, 0.5, i % 2 ? 0x8fa9c4 : 0x9db4cc, { roughness: 0.55, metalness: 0.15 });
      locker.position.set(side * 1.75, 0.55, -0.5 - i * 0.52);
      world.add(locker);
      const seam = box3(0.015, 1.0, 0.51, 0x5c7592);
      seam.position.set(side * (1.75 - 0.21), 0.55, -0.5 - i * 0.52);
      world.add(seam);
      const handle = sphere3(0.018, 0x33363b, 8, 6);
      handle.position.set(side * (1.75 - 0.15), 0.5, -0.5 - i * 0.52 + 0.23);
      world.add(handle);

  lockerBank(-1); lockerBank(1);
  for (let i = 0; i < 5; i++) {

  // Round 5 (per Faye): a cylinder here read as a hollow blue cup/vase

  const forePant = box3(0.16, 0.13, 0.15, 0x2d5fa8);

  const doorFrame = box3(2.3, 1.85, 0.08, 0xb8ae9c, { roughness: 0.7 });

    leaf.position.set(side * 0.56, 0.9, -6.66);

  return {
    start: { pos: { x: 0.15, y: 0.34, z: 1.9 }, look: { x: 0, y: 0.06, z: -4 } },

// PANEL 5 — Passing a Secret Note. Round 2 (per Faye's storyboard v2):
// completely rebuilt from her drawing — a lower, wider under-the-table
// view showing two chairs (slatted backs) flanking the shot, the table
// surface with a book and pencil on top, two hands reaching in from
// left and right meeting near the middle (passing the note — no
// visible note object, per Faye's "student decides what's on it"), and
// a pair of feet/shoes near the base of each chair. Floor tiles ground
// the low angle. Previously a much tighter two-hands-only crop; this is
// a fuller scene matching her new composition.
function buildSceneSecretNote(stage) {
  const world = new THREE.Group();
  stage.scene.add(world);
  setBackdrop(stage, 0x241d17, 1.0, 3.4);
  dimSceneLights(stage, 0.4, 0.35, 0.3);
  const spill = new THREE.PointLight(0xfff0c8, 0.55, 2.6);
  spill.position.set(0, 0.9, 0.6);
  stage.scene.add(spill);

  // Floor tiles grounding the low angle.
  for (let i = -3; i <= 3; i++) {
    const seam = box3(0.01, 0.001, 2.4, 0x3a2c1e);
    seam.position.set(i * 0.35, -0.62, -0.4);
    world.add(seam);
  }

  // The table: surface + front edge lip (the note passes just beneath
  // this edge), a book and a pencil resting on top.
  const tableTop = box3(1.9, 0.05, 1.3, 0x8a5a3c, { roughness: 0.65 });
  tableTop.position.set(0, 0.62, -0.6);
  world.add(tableTop);
  const tableEdge = box3(1.9, 0.09, 0.06, 0x6b4530, { roughness: 0.65 });
  tableEdge.position.set(0, 0.58, 0.03);
  world.add(tableEdge);
  const book = new THREE.Group();
  const pageL = box3(0.16, 0.01, 0.13, 0xf7f3e8, { roughness: 0.7 });
  pageL.position.set(-0.08, 0, 0);
  pageL.rotation.z = 0.06;
  book.add(pageL);
  const pageR = box3(0.16, 0.01, 0.13, 0xf2ede0, { roughness: 0.7 });
  pageR.position.set(0.08, 0, 0);
  pageR.rotation.z = -0.06;
  book.add(pageR);
  book.position.set(-0.05, 0.665, -0.02);
  world.add(book);
  const pencil = cyl3(0.008, 0.008, 0.22, 0xf0c04a, 6);
  pencil.rotation.z = Math.PI / 2;
  pencil.rotation.y = 0.25;
  pencil.position.set(0.2, 0.666, -0.03);
  world.add(pencil);

  // Two chairs (slatted, rounded-top backs) framing the shot, close and
  // large in the foreground on either side — matches Faye's low-angle
  // drawing looking between the two chair backs at the table.
  function buildChairBack(color) {
    const g = new THREE.Group();
    const seat = box3(0.5, 0.05, 0.46, color, { roughness: 0.6 });
    seat.position.y = 0.42;
    g.add(seat);
    [-1, 1].forEach(fx => {
      const leg = box3(0.05, 0.84, 0.05, color, { roughness: 0.6 });
      leg.position.set(fx * 0.2, 0, 0.19);
      g.add(leg);
    });
    [-1, 1].forEach(bx => {
      const leg = box3(0.05, 1.5, 0.05, color, { roughness: 0.6 });
      leg.position.set(bx * 0.2, 0.15, -0.19);
      g.add(leg);
    });
    // domed top rail (a flattened sphere cap) + vertical slats beneath
    const topRail = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.5),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 }));
    topRail.scale.set(1, 0.6, 0.35);
    topRail.position.set(0, 1.34, -0.19);
    g.add(topRail);
    const bottomRail = box3(0.46, 0.05, 0.05, color, { roughness: 0.6 });
    bottomRail.position.set(0, 0.9, -0.19);
    g.add(bottomRail);
    for (let i = -1; i <= 1; i++) {
      const slat = box3(0.045, 0.5, 0.045, color, { roughness: 0.6 });
      slat.position.set(i * 0.16, 1.12, -0.19);
      g.add(slat);
    }
    return g;
  }
  // Round 2 fix: at x=+-0.85 with the settle camera only ~0.3 units
  // away in Z, the chairs' angular offset from the view axis was far
  // outside the camera's ~33 degree horizontal half-FOV — entirely
  // off-frame, which is why nothing but the two hands showed up.
  // Scaled down and pulled in closer to center so they land at the
  // frame's edges (partially cropped, same as her drawing) instead of
  // off it entirely.
  // Lightened from a near-black brown — against this scene's dark
  // fogged background the chair tops were blending straight into it.
  const chairColor = 0x6b4a32;
  const chairL = buildChairBack(chairColor);
  chairL.scale.setScalar(0.46);
  chairL.position.set(-0.5, -0.34, 0.2);
  chairL.rotation.y = 0.15;
  world.add(chairL);
  const chairR = buildChairBack(0x5c3f2a);
  chairR.scale.setScalar(0.46);
  chairR.position.set(0.5, -0.34, 0.2);
  chairR.rotation.y = -0.15;
  world.add(chairR);

  // Feet/shoes near the base of each chair.
  const shoeL = buildShoe3(0x5a9dd6, 0.5);
  shoeL.rotation.y = Math.PI * 0.55;
  shoeL.position.set(-0.4, -0.5, 0.25);
  world.add(shoeL);
  const shoeR = buildShoe3(0x2d5fa8, 0.5);
  shoeR.rotation.y = -Math.PI * 0.55;
  shoeR.position.set(0.38, -0.5, 0.25);
  world.add(shoeR);

  // Two hands reaching in from either side, meeting just below the
  // table's front edge — passing the note there, out of sight of
  // anyone looking down at the tabletop (where only the book shows).
  const handAPos = new THREE.Vector3(-0.32, 0.42, 0.1);
  const handBPos = new THREE.Vector3(0.3, 0.4, 0.12);
  const meetPoint = new THREE.Vector3(0, 0.4, 0.14);

  const handA = buildHandProp(0xf0c49a);
  handA.position.copy(handAPos);
  orientHand(handA, meetPoint.clone().sub(handAPos), new THREE.Vector3(0, -1, 0.15));
  poseHand(handA, 0.45, 0.3);
  attachForearm(handA, 0xe888b0, 0.4);
  world.add(handA);

  const handB = buildHandProp(0xc9895c);
  handB.position.copy(handBPos);
  orientHand(handB, meetPoint.clone().sub(handBPos), new THREE.Vector3(0, 1, 0.15));
  poseHand(handB, 0.4, 0.35);
  attachForearm(handB, 0x5cb85c, 0.4);
  world.add(handB);

  return {
    start: { pos: { x: 0.02, y: 0.1, z: 1.5 }, look: { x: 0, y: 0.3, z: -0.5 } },
    // Framed to fit both (now correctly-scaled) chairs at the edges,
    // the table + book behind, and the hands meeting in the middle —
    // the fuller composition from her drawing, vs. the previous
    // version's much tighter two-hands-only crop.
    settle: { pos: { x: 0, y: 0.4, z: 1.15 }, look: { x: 0, y: 0.55, z: -0.15 } }
  };
}

/* ============================================================
   STORY DRAWING ROUND — one after every story, all five required, same
   two-panel format as Lesson 01's
   practice restructure: LEFT = that story's Quick Sketch Reference
   video, enlarged into its own full panel (the small 3D-scene corner
   overlay stays as-is); RIGHT = the student's own canvas, same size.
   "I would prefer to work on paper" is the opt-out. Either saving or
   choosing paper resolves the story (STATE.storyResults[i]) and turns
   Continue from ghost to solid — the canvas is open from the moment
   the round mounts, so a student can sketch along with the video.
   The reference panel keeps the established "just one reference"
   framing (same line as the lightbox). Stories without a video yet
   show a "coming soon" placeholder in the same panel.

   Canvas/IndexedDB code is Lesson 01's (same in-browser sketch canvas +
   per-story IndexedDB record pattern), reused rather than reinvented.
   One record PER STORY (practiceKeyForStory); a story done on paper has
   nothing to save.
============================================================ */
const PRACTICE_DB_NAME = 'fei_scene_drawing_medium_shot_storage';
const PRACTICE_DB_VERSION = 1;
const PRACTICE_STORE_NAME = 'artworks';
const PRACTICE_MAX_EDGE = 1200;
const PRACTICE_JPEG_QUALITY = 0.85;
let _practiceDbPromise = null;
function practiceOpenDB(){
  if (_practiceDbPromise) return _practiceDbPromise;
  _practiceDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(PRACTICE_DB_NAME, PRACTICE_DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PRACTICE_STORE_NAME)) {
        db.createObjectStore(PRACTICE_STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _practiceDbPromise;
}
function practiceCompressCanvas(canvas){
  return new Promise((resolve, reject) => {
    let width = canvas.width, height = canvas.height;
    const longestEdge = Math.max(width, height);
    let source = canvas;
    if (longestEdge > PRACTICE_MAX_EDGE) {
      const scale = PRACTICE_MAX_EDGE / longestEdge;
      const small = document.createElement('canvas');
      small.width = Math.round(width * scale);
      small.height = Math.round(height * scale);
      small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
      source = small;
    }
    source.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', PRACTICE_JPEG_QUALITY);
  });
}
function practiceKeyForStory(storyId){
  return LESSON_DATA.courseId + '_' + storyId;
}
async function practiceSaveArtwork(canvas, key){
  const compressed = await practiceCompressCanvas(canvas);
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readwrite');
    const record = { id: key, blob: compressed, savedAt: Date.now() };
    const req = tx.objectStore(PRACTICE_STORE_NAME).put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function practiceGetArtwork(key){
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readonly');
    const req = tx.objectStore(PRACTICE_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

  fill: { label: 'Fill', icon: '🧱', width: 46, alpha: 0.5 },
  eraser: { label: 'Eraser', icon: '🧽', width: 30, alpha: 1, isEraser: true }
};
let practiceColor = PRACTICE_COLORS[0];
let practiceTool = 'fineliner';
let practiceDrawing = false;
let practiceLast = null;
let _currentStory = null;
let _currentStoryIndex = -1;

function practicePos(canvas, e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function pickPracticeColor(color){
  practiceColor = color;
  document.querySelectorAll('.practice-color-dot').forEach(el => el.classList.toggle('picked', el.dataset.color === color));
}
function pickPracticeTool(tool){
  practiceTool = tool;
  document.querySelectorAll('.practice-style-btn').forEach(el => el.classList.toggle('picked', el.dataset.tool === tool));
}
function clearPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function initPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 225;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvas.onpointerdown = (e) => {
    practiceDrawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    practiceLast = practicePos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!practiceDrawing) return;
    const p = practicePos(canvas, e);
    const tool = PRACTICE_TOOLS[practiceTool] || PRACTICE_TOOLS.fineliner;
    ctx.strokeStyle = tool.isEraser ? PRACTICE_PAPER : practiceColor;
    ctx.globalAlpha = tool.alpha;
    ctx.lineWidth = tool.width * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(practiceLast.x, practiceLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    practiceLast = p;
  };
  canvas.onpointerup = () => { practiceDrawing = false; };
  canvas.onpointercancel = () => { practiceDrawing = false; };
}

/* ============================================================
   MY JOURNEY — round 3. Real component, adapted from lesson-1-
   sphere's openMyJourney/closeMyJourney/renderJourneyContent, reading
   the SAME shared JournalStorage this file already writes to in
   finishLesson() (bare global from core/scene-drawing-platform-
   bridge.js — not a new storage mechanism). JournalStorage.getAll()
   is platform-wide, not scoped to this course, so the stats below
   genuinely aggregate across every course that writes into
   'fei_thinking_journal' — Creation and Foundation together, per
   Faye's own description of what this should show.

   Foundation A's own timeline row assumes every entry carries
   promptText/studentText/inputType/ageGroup (its own reflection-entry
   shape). This lesson's own finishLesson() entry doesn't — and any
   other course's entries may not either — so the row below is
   defensive: it falls back to a synthesized summary instead of
   printing "undefined" for entries that aren't shaped like Foundation
   A's. This isn't cosmetic — it's what a genuinely SHARED cross-
   platform journey view actually needs, not just cover for this one
   lesson's own entries.
============================================================ */
function openMyJourney(){
  renderJourneyModalContent();
  document.getElementById('journeyModalBackdrop').classList.add('show');
}
function closeMyJourney(){
  document.getElementById('journeyModalBackdrop').classList.remove('show');
}
function journeyEscapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function journeyFormatRelativeDate(timestamp){
  const diff = Date.now() - timestamp;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  if (seconds < 60) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
  if (days < 7) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  if (days < 30) return Math.floor(days / 7) + ' week' + (Math.floor(days / 7) > 1 ? 's' : '') + ' ago';
  return new Date(timestamp).toLocaleDateString();
}
// Best-effort summary for entries that don't carry Foundation A's own
// promptText/studentText fields (this lesson's completion entry, or
// any other course's differently-shaped one).
function journeySummarize(e){
  if (e.promptText || e.studentText) {
    return { prompt: e.promptText || '', text: e.studentText || '' };
  }
  if (e.momentKey === 'lesson_complete') {
    const bits = [];
    if (e.storyChoice) bits.push('chose "' + e.storyChoice + '"');
    if (e.sceneChoice) bits.push('chose "' + e.sceneChoice + '"');
    if (Array.isArray(e.checkedConcepts) && e.checkedConcepts.length) bits.push('understood: ' + e.checkedConcepts.join(', '));
    return { prompt: '', text: 'Completed this lesson' + (bits.length ? ' — ' + bits.join('; ') : '') + '.' };
  }
  return { prompt: '', text: 'Saved a moment in this lesson.' };
}
function renderJourneyModalContent(){
  const entries = (typeof JournalStorage !== 'undefined') ? JournalStorage.getAll() : [];
  const statsEl = document.getElementById('journeyStats');
  const timelineEl = document.getElementById('journeyTimeline');

  const totalEntries = entries.length;
  const courseEntries = entries.filter(e => e.courseId === LESSON_DATA.courseId).length;
  const firstEntry = entries[entries.length - 1];
  const daysSinceFirst = firstEntry ? Math.max(1, Math.floor((Date.now() - firstEntry.createdAt) / 86400000)) : 0;
  statsEl.innerHTML = `
    <div class="journey-stat"><div class="journey-stat-number">${totalEntries}</div><div class="journey-stat-label">Thoughts</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${courseEntries}</div><div class="journey-stat-label">This lesson</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${daysSinceFirst}</div><div class="journey-stat-label">Day${daysSinceFirst !== 1 ? 's' : ''} growing</div></div>
  `;

  if (entries.length === 0) {
    timelineEl.innerHTML = `<div class="journey-empty"><div class="journey-empty-icon">💭</div><div>No thoughts yet — your journey starts when you save your first moment.</div></div>`;
    return;
  }
  timelineEl.innerHTML = entries.map(e => {
    const summary = journeySummarize(e);
    return `
      <div class="journey-entry">
        <button class="journey-entry-delete" onclick="deleteJourneyEntry('${e.id}')" title="Delete this thought">🗑</button>
        <div class="journey-entry-meta">
          <span class="journey-entry-lesson">${journeyEscapeHtml(e.lessonId || e.courseId || 'lesson')}</span>
          ${e.momentKey ? `<span class="journey-entry-moment">${journeyEscapeHtml(e.momentKey)}</span>` : ''}
          <span class="journey-entry-date">${journeyFormatRelativeDate(e.createdAt)}</span>
        </div>
        ${summary.prompt ? `<div class="journey-entry-prompt">${journeyEscapeHtml(summary.prompt)}</div>` : ''}
        <div class="journey-entry-text">${journeyEscapeHtml(summary.text)}</div>
      </div>
    `;
  }).join('');
}
function deleteJourneyEntry(entryId){
  if (!confirm('Delete this thought? This cannot be undone.')) return;
  JournalStorage.remove(entryId);
  renderJourneyModalContent();
}

/* ============================================================
   NAVIGATION + RAIL
============================================================ */
function renderRail(){
  const dots = STEPS.map((s, i) => `<span class="rail-dot${i < STATE.stepIndex ? ' done' : ''}${i === STATE.stepIndex ? ' current' : ''}"></span>`).join('');
  document.getElementById('rail').innerHTML = dots;
  // Disabled (not hidden) on Step 1 so the control's position never
  // shifts as the student moves through the lesson.
  document.getElementById('prevStepBtn').disabled = STATE.stepIndex === 0;
}
// Set to whichever step is currently live so renderCurrentStep can
// clean it up before swapping away — needed for Step 2's Three.js
// renderer/requestAnimationFrame loop, which would otherwise keep
// running in the background (a real, growing leak) every time the
// student navigates off Step 2, in either direction.
let _liveStep = null;
function renderCurrentStep(){
  hideContinue();
  if (_liveStep && _liveStep.cleanup) {
    try { _liveStep.cleanup(); } catch (e) { console.warn('[cleanup] failed', e); }
  }
  const step = STEPS[STATE.stepIndex];
  const stageEl = document.getElementById('stage');
  stageEl.innerHTML = `<div class="step">${step.render()}</div>`;
  renderRail();
  window.scrollTo(0, 0);
  _liveStep = step;
  if (step.afterRender) step.afterRender();
}
// Step-transition chime — round 3. Reuses the exact same synthesized-
// tone mechanism Foundation Skill lessons already use for lightweight
// UI feedback (artchiPlayTone, ported verbatim from Foundation A's own
// playTone() in core/scene-drawing-archi.js — no new sound asset).
// 880Hz/0.12s matches that codebase's existing single-ding feedback
// calls (e.g. lesson-1-sphere's own `playTone(880, 0.1)`), not the
// multi-note ascending sequences reserved for bigger celebrations.
// Lives in the shared nav functions below so it covers every lesson-
// level step-to-step move uniformly — Step 1's video and Step 2's
// automatic camera reveal only reach these functions once each
// sequence has already finished on its own, so the chime marks the
// discrete navigation action, never layers over the video's own audio
// or the reveal animation itself.
function playStepAdvanceTone(){
  if (typeof artchiPlayTone === 'function') artchiPlayTone(880, 0.12);
}
function isStepHidden(i){
  const st = STEPS[i];
  return !!(st && st.hiddenWhen && st.hiddenWhen());
}
function nextStep(){
  let t = STATE.stepIndex + 1;
  while (t < STEPS.length - 1 && isStepHidden(t)) t++;
  if (t <= STEPS.length - 1 && STATE.stepIndex < STEPS.length - 1) { playStepAdvanceTone(); STATE.stepIndex = t; renderCurrentStep(); }
}
// Global Previous. Every step is a flat top-level STEPS entry (see
// STORY_SCENE_STEPS's comment), so this is a plain decrement. The
// isStepHidden skip-loop is generic shell infra (shared shape with
// other lessons' STEPS arrays) — nothing in this lesson sets
// hiddenWhen anymore since Round 2 removed the optional story.
function prevStep(){
  let t = STATE.stepIndex - 1;
  while (t > 0 && isStepHidden(t)) t--;
  if (t >= 0 && STATE.stepIndex > 0) { playStepAdvanceTone(); STATE.stepIndex = t; renderCurrentStep(); }
}
function goToStep(i){
  playStepAdvanceTone();
  STATE.stepIndex = Math.max(0, Math.min(STEPS.length - 1, i));
  renderCurrentStep();
}

/* ============================================================
   ARTCHI — mounted lazily, starting at Step 2, NOT on init(). Step 1
   is the full-screen intro video and must stay completely free of
   chrome; showArtchi()'s own first-visit onboarding is a full-
   viewport blocking modal (core/scene-drawing-style.css
   .artchi-onboard-backdrop), so firing it during the video would trap
   the whole lesson behind a popup before the student sees anything —
   caught live in a Playwright pass, not by inspection. Archi's first
   real appearance now lines up with her first bubble line anyway
   (Step 2's "Try stepping back."), matching the brief's "only very
   short moments" instruction.
============================================================ */
let artchiMounted = false;
function ensureArtchiMounted(){
  if (artchiMounted) return;
  artchiMounted = true;
  document.getElementById('artchi-mount').innerHTML = artchiMarkup();
  initArtchiDrag();
  // Reveal only — deliberately NOT calling the shared showArtchi(),
  // which also triggers either a full-screen onboarding modal (first
  // platform visit) or a generic idle bubble a few hundred ms later.
  // Both would collide with this lesson's own deliberate, sparse
  // bubble cues (the brief's "should NOT constantly speak" rule), and
  // the onboarding modal specifically is a full-viewport popup that
  // would block the Learning Canvas mid-interaction — caught live in
  // a Playwright pass, not by inspection. Everything else (markup,
  // drag, bubble, chat) is the same shared component, untouched.
  const character = document.getElementById('artchi-character');
  const label = document.getElementById('artchi-label');
  if (character) character.classList.remove('hidden');
  if (label) label.classList.remove('hidden');
  resetArtchiSleep();
}

init();
</script>
