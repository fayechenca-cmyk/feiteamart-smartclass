<!--
  LIVE LESSON — "Learning Canvas" build of Unit 01 Lesson 04, Close-Up,
  built DIRECTLY on this real path (no -v2 staging — the standing
  simplification from Lesson 02 onward), replacing the original
  13-stage/CameraZoomSlider build, which is archived (not deleted) at
  ../_archive/lesson-04-close-up-original/.

  Same id/courseId ('close-up') as the archived original on purpose —
  core/course-badge-registry.js's scene_drawing_unit_01 badge already
  keys off this exact string. See lesson-data.js's own header note for
  the data-shape reasoning.

  WHAT THIS IS: the same "Learning Canvas" shell as Lessons 01-03
  (full-screen, low-chrome, data-driven off lesson-data.js's
  LESSON_DATA). Top-level STEPS: (1) "What is a Close-Up?" — the
  shared ShotSizeCompare device (../../shared/shot-size-compare.js)
  pushed one stop further than Lesson 03's, ending on the component's
  new 'cu' (Close-Up) stop, then a short written block (the two framing
  lines, the four categories, "not just faces," and the "background
  gets quiet, not gone" principle — see renderCloseupConcept /
  afterRenderCloseupConcept); (2) a two-card intro, then five stories,
  ALL required (no optional/skip story — see Round 2 note below), each
  TWO flat top-level steps: its 3D scene (tip -> "Situation N" reveal ->
  3D scene -> Quick Sketch Reference overlay) and its own drawing round
  (two-panel: the reference video enlarged + the student's canvas, with
  an "I would prefer to work on paper" opt-out — Lessons 01-03's
  practice format); then the community + complete steps.

  Round 2 (Sept 2026, per Faye): she wasn't happy with the 3D scenes'
  visual quality and redrew this lesson's storyboard by hand
  (reference-images/lesson04-close-up-storyboard-reference.png is the
  ORIGINAL v1 sheet these scenes were first built from — kept for
  history, no longer the live reference). Structural change alongside
  the rebuild: "The Crumpled Paper" is cut entirely (she didn't carry it
  forward into her new storyboard), and "Passing a Secret Note" — the
  old optional 6th story — is now the closing 5th, required like every
  other story. The old scene-gate/skip UI and STATE.optionalSkipped
  bookkeeping are removed along with it; nothing in this lesson is
  skippable anymore.

  Every 3D scene keeps a faint trace of its environment (fog + a few
  simple background props — a door panel, a blurred wall, a hallway,
  table legs) behind the close-up subject — Faye's explicit "quieter,
  not gone" rule; see each buildScene* function's own comment for what
  that trace is.

  SCOPE NOTES (flagged, not silently assumed):
  - All five Quick Sketch Reference videos are wired (Sept 2026, see
    lesson-data.js's teacher_references — data-only change, no
    index.html rendering-logic change needed).
  - The community gallery is placeholder-only until real student
    photos are supplied (same data-driven branch as Lessons 01-03).
  - Access control is deliberately NOT gated, matching every other
    Unit 01 lesson's own unresolved free/paid TODO.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a22;
  --ink-soft:rgba(28,26,34,.66);
  --ink-faint:rgba(28,26,34,.42);
  --ink-muted:rgba(28,26,34,.42);
  --accent:#2d5fa8;
  --accent-deep:#1f4076;
  --line:rgba(28,26,34,.14);
  --border:rgba(28,26,34,.14);
  --paper:#faf8f5;
  --purple:#a78bfa;
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:20px;
  /* Round 6 — storyboard/production-panel palette, Step 3 onward only
     (Steps 1-2 keep their current video/colorful-3D treatment; Step 4
     is Faye's own build). Grayscale/off-white and restrained, not the
     platform's blue accent — a deliberate, scoped departure per her
     explicit reference, not a change to the rest of the lesson. */
  --sb-paper:#f2ede0;
  --sb-panel:#faf7ee;
  --sb-ink:#3a352c;
  --sb-ink-soft:rgba(58,53,44,.62);
  --sb-ink-faint:rgba(58,53,44,.4);
  --sb-line:rgba(58,53,44,.3);
  --sb-accent:#8a6a4a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Open Sans',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.display{font-family:'Montserrat',sans-serif;}
button{font-family:inherit;}

/* ============================================================
   LEARNING CANVAS SHELL — minimal chrome, full-viewport stage.
============================================================ */
#canvas-app{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;position:sticky;top:0;z-index:80;
  background:linear-gradient(var(--paper) 70%, transparent);
  pointer-events:none;
}
#topbar > *{pointer-events:auto;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.exit-link{font-size:12px;color:var(--ink-faint);text-decoration:none;font-weight:700;letter-spacing:.2px;transition:color .15s ease;}
.exit-link:hover{color:var(--accent-deep);}
/* Global Previous control — every step needs a visible way back, per
   Faye's explicit round-2 flag ("real problem, not nitpicking"). One
   control in the topbar covers all 8 steps without each step's own
   render() needing to know about navigation. Step 1 gets it disabled,
   not hidden, so its position stays stable across steps. */
.prev-step-btn{
  font-size:12px;color:var(--ink-soft);background:none;border:1.5px solid var(--line);
  border-radius:999px;padding:5px 13px 5px 10px;font-weight:700;letter-spacing:.2px;
  cursor:pointer;display:flex;align-items:center;gap:3px;transition:border-color .15s ease,color .15s ease;
}
.prev-step-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-deep);}
.prev-step-btn:active:not(:disabled){transform:scale(.96);}
.prev-step-btn:disabled{opacity:.32;cursor:default;}
/* My Journey entry point — round 3. The real component (see the
   ported modal further down) is Foundation A's existing My Journey
   (cross-course JournalStorage stats + timeline), reused as-is, not
   rebuilt. Its usual home elsewhere on the platform is a sticky
   side-panel button inside a two-column desktop grid layout — this
   Learning Canvas is deliberately single-column/full-viewport on
   every step (the original brief's own "avoid multi-column content
   during active learning" rule), so retrofitting that grid would
   fight the rest of the design. Placing the same real entry point in
   this topbar instead keeps it "fixed" (the topbar is already
   position:sticky;top:0 on every step) without importing a layout
   that contradicts the lesson's own design language — a judgment
   call, flagged as such in the round-3 report. */
.journey-btn{
  font-size:12px;color:var(--ink-soft);background:none;border:1.5px solid var(--line);
  border-radius:999px;padding:5px 13px;font-weight:700;letter-spacing:.2px;cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:border-color .15s ease,color .15s ease;
}
.journey-btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.journey-btn:active{transform:scale(.96);}
.rail{display:flex;gap:6px;align-items:center;}
/* Narrow viewports: "← Scene Drawing Foundation" + "‹ Previous" +
   "📖 Journey" together wrapped and crowded the topbar — caught in a
   mobile-viewport screenshot pass, not by inspection. Collapse the
   exit link to just its arrow there, and the Journey button to just
   its icon; the Previous control stays full (it's the one Faye
   specifically flagged as a real usability gap). */
@media(max-width:420px){.exit-link-full{display:none;}.journey-btn-full{display:none;}}
.rail-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s ease,transform .2s ease;}
.rail-dot.done{background:var(--accent);}
.rail-dot.current{background:var(--accent-deep);transform:scale(1.5);}

#stage{flex:1;position:relative;display:flex;flex-direction:column;}
.step{
  flex:1;display:flex;flex-direction:column;
  animation:stepIn .5s ease;
}
@keyframes stepIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.step-inner{
  flex:1;width:100%;max-width:760px;margin:0 auto;
  padding:6px 22px 120px;display:flex;flex-direction:column;justify-content:center;
}
.step-inner.wide{max-width:1040px;}
.step-inner.bleed{max-width:none;padding:0 0 120px;}
/* Content-dense steps (e.g. Look Closer's 6-card grid) can be taller
   than the viewport. justify-content:center (the default, right for
   short single-moment steps) makes overflowing content spill equally
   above AND below the fold, so the true bottom padding that's meant
   to clear the fixed continue-dock never actually sits below the
   last visible row on first paint — the dock still overlaps it. Root
   cause found by measuring boundingBoxes, not by eyeballing the
   screenshot alone. flex-start anchors dense content to the top so
   scrolling to the real end also reaches the reserved clearance. */
.step-inner.dense{justify-content:flex-start;}

.step-kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:10px;}
.step-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);text-align:center;margin:0 0 10px;color:var(--accent-deep);}
.step-sub{text-align:center;font-size:14px;color:var(--ink-soft);margin:0 auto 22px;line-height:1.6;max-width:520px;}

/* ---- Continue dock (quiet, floats in only once a step is "done").
   The scrim behind it keeps the button from visually cutting into
   card text on content-dense steps (e.g. Look Closer's 6-card grid)
   when the viewport is shorter than the content — caught in a live
   screenshot, not by inspection. ---- */
.continue-dock{
  position:fixed;left:0;right:0;bottom:0;padding-bottom:clamp(18px,4vh,34px);
  display:flex;justify-content:center;align-items:flex-end;z-index:70;pointer-events:none;
  height:104px;background:linear-gradient(transparent, var(--paper) 62%);
}
.continue-dock:empty{background:none;}
.continue-btn{
  pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity .35s ease,transform .35s ease;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;
  padding:13px 28px;border-radius:999px;border:none;background:var(--accent);color:#fff;
  box-shadow:0 10px 28px rgba(28,26,34,.24);cursor:pointer;
}
.continue-btn.ready{opacity:1;transform:translateY(0);pointer-events:auto;}
.continue-btn:active{transform:scale(.96);}
.continue-btn.ghost{background:transparent;color:var(--ink-faint);box-shadow:none;font-weight:600;font-size:12.5px;}

/* ============================================================
   3D story-scene stage (used by the five Close-Up stories). Ported/
   extended from Lesson 01's equivalent "Discover" 3D stage — same
   full-bleed shell.
============================================================ */
.camera3d-stage{
  position:relative;width:100%;flex:1;min-height:420px;
  overflow:hidden;
  /* Round 3: a real sky gradient instead of a flat fill — the
   * renderer clears to transparent (see afterRenderDiscover) so this
   * shows through behind the scene. Scoped to this Step 2 environment
   * only, not a change to the platform's own restrained palette. */
  background:linear-gradient(180deg,#7cc0e8 0%,#a9dbe6 45%,#e3ddb3 100%);
}
.camera3d-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s ease;}
.camera3d-stage canvas.visible{opacity:1;}
.camera3d-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 30px;font-size:13px;color:var(--ink-soft);
}
/* Term label lives INSIDE the 3D frame, in its lower third — round-1
   put this below the frame with a track underneath it, leaving the
   bottom of the page empty once the track was removed; anchoring it
   low inside the frame itself balances the composition across the
   full height instead of clustering everything near the top. */
.camera3d-term{
  position:absolute;left:50%;bottom:9%;transform:translate(-50%,8px);
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.35rem;
  color:var(--accent-deep);background:rgba(250,248,245,.92);padding:9px 22px;border-radius:999px;
  opacity:0;transition:opacity .6s ease,transform .6s ease;letter-spacing:.4px;white-space:nowrap;
  box-shadow:0 8px 20px rgba(28,26,34,.12);
}
.camera3d-term.show{opacity:1;transform:translate(-50%,0);}
@media(max-width:480px){.camera3d-term{font-size:1.05rem;padding:7px 16px;}}
/* Step 3's six-scene question overlay — same "lives inside the 3D
   frame" convention as .camera3d-term above, anchored to the TOP
   instead (so it never competes with the fixed Continue dock at the
   very bottom of the viewport). Appears once the camera sweep settles. */
.scene-question{
  position:absolute;left:50%;top:5%;transform:translate(-50%,-8px);max-width:88%;
  text-align:center;opacity:0;transition:opacity .6s ease,transform .6s ease;
  background:rgba(250,248,245,.94);border-radius:16px;padding:12px 22px;
  box-shadow:0 8px 20px rgba(28,26,34,.14);
}
.scene-question.show{opacity:1;transform:translate(-50%,0);}
.scene-question-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.scene-question-text{font-size:15px;font-weight:600;color:var(--accent-deep);line-height:1.4;}
.scene-question-alt{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.scene-question-category{font-weight:600;color:var(--ink-soft);text-transform:none;letter-spacing:0;}
.scene-gate-category{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:-6px;}
@media(max-width:480px){.scene-question{top:3%;padding:10px 16px;}.scene-question-text{font-size:13px;}}


/* Step 1 — "What is a Close-Up?" full-screen explanation moment. The
   16:9 stage is capped by viewport height so it never pushes the
   caption/hint below the fold on short screens. */
.concept-moment{align-items:center;justify-content:flex-start;gap:0;padding-top:10px;}
.concept-moment .step-title{margin-bottom:12px;}
.concept-moment-stage{width:min(100%, calc((100vh - 330px) * 16 / 9));min-width:min(100%,320px);margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(28,26,34,.22);}
.concept-moment-fallback{display:flex;flex-direction:column;gap:10px;padding:8px 4px;}
.concept-moment-fallback-row{background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;padding:14px 16px;font-size:15px;color:var(--accent-deep);line-height:1.45;}
.concept-moment-fallback-row span{display:block;font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--sb-accent);margin-bottom:4px;}
.concept-moment-extra{max-width:640px;margin:16px auto 0;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;}
.concept-moment-extra.show{opacity:1;transform:translateY(0);}
.cu-line{font-size:14.5px;color:var(--accent-deep);text-align:center;line-height:1.55;margin-bottom:9px;}
.cu-line-strong{font-weight:700;font-size:16.5px;}
.cu-cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.cu-cat-chip{background:var(--sb-panel,#faf7ee);border:1.5px solid var(--sb-ink,#3a352c);border-radius:10px;padding:8px 13px;text-align:center;min-width:88px;}
.cu-cat-label{display:block;font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--sb-accent,#8a6a4a);margin-bottom:3px;}
.cu-cat-desc{font-size:10.5px;color:var(--sb-ink-soft,rgba(58,53,44,.62));line-height:1.35;}
.cu-note{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.5;max-width:520px;margin:0 auto 6px;}


/* Story drawing round — Quick Sketch Reference (LEFT, its own full
   panel) + the student's canvas (RIGHT), side by side on desktop, stacked
   on narrow viewports. Same format as Lesson 01's practice restructure. */
.step-inner.practice-round{max-width:1180px;justify-content:flex-start;padding-top:2px;}
.practice-story-label{text-align:center;font-size:13px;color:var(--ink-faint);margin-bottom:14px;}
.practice-two-panel{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
@media(max-width:820px){.practice-two-panel{grid-template-columns:1fr;}}
.practice-panel{background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;padding:18px 16px 20px;position:relative;}
.practice-panel-label{font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--sb-accent);text-align:center;margin-bottom:10px;}
.practice-panel-hint{font-size:11.5px;color:var(--sb-ink-soft);text-align:center;line-height:1.5;margin:-2px 0 14px;}
.practice-panel-teacher{padding:14px;}
.practice-two-panel .practice-canvas-wrap{max-width:100%;}
.practice-ref-video{position:relative;aspect-ratio:100/77.13068181818183;background:#000;border-radius:3px;overflow:hidden;}
.practice-ref-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.practice-ref-placeholder{background:var(--sb-paper);border:1.5px dashed var(--sb-ink-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sb-ink-soft);font-size:13px;text-align:center;padding:0 16px;}
.practice-ref-placeholder-icon{font-size:2rem;filter:grayscale(1) contrast(.9);opacity:.7;}
.practice-ref-note{text-align:center;font-size:11.5px;font-style:italic;color:var(--sb-ink-faint);line-height:1.45;margin-top:12px;}
.video-tap-overlay{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;
  padding:16px 30px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(28,26,34,.72);color:#fff;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.video-tap-overlay[hidden]{display:none;}
.prefer-paper-btn{display:block;margin:14px auto 0;background:none;border:none;font-size:12.5px;font-weight:700;color:var(--sb-ink-soft);text-decoration:underline;cursor:pointer;}
.prefer-paper-btn.picked{color:var(--sb-accent);}
.own-work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:600px){.own-work-grid{grid-template-columns:1fr;}}
.own-work-grid .own-work-card{margin-bottom:0;padding:16px 12px;}
.own-work-grid .own-work-img{max-width:100%;}
.own-work-note-card{border-style:dashed;}
.own-work-note{font-size:12px;color:var(--sb-ink-faint);}

/* Round 2 — two-card intro before Situation 1. */
.intro-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:56vh;gap:6px;}
.intro-card-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(1.9rem,6vw,2.9rem);color:var(--accent-deep);}
.intro-card-line{font-size:16px;color:var(--ink-soft);max-width:480px;line-height:1.65;margin:0;}

/* Round 2 — pre-scene reveal: "Situation N" + the situation line,
   both typed out, then a 3-2-1 countdown, all inside the same
   camera3d-stage the scene itself mounts into right after. Sits on
   its own dark scrim so it reads clearly regardless of what the sky
   gradient behind it looks like once the 3D canvas appears. */
.scene-reveal{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:0 24px;background:rgba(28,26,34,.82);
  opacity:1;transition:opacity .5s ease;pointer-events:none;
}
.scene-reveal.hide{opacity:0;}
/* Optional-scene gate (Scene 6): shown BEFORE the reveal chain starts,
   so a tired student can skip cleanly instead of sitting through the
   typewriter/countdown/3D sequence for a scene they don't want. The
   .scene-reveal scrim is pointer-events:none, so the gate re-enables
   them for its own buttons. */
.scene-reveal.gated .scene-reveal-title,.scene-reveal.gated .scene-reveal-line,.scene-reveal.gated .scene-reveal-countdown{display:none;}
.scene-gate{display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:auto;max-width:460px;}
.scene-gate[hidden]{display:none;}
.scene-gate-kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);padding:5px 14px;border-radius:999px;}
.scene-gate-text{font-family:'Montserrat',sans-serif;font-weight:600;font-size:clamp(1.1rem,3.4vw,1.5rem);color:#fff;line-height:1.4;}
.scene-gate-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.scene-gate-btn{font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;padding:12px 24px;border-radius:999px;cursor:pointer;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;}
.scene-gate-btn.primary{background:var(--accent);border-color:var(--accent);}
.scene-gate-btn:active{transform:scale(.96);}
.scene-reveal-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(1.3rem,4.5vw,2rem);color:#fff;letter-spacing:.5px;min-height:1.2em;}
.scene-reveal-line{font-size:clamp(13px,2.6vw,16px);color:rgba(255,255,255,.86);max-width:560px;line-height:1.5;min-height:1.5em;}
.scene-reveal-countdown{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:3.2rem;color:var(--accent);
  min-height:1.3em;
}
.scene-reveal-countdown.pulse{animation:sceneCountdownPulse .7s ease;}
@keyframes sceneCountdownPulse{0%{transform:scale(1.5);opacity:0;}30%{opacity:1;}100%{transform:scale(1);opacity:1;}}

/* Round 3 (Faye's correction — was too small, and read as "the one
   correct answer"): the per-scene reference overlay moved from a
   vertically-centered 72px icon badge to a much bigger bottom-corner
   panel with a real 16:9 preview thumbnail, so a glance at it actually
   shows something rather than a tiny paint icon. Still storyboard-
   panel styled (thin ink border, warm paper, corner ticks) and still
   alternates left/right per scene (round 2's own reasoning: never
   covering the same part of the 3D scene twice in a row) — just
   anchored to the bottom of the frame now instead of mid-height,
   which reads better for a "reference in the corner" than dead center
   on the scene's tallest axis. */
.teacher-overlay{
  position:absolute;bottom:16px;width:clamp(210px,26vw,380px);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;padding:0;cursor:pointer;
  opacity:0;transition:opacity .6s ease,transform .6s ease;pointer-events:none;z-index:4;
}
.teacher-overlay.show{opacity:1;pointer-events:auto;}
.teacher-overlay-left{left:16px;}
.teacher-overlay-right{right:16px;}
.teacher-overlay-frame{
  width:100%;aspect-ratio:16/9;background:var(--sb-panel) center/cover no-repeat;border:1.5px solid var(--sb-ink);border-radius:5px;
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 8px 20px rgba(28,26,34,.28);
}
.teacher-overlay-frame::before,.teacher-overlay-frame::after{content:'';position:absolute;width:12px;height:12px;border-color:rgba(255,255,255,.75);border-style:solid;pointer-events:none;}
.teacher-overlay-frame::before{top:6px;left:6px;border-width:1.5px 0 0 1.5px;}
.teacher-overlay-frame::after{bottom:6px;right:6px;border-width:0 1.5px 1.5px 0;}
/* Play-triangle badge, shown only when the frame has a real video
   thumbnail behind it (.has-video) — signals "tap to watch," not just
   "tap to enlarge a picture." */
.teacher-overlay-frame.has-video::after{content:'▶';border:none;bottom:auto;right:auto;top:50%;left:50%;
  transform:translate(-50%,-50%);width:auto;height:auto;font-size:1.6rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.teacher-overlay-icon{font-size:1.7rem;filter:grayscale(1) contrast(.9);opacity:.7;}
.teacher-overlay-label{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.4px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center;line-height:1.3;}
@media(max-width:600px){.teacher-overlay{width:clamp(150px,44vw,220px);bottom:12px;}.teacher-overlay-label{font-size:11px;}}

/* Round 2 layout, round 3 sizing/content — the lightbox itself now
   actually plays video (was always a static painted-icon placeholder,
   even for scenes that had one) — see openTeacherLightbox. Widened
   from 360px so a 16:9 video actually reads at a real size, not a
   postage stamp. */
.teacher-lightbox-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.teacher-lightbox-backdrop.show{display:flex;}
.teacher-lightbox{background:var(--sb-panel);border-radius:var(--radius-lg);max-width:min(1120px,96vw);width:100%;padding:24px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;}
.teacher-lightbox-frame{
  aspect-ratio:4/3;background:var(--sb-paper);border:1.5px solid var(--sb-ink);border-radius:4px;
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;position:relative;
}
/* Video mode: the frame becomes a plain 16:9 video stage, not the 4:3
   icon box — same override reasoning as Lesson 01's
   .practice-panel-video .video-stage (a fixed aspect-ratio box, no
   competing sizing rules). */
/* Round 4: video width is the smaller of "fill the card" and "whatever
   the real video's width still fits the viewport HEIGHT" (210px
   reserved for the card's own padding/label/disclaimer/backdrop) — so
   it's as big as possible on any screen without the card ever
   overflowing vertically. The 4:3 placeholder frame (used only if a
   video ever fails to load) is capped separately below so it doesn't
   balloon to fill the wider card.
   Sept 2026: aspect ratio + the width-calc multiplier updated from
   16:9 (1.7778) to these videos' real encoded ratio,
   100/77.13068181818183 (=1.2965009208103129) — same fix as Lesson 03. */
.teacher-lightbox-frame.has-video{aspect-ratio:100/77.13068181818183;background:#000;width:min(100%,calc((100vh - 210px) * 1.2965009208103129));margin-left:auto;margin-right:auto;}
.teacher-lightbox-frame:not(.has-video){max-width:560px;margin-left:auto;margin-right:auto;}
/* phones: give the video every pixel — tighter backdrop + card padding (the Stream player has its own fullscreen button for more) */
@media(max-width:600px){.teacher-lightbox-backdrop{padding:8px;}.teacher-lightbox{padding:14px 10px;}}
.teacher-lightbox-frame.has-video iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.teacher-lightbox-video-tap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;
  padding:14px 26px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(28,26,34,.72);color:#fff;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:2;
}
.teacher-lightbox-icon{font-size:2.6rem;filter:grayscale(1) contrast(.9);opacity:.6;}
.teacher-lightbox-label{font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;color:var(--sb-ink);}
.teacher-lightbox-disclaimer{font-size:12.5px;color:var(--sb-ink-soft);line-height:1.5;margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto;}
.teacher-lightbox-note{font-size:12px;color:var(--sb-ink-faint);margin-top:6px;font-style:italic;}

/* ============================================================
   STEP 2 — What Is a Wide Shot? Reuses the .lc-card "small visual
   showroom" card system built for Lesson 01's Step 4 "Look Closer"
   (round 6's warm --sb-* tokens + #sbSketch filter) — here holding
   four placeholder reference cards instead of verified real ones,
   since Faye supplies this lesson's curated art in a later round.
============================================================ */
.concept-contrast{max-width:640px;margin:0 auto 26px;display:flex;flex-direction:column;gap:10px;}
.concept-line{font-size:14px;line-height:1.55;padding:12px 16px;border-radius:10px;border:1.5px solid var(--line);}
.concept-line-label{display:block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px;}
.concept-line-extreme{color:var(--ink-soft);background:rgba(28,26,34,.03);}
.concept-line-extreme .concept-line-label{color:var(--ink-faint);}
.concept-line-wide{color:var(--accent-deep);background:rgba(45,95,168,.06);border-color:rgba(45,95,168,.3);font-weight:600;}
.concept-line-wide .concept-line-label{color:var(--accent);}
.concept-refs-label{text-align:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px;}
.lc-media-placeholder{display:flex;align-items:center;justify-content:center;background:var(--sb-paper);}
.lc-placeholder-icon{font-size:1.8rem;opacity:.35;filter:grayscale(1);}
.lc-card-placeholder{cursor:default;}

.lookcloser-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px;}
@media(max-width:640px){.lookcloser-grid{grid-template-columns:1fr;}}
.lc-subtitle{font-size:13.5px;color:var(--ink-soft);text-align:center;margin:-4px 0 3px;}
.lc-support-line{font-size:12px;color:var(--ink-faint);text-align:center;max-width:520px;margin:0 auto 22px;}
.lc-ending-line{font-size:12.5px;color:var(--ink-faint);text-align:center;font-style:italic;margin:22px auto 0;max-width:480px;}
.lc-card{
  position:relative;background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;
  overflow:hidden;cursor:pointer;
}
.lc-card::before,.lc-card::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--sb-ink-faint);border-style:solid;pointer-events:none;z-index:2;}
.lc-card::before{top:6px;left:6px;border-width:1.5px 0 0 1.5px;}
.lc-card::after{bottom:6px;right:6px;border-width:0 1.5px 1.5px 0;}
.lc-media{display:block;aspect-ratio:16/9;background:var(--sb-paper);}
.lc-media svg,.lc-img{width:100%;height:100%;display:block;object-fit:cover;}
.lc-body{padding:12px 15px 15px;}
.lc-cat{font-size:9.5px;font-weight:800;letter-spacing:1.6px;color:var(--sb-accent);margin-bottom:3px;}
.lc-title{font-family:'Montserrat',sans-serif;font-size:14.5px;font-weight:700;color:var(--sb-ink);line-height:1.3;}
.lc-reveal{max-height:0;opacity:0;overflow:hidden;transition:max-height .28s ease,opacity .22s ease,margin-top .28s ease;}
.lc-card:hover .lc-reveal,.lc-card:focus-within .lc-reveal,.lc-card.revealed .lc-reveal{max-height:96px;opacity:1;margin-top:9px;}
.lc-observation{font-size:12px;color:var(--sb-ink-soft);line-height:1.5;margin-bottom:9px;}
.lc-view-btn{
  display:inline-block;font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  color:var(--sb-panel);background:var(--sb-ink);padding:6px 13px;border-radius:2px;text-decoration:none;
}
.lc-view-btn:hover{background:var(--sb-accent);}
/* In-flow Continue (used by dense/grid steps instead of the fixed
   dock). A fixed dock always overlaps whatever sits at the CURRENT
   viewport bottom on first paint, regardless of how much padding is
   reserved further down the document — reserved space only helps
   once the user has actually scrolled to it. Tuning padding/margins
   under the floating dock could not fix that; an in-flow button that
   is simply part of the document after the last card can't overlap
   anything, at any viewport height. Confirmed by measuring the real
   gap after this change (not just eyeballing a screenshot). */
.step-continue-inline{
  display:block;margin:34px auto 30px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;
  padding:13px 28px;border-radius:999px;border:none;background:var(--accent);color:#fff;
  box-shadow:0 10px 28px rgba(28,26,34,.24);cursor:pointer;
}
.step-continue-inline:active{transform:scale(.96);}

/* ============================================================
   STEP 4 — Choose Your Scene. Same story-card system as Lesson 01's
   Choose Your Story, six cards instead of three — .scene-choice-grid
   below overrides the flex-row layout (fine for 3 cards, cramped for
   6) with a real responsive grid. Thumbnails use SCENE_THUMB_ICON
   (flat colorful icons defined alongside Step 3's scene builders),
   not a 3D re-render per card.
============================================================ */
.story-grid{display:flex;flex-direction:column;gap:14px;}
@media(min-width:700px){.story-grid{flex-direction:row;}}
.scene-choice-grid{display:grid !important;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.scene-choice-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.scene-choice-grid{grid-template-columns:1fr;}}
.story-card{
  flex:1;background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:3px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:3px 4px 0 rgba(58,53,44,.12);
  transition:border-color .15s ease,transform .15s ease;
}
.story-card:hover{border-color:var(--sb-accent);}
.story-thumb{aspect-ratio:16/10;display:block;position:relative;background:var(--sb-paper);}
.story-thumb svg{width:100%;height:100%;display:block;}
.story-thumb::before,.story-thumb::after{content:'';position:absolute;width:13px;height:13px;border-color:var(--sb-ink-faint);border-style:solid;pointer-events:none;}
.story-thumb::before{top:7px;left:7px;border-width:1.3px 0 0 1.3px;}
.story-thumb::after{bottom:7px;right:7px;border-width:0 1.3px 1.3px 0;}
.story-card-body{padding:18px 20px;display:flex;flex-direction:column;flex:1;}
.story-card-title{font-family:'Montserrat',sans-serif;font-weight:600;font-size:1.02rem;line-height:1.4;color:var(--ink);margin-bottom:16px;flex:1;}
.story-choose-btn{
  align-self:flex-start;font-weight:700;font-size:12.5px;padding:9px 18px;border-radius:999px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
}
.story-choose-btn:active{transform:scale(.95);}
.story-card-optional{display:inline-block;vertical-align:middle;margin-left:6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--sb-accent);border:1.5px solid var(--sb-accent);border-radius:999px;padding:2px 8px;}
.story-card.picked{border-color:var(--sb-accent);}
.story-card.picked .story-choose-btn{background:var(--accent);border-color:var(--accent-deep);color:#fff;}

/* ============================================================
   STEP 5 — Guided Drawing (progressive illustration)
============================================================ */
.draw-context{text-align:center;font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
/* Round 6: storyboard panel frame, matching Steps 3/5 — warm paper,
   ink-toned border, quiet corner marks. */
.draw-canvas-wrap{
  position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:4/3;
  border-radius:3px;overflow:hidden;background:var(--sb-paper);border:1.5px solid var(--sb-ink);
  box-shadow:4px 5px 0 rgba(58,53,44,.14);
}
.draw-canvas-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
.draw-canvas-wrap::before,.draw-canvas-wrap::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--sb-ink-faint);border-style:solid;pointer-events:none;z-index:1;}
.draw-canvas-wrap::before{top:9px;left:9px;border-width:1.5px 0 0 1.5px;}
.draw-canvas-wrap::after{bottom:9px;right:9px;border-width:0 1.5px 1.5px 0;}
.dstage{transition:opacity .5s ease;}
.draw-caption{
  text-align:center;font-family:'Montserrat',sans-serif;font-weight:600;font-size:1.05rem;
  color:var(--accent-deep);margin:18px auto 2px;min-height:1.6em;
}
/* Round 2 addition — a short second line explaining the actual
   technique each stage demonstrates (Faye: round 1's stages "didn't
   actually teach anything"). Deliberately smaller/quieter than the
   main caption so it reads as elaboration, not a second headline. */
.draw-teaching-note{
  text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.5;
  max-width:440px;margin:0 auto 6px;
}
.draw-progress{display:flex;justify-content:center;gap:7px;margin-bottom:4px;}
.draw-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.draw-dot.done{background:var(--accent);}
.draw-dot.current{background:var(--accent-deep);transform:scale(1.35);}
.draw-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.draw-btn{
  font-weight:700;font-size:13px;padding:10px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--ink);background:transparent;color:var(--ink);
}
.draw-btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;}
.draw-btn:disabled{opacity:.3;cursor:not-allowed;}
.draw-btn:active{transform:scale(.96);}

/* ---- Round 2 addition: homework/artwork submission. Same in-browser
   sketch-canvas + IndexedDB pattern already used by the live
   lesson-01-extreme-wide-shot and the Kandinsky lesson template
   (openDB/compressCanvas/saveArtwork/listArtworks) — reused, not
   reinvented, per Faye's explicit instruction. Own DB name (see the
   JS comment) so this prototype never writes into the live lesson's
   real student data. ---- */
.practice-tool-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.practice-color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);}
.practice-color-dot.picked{box-shadow:0 0 0 2.5px var(--accent);transform:scale(1.1);}
/* Round 4 addition: stroke-style tool row (fineliner/marker/
   watercolor/fill/eraser), separate from the color row above it. */
.practice-style-btn{
  display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-soft);
  background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;
}
.practice-style-btn.picked{border-color:var(--accent);background:rgba(45,95,168,.08);color:var(--accent-deep);}
.practice-style-btn:active{transform:scale(.96);}
/* Round 4: substantially larger — round 2/3's 420px cap left barely
   any room to draw on desktop, per Faye's explicit correction. */
.practice-canvas-wrap{
  width:100%;max-width:720px;aspect-ratio:4/3;margin:0 auto 10px;border-radius:14px;overflow:hidden;
  border:2px solid var(--ink);box-shadow:5px 6px 0 rgba(28,26,34,.12);touch-action:none;background:var(--paper);
}
.practice-canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair;}
.practice-clear-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;}
.practice-saved-note{text-align:center;font-size:12.5px;color:var(--accent-deep);font-weight:700;margin-top:10px;}

/* ============================================================
   STEP 6 — Artwork Community. Same storyboard/production-panel card
   treatment as Lesson 01's equivalent (Compare) — warm paper, ink-
   toned dashed border reading as "placeholder." The Teacher/Quick-
   Sketch-Reference card that used to sit here is gone as of round 2 —
   moved to the per-scene overlay in Step 3 (renderTeacherOverlay) —
   see this file's header for why. compare-grid-single (still used
   below) predates that move; kept as-is since nothing currently needs
   a second grid column here, not because a reference card still
   belongs in it.
============================================================ */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
@media(max-width:480px){.compare-grid{grid-template-columns:1fr;}}
.compare-grid-single{grid-template-columns:1fr;max-width:280px;margin-left:auto;margin-right:auto;}
.compare-card{background:var(--sb-panel);border:1.5px dashed var(--sb-ink-faint);border-radius:4px;padding:26px 16px;text-align:center;}
.compare-card-icon{font-size:1.8rem;filter:grayscale(1) contrast(.9);opacity:.75;}
.compare-card-label{font-family:'Montserrat',sans-serif;font-weight:700;font-size:.95rem;color:var(--sb-ink);margin-top:8px;}
.compare-card-note{font-size:11px;color:var(--sb-ink-faint);margin-top:4px;}
.compare-message{text-align:center;font-family:'Montserrat',sans-serif;font-weight:600;font-size:1.05rem;color:var(--accent-deep);margin:26px auto 32px;max-width:420px;line-height:1.5;}

/* ---- Round 2 addition: "your own reference" card (shows the saved
   Step 6 practice drawing if there is one, otherwise an upload
   placeholder), and a community-gallery placeholder section below —
   see lesson-data.js's community_gallery field and the file header
   for what's real vs. placeholder here. Round 5: wrapped both in a
   shared "Our Community" section — per Faye's explicit correction,
   this should read as "my work + my classmates' work, together,"
   not a private result screen. ---- */
.community-section{margin-top:8px;padding-top:26px;border-top:1.5px solid var(--sb-line);}
.community-kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:700;margin-bottom:8px;}
.community-lead{font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.55;max-width:420px;margin:0 auto 18px;}
.own-work-card{background:var(--sb-panel);border:1.5px solid var(--sb-ink);border-radius:4px;padding:20px 16px;text-align:center;margin-bottom:8px;}
.own-work-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:.92rem;color:var(--sb-ink);margin-bottom:12px;}
.own-work-img{max-width:220px;width:100%;border-radius:2px;border:1.5px solid var(--sb-ink-faint);display:block;margin:0 auto;}
.upload-dropzone{
  /* <label> is inline by default — its dashed border fragmented into a
     stray strip cutting through the text instead of boxing the whole
     card. Block fixes it. */
  display:block;
  border:1.5px dashed var(--sb-ink-faint);border-radius:4px;padding:22px 16px;cursor:pointer;
  transition:border-color .15s ease;position:relative;background:var(--sb-paper);
}
.upload-dropzone:hover{border-color:var(--sb-accent);}
.upload-dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-dropzone-icon{font-size:1.6rem;filter:grayscale(1);opacity:.7;}
.upload-dropzone-label{font-size:12px;color:var(--sb-ink-soft);margin-top:6px;}
.gallery-section{margin-top:22px;}
.gallery-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.05rem;color:var(--sb-ink);text-align:center;margin-bottom:4px;}
.gallery-subtitle{font-size:12px;color:var(--sb-ink-faint);text-align:center;margin-bottom:16px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
@media(max-width:600px){.gallery-grid{grid-template-columns:1fr 1fr;}}
.gallery-card{
  aspect-ratio:1;background:repeating-linear-gradient(135deg,var(--sb-panel),var(--sb-panel) 8px,var(--sb-paper) 8px,var(--sb-paper) 16px);
  border-radius:4px;border:1.5px dashed var(--sb-ink-faint);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--sb-ink-faint);filter:grayscale(1);opacity:.85;
}
/* Real student work (gallery.items) — same thin-ink-border framing as
   Lesson 01's .gallery-photo-card, but 4:3 + object-fit:contain instead
   of a square crop: these are landscape sketchbook pages (about 1.75:1
   and 1.3:1), and a square cover-crop would cut off whole panels of the
   drawing. Contain shows the full page on the paper-colored card. */
.gallery-photo-card{
  aspect-ratio:4/3;border-radius:4px;border:1.5px solid var(--sb-ink);overflow:hidden;background:var(--sb-paper);
}
.gallery-photo-card img{width:100%;height:100%;object-fit:contain;display:block;}
.gallery-photo-item{margin:0;}
.gallery-credit{font-size:12px;font-weight:700;color:var(--sb-ink-soft);text-align:center;margin-top:6px;}

/* ============================================================
   STEP 7 — Complete
============================================================ */
.check-chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 4px;}
.check-chip{
  font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;
  border:2px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .15s ease;
}
.check-chip.picked{border-color:var(--accent);background:rgba(45,95,168,.08);color:var(--accent-deep);}
.complete-btn{
  display:block;margin:26px auto 0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;
  padding:14px 30px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 10px 26px rgba(28,26,34,.2);
}

.artchi-mascot{position:fixed;right:18px;bottom:18px;width:64px;height:64px;cursor:grab;z-index:60;user-select:none;transition:transform .3s;filter:drop-shadow(0 6px 20px rgba(167,139,250,.45));}

.artchi-mascot.excited{animation:artchiBounce .6s ease-in-out 3;}
.artchi-mascot.sleep .artchi-eye{transform:scaleY(.1);transform-origin:center;}
.artchi-mascot.sleep::after{content:'z';position:absolute;top:-4px;right:-6px;font-size:16px;color:var(--ink-muted);font-weight:900;animation:artchiZzz 2s ease-in-out infinite;font-style:italic;font-family:'Montserrat',sans-serif;}

@keyframes artchiBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes artchiBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-13px) rotate(-5deg);}}
@keyframes artchiZzz{0%,100%{opacity:0;transform:translateY(0);}50%{opacity:1;transform:translateY(-6px);}}
/* pointer-events:none on the bubble itself — found live: its fixed
   position (right:20px; bottom:96px, taller once text wraps) reaches
   up over the right portion of Step 2's drag track, and being a real

<script>
/* ============================================================
   STEP LIST — generic dispatcher. Each entry's render() returns
   the step's HTML; afterRender() (optional) wires up interaction
   once that HTML is in the DOM. Nothing here is Lesson-01-specific
   beyond which render functions are plugged in — the shell itself
   (topbar, rail, continue dock, transitions) has no lesson content
   baked in, so Lessons 02-26 can reuse it with a different STEPS
   array and a different lesson-data.js.
============================================================ */
// Each story is TWO flat top-level entries: its scene (tip -> reveal ->
// 3D -> Quick Sketch Reference overlay) and then its own drawing round
// (scene_<id>, draw_<id>). Flat entries — not sub-stage state — keep the
// plain stepIndex++/-- correct everywhere (the Previous-navigation bug
// class Lesson 01's round 5 hit needs a step tracking its own sub-stages;
// this never does). STORY_SCENE_STEPS builds them from
// LESSON_DATA.story_scenes + SCENE3D_BUILDERS so the two stay in sync.
const STORY_SCENE_STEPS = LESSON_DATA.story_scenes.flatMap((s, i) => [
  {
    id: 'scene_' + s.id,
    render: () => renderStoryScene(s, i),
    afterRender: () => afterRenderStoryScene(s, i),
    cleanup: cleanupStoryScene
  },
  {
    id: 'draw_' + s.id,
    render: () => renderStoryDraw(s, i),
    afterRender: () => afterRenderStoryDraw(s, i)
  }
]);
const EXTREME_STEPS = CloseupVisuals.comparisons.flatMap((story, i) => [
 { id:'compare_'+story.id, render:()=>CloseupVisuals.compare(i), afterRender:()=>{CloseupVisuals.mountComparison(i);showContinue('Draw this detail →',nextStep)} },
 { id:'draw_'+story.id, render:()=>renderStoryDraw(story,i+5), afterRender:()=>afterRenderStoryDraw(story,i+5) }
]);
const STEPS = [
  { id:'closeup_concept',    render:renderCloseupConcept,       afterRender:afterRenderCloseupConcept, cleanup:cleanupCloseupConcept },
  { id:'scenes_intro_title', render:renderScenesIntroTitle,     afterRender:afterRenderScenesIntroTitle },
  { id:'scenes_intro_explain', render:renderScenesIntroExplain, afterRender:afterRenderScenesIntroExplain },
  ...STORY_SCENE_STEPS,
  ...EXTREME_STEPS,
  { id:'artwork_community',  render:renderTeacherCommunity,     afterRender:afterRenderTeacherCommunity },
  { id:'complete',           render:renderComplete }
];

let STATE = {
  stepIndex: 0,
  storyResults: [],        // per story index: 'digital' | 'paper' | undefined (not resolved)
  checkedConcepts: [],
  lessonSaved: false
};

/* ============================================================
   SHARED HELPERS
============================================================ */
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function clamp01(n){ return Math.max(0, Math.min(1, n)); }

function showContinue(label, onClick, opts){
  const dock = document.getElementById('continueDock');
  opts = opts || {};
  dock.innerHTML = `<button class="continue-btn${opts.ghost ? ' ghost' : ''}" id="continueBtn">${label}</button>`;
  const btn = document.getElementById('continueBtn');
  btn.onclick = onClick;
  requestAnimationFrame(() => btn.classList.add('ready'));
}
function hideContinue(){
  document.getElementById('continueDock').innerHTML = '';
}

/* ============================================================
   PROFILE / XP — direct sessionStorage read-write, matching the
   live sibling lesson's own bumpXP/markLessonComplete exactly (the
   real, verified fei_user_profile convention — sessionStorage, not
   localStorage; see that file's own comment on the Safari-iframe fix
   this depends on). core/scene-drawing-platform-bridge.js's
   SceneDrawingProfileBridge uses localStorage instead and is NOT the
   convention actually used by any live lesson page, so it is
   deliberately not used here for profile/XP — only for JournalStorage.
============================================================ */
function bumpXP(amount){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return;
    const profile = JSON.parse(raw);
    profile.totalXP = (profile.totalXP || 0) + amount;
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[bumpXP] failed', e); }
}
function markLessonComplete(){
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    if (!raw) return;
    const profile = JSON.parse(raw);
    profile.completedLessons = Array.isArray(profile.completedLessons) ? profile.completedLessons : [];
    if (!profile.completedLessons.includes(LESSON_DATA.courseId)) {
      profile.completedLessons.push(LESSON_DATA.courseId);
    }
    ['close-up-and-extreme-close-up','close-up','extreme-close-up'].forEach(id=>{if(!profile.completedLessons.includes(id))profile.completedLessons.push(id)});
    sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
  } catch (e) { console.warn('[markLessonComplete] failed', e); }
}

/* ============================================================
   SHARED 3D TOOLKIT — primitives, an articulated character builder
   (head/torso/2-segment posed limbs — a real step up from Lesson 01's
   abstract cloak-silhouette character, per this lesson's brief), a
   generic mount/cleanup stage helper, and common classroom/outdoor
   props. Used by all five story scene builds (SCENE3D_BUILDERS, further
   down) — written once here so the scenes share one consistent toolkit
   and visual language instead of five bespoke ad-hoc ones.
============================================================ */
function box3(w, h, d, color, opts) {
  opts = opts || {};
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: opts.roughness != null ? opts.roughness : 0.85, metalness: opts.metalness || 0 }));
}
function cyl3(rTop, rBottom, h, color, segments) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, h, segments || 12), new THREE.MeshStandardMaterial({ color: color, roughness: 0.82 }));
}
function cone3(r, h, color, segments) {
  return new THREE.Mesh(new THREE.ConeGeometry(r, h, segments || 16), new THREE.MeshStandardMaterial({ color: color, roughness: 0.82 }));
}
function sphere3(r, color, wSeg, hSeg) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, wSeg || 16, hSeg || 12), new THREE.MeshStandardMaterial({ color: color, roughness: 0.65 }));
}
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// Articulated kid character — head/torso on a hip root, two shoulder-
// pivoted arms (upper + forearm) and two hip-pivoted legs (thigh +
// shin), simple hair cap, optional ponytail/backpack. Every joint is
// a named THREE.Group pivot (see userData.parts) so poseKid() below
// can pose the SAME rig completely differently per scene (running,
// waving, crouching, pointing, sitting...) by rotating pivots, rather
// than needing separate bespoke geometry for every pose.
function buildKid(opts) {
  opts = opts || {};
  const skin = opts.skin || 0xf0c49a;
  const hair = opts.hair || 0x4a3527;
  const shirt = opts.shirt || 0xe8654a;
  const pants = opts.pants || 0x3568c9;
  const shoe = opts.shoe || 0x2c2c2c;
  const g = new THREE.Group();

  const hip = new THREE.Group();
  hip.position.y = 0.52;
  g.add(hip);

  const torso = box3(0.32, 0.38, 0.19, shirt, { roughness: 0.75 });
  torso.position.y = 0.22;
  hip.add(torso);

  const headGroup = new THREE.Group();
  headGroup.position.y = 0.53;
  hip.add(headGroup);
  const head = sphere3(0.15, skin, 20, 16);
  headGroup.add(head);
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.156, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62),
    new THREE.MeshStandardMaterial({ color: hair, roughness: 0.9 })
  );
  hairCap.position.y = 0.03;
  headGroup.add(hairCap);
  // Round 2 — simple facial features (eyes, nose, mouth), per Faye's
  // "faces read as blank shapes" note. Positioned on the front (+Z,
  // this rig's established forward direction) of the head sphere;
  // simple primitives, not modeled geometry — legible at the small
  // sizes these characters render at, not meant to hold up in a
  // close-up.
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2a2420, roughness: 0.5 });
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), eyeMat);
  eyeL.position.set(-0.055, 0.02, 0.134);
  headGroup.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.055;
  headGroup.add(eyeR);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 6), new THREE.MeshStandardMaterial({ color: skin, roughness: 0.6 }));
  nose.position.set(0, -0.015, 0.148);
  headGroup.add(nose);
  const mouth = new THREE.Mesh(
    new THREE.TorusGeometry(0.026, 0.007, 6, 8, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x9c4a3c, roughness: 0.6 })
  );
  mouth.rotation.z = Math.PI; // opens downward — reads as a small smile
  mouth.position.set(0, -0.06, 0.128);
  headGroup.add(mouth);
  if (opts.ponytail) {
    const pt = cyl3(0.03, 0.05, 0.22, hair);
    pt.position.set(0, 0, -0.16);
    pt.rotation.x = 0.6;
    headGroup.add(pt);
  }

  function buildArm(side) {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.19, 0.38, 0);
    const sleeve = cyl3(0.055, 0.05, 0.1, shirt);
    sleeve.position.y = -0.03;
    shoulder.add(sleeve);
    const upper = cyl3(0.045, 0.04, 0.22, skin);
    upper.position.y = -0.11;
    shoulder.add(upper);
    const elbow = new THREE.Group();
    elbow.position.y = -0.22;
    shoulder.add(elbow);
    const fore = cyl3(0.038, 0.032, 0.2, skin);
    fore.position.y = -0.1;
    elbow.add(fore);
    const hand = sphere3(0.045, skin, 10, 8);
    hand.position.y = -0.21;
    elbow.add(hand);
    hip.add(shoulder);
    return { shoulder: shoulder, elbow: elbow, hand: hand };
  }
  const armL = buildArm(-1), armR = buildArm(1);

  function buildLeg(side) {
    const thighPivot = new THREE.Group();
    thighPivot.position.set(side * 0.09, 0, 0);
    const thigh = cyl3(0.05, 0.045, 0.24, pants);
    thigh.position.y = -0.12;
    thighPivot.add(thigh);
    const kneePivot = new THREE.Group();
    kneePivot.position.y = -0.24;
    thighPivot.add(kneePivot);
    const shin = cyl3(0.042, 0.035, 0.22, pants);
    shin.position.y = -0.11;
    kneePivot.add(shin);
    const shoeM = box3(0.07, 0.045, 0.12, shoe);
    shoeM.position.set(0, -0.24, 0.025);
    kneePivot.add(shoeM);
    hip.add(thighPivot);
    return { thighPivot: thighPivot, kneePivot: kneePivot };
  }
  const legL = buildLeg(-1), legR = buildLeg(1);

  let backpack = null;
  if (opts.backpack) {
    backpack = box3(0.24, 0.28, 0.12, opts.backpack, { roughness: 0.8 });
    backpack.position.set(0, 0.24, -0.155);
    hip.add(backpack);
  }
  let heldProp = null;
  if (opts.heldPropBuilder) {
    heldProp = opts.heldPropBuilder();
    armR.hand.add(heldProp);
  }

  g.userData.parts = { hip: hip, headGroup: headGroup, armL: armL, armR: armR, legL: legL, legR: legR, torso: torso, backpack: backpack, heldProp: heldProp };
  return g;
}
// Applies a pose config (radians, or a crouch height in world units)
// to a buildKid() group's named pivots — poses are just numbers, not
// separate geometry, so every scene reuses the identical rig.
function poseKid(kid, pose) {
  pose = pose || {};
  const p = kid.userData.parts;
  if (pose.headTurn != null) p.headGroup.rotation.y = pose.headTurn;
  if (pose.headTilt != null) p.headGroup.rotation.x = pose.headTilt;
  if (pose.lean != null) p.hip.rotation.x = pose.lean;
  if (pose.turn != null) kid.rotation.y = pose.turn;
  if (pose.crouch) kid.position.y -= pose.crouch;
  if (pose.armL) {
    if (pose.armL.shoulder != null) p.armL.shoulder.rotation.x = pose.armL.shoulder;
    if (pose.armL.shoulderZ != null) p.armL.shoulder.rotation.z = pose.armL.shoulderZ;
    if (pose.armL.elbow != null) p.armL.elbow.rotation.x = pose.armL.elbow;
  }
  if (pose.armR) {
    if (pose.armR.shoulder != null) p.armR.shoulder.rotation.x = pose.armR.shoulder;
    if (pose.armR.shoulderZ != null) p.armR.shoulder.rotation.z = pose.armR.shoulderZ;
    if (pose.armR.elbow != null) p.armR.elbow.rotation.x = pose.armR.elbow;
  }
  if (pose.legL) {
    if (pose.legL.thigh != null) p.legL.thighPivot.rotation.x = pose.legL.thigh;
    if (pose.legL.knee != null) p.legL.kneePivot.rotation.x = pose.legL.knee;
  }
  if (pose.legR) {
    if (pose.legR.thigh != null) p.legR.thighPivot.rotation.x = pose.legR.thigh;
    if (pose.legR.knee != null) p.legR.kneePivot.rotation.x = pose.legR.knee;
  }
}

function buildTextSign(text, w, h, opts) {
  opts = opts || {};
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = Math.round(512 * (h / w));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = opts.bg || '#f5f2ea';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = opts.border || '#8a5a3c';
  ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
  ctx.fillStyle = opts.color || '#3a352c';
  ctx.font = `bold ${Math.round(canvas.height * 0.34)}px 'Montserrat', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding; // r128 API — newer THREE.SRGBColorSpace doesn't exist on this pinned version
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: texture }));
  return mesh;
}

// Generic mount: creates the renderer/scene/camera/lights + render
// loop + resize handling for one boxed 3D stage. Callers populate
// stage.scene with their own props/characters and animate stage.camera
// themselves; _active3DStage/cleanupActive3DStage() (above) handle
// teardown uniformly across all seven 3D steps.
function createThreeStage(stageEl) {
  const canvas = document.createElement('canvas');
  stageEl.insertBefore(canvas, stageEl.firstChild);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 300);
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.0);
  sun.position.set(-8, 18, 10);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xdce8f8, 0.32);
  fill.position.set(10, 8, -6);
  scene.add(fill);
  const state = { alive: true };
  function resize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);
  let rafId = null;
  function loop() {
    if (!state.alive) return;
    renderer.render(scene, camera);
    rafId = requestAnimationFrame(loop);
  }
  loop();
  requestAnimationFrame(() => canvas.classList.add('visible'));
  return {
    canvas: canvas, renderer: renderer, scene: scene, camera: camera, state: state,
    cleanup() {
      state.alive = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      renderer.dispose();
    }
  };
}
// Generic camera tween — from one position/lookAt pair to another,
// eased, over durationMs. Used for both Step 1's settle-in dolly and
// Step 3 scenes' camera sweeps.
function animateCameraTo(stage, fromPos, toPos, fromLook, toLook, durationMs, onDone) {
  const start = performance.now();
  function step(now) {
    if (!stage.state.alive) return;
    const t = clamp01((now - start) / durationMs);
    const e = easeInOutCubic(t);
    stage.camera.position.set(lerp(fromPos.x, toPos.x, e), lerp(fromPos.y, toPos.y, e), lerp(fromPos.z, toPos.z, e));
    const lx = lerp(fromLook.x, toLook.x, e), ly = lerp(fromLook.y, toLook.y, e), lz = lerp(fromLook.z, toLook.z, e);
    stage.camera.lookAt(lx, ly, lz);
    if (t < 1) requestAnimationFrame(step); else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}
// Drop-in assembly animation, same pattern as Lesson 01's discover
// step — objects fall gently into their final Y position, staggered.
function dropIn3(stage, obj, delayMs, durationMs) {
  const finalY = obj.userData.finalY || 0;
  obj.position.y = finalY + 4;
  obj.visible = true;
  setTimeout(() => {
    const start = performance.now();
    function step(now) {
      const t = clamp01((now - start) / durationMs);
      obj.position.y = lerp(finalY + 4, finalY, easeOutCubic(t));
      if (t < 1 && stage.state.alive) requestAnimationFrame(step); else obj.position.y = finalY;
    }
    requestAnimationFrame(step);
  }, delayMs);
}

     3. cleanupStoryScene (not just cleanupActive3DStage) as this
        step's cleanup — see that function's own comment on why the

function typewriterInto(el, text, speed, timers, onDone){
  el.textContent = '';
  let i = 0;
  function tick(){
    if (i >= text.length) { if (onDone) onDone(); return; }
    el.textContent += text.charAt(i);
    i++;
    timers.push(setTimeout(tick, speed));
  }
  tick();
}
// Same 5-4-3-2-1 at 1000ms as Lesson 01's runPracticeCountdown — Faye found
// 3 seconds wasn't enough time to actually read the storyline there, and
// the same applies here; one countdown feel across the lessons.
function runRevealCountdown(el, timers, onDone){
  const seq = ['5', '4', '3', '2', '1'];
  let i = 0;
  function tick(){
    if (i >= seq.length) { onDone(); return; }
    el.textContent = seq[i];
    el.classList.remove('pulse');
    void el.offsetWidth; // restart the CSS animation
    el.classList.add('pulse');
    i++;
    timers.push(setTimeout(tick, 1000));
  }
  tick();
}
// Synthesized "suspense/drumroll" cue — a rising triangle-wave tone
// with a fast tremolo (a second oscillator modulating the main gain),
// not a recorded sound effect asset. Best-effort: some browsers block
// AudioContext before any gesture on the page, or a user may have
// audio disabled entirely — either way this never blocks the reveal
// sequence itself, it just plays silently-failed.
let _sceneAudioCtx = null;
function getSceneAudioCtx(){
  if (_sceneAudioCtx) return _sceneAudioCtx;
  try { _sceneAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return null; }
  return _sceneAudioCtx;
}
function playSuspenseSound(durationMs){
  const ctx = getSceneAudioCtx();
  if (!ctx) return;
  try {
    const now = ctx.currentTime, dur = durationMs / 1000;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.linearRampToValueAtTime(210, now + dur);
    const mainGain = ctx.createGain();
    mainGain.gain.setValueAtTime(0.0001, now);
    mainGain.gain.linearRampToValueAtTime(0.05, now + 0.25);
    mainGain.gain.setValueAtTime(0.05, now + Math.max(0.25, dur - 0.25));
    mainGain.gain.linearRampToValueAtTime(0.0001, now + dur);
    const tremolo = ctx.createOscillator();
    tremolo.frequency.setValueAtTime(11, now); // ~11Hz flutter reads as a drumroll
    const tremGain = ctx.createGain();
    tremGain.gain.setValueAtTime(0.5, now);
    tremolo.connect(tremGain);
    tremGain.connect(mainGain.gain);
    osc.connect(mainGain);
    mainGain.connect(ctx.destination);
    osc.start(now); tremolo.start(now);
    osc.stop(now + dur + 0.1); tremolo.stop(now + dur + 0.1);
  } catch (e) { console.warn('[playSuspenseSound] failed', e); }
}

function attachTeacherRefVideo(streamId, frameId, tapId){
  frameId = frameId || 'teacherLightboxVideoFrame';
  tapId = tapId || 'teacherLightboxVideoTap';
  const sdk = document.createElement('script');
  sdk.src = 'https://embed.cloudflarestream.com/embed/sdk.latest.js';
  sdk.onload = () => {
    try {
      const iframe = document.getElementById(frameId);
      const player = window.Stream && iframe ? window.Stream(iframe) : null;

      let started = false;
      player.addEventListener('play', () => {
        started = true;
        const overlay = document.getElementById(tapId);
        if (overlay) overlay.hidden = true;
      });
      setTimeout(() => {
        if (started) return;
        const overlay = document.getElementById(tapId);
        if (!overlay) return;
        overlay.hidden = false;
        overlay.onclick = () => {
          try { player.muted = false; } catch (e) { /* best-effort */ }
          const playResult = player.play();
          if (playResult && playResult.catch) playResult.catch((e) => console.warn('[teacher_ref_video] play() failed', e));

        };

    } catch (e) {

============================================================ */
const PRACTICE_DB_NAME = 'fei_scene_drawing_medium_shot_storage';
const PRACTICE_DB_VERSION = 1;
const PRACTICE_STORE_NAME = 'artworks';
const PRACTICE_MAX_EDGE = 1200;
const PRACTICE_JPEG_QUALITY = 0.85;
let _practiceDbPromise = null;
function practiceOpenDB(){
  if (_practiceDbPromise) return _practiceDbPromise;
  _practiceDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(PRACTICE_DB_NAME, PRACTICE_DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PRACTICE_STORE_NAME)) {
        db.createObjectStore(PRACTICE_STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _practiceDbPromise;
}
function practiceCompressCanvas(canvas){
  return new Promise((resolve, reject) => {
    let width = canvas.width, height = canvas.height;
    const longestEdge = Math.max(width, height);
    let source = canvas;
    if (longestEdge > PRACTICE_MAX_EDGE) {
      const scale = PRACTICE_MAX_EDGE / longestEdge;
      const small = document.createElement('canvas');
      small.width = Math.round(width * scale);
      small.height = Math.round(height * scale);
      small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
      source = small;
    }
    source.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', PRACTICE_JPEG_QUALITY);
  });
}
function practiceKeyForStory(storyId){
  return LESSON_DATA.courseId + '_' + storyId;
}
async function practiceSaveArtwork(canvas, key){
  const compressed = await practiceCompressCanvas(canvas);
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readwrite');
    const record = { id: key, blob: compressed, savedAt: Date.now() };
    const req = tx.objectStore(PRACTICE_STORE_NAME).put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function practiceGetArtwork(key){
  const db = await practiceOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PRACTICE_STORE_NAME, 'readonly');
    const req = tx.objectStore(PRACTICE_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

const PRACTICE_COLORS = ['#4b473d', '#2d5fa8', '#8a6a4a', '#5b7a96', '#3a3a34'];
const PRACTICE_PAPER = '#faf8f5';
// Eraser paints the paper colour (not destination-out): the canvas is
// compressed to JPEG for storage, which has no alpha channel.
const PRACTICE_TOOLS = {
  fineliner: { label: 'Fineliner', icon: '✒️', width: 2, alpha: 1 },
  marker: { label: 'Marker', icon: '🖊️', width: 8, alpha: 0.88 },
  watercolor: { label: 'Watercolor', icon: '🖌️', width: 20, alpha: 0.24 },
  fill: { label: 'Fill', icon: '🧱', width: 46, alpha: 0.5 },
  eraser: { label: 'Eraser', icon: '🧽', width: 30, alpha: 1, isEraser: true }
};
let practiceColor = PRACTICE_COLORS[0];
let practiceTool = 'fineliner';
let practiceDrawing = false;
let practiceLast = null;
let _currentStory = null;
let _currentStoryIndex = -1;

function practicePos(canvas, e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function pickPracticeColor(color){
  practiceColor = color;
  document.querySelectorAll('.practice-color-dot').forEach(el => el.classList.toggle('picked', el.dataset.color === color));
}
function pickPracticeTool(tool){
  practiceTool = tool;
  document.querySelectorAll('.practice-style-btn').forEach(el => el.classList.toggle('picked', el.dataset.tool === tool));
}
function clearPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function initPracticeCanvas(){
  const canvas = document.getElementById('practiceCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 225;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PRACTICE_PAPER;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvas.onpointerdown = (e) => {
    practiceDrawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    practiceLast = practicePos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!practiceDrawing) return;
    const p = practicePos(canvas, e);
    const tool = PRACTICE_TOOLS[practiceTool] || PRACTICE_TOOLS.fineliner;
    ctx.strokeStyle = tool.isEraser ? PRACTICE_PAPER : practiceColor;
    ctx.globalAlpha = tool.alpha;
    ctx.lineWidth = tool.width * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(practiceLast.x, practiceLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    practiceLast = p;
  };
  canvas.onpointerup = () => { practiceDrawing = false; };
  canvas.onpointercancel = () => { practiceDrawing = false; };
}
