        <div class="practice-panel practice-panel-teacher">
          <div class="practice-panel-label">${story.crop ? "Same story · One detail" : "Quick Sketch Reference"}</div>
          <div class="practice-panel-hint">A fast idea sketch, not a formal tutorial — you can sketch quickly too, digitally or on paper.</div>
          ${refInner}
          <div class="practice-ref-note">This is just one reference — there are many possible ways to draw this scene.</div>
          ${typeof ShotSizeTips !== 'undefined' ? ShotSizeTips.html({ current: story.crop ? 'ecu' : 'cu' }) : ''}
        </div>
        <div class="practice-panel practice-panel-student" id="practiceStudentPanel">
          <div class="practice-panel-label">Your Turn</div>
          <div class="practice-canvas-wrap"><canvas id="practiceCanvas"></canvas></div>
          <div class="practice-tool-row">${tools}</div>
          <div class="practice-tool-row">${colors}</div>
          <div class="draw-controls">
            <button class="draw-btn" onclick="clearPracticeCanvas()">Clear</button>
            <button class="draw-btn primary" id="practiceSaveBtn" onclick="savePracticeDrawingForStory()">Save My Drawing</button>
          </div>
          <button class="prefer-paper-btn" id="preferPaperBtn" onclick="choosePreferPaper()">I would prefer to work on paper</button>
          <div class="practice-saved-note" id="practiceSavedNote"></div>
        </div>
      </div>
    </div>
  `;
}
function afterRenderStoryDraw(story, i){
  _currentStory = story;
  _currentStoryIndex = i;
  practiceColor = PRACTICE_COLORS[0];
  practiceTool = 'fineliner';
  const ref = LESSON_DATA.teacher_references.find(r => r.sceneId === story.id);
  if (ref && ref.demoVideoStreamId) attachTeacherRefVideo(ref.demoVideoStreamId, 'storyRefVideoFrame', 'storyRefVideoTap');
  initPracticeCanvas();
  const result = STATE.storyResults[i];
  if (result === 'digital') {
    // Returning via Previous: put the saved drawing back so it isn't lost from view.
    practiceGetArtwork(practiceKeyForStory(story.id)).then(rec => {
      if (!rec || !rec.blob) return;
      const img = new Image();
      img.onload = () => {
        const c = document.getElementById('practiceCanvas');
        if (c) c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(rec.blob);
      const note = document.getElementById('practiceSavedNote');
      if (note) note.textContent = '✓ Saved — you can keep drawing or continue.';
    }).catch(e => console.warn('[afterRenderStoryDraw] restore failed', e));
  } else if (result === 'paper') {
    const btn = document.getElementById('preferPaperBtn');
    if (btn) btn.classList.add('picked');
    document.getElementById('practiceSavedNote').textContent = 'No problem — grab a pencil and draw this one on paper.';
  }
  showContinue('Continue →', nextStep, { ghost: result == null });
}
async function savePracticeDrawingForStory(){
  const canvas = document.getElementById('practiceCanvas');
  const btn = document.getElementById('practiceSaveBtn');
  if (!canvas || !_currentStory) return;
  btn.disabled = true;
  try {
    await practiceSaveArtwork(canvas, practiceKeyForStory(_currentStory.id));
    STATE.storyResults[_currentStoryIndex] = 'digital';
    document.getElementById('practiceSavedNote').textContent = '✓ Saved — you can keep drawing or continue.';
    const paperBtn = document.getElementById('preferPaperBtn');
    if (paperBtn) paperBtn.classList.remove('picked');
    showContinue('Continue →', nextStep);
  } catch (e) {
    console.warn('[savePracticeDrawingForStory] failed', e);
    document.getElementById('practiceSavedNote').textContent = "Couldn't save — you can still continue without saving.";
  }
  btn.disabled = false;
}
function choosePreferPaper(){
  if (_currentStoryIndex < 0) return;
  STATE.storyResults[_currentStoryIndex] = 'paper';
  const btn = document.getElementById('preferPaperBtn');
  if (btn) btn.classList.add('picked');
  document.getElementById('practiceSavedNote').textContent = 'No problem — grab a pencil and draw this one on paper.';
  showContinue('Continue →', nextStep);
}

/* ============================================================
   ARTWORK COMMUNITY. Student-work-only step: an upload card for a
   photo of their own drawings, then the shared community gallery.
   (Lessons 01/02 also pulled a saved Try-It-Yourself drawing from
   IndexedDB here; this lesson has no in-lesson drawing step — see
   the file header — so only the upload path applies.)
============================================================ */
function renderTeacherCommunity(){
  const gallery = LESSON_DATA.community_gallery;
  // Real photos (gallery.items) when supplied, dashed placeholders only
  // when there are none — same data-driven branch as Lesson 01.
  const galleryCards = (gallery.items && gallery.items.length)
    ? gallery.items.map(item => `<figure class="gallery-photo-item"><div class="gallery-photo-card"><img src="${item.src}" alt="${item.alt}" loading="lazy"></div>${item.credit ? `<figcaption class="gallery-credit">${item.credit}</figcaption>` : ''}</figure>`).join('')
    : Array.from({ length: gallery.placeholderCount }, () => `<div class="gallery-card">🖼️</div>`).join('');
  return `
    <div class="step-inner">
      <div class="step-kicker">Our Community</div>
      <h2 class="step-title">Your Drawing, Together With Everyone Else's</h2>
      <p class="compare-message">Here's what you drew in this lesson — shown together with work from students like you.</p>

      <div class="community-section">
        <div id="ownWorkArea"><!-- filled by afterRenderTeacherCommunity --></div>
        <div class="gallery-section">
          <div class="gallery-title">${gallery.title}</div>
          <div class="gallery-subtitle">${gallery.subtitle}</div>
          <div class="gallery-grid">${galleryCards}</div>
        </div>
      </div>
    </div>
  `;
}
// One card per story: the saved drawing (digital), a plain note for a
// story done on paper / not completed, and the upload card for anyone
// who drew on paper and wants to add a photo.
async function afterRenderTeacherCommunity(){
  const host = document.getElementById('ownWorkArea');
  const cards = [];
  const allStories = [...LESSON_DATA.story_scenes, ...CloseupVisuals.comparisons];
  for (let i = 0; i < allStories.length; i++) {
    const story = allStories[i];
    const label = i < 5 ? 'Close-Up · Situation ' + (i + 1) : 'Extreme Close-Up · ' + story.title;
    const result = STATE.storyResults[i];
    if (result === 'digital') {
      let record = null;
      try { record = await practiceGetArtwork(practiceKeyForStory(story.id)); } catch (e) { console.warn('[afterRenderTeacherCommunity] practiceGetArtwork failed', e); }
      if (record && record.blob) {
        const url = URL.createObjectURL(record.blob);
        cards.push(`<div class="own-work-card"><div class="own-work-title">${label}</div><img class="own-work-img" src="${url}" alt="Your drawing for ${label}: ${story.title}"></div>`);
        continue;
      }
    }
    const note = result === 'paper' ? '📝 Drawn on paper' : 'Not completed';
    cards.push(`<div class="own-work-card own-work-note-card"><div class="own-work-title">${label}</div><div class="own-work-note">${note}</div></div>`);
  }
  host.innerHTML = `
    <div class="own-work-grid">${cards.join('')}</div>
    <div class="own-work-card" id="ownWorkUpload">
      <div class="own-work-title">Drew on paper? Add a photo</div>
      <label class="upload-dropzone" id="uploadDropzone">
        <input type="file" accept="image/*" onchange="previewUpload(event)">
        <div class="upload-dropzone-icon">📤</div>
        <div class="upload-dropzone-label">Upload a photo of your drawing</div>
      </label>
    </div>
  `;
  showContinue('Continue →', nextStep);
}
function previewUpload(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const zone = document.getElementById('uploadDropzone');
  if (zone) zone.outerHTML = `<img class="own-work-img" src="${url}" alt="Your uploaded reference">`;
}


/* ============================================================
   STEP 8 — COMPLETE
============================================================ */
function renderComplete(){
  if (STATE.lessonSaved) return renderCompleteDone();
  const d = LESSON_DATA.completion_check;
  const chips = d.options.map(opt => `
    <div class="check-chip" data-opt="${opt}" onclick="toggleCheck(this,'${opt}')">${opt}</div>
  `).join('');
  return `
    <div class="step-inner">
      <h2 class="step-title">${d.question}</h2>
      <div class="check-chips">${chips}</div>
      <button class="complete-btn" id="completeBtn" disabled onclick="finishLesson()">Complete Lesson</button>
    </div>
  `;
}
function renderCompleteDone(){
  const next = LESSON_DATA.next_lesson;
  // Real, existing badge-progress mechanism (not invented here) — see
  // the <script> include comment above. Degrades to '' if either
  // script failed to load, rather than throwing.
  const badgeHtml = typeof renderCourseBadgeCard === 'function' ? renderCourseBadgeCard('scene_drawing_unit_01') : '';
  const nextLessonHtml = next ? `
    <a class="next-lesson-card" href="${next.href}">
      <div class="next-lesson-kicker">Next Lesson</div>
      <div class="next-lesson-title">${next.title}</div>
      <div class="next-lesson-sub">${next.subtitle}</div>
    </a>
  ` : '';
  // Round 6: only a light touch here (a hand-drawn ink checkmark
  // instead of a plain "✓" character) — flagged rather than forcing
  // a full storyboard reskin. This screen is mostly a status/
  // confirmation moment (heading, next-lesson link, the real shared
  // badge card from core/scene-drawing-app.js) with little actual
  // illustration content to restyle, and the badge card specifically
  // should keep matching how it looks everywhere else on the
  // platform, not diverge into this lesson's own palette.
  const checkSvg = `<svg viewBox="0 0 60 60" width="52" height="52"><path filter="url(#sbSketch)" d="M14,32 L25,43 L47,17" fill="none" stroke="#3a352c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `
    <div class="step-inner">
      <div class="complete-done">
        <div class="complete-check">${checkSvg}</div>
        <h2 class="step-title">Lesson Complete</h2>
        <p class="step-sub">${LESSON_DATA.title} — ${LESSON_DATA.subtitle}</p>
        ${nextLessonHtml}
        ${badgeHtml}
        <a class="complete-exit" href="../../">← Back to Scene Drawing Foundation</a>
      </div>
    </div>
  `;
}
function toggleCheck(el, opt){
  const picked = el.classList.toggle('picked');
  if (picked) STATE.checkedConcepts.push(opt);
  else STATE.checkedConcepts = STATE.checkedConcepts.filter(o => o !== opt);
  document.getElementById('completeBtn').disabled = STATE.checkedConcepts.length === 0;
}
function finishLesson(){
  if(STATE.lessonSaved)return;
  bumpXP(30);
  markLessonComplete();
  try {
    JournalStorage.save({
      courseId: LESSON_DATA.courseId,
      lessonId: LESSON_DATA.courseId,
      momentKey: 'lesson_complete',
      storyResults: STATE.storyResults.slice(),
      checkedConcepts: STATE.checkedConcepts.slice()
    });
  } catch (e) { console.warn('[finishLesson] JournalStorage.save failed', e); }
  STATE.lessonSaved = true;
  document.getElementById('stage').innerHTML = `<div class="step">${renderCompleteDone()}</div>`;
  hideContinue();
  ensureArtchiMounted();
  // A lesson-accurate line, not the shared ARTCHI_LINES.lessonComplete
  // pool — those were written for the perspective lessons ("you
  // completed this perspective challenge!", "ready for the next
  // room?") and would misdescribe this one. Caught in the completion
  // screenshot, not by inspection.
  showArtchiBubble('Nicely done — you looked closer at what matters. ✨', 3200);
}

/* ============================================================
   MY JOURNEY — round 3. Real component, adapted from lesson-1-
   sphere's openMyJourney/closeMyJourney/renderJourneyContent, reading
   the SAME shared JournalStorage this file already writes to in
   finishLesson() (bare global from core/scene-drawing-platform-
   bridge.js — not a new storage mechanism). JournalStorage.getAll()
   is platform-wide, not scoped to this course, so the stats below
   genuinely aggregate across every course that writes into
   'fei_thinking_journal' — Creation and Foundation together, per
   Faye's own description of what this should show.

   Foundation A's own timeline row assumes every entry carries
   promptText/studentText/inputType/ageGroup (its own reflection-entry
   shape). This lesson's own finishLesson() entry doesn't — and any
   other course's entries may not either — so the row below is
   defensive: it falls back to a synthesized summary instead of
   printing "undefined" for entries that aren't shaped like Foundation
   A's. This isn't cosmetic — it's what a genuinely SHARED cross-
   platform journey view actually needs, not just cover for this one
   lesson's own entries.
============================================================ */
function openMyJourney(){
  renderJourneyModalContent();
  document.getElementById('journeyModalBackdrop').classList.add('show');
}
function closeMyJourney(){
  document.getElementById('journeyModalBackdrop').classList.remove('show');
}
function journeyEscapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function journeyFormatRelativeDate(timestamp){
  const diff = Date.now() - timestamp;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  if (seconds < 60) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
  if (days < 7) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  if (days < 30) return Math.floor(days / 7) + ' week' + (Math.floor(days / 7) > 1 ? 's' : '') + ' ago';
  return new Date(timestamp).toLocaleDateString();
}
// Best-effort summary for entries that don't carry Foundation A's own
// promptText/studentText fields (this lesson's completion entry, or
// any other course's differently-shaped one).
function journeySummarize(e){
  if (e.promptText || e.studentText) {
    return { prompt: e.promptText || '', text: e.studentText || '' };
  }
  if (e.momentKey === 'lesson_complete') {
    const bits = [];
    if (e.storyChoice) bits.push('chose "' + e.storyChoice + '"');
    if (e.sceneChoice) bits.push('chose "' + e.sceneChoice + '"');
    if (Array.isArray(e.checkedConcepts) && e.checkedConcepts.length) bits.push('understood: ' + e.checkedConcepts.join(', '));
    return { prompt: '', text: 'Completed this lesson' + (bits.length ? ' — ' + bits.join('; ') : '') + '.' };
  }
  return { prompt: '', text: 'Saved a moment in this lesson.' };
}
function renderJourneyModalContent(){
  const entries = (typeof JournalStorage !== 'undefined') ? JournalStorage.getAll() : [];
  const statsEl = document.getElementById('journeyStats');
  const timelineEl = document.getElementById('journeyTimeline');

  const totalEntries = entries.length;
  const courseEntries = entries.filter(e => e.courseId === LESSON_DATA.courseId).length;
  const firstEntry = entries[entries.length - 1];
  const daysSinceFirst = firstEntry ? Math.max(1, Math.floor((Date.now() - firstEntry.createdAt) / 86400000)) : 0;
  statsEl.innerHTML = `
    <div class="journey-stat"><div class="journey-stat-number">${totalEntries}</div><div class="journey-stat-label">Thoughts</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${courseEntries}</div><div class="journey-stat-label">This lesson</div></div>
    <div class="journey-stat"><div class="journey-stat-number">${daysSinceFirst}</div><div class="journey-stat-label">Day${daysSinceFirst !== 1 ? 's' : ''} growing</div></div>
  `;

  if (entries.length === 0) {
    timelineEl.innerHTML = `<div class="journey-empty"><div class="journey-empty-icon">💭</div><div>No thoughts yet — your journey starts when you save your first moment.</div></div>`;
    return;
  }
  timelineEl.innerHTML = entries.map(e => {
    const summary = journeySummarize(e);
    return `
      <div class="journey-entry">
        <button class="journey-entry-delete" onclick="deleteJourneyEntry('${e.id}')" title="Delete this thought">🗑</button>
        <div class="journey-entry-meta">
          <span class="journey-entry-lesson">${journeyEscapeHtml(e.lessonId || e.courseId || 'lesson')}</span>
          ${e.momentKey ? `<span class="journey-entry-moment">${journeyEscapeHtml(e.momentKey)}</span>` : ''}
          <span class="journey-entry-date">${journeyFormatRelativeDate(e.createdAt)}</span>
        </div>
        ${summary.prompt ? `<div class="journey-entry-prompt">${journeyEscapeHtml(summary.prompt)}</div>` : ''}
        <div class="journey-entry-text">${journeyEscapeHtml(summary.text)}</div>
      </div>
    `;
  }).join('');
}
function deleteJourneyEntry(entryId){
  if (!confirm('Delete this thought? This cannot be undone.')) return;
  JournalStorage.remove(entryId);
  renderJourneyModalContent();
}

/* ============================================================
   NAVIGATION + RAIL
============================================================ */
function renderRail(){
  const dots = STEPS.map((s, i) => `<span class="rail-dot${i < STATE.stepIndex ? ' done' : ''}${i === STATE.stepIndex ? ' current' : ''}"></span>`).join('');
  document.getElementById('rail').innerHTML = dots;
  // Disabled (not hidden) on Step 1 so the control's position never
  // shifts as the student moves through the lesson.
  document.getElementById('prevStepBtn').disabled = STATE.stepIndex === 0;
}
// Set to whichever step is currently live so renderCurrentStep can
// clean it up before swapping away — needed for Step 2's Three.js
// renderer/requestAnimationFrame loop, which would otherwise keep
// running in the background (a real, growing leak) every time the
// student navigates off Step 2, in either direction.
let _liveStep = null;
function renderCurrentStep(){
  hideContinue();
  if (_liveStep && _liveStep.cleanup) {
    try { _liveStep.cleanup(); } catch (e) { console.warn('[cleanup] failed', e); }
  }
  const step = STEPS[STATE.stepIndex];
  const stageEl = document.getElementById('stage');
  stageEl.innerHTML = `<div class="step">${step.render()}</div>`;
  renderRail();
  window.scrollTo(0, 0);
  _liveStep = step;
  if (step.afterRender) step.afterRender();
}
// Step-transition chime — round 3. Reuses the exact same synthesized-
// tone mechanism Foundation Skill lessons already use for lightweight
// UI feedback (artchiPlayTone, ported verbatim from Foundation A's own
// playTone() in core/scene-drawing-archi.js — no new sound asset).
// 880Hz/0.12s matches that codebase's existing single-ding feedback
// calls (e.g. lesson-1-sphere's own `playTone(880, 0.1)`), not the
// multi-note ascending sequences reserved for bigger celebrations.
// Lives in the shared nav functions below so it covers every lesson-
// level step-to-step move uniformly — Step 1's video and Step 2's
// automatic camera reveal only reach these functions once each
// sequence has already finished on its own, so the chime marks the
// discrete navigation action, never layers over the video's own audio
// or the reveal animation itself.
function playStepAdvanceTone(){
  if (typeof artchiPlayTone === 'function') artchiPlayTone(880, 0.12);
}
function isStepHidden(i){
  const st = STEPS[i];
  return !!(st && st.hiddenWhen && st.hiddenWhen());
}
function nextStep(){
  let t = STATE.stepIndex + 1;
  while (t < STEPS.length - 1 && isStepHidden(t)) t++;
  if (t <= STEPS.length - 1 && STATE.stepIndex < STEPS.length - 1) { playStepAdvanceTone(); STATE.stepIndex = t; renderCurrentStep(); }
}
// Global Previous. Every step is a flat top-level STEPS entry (see
// STORY_SCENE_STEPS's comment), so this is a plain decrement. The
// isStepHidden skip-loop is generic shell infra (shared shape with
// other lessons' STEPS arrays) — nothing in this lesson sets
// hiddenWhen anymore since Round 2 removed the optional story.
function prevStep(){
  let t = STATE.stepIndex - 1;
  while (t > 0 && isStepHidden(t)) t--;
  if (t >= 0 && STATE.stepIndex > 0) { playStepAdvanceTone(); STATE.stepIndex = t; renderCurrentStep(); }
}
function goToStep(i){
  playStepAdvanceTone();
  STATE.stepIndex = Math.max(0, Math.min(STEPS.length - 1, i));
  renderCurrentStep();
}

/* ============================================================
   ARTCHI — mounted lazily, starting at Step 2, NOT on init(). Step 1
   is the full-screen intro video and must stay completely free of
   chrome; showArtchi()'s own first-visit onboarding is a full-
   viewport blocking modal (core/scene-drawing-style.css
   .artchi-onboard-backdrop), so firing it during the video would trap
   the whole lesson behind a popup before the student sees anything —
   caught live in a Playwright pass, not by inspection. Archi's first
   real appearance now lines up with her first bubble line anyway
   (Step 2's "Try stepping back."), matching the brief's "only very
   short moments" instruction.
============================================================ */
let artchiMounted = false;
function ensureArtchiMounted(){
  if (artchiMounted) return;
  artchiMounted = true;
  document.getElementById('artchi-mount').innerHTML = artchiMarkup();
  initArtchiDrag();
  // Reveal only — deliberately NOT calling the shared showArtchi(),
  // which also triggers either a full-screen onboarding modal (first
  // platform visit) or a generic idle bubble a few hundred ms later.
  // Both would collide with this lesson's own deliberate, sparse
  // bubble cues (the brief's "should NOT constantly speak" rule), and
  // the onboarding modal specifically is a full-viewport popup that
  // would block the Learning Canvas mid-interaction — caught live in
  // a Playwright pass, not by inspection. Everything else (markup,
  // drag, bubble, chat) is the same shared component, untouched.
  const character = document.getElementById('artchi-character');
  const label = document.getElementById('artchi-label');
  if (character) character.classList.remove('hidden');
  if (label) label.classList.remove('hidden');
  resetArtchiSleep();
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      // Deliberately ungated — matches the live sibling lesson's own
      // unresolved TODO on Scene Drawing's free/paid rule.
    } catch (e) { console.warn('[init] FEIAccess.init failed, continuing', e); }
  }
  renderCurrentStep();
}
init();
</script>
