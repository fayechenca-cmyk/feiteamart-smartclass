<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2e8d5;
  --paper-soft:#f8f1e2;
  --ink:#2a2420;
  --ink-soft:rgba(42,36,32,.65);
  --ink-faint:rgba(42,36,32,.4);
  --indigo:#1f3a5f;
  --indigo-deep:#12253d;
  --turquoise:#4f8a8b;
  --turquoise-soft:#bcd8d3;
  --vermilion:#c0503a;
  --cream:#faf3e4;
  --line:rgba(42,36,32,.18);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Karla',sans-serif;
  background:var(--paper);
  color:var(--ink);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}
button{font-family:'Karla',sans-serif;}

svg.defs{position:absolute;width:0;height:0;}

/* faint handmade-paper grain, whole page */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(42,36,32,.05) 1px, transparent 1.3px);
  background-size:5px 5px;opacity:.55;
}

#app{position:relative;min-height:100vh;padding-bottom:40px;z-index:1;}

/* ---------- Top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:500;background:linear-gradient(var(--paper) 78%, transparent);
  padding:12px 18px 8px;
}
.back-link{font-size:13px;color:var(--indigo);text-decoration:none;font-weight:700;letter-spacing:.3px;}
.progress-dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px;}
.p-dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:transform .15s ease;}
.p-dot.done{background:var(--indigo);}
.p-dot.current{transform:scale(1.7);box-shadow:0 0 0 3px rgba(31,58,95,.16);}

/* ---------- Screens ---------- */
.screen{display:none;max-width:640px;margin:0 auto;padding:8px 20px 40px;}
.screen.active{display:block;animation:wyFadeIn .4s ease;}
@keyframes wyFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--vermilion);text-align:center;font-weight:700;margin-bottom:6px;}
.s-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.9rem;text-align:center;margin:0 0 6px;color:var(--indigo-deep);}
.s-sub{text-align:center;font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.wy-btn{
  font-family:'Karla',sans-serif;font-weight:700;font-size:14px;
  padding:12px 22px;border-radius:999px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease, opacity .15s ease;
  border:2px solid var(--ink);background:transparent;color:var(--ink);
}
.wy-btn:active{transform:scale(.96);}
.wy-btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.wy-btn.vermilion{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.wy-btn:disabled{opacity:.3;cursor:not-allowed;}
.wy-btn.wide{width:100%;text-align:center;}

.wy-card{
  background:var(--cream);border:1.5px solid var(--line);border-radius:16px;
  filter:url(#roughInk);box-shadow:3px 4px 0 rgba(42,36,32,.1);padding:16px;
}

/* video embed (studio steps) */
.video-embed-wrap{margin:14px 0 8px;border-radius:14px;overflow:hidden;box-shadow:0 8px 22px rgba(18,37,61,.22);}

/* ---------- Screen 1: Enter the World ---------- */
.entrance-stage{height:38vh;min-height:220px;max-height:320px;position:relative;display:flex;align-items:center;justify-content:center;}
.ripple{transform-origin:center;transform-box:fill-box;opacity:0;animation:rippleOut 2.2s ease-out infinite;}
.ripple.r2{animation-delay:.5s;}
.ripple.r3{animation-delay:1s;}
@keyframes rippleOut{0%{transform:scale(.3);opacity:.55;}100%{transform:scale(2.6);opacity:0;}}
.wave-mark{animation:waveMarkIn 1s ease-out forwards;opacity:0;transform:scale(.6);transform-origin:center;transform-box:fill-box;}
@keyframes waveMarkIn{0%{opacity:0;transform:scale(.5);}60%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
.entrance-headline{opacity:0;animation:wyTextIn .6s ease forwards;animation-delay:.9s;text-align:center;font-size:2.3rem;margin:6px 0 4px;}
.entrance-sub{opacity:0;animation:wyTextIn .6s ease forwards;animation-delay:1.15s;text-align:center;font-size:14px;color:var(--ink-soft);max-width:360px;margin:0 auto 22px;line-height:1.6;}
.entrance-cta{opacity:0;animation:wyTextIn .6s ease forwards;animation-delay:1.4s;text-align:center;}
@keyframes wyTextIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.copyright-note{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:10px;font-style:italic;}

/* ---------- Screen 2: What is Ukiyo-e ---------- */
.ukiyoe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
@media(min-width:520px){.ukiyoe-grid{grid-template-columns:1fr 1fr 1fr;}}
.uk-card{perspective:900px;height:128px;cursor:pointer;}
.uk-card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.uk-card.flipped .uk-card-inner{transform:rotateY(180deg);}
.uk-card-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;
  border:1.5px solid var(--line);
}
.uk-card-front{background:var(--cream);}
.uk-card-front .uk-icon{font-size:1.7rem;}
.uk-card-front .uk-label{font-weight:700;font-size:12.5px;margin-top:6px;}
.uk-card-back{background:var(--indigo);color:#fff;transform:rotateY(180deg);font-size:11.5px;line-height:1.4;}
.uk-seen-dot{display:none;}
.uk-card.seen .uk-seen-dot{display:block;position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--vermilion);}

/* ---------- Screen 3: Wave Detective ---------- */
.wave-stage{position:relative;border-radius:16px;overflow:hidden;background:#eaf2f0;box-shadow:0 6px 20px rgba(18,37,61,.15);}
.wave-svg{display:block;width:100%;height:auto;}
.wave-hotspot{position:absolute;border-radius:10px;cursor:pointer;}
.wave-hotspot.active{box-shadow:0 0 0 2px var(--vermilion);animation:hotspotPulse 1s ease-in-out infinite;}
@keyframes hotspotPulse{0%,100%{box-shadow:0 0 0 2px var(--vermilion);}50%{box-shadow:0 0 0 5px rgba(192,80,58,.35);}}
.wave-callout{
  margin-top:10px;background:var(--cream);border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.5;min-height:20px;border:1.5px solid var(--line);
}
.wave-callout .wc-label{font-weight:700;color:var(--indigo);margin-right:6px;}
.speed-row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.speed-card{
  background:var(--cream);border:1.5px solid var(--line);border-radius:12px;
  padding:8px;cursor:pointer;text-align:center;width:80px;
}
.speed-card.picked{border-color:var(--vermilion);background:var(--turquoise-soft);}
.speed-card svg{width:100%;height:36px;}
.speed-note{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:10px;min-height:16px;font-style:italic;}

/* ---------- Screen 4: Meet the Creatures ---------- */
.creature-type-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.creature-type-btn{
  background:var(--cream);border:2px solid var(--line);border-radius:14px;
  padding:8px 10px;text-align:center;cursor:pointer;width:64px;
}
.creature-type-btn.picked{border-color:var(--indigo);background:var(--turquoise-soft);}
.creature-type-btn .ct-emoji{font-size:1.4rem;}
.creature-type-btn .ct-label{font-size:10px;font-weight:700;margin-top:2px;}
.creature-stage{width:200px;height:200px;margin:0 auto 16px;}
.feature-row{margin-bottom:12px;}
.feature-row-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;text-align:center;}
.feature-chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.feature-chip{
  background:var(--cream);border:1.5px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:600;
}
.feature-chip.picked{background:var(--indigo);border-color:var(--indigo);color:#fff;}

/* ---------- Screen 5: Build Your Story ---------- */
.story-row{margin-bottom:14px;}
.story-row-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
.story-chips{display:flex;gap:7px;flex-wrap:wrap;}
.story-chip{
  background:var(--cream);border:1.5px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600;
}
.story-chip.picked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.story-sentence{
  margin-top:18px;background:var(--indigo);color:#fff;border-radius:14px;
  padding:20px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.4rem;line-height:1.4;
}

/* ---------- Screen 6: Materials ---------- */
.materials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
@media(max-width:420px){.materials-grid{grid-template-columns:repeat(2,1fr);}}
.mat-tile{
  background:var(--cream);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 6px;text-align:center;cursor:pointer;position:relative;
}
.mat-tile.optional{border-style:dashed;}
.mat-tile.checked{border-color:var(--indigo);background:var(--turquoise-soft);}
.mat-tile .m-icon{font-size:1.6rem;}
.mat-tile .m-label{font-size:11px;font-weight:700;margin-top:5px;}
.mat-check{display:none;position:absolute;top:5px;right:7px;color:var(--indigo);font-weight:900;}
.mat-tile.checked .mat-check{display:block;}
.optional-tag{text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin:16px 0 6px;}

/* ---------- Studio steps (7-10) ---------- */
.studio-kicker{text-align:center;font-size:12px;color:var(--ink-faint);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.reminder-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.reminder-chip{background:var(--turquoise-soft);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--indigo-deep);}
.optional-note{text-align:center;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:6px;}
.palette-row{display:flex;gap:14px;justify-content:center;margin:14px 0 6px;}
.palette-swatch-group{text-align:center;cursor:pointer;padding:8px;border-radius:12px;border:1.5px solid transparent;}
.palette-swatch-group.picked{border-color:var(--indigo);background:var(--cream);}
.palette-dots{display:flex;gap:4px;justify-content:center;margin-bottom:4px;}
.palette-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
.palette-name{font-size:11px;font-weight:700;}
.wave-anim-row{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
.wave-anim-panel{width:80px;text-align:center;}
.wave-anim-panel svg{width:100%;height:40px;}
.wave-anim-panel.moving svg{animation:waveDrift 1.8s ease-in-out infinite;}
@keyframes waveDrift{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}
.wave-anim-caption{font-size:10px;color:var(--ink-faint);margin-top:4px;}
.studio-prompt{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--indigo-deep);margin:14px 0 6px;font-style:italic;}
.complete-wrap{text-align:center;margin-top:20px;}
.complete-btn{
  background:var(--cream);border:2px dashed var(--line);border-radius:999px;
  padding:12px 26px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-soft);
}
.complete-btn.done{background:var(--indigo);border-style:solid;border-color:var(--indigo);color:#fff;}

/* ---------- Screen 11: Final Touch ---------- */
.touch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.touch-tile{
  background:var(--cream);border:1.5px solid var(--line);border-radius:14px;
  padding:16px 6px;text-align:center;cursor:pointer;
}
.touch-tile.picked{border-color:var(--vermilion);background:var(--turquoise-soft);}
.touch-tile .t-icon{font-size:1.6rem;}
.touch-tile .t-label{font-size:11px;font-weight:700;margin-top:5px;}
.touch-confirm{text-align:center;font-size:13px;color:var(--indigo);margin-top:16px;min-height:18px;font-style:italic;}

/* ---------- Screen 12: Gallery ---------- */
.upload-slot-wrap{display:flex;flex-direction:column;align-items:center;margin-top:8px;}
.upload-slot{
  position:relative;width:220px;height:220px;border-radius:16px;
  border:2px dashed var(--indigo);background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.upload-slot.saving{border-color:var(--vermilion);}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-slot .slot-plus{font-size:32px;color:var(--indigo);}
.upload-slot .slot-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:6px;padding:0 16px;text-align:center;}
.paper-frame{
  width:240px;margin:18px auto 6px;padding:14px;background:var(--cream);
  border:2px solid var(--ink);filter:url(#roughInk);box-shadow:5px 6px 0 rgba(42,36,32,.18);
}
.paper-frame img{width:100%;display:block;border-radius:2px;}
.gallery-closing{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--indigo-deep);margin:20px 0 6px;font-style:italic;}
.gallery-credit{text-align:center;font-size:12px;color:var(--ink-faint);margin-bottom:20px;}
.gallery-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px;}
</style>
</head>
<body>

<div id="grain"></div>

<svg class="defs">
  <defs>
    <filter id="roughInk">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="6" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <div id="topbar">
    <a class="back-link" href="../../creation/">← Studio</a>
    <div class="progress-dots" id="progressDots"></div>
  </div>
  <div id="screen-content"></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileSelected(event)">

<script>
/* ============================================================
   DATA
============================================================ */
const SCREENS = [
  { id:'enter-world',      title:'Enter the World',                noFooter:true },
  { id:'what-is-ukiyoe',   title:'What is Ukiyo-e?' },
  { id:'wave-detective',   title:'Wave Detective' },
  { id:'meet-creatures',   title:'Meet the Creatures' },
  { id:'build-story',      title:'Build Your Story' },
  { id:'materials',        title:'Materials',                      nextLabel:"Let's Draw →" },
  { id:'studio-1',         title:'Draw & Outline',                 studioIndex:0 },
  { id:'studio-2',         title:'Paint the Creatures & Background', studioIndex:1 },
  { id:'studio-3',         title:'Paint the Waves',                studioIndex:2 },
  { id:'studio-4',         title:'Add Details & Final Lines',      studioIndex:3 },
  { id:'final-touch',      title:'Optional Final Touch' },
  { id:'gallery',          title:'Gallery' }
];

const UKIYOE_CARDS = [
  { id:'lines',     label:'Bold Lines',        icon:'〰️', note:'Thick, confident outlines hold every shape together.' },

  { id:'waves',     label:'Big Waves',         icon:'🌊', note:'Water becomes a shape you can almost feel moving.' },

const SPEED_SAMPLES = [
  { id:'gentle',  label:'Gentle curve', d:'M4 20 Q30 5 56 20', note:'Gentle curves feel calm — a slow drift, not a rush.' },

const CREATURE_TYPES = [
  { id:'cat',       label:'Cat',       emoji:'🐱' },

const FEATURE_OPTIONS = {

const STORY_CREATURES = ['fox','cat','fish','dragon','bird','tiny creature'];
const STORY_FEELINGS  = ['brave','curious','sleepy','shy','proud','playful'];
const STORY_WATERS    = ['a giant wave','a calm sea','a stormy tide','a quiet pond','a rushing river'];

const MATERIALS = [
  { id:'pencil',      label:'Pencil',            icon:'✏️' },
  { id:'paper',       label:'Watercolor Paper',  icon:'📄' },
  { id:'watercolor',  label:'Watercolor',        icon:'🎨' },
  { id:'brushes',     label:'Brushes',           icon:'🖌️' },
  { id:'water',       label:'Water',             icon:'💧' },
  { id:'papertowel',  label:'Paper Towel',       icon:'🧻' },
  { id:'fineliner',   label:'Fineliner',         icon:'✒️', optional:true },
  { id:'whitepaint',  label:'White Paint',       icon:'⚪', optional:true }
];

// Studio steps — edit this array only for content changes (video URL,
// title, completion label). No render-logic changes needed.
const STUDIO_STEPS = [
  {
    stepNumber: 1,
    title: 'Draw & Outline',
    teacherVideoUrl: '', // TODO(Faye): paste real Cloudflare Stream video for this step
    videoTitle: 'Draw & Outline — teacher demo',
    reminders: ['Big shapes first', 'Let lines flow', 'Leave space for waves'],
    optionalNote: 'Optional: trace one wave line before you start.',
    completionLabel: '✓ Step Complete'
  },
  {
    stepNumber: 2,
    title: 'Paint the Creatures & Background',
    teacherVideoUrl: '', // TODO(Faye): paste real Cloudflare Stream video for this step
    videoTitle: 'Paint the Creatures & Background — teacher demo',
    palette: [
      { name:'Ocean', colors:['#1f3a5f','#4f8a8b','#12253d'] },
      { name:'Fire',  colors:['#c0503a','#d9642c','#e8b23a'] }
    ],
    note: 'Your colors can be different.',
    completionLabel: '✓ Color Added!'

/* ============================================================
   IndexedDB — finished-artwork photo storage, scoped to this course
   (modeled on lessons/color-magic/shared/color-storage.js).
============================================================ */
const DB_NAME = 'fei_waves_yokai_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const PIECE_ID = 'piece_001';
const MAX_EDGE = 1400;
const JPEG_QUALITY = 0.87;
let _dbPromise = null;

function isStorageSupported(){ return !!window.indexedDB; }

function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}

function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileOrBlob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      const longestEdge = Math.max(width, height);
      if (longestEdge > MAX_EDGE) {
        const scale = MAX_EDGE / longestEdge;
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
    img.src = url;
  });
}

async function saveArtwork(pieceId, fileOrBlob){
  const compressed = await compressImage(fileOrBlob);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId + '::' + Date.now(), pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}

async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => {
      const rows = req.result || [];
      rows.sort((a, b) => b.savedAt - a.savedAt);
      resolve(rows);
    };
    req.onerror = () => reject(req.error);
  });
}

    const groups = step.palette.map(p => `
      <div class="palette-swatch-group${STATE.studioPalettePick === p.name ? ' picked' : ''}" onclick="pickPalette('${p.name}')">
        <div class="palette-dots">${p.colors.map(c => `<span class="palette-dot" style="background:${c};"></span>`).join('')}</div>
        <div class="palette-name">${p.name}</div>
      </div>
    `).join('');
    extra += `<div class="palette-row">${groups}</div>`;
  }
  if (step.note) {
    extra += `<p class="optional-note">${step.note}</p>`;
  }
  if (step.stepNumber === 3) {
    extra += renderWaveAnimReminder();
  }
  if (step.prompt) {
    extra += `<p class="studio-prompt">${step.prompt}</p>`;
  }
  const done = STATE.studioDone[idx];
  return `
    <div class="studio-kicker">Studio Step ${step.stepNumber} of 4</div>
    <h2 class="s-title">${step.title}</h2>
    ${renderVideoEmbed(step.teacherVideoUrl, step.videoTitle)}
    ${extra}
    <div class="complete-wrap">
      <button class="complete-btn${done ? ' done' : ''}" onclick="toggleStudioDone(${idx})">
        ${done ? step.completionLabel : "I'm done with this step"}
      </button>
    </div>
  `;
}

/* ============================================================
   SCREEN 11 — Optional Final Touch
============================================================ */
function pickFinalTouch(id){
  STATE.finalTouch = id;
  saveState();
  renderCurrentScreen();
}
function renderScreen11(){
  const tiles = FINAL_TOUCHES.map(t => `
    <div class="touch-tile${STATE.finalTouch === t.id ? ' picked' : ''}" onclick="pickFinalTouch('${t.id}')">
      <div class="t-icon">${t.icon}</div><div class="t-label">${t.label}</div>
    </div>
  `).join('');
  const confirm = STATE.finalTouch
    ? `Nice — a little ${FINAL_TOUCHES.find(t => t.id === STATE.finalTouch).label.toLowerCase()} of your own.`
    : '';
  return `
    <div class="kicker">Optional</div>
    <h2 class="s-title">One Final Touch</h2>
    <p class="s-sub">Add one small detail the teacher didn't use.</p>
    <div class="touch-grid">${tiles}</div>
    <div class="touch-confirm">${confirm}</div>
  `;
}

/* ============================================================
   SCREEN 12 — Gallery
============================================================ */
function triggerUpload(){ document.getElementById('fileInput').click(); }

async function onFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please choose an image file (JPG or PNG).'); return; }
  saving = true;
  renderCurrentScreen();
  try {
    const record = await saveArtwork(PIECE_ID, file);
    artworkRecord = record;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(record.blob);
  } catch (e) {
    console.warn('[gallery] saveArtwork failed', e);
    alert("Couldn't save that photo — want to try a different one?");
  }
  saving = false;
  renderCurrentScreen();
}

function renderScreen12(){
  let uploadHtml;
  if (saving) {
    uploadHtml = `<div class="upload-slot saving"><div class="slot-plus">⏳</div><div class="slot-label">Saving…</div></div>`;
  } else if (artworkRecord) {
    uploadHtml = `<div class="upload-slot" onclick="triggerUpload()"><img src="${objectUrl}" alt="Your finished ukiyo-e artwork"></div>`;
  } else {
    uploadHtml = `<div class="upload-slot" onclick="triggerUpload()"><div class="slot-plus">+</div><div class="slot-label">Upload a photo of your artwork</div></div>`;
  }

  let framePart = '';
  let closingPart = '';
  if (artworkRecord) {
    framePart = `<div class="paper-frame"><img src="${objectUrl}" alt="Your finished ukiyo-e artwork"></div>`;
    closingPart = `
      <p class="gallery-closing">Every wave tells a different story.</p>
      <p class="gallery-credit">Taught by Mrs. Dawn Wang</p>
    `;
  }

  return `
    <div class="kicker">Share It</div>
    <h2 class="s-title">Gallery</h2>
    <p class="s-sub">No ranking, no scores — just your story.</p>
    <div class="upload-slot-wrap">${uploadHtml}</div>
    ${framePart}
    ${closingPart}
    <div class="gallery-actions">
      <a class="wy-btn primary wide" href="../../creation/" style="text-decoration:none;display:block;">Explore Other Artists →</a>
    </div>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
function renderScreenBody(screen){
  switch (screen.id) {
    case 'enter-world':    return renderScreen1();
    case 'what-is-ukiyoe': return renderScreen2();
    case 'wave-detective': return renderScreen3();
    case 'meet-creatures': return renderScreen4();
    case 'build-story':    return renderScreen5();
    case 'materials':      return renderScreen6();
    case 'studio-1':
    case 'studio-2':
    case 'studio-3':
    case 'studio-4':       return renderStudioStep(screen);
    case 'final-touch':    return renderScreen11();
    case 'gallery':        return renderScreen12();
    default: return '';
  }
}

async function renderCurrentScreen(){
  const idx = STATE.currentStep;
  const screen = SCREENS[idx];
  document.getElementById('progressDots').innerHTML = renderDots();

  if (screen.id === 'gallery' && !artworkRecord && isStorageSupported()) {
    try {
      const rows = await listArtworks(PIECE_ID);
      if (rows.length) {
        artworkRecord = rows[0];
        objectUrl = URL.createObjectURL(artworkRecord.blob);
      }
    } catch (e) { console.warn('[gallery] listArtworks failed', e); }
  }

  const body = renderScreenBody(screen);
  const footer = screen.noFooter ? '' : renderNavFooter(screen, idx);
  document.getElementById('screen-content').innerHTML =
    `<div class="screen active">${body}${footer}</div>`;
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'waves-and-yokai');
      if (!ok) return; // gateLessonPage already redirected to home
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  renderCurrentScreen();
}

init();
</script>
