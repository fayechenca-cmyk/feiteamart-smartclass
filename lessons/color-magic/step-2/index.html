<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 2 · Color Detective · Color Magic</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/color-style.css">

<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<script src="../shared/color-state.js"></script>

<style>
  .hero-q {
    text-align: center; padding: 8px 10px 4px;
  }
  .hero-q .kicker {
    font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: var(--c-orange); margin-bottom: 8px;
  }
  .hero-q h1 { font-size: 22px; font-weight: 900; margin: 0; line-height: 1.3; }
  .hero-q .icon-row { font-size: 26px; margin-top: 6px; }

  .bubble-field {
    position: relative;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 18px;
    padding: 34px 10px; margin-top: 10px;
  }
  .bubble {
    width: 68px; height: 68px; border-radius: 50%;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), 0 6px 14px rgba(43,36,64,0.2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, box-shadow .18s ease;
    animation: bob 3s ease-in-out infinite;
  }
  .bubble:active { transform: scale(0.92); }
  .bubble.selected { transform: scale(1.15); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--sel-ring, #2b2440), 0 8px 18px rgba(43,36,64,0.3); }
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -8px; } }

  .meet-stage { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .flyer { position: fixed; width: 68px; height: 68px; border-radius: 50%; box-shadow: 0 6px 14px rgba(43,36,64,0.25); transition: top .55s cubic-bezier(.34,1.4,.64,1), left .55s cubic-bezier(.34,1.4,.64,1); }
  .sparkle-burst {
    position: fixed; transform: translate(-50%,-50%);
    font-size: 30px; opacity: 0; pointer-events: none;
    animation: burstPop .9s ease forwards;
  }
  @keyframes burstPop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
    35% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%,-80%) scale(1); }
  }
  .pair-caption {
    position: fixed; transform: translate(-50%,0);
    font-size: 13px; font-weight: 800; color: var(--ink);
    background: #fff; padding: 6px 12px; border-radius: 14px;
    box-shadow: 0 4px 12px rgba(43,36,64,0.2);
    opacity: 0; animation: capFade .9s ease forwards;
    white-space: nowrap;
  }
  @keyframes capFade { 0% { opacity: 0; transform: translate(-50%,10px); } 30% { opacity: 1; transform: translate(-50%,0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-8px); } }

  .tally { text-align: center; margin-top: 18px; font-size: 12px; color: var(--ink-muted); font-weight: 700; }
  .next-wrap { margin-top: 22px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Color Detective</p>
  <div class="stops-pill">STEP 2 OF 10</div>
</div>

<div class="content-wrap">
  <div class="hero-q">
    <div class="kicker">Color Detective</div>
    <h1>Which colors look happy together?</h1>
    <div class="icon-row">👉🫧</div>
  </div>

  <div class="bubble-field" id="bubbleField"></div>

  <div class="tally" id="tally">tap any two bubbles</div>

  <div class="next-wrap">
    <button class="btn btn-pop" id="nextBtn" style="display:none;" onclick="goNext()">Next →</button>
  </div>
</div>

<div class="meet-stage" id="meetStage"></div>

<script>
const STEP_N = 2;
const NEEDED_PAIRS = 3;

const COLORS = [
  { name: 'Red',    v: '#ef4444' },
  { name: 'Orange', v: '#f6871f' },
  { name: 'Yellow', v: '#ffc93c' },
  { name: 'Green',  v: '#22b573' },
  { name: 'Blue',   v: '#2a7de1' },
  { name: 'Purple', v: '#9b5de5' },
  { name: 'Pink',   v: '#ff5da2' },
  { name: 'Teal',   v: '#12aeb2' },
];

const CAPTIONS = ['happy together! 😊', 'what a match! ✨', 'lovely pair! 💫', 'these shine together! 🎉', 'ooh, nice! 🌈'];

let selected = null; // {el, idx}
let pairsFound = new Set();
let busy = false;

function renderBubbles() {
  const field = document.getElementById('bubbleField');
  field.innerHTML = COLORS.map((c, i) => {
    const delay = (i * 0.35).toFixed(2);
    return `<div class="bubble" data-idx="${i}" style="background:${c.v}; animation-delay:${delay}s" onclick="tapBubble(${i})"></div>`;
  }).join('');
}

function tapBubble(idx) {
  if (busy) return;
  const els = document.querySelectorAll('.bubble');
  const el = els[idx];

  if (selected === null) {
    selected = { el, idx };
    el.classList.add('selected');
    el.style.setProperty('--sel-ring', COLORS[idx].v);
    return;
  }

  if (selected.idx === idx) {
    el.classList.remove('selected');
    selected = null;
    return;
  }

  const a = selected;
  const b = { el, idx };
  a.el.classList.remove('selected');
  playMeet(a, b);
  selected = null;
}

function playMeet(a, b) {
  busy = true;
  const stage = document.getElementById('meetStage');
  const rectA = a.el.getBoundingClientRect();
  const rectB = b.el.getBoundingClientRect();
  const midX = (rectA.left + rectB.left) / 2;
  const midY = (rectA.top + rectB.top) / 2;

  const flyerA = document.createElement('div');
  flyerA.className = 'flyer';
  flyerA.style.background = COLORS[a.idx].v;
  flyerA.style.left = rectA.left + 'px';
  flyerA.style.top = rectA.top + 'px';
  const flyerB = document.createElement('div');
  flyerB.className = 'flyer';
  flyerB.style.background = COLORS[b.idx].v;
  flyerB.style.left = rectB.left + 'px';
  flyerB.style.top = rectB.top + 'px';
  stage.appendChild(flyerA);
  stage.appendChild(flyerB);

  requestAnimationFrame(() => {
    flyerA.style.left = (midX - 14) + 'px';
    flyerA.style.top = (midY) + 'px';
    flyerB.style.left = (midX + 14) + 'px';
    flyerB.style.top = (midY) + 'px';
  });

  setTimeout(() => {
    const burst = document.createElement('div');
    burst.className = 'sparkle-burst';
    burst.style.left = midX + 'px';
    burst.style.top = midY + 'px';
    burst.textContent = '✨';
    stage.appendChild(burst);

    const caption = document.createElement('div');
    caption.className = 'pair-caption';
    caption.style.left = midX + 'px';
    caption.style.top = (midY + 46) + 'px';
    caption.textContent = COLORS[a.idx].name + ' + ' + COLORS[b.idx].name + ' — ' + CAPTIONS[Math.floor(Math.random() * CAPTIONS.length)];
    stage.appendChild(caption);

    setTimeout(() => {
      flyerA.remove(); flyerB.remove();
      setTimeout(() => { burst.remove(); caption.remove(); }, 950);
      busy = false;
    }, 500);
  }, 580);

  const key = [a.idx, b.idx].sort().join('-');
  pairsFound.add(key);
  updateTally();
}

function updateTally() {
  const n = pairsFound.size;
  const tally = document.getElementById('tally');
  if (n < NEEDED_PAIRS) {
    tally.textContent = `${n} of ${NEEDED_PAIRS} pairs discovered`;
  } else {
    tally.textContent = `${n} pairs discovered — nice eye! 👀`;
    document.getElementById('nextBtn').style.display = 'block';
    ColorState.markCompleted(STEP_N);
  }
  ColorState.markInProgress(STEP_N);
}

function goNext() {
  window.location.href = '../step-3/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'color-magic');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  ColorState.markVisited(STEP_N);
  renderBubbles();
}

init();
</script>
</body>
</html>
