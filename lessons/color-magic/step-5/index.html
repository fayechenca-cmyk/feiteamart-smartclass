<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 5 · Color Magic · Color Magic</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/color-style.css">

<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<script src="../shared/color-state.js"></script>
<script src="../shared/color-shapes.js"></script>
<script src="../shared/color-voice.js"></script>

<style>
  html, body { background: radial-gradient(circle at 50% 20%, #2b2440 0%, #1c1730 70%); }
  .topbar { background: rgba(28,23,48,0.7); }
  .back-link, .topbar-title { color: #fff; }
  .stops-pill { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); }

  .hero-q { text-align: center; padding: 8px 10px 4px; }
  .hero-q .kicker { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #ffd76b; margin-bottom: 8px; }
  .hero-q h1 { font-size: 22px; font-weight: 900; margin: 0; line-height: 1.3; color: #fff; }
  .hero-q p { font-size: 12.5px; color: rgba(255,255,255,0.55); margin: 6px 0 0; }

  .wheel-wrap { position: relative; width: 280px; height: 280px; margin: 30px auto 10px; }
  .chip {
    position: absolute; width: 74px; height: 74px;
    top: 50%; left: 50%; margin: -37px 0 0 -37px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, filter .2s ease;
  }
  .chip.selected { filter: drop-shadow(0 0 0 3px #fff) drop-shadow(0 0 5px rgba(255,255,255,0.6)); transform: scale(1.08); }
  .chip.glow { animation: glowPulse 1.1s ease; }
  .chip.bounce { animation: bounceApart .5s ease; }
  .chip.discovered::after {
    content: '✓'; position: absolute; top: -4px; right: -4px;
    width: 20px; height: 20px; border-radius: 50%; background: #ffd76b; color: #2b2440;
    font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 26px; opacity: 0.5; }

  .tally { text-align: center; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 700; }

  .takeaway-card {
    display: none; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 20px; margin-top: 20px; text-align: center;
  }
  .takeaway-card p { color: #fff; font-size: 15px; font-weight: 700; line-height: 1.5; margin: 0; }
  .next-wrap { margin-top: 18px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Color Magic</p>
  <div class="stops-pill">STEP 5 OF 10</div>
</div>

<div class="content-wrap">
  <div class="hero-q">
    <div class="kicker">Opposite Colors</div>
    <h1>Tap two colors ✨</h1>
    <p>find the ones that make each other glow</p>
  </div>

  <div class="wheel-wrap" id="wheel">
    <div class="wheel-center">🎨</div>
  </div>

  <div class="tally" id="tally">0 of 3 magic pairs found</div>

  <div class="takeaway-card" id="takeaway">
    <p>When opposite colors sit together,<br>they make each other brighter. ✨</p>
  </div>

  <div class="next-wrap">
    <button class="btn btn-pop" id="nextBtn" style="display:none;" onclick="goNext()">Next →</button>
  </div>
</div>

<script>
const STEP_N = 5;

// Positioned in true color-wheel order — index i and i+3 are complementary.
const CHIPS = [
  { name: 'Red',    v: '#ef4444' },
  { name: 'Orange', v: '#f6871f' },
  { name: 'Yellow', v: '#ffc93c' },
  { name: 'Green',  v: '#22b573' },
  { name: 'Blue',   v: '#2a7de1' },
  { name: 'Purple', v: '#9b5de5' },
];
const RADIUS = 118;

let selected = null;
let found = new Set(); // pair keys "0-3" etc.

function place() {
  const wheel = document.getElementById('wheel');
  CHIPS.forEach((c, i) => {
    const angle = (i / CHIPS.length) * 2 * Math.PI - Math.PI / 2;
    const x = Math.cos(angle) * RADIUS;
    const y = Math.sin(angle) * RADIUS;
    const el = document.createElement('div');
    el.className = 'chip';
    el.id = 'chip-' + i;
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.dataset.baseTransform = `translate(${x}px, ${y}px)`;
    el.innerHTML = ColorShapes.paintBlobSVG({ seed: i + 41, color: c.v, size: 74, label: c.name });
    el.addEventListener('click', () => tapChip(i));
    wheel.appendChild(el);
  });
}

function pairKey(i, j) { return [i, j].sort((a,b) => a-b).join('-'); }
function isComplementary(i, j) { return (i + 3) % 6 === j; }

function tapChip(i) {
  const el = document.getElementById('chip-' + i);

  if (selected === null) {
    selected = i;
    el.classList.add('selected');
    return;
  }
  if (selected === i) {
    el.classList.remove('selected');
    selected = null;
    return;
  }

  const a = selected;
  const b = i;
  document.getElementById('chip-' + a).classList.remove('selected');
  selected = null;

  if (isComplementary(a, b)) {
    document.getElementById('chip-' + a).classList.add('glow');
    document.getElementById('chip-' + b).classList.add('glow');
    setTimeout(() => {
      document.getElementById('chip-' + a).classList.remove('glow');
      document.getElementById('chip-' + b).classList.remove('glow');
    }, 1100);

    const key = pairKey(a, b);
    if (!found.has(key)) {
      found.add(key);
      document.getElementById('chip-' + a).classList.add('discovered');
      document.getElementById('chip-' + b).classList.add('discovered');
      ColorState.markInProgress(STEP_N);
      updateTally();
    }
  } else {
    const elA = document.getElementById('chip-' + a);
    const elB = document.getElementById('chip-' + b);
    elA.style.setProperty('--bx', '-16px');
    elB.style.setProperty('--bx', '16px');
    elA.classList.add('bounce');
    elB.classList.add('bounce');
    setTimeout(() => { elA.classList.remove('bounce'); elB.classList.remove('bounce'); }, 500);
  }
}

function updateTally() {
  const n = found.size;
  document.getElementById('tally').textContent = n + ' of 3 magic pairs found';
  if (n === 3) {
    document.getElementById('takeaway').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
    ColorState.markCompleted(STEP_N);
  }
}

function goNext() {
  window.location.href = '../step-6/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'color-magic');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  ColorShapes.injectDefs();
  ColorState.markVisited(STEP_N);
  place();
  ColorVoice.init(STEP_N, "Tap two colors. If they're opposites, they'll glow like magic!");
}

init();
</script>
</body>
</html>
