<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 4 · Color Families · Color Magic</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/color-style.css">

<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<script src="../shared/color-state.js"></script>
<script src="../shared/color-shapes.js"></script>
<script src="../shared/color-voice.js"></script>
<script src="../../../core/tutorial-hand.js"></script>

<style>
  .hero-q { text-align: center; padding: 8px 10px 4px; }
  .hero-q .kicker { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--c-green); margin-bottom: 8px; }
  .hero-q h1 { font-size: 22px; font-weight: 900; margin: 0; line-height: 1.3; }
  .hero-q p { font-size: 12.5px; color: var(--ink-muted); margin: 6px 0 0; }

  .playfield { position: relative; margin-top: 18px; height: 380px; touch-action: none; }

  .zone {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, filter .2s ease;
  }
  .zone.hover { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(18,174,178,0.6)); }

  .chip {
    position: absolute; width: 58px; height: 58px;
    cursor: grab; touch-action: none; user-select: none;
    transition: left .4s cubic-bezier(.34,1.5,.64,1), top .4s cubic-bezier(.34,1.5,.64,1), opacity .3s ease, transform .3s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .chip.dragging { cursor: grabbing; transition: none; z-index: 30; }
  .chip.placed { opacity: 0.5; transform: scale(0.78); }

  .phase-label { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-muted); margin-top: 6px; }
  .next-wrap { margin-top: 18px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Color Families</p>
  <div class="stops-pill">STEP 4 OF 10</div>
</div>

<div class="content-wrap">
  <div class="hero-q">
    <div class="kicker" id="kicker">Same Family</div>
    <h1 id="headline">Drag the matching colors into the basket 🧺</h1>
    <p id="subline">yellow, yellow-orange, orange, red-orange — they're cousins!</p>
  </div>

  <div class="playfield" id="playfield"></div>

  <div class="phase-label" id="phaseLabel">0 of 4 found</div>

  <div class="next-wrap">
    <button class="btn btn-teal" id="nextBtn" style="display:none;" onclick="goNext()">Next →</button>
  </div>
</div>

<script>
const STEP_N = 4;

/* ── PHASE A: same family ── all chips start on a shelf ABOVE the
   single basket, so the drag motion reads as "pick this up, put it
   in the basket below." ── */
const PHASE_A_CHIPS = [
  { id: 'yellow',      label: 'Yellow',        v: '#ffc93c', family: true,  x: 0,  y: 2 },
  { id: 'yelorange',   label: 'Yellow-Orange', v: '#f9a826', family: true,  x: 18, y: 10 },
  { id: 'orange',      label: 'Orange',        v: '#f6871f', family: true,  x: 36, y: 2 },
  { id: 'redorange',   label: 'Red-Orange',    v: '#f2571c', family: true,  x: 54, y: 10 },
  { id: 'blue',        label: 'Blue',          v: '#2a7de1', family: false, x: 72, y: 2 },
  { id: 'purple',      label: 'Purple',        v: '#9b5de5', family: false, x: 88, y: 10 },
];

/* ── PHASE B: warm vs cool ── same shelf-above-buckets idea, two
   buckets side by side below. ── */
const PHASE_B_CHIPS = [
  { id: 'red',    label: 'Red',    v: '#ef4444', bin: 'warm', x: 0,  y: 2 },
  { id: 'orange2',label: 'Orange', v: '#f6871f', bin: 'warm', x: 18, y: 10 },
  { id: 'yellow2',label: 'Yellow', v: '#ffc93c', bin: 'warm', x: 36, y: 2 },
  { id: 'blue2',  label: 'Blue',   v: '#2a7de1', bin: 'cool', x: 54, y: 10 },
  { id: 'green2', label: 'Green',  v: '#22b573', bin: 'cool', x: 72, y: 2 },
  { id: 'purple2',label: 'Purple', v: '#9b5de5', bin: 'cool', x: 88, y: 10 },
];

let phase = 'A';
let positions = {};
let placed = new Set();
let dragState = null;

function renderPhaseA() {
  document.getElementById('kicker').textContent = 'Same Family';
  document.getElementById('headline').textContent = 'Drag the matching colors into the basket 🧺';
  document.getElementById('subline').textContent = "yellow, yellow-orange, orange, red-orange — they're cousins!";

  const field = document.getElementById('playfield');
  field.innerHTML = '';
  positions = {};
  placed = new Set();

  const basket = document.createElement('div');
  basket.className = 'zone';
  basket.id = 'zone-basket';
  basket.style.left = '30%'; basket.style.top = '48%';
  basket.style.width = '40%'; basket.style.height = '48%';
  basket.innerHTML = ColorShapes.bucketSVG({ fill: '#f9a826', stroke: '#8a5a1a', drip: '#f2571c', emoji: '🧡', label: 'family basket', width: 150, height: 118 });
  basket.querySelector('svg').style.cssText = 'width:100%;height:100%;';
  field.appendChild(basket);

  PHASE_A_CHIPS.forEach(c => spawnChip(c, field));
  updatePhaseLabel();
  setupBucketHandDemo();
}

function renderPhaseB() {
  document.getElementById('kicker').textContent = 'Warm & Cool';
  document.getElementById('headline').textContent = 'Sort into Warm ☀️ or Cool ❄️';
  document.getElementById('subline').textContent = 'drag each color where it belongs';

  const field = document.getElementById('playfield');
  field.innerHTML = '';
  positions = {};
  placed = new Set();

  const warm = document.createElement('div');
  warm.className = 'zone'; warm.id = 'zone-warm';
  warm.style.left = '2%'; warm.style.top = '48%';
  warm.style.width = '46%'; warm.style.height = '48%';
  warm.innerHTML = ColorShapes.bucketSVG({ fill: '#f6871f', stroke: '#8a3c10', drip: '#ef4444', emoji: '☀️', label: 'Warm', width: 150, height: 118 });
  warm.querySelector('svg').style.cssText = 'width:100%;height:100%;';
  field.appendChild(warm);

  const cool = document.createElement('div');
  cool.className = 'zone'; cool.id = 'zone-cool';
  cool.style.left = '52%'; cool.style.top = '48%';
  cool.style.width = '46%'; cool.style.height = '48%';
  cool.innerHTML = ColorShapes.bucketSVG({ fill: '#2a7de1', stroke: '#123a6e', drip: '#12aeb2', emoji: '❄️', label: 'Cool', width: 150, height: 118 });
  cool.querySelector('svg').style.cssText = 'width:100%;height:100%;';
  field.appendChild(cool);

  PHASE_B_CHIPS.forEach(c => spawnChip(c, field));
  updatePhaseLabel();
  setupBucketHandDemo();
}

// Guiding-hand demo (see core/tutorial-hand.js) — re-run for each phase
// since phase B swaps in a whole new set of chips/buckets that the kid
// hasn't seen yet, so it gets its own auto-play-once + replay button.
function setupBucketHandDemo() {
  document.querySelectorAll('.th-replay-btn').forEach(b => b.remove());
  const fromEl = phase === 'A' ? document.getElementById('chip-yellow') : document.getElementById('chip-red');
  const toEl = phase === 'A' ? document.getElementById('zone-basket') : document.getElementById('zone-warm');
  if (!fromEl || !toEl) return;
  TutorialHand.init({
    key: phase === 'A' ? 'cm_step4_phaseA' : 'cm_step4_phaseB',
    demo: { fromEl, toEl, hand: '👆' }
  });
}

function spawnChip(c, field) {
  positions[c.id] = { x: c.x, y: c.y };
  const el = document.createElement('div');
  el.className = 'chip';
  el.id = 'chip-' + c.id;
  el.style.left = positions[c.id].x + '%';
  el.style.top = positions[c.id].y + '%';
  el.innerHTML = ColorShapes.paintBlobSVG({ seed: c.id.length + c.x, color: c.v, size: 58, label: c.label });
  el.addEventListener('pointerdown', (e) => startDrag(e, c));
  field.appendChild(el);
}

function startDrag(e, c) {
  if (placed.has(c.id)) return;
  const field = document.getElementById('playfield');
  const el = document.getElementById('chip-' + c.id);
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');
  dragState = { c, fieldRect: field.getBoundingClientRect() };
  moveDrag(e);
  el.addEventListener('pointermove', moveDrag);
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

function moveDrag(e) {
  if (!dragState) return;
  const el = document.getElementById('chip-' + dragState.c.id);
  const rect = dragState.fieldRect;
  let xPct = ((e.clientX - rect.left) / rect.width) * 100;
  let yPct = ((e.clientY - rect.top) / rect.height) * 100;
  xPct = Math.max(0, Math.min(88, xPct));
  yPct = Math.max(0, Math.min(85, yPct));
  el.style.left = xPct + '%';
  el.style.top = yPct + '%';
  positions[dragState.c.id] = { x: xPct, y: yPct };
  highlightZones(el);
}

function highlightZones(el) {
  document.querySelectorAll('.zone').forEach(z => {
    z.classList.toggle('hover', rectsOverlap(el.getBoundingClientRect(), z.getBoundingClientRect()));
  });
}

function rectsOverlap(a, b) {
  const ac = { x: a.left + a.width/2, y: a.top + a.height/2 };
  return ac.x > b.left && ac.x < b.right && ac.y > b.top && ac.y < b.bottom;
}

function endDrag(e) {
  if (!dragState) return;
  const c = dragState.c;
  const el = document.getElementById('chip-' + c.id);
  el.classList.remove('dragging');
  el.removeEventListener('pointermove', moveDrag);
  el.removeEventListener('pointerup', endDrag);
  el.removeEventListener('pointercancel', endDrag);
  dragState = null;
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('hover'));

  if (phase === 'A') {
    const basket = document.getElementById('zone-basket');
    const hit = rectsOverlap(el.getBoundingClientRect(), basket.getBoundingClientRect());
    if (hit && c.family) {
      settleChip(c, el, basket);
    } else if (hit && !c.family) {
      bounceHome(c, el);
    }
  } else {
    ['warm', 'cool'].forEach(binName => {
      const zone = document.getElementById('zone-' + binName);
      const hit = rectsOverlap(el.getBoundingClientRect(), zone.getBoundingClientRect());
      if (hit && c.bin === binName) settleChip(c, el, zone);
      else if (hit && c.bin !== binName) bounceHome(c, el);
    });
  }
}

function settleChip(c, el, zone) {
  const field = document.getElementById('playfield');
  const fieldRect = field.getBoundingClientRect();
  const zoneRect = zone.getBoundingClientRect();
  const slot = placed.size % 4;
  const cx = ((zoneRect.left - fieldRect.left) + zoneRect.width * (0.28 + (slot % 2) * 0.44)) / fieldRect.width * 100;
  const cy = ((zoneRect.top - fieldRect.top) + zoneRect.height * (0.35 + Math.floor(slot/2) * 0.4)) / fieldRect.height * 100;
  el.style.left = cx + '%';
  el.style.top = cy + '%';
  el.classList.add('placed');
  placed.add(c.id);
  updatePhaseLabel();
  checkPhaseComplete();
}

function bounceHome(c, el) {
  const original = phase === 'A'
    ? PHASE_A_CHIPS.find(x => x.id === c.id)
    : PHASE_B_CHIPS.find(x => x.id === c.id);
  el.style.left = original.x + '%';
  el.style.top = original.y + '%';
}

function updatePhaseLabel() {
  const total = phase === 'A' ? 4 : 6;
  document.getElementById('phaseLabel').textContent = placed.size + ' of ' + total + (phase === 'A' ? ' found' : ' sorted');
}

function checkPhaseComplete() {
  if (phase === 'A' && placed.size === 4) {
    ColorState.markInProgress(STEP_N);
    setTimeout(() => {
      phase = 'B';
      renderPhaseB();
      ColorVoice.say(STEP_N, "Is this color warm like the sun, or cool like the ocean? Drag it into the right bucket!");
    }, 700);
  } else if (phase === 'B' && placed.size === 6) {
    ColorState.markCompleted(STEP_N);
    document.getElementById('nextBtn').style.display = 'block';
  }
}

function goNext() {
  window.location.href = '../step-5/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'color-magic');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  ColorShapes.injectDefs();
  ColorState.markVisited(STEP_N);
  renderPhaseA();
  ColorVoice.init(STEP_N, 'Drag each matching color into the bucket!');
}

init();
</script>
</body>
</html>
