<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 2 · Explore the Studio · Dream Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/studio-style.css">

<!-- Art GPS access control (loaded before this page's script so FEIAccess is available) -->
<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<!-- Shared step/state module -->
<script src="../shared/studio-state.js"></script>

<style>
  /* Faye's own inspired artwork (a painted shoebox diorama) — real
     photo now available, replacing the old text-only MoMA placeholder
     frame (2026-09-03). */
  .artwork-frame {
    border-radius: 16px;
    border: 6px solid var(--gold);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(44,30,16,0.22);
    margin-bottom: 10px;
    line-height: 0;
    position: relative;
  }
  .artwork-frame img { display: block; width: 100%; height: auto; }
  .artwork-frame .af-pulse-ring {
    position: absolute; inset: 0;
    border-radius: 10px;
    border: 4px solid var(--gold);
    opacity: 0;
  }
  .artwork-frame .af-pulse-ring.pulsing { animation: pulseRing 0.9s ease-out; }
  @keyframes pulseRing {
    0% { opacity: 0.9; transform: scale(0.94); }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* Original-painting link — a real button now, not tiny italic text
     (2026-09-04, per Faye: it was too easy to miss). */
  .original-link-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--cream); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 14px;
    padding: 13px 16px; margin: 0 0 16px;
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px;
    text-decoration: none; text-align: center;
    box-shadow: 0 3px 10px rgba(44,30,16,0.15);
    transition: transform .15s ease;
  }
  .original-link-btn:active { transform: scale(0.98); }

  .artwork-caption {
    text-align: center; font-size: 12.5px; font-style: italic;
    color: var(--ink-soft); margin-bottom: 22px; line-height: 1.55;
  }

  .objects-progress {
    text-align: center; font-size: 12.5px; font-weight: 800; color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .objects-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    margin-bottom: 8px;
  }
  @media (min-width: 480px) { .objects-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 768px) { .objects-grid { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Explore the Studio</p>
  <div class="stops-pill">STEP 2 OF 9</div>
</div>

<div class="content-wrap">

  <div class="page-hero">
    <h1>Explore the Studio</h1>
    <p>What can you find in this studio? Tap every object you spot.</p>
  </div>

  <div class="artwork-frame" id="artworkFrame">
    <div class="af-pulse-ring" id="pulseRing"></div>
    <img src="https://imagedelivery.net/IoNSXjEbekGjbxAZrhrYGQ/ee229d4d-10e7-4dc8-f174-7ebc98d7fa00/public" alt="Faye's painted shoebox-diorama studio, inspired by Henri Matisse's The Red Studio — pink watercolor-stripe walls, a wood-plank floor, an easel, an armchair with a cat, a pink dresser, and a bookshelf">
  </div>

  <a class="original-link-btn" href="https://www.moma.org/collection/works/78389" target="_blank" rel="noopener">🖼 See the original: The Red Studio (1911) — MoMA →</a>

  <div class="artwork-caption">Look at the picture carefully. Then come back here and tap every object you can find.</div>

  <div class="objects-progress" id="objectsProgress">0 of 12 objects found</div>

  <div class="objects-grid" id="objectsGrid"></div>

  <div id="feedbackSlot"></div>

  <div class="next-footer">
    <button class="btn btn-gold" id="continueBtn" onclick="goNext()" disabled>Continue →</button>
    <div id="readyAnywayWrap" style="text-align:center; margin-top:10px;">
      <button class="btn btn-ghost" onclick="goNext()" style="font-size:12px; padding:10px;">I'm ready to move on</button>
    </div>
  </div>

</div>

<script>
const STEP_N = 2;
const UNLOCK_THRESHOLD = 8;

const OBJECTS = [
  { key: 'chair', icon: '🪑', label: 'Chair' },
  { key: 'easel', icon: '🎨', label: 'Easel' },
  { key: 'painting', icon: '🖼', label: 'Painting' },
  { key: 'plant', icon: '🪴', label: 'Plant' },
  { key: 'rug', icon: '🟥', label: 'Rug' },
  { key: 'sculpture', icon: '🗿', label: 'Sculpture' },
  { key: 'window', icon: '🪟', label: 'Window' },
  { key: 'table', icon: '🛋', label: 'Table' },
  { key: 'lamp', icon: '💡', label: 'Lamp' },
  { key: 'frame', icon: '🖼️', label: 'Frame' },
  { key: 'screen', icon: '🚪', label: 'Screen' },
  { key: 'books', icon: '📚', label: 'Books' },
];

const FEEDBACK_LINES = ["Good eye!", "Found it!", "An artist always notices that."];
let feedbackIdx = 0;

function renderObjects() {
  const data = DreamState.getStepData(STEP_N);
  const found = data.found || [];

  const grid = document.getElementById('objectsGrid');
  grid.innerHTML = OBJECTS.map(o => `
    <div class="check-card ${found.includes(o.key) ? 'checked' : ''}" onclick="toggleObject('${o.key}')">
      <div class="check-box">${found.includes(o.key) ? '✓' : ''}</div>
      <div class="check-label">${o.icon} ${o.label}</div>
    </div>
  `).join('');

  document.getElementById('objectsProgress').textContent = found.length + ' of ' + OBJECTS.length + ' objects found';

  const continueBtn = document.getElementById('continueBtn');
  const readyAnywayWrap = document.getElementById('readyAnywayWrap');
  if (found.length >= UNLOCK_THRESHOLD) {
    continueBtn.removeAttribute('disabled');
    readyAnywayWrap.style.display = 'none';
  } else {
    continueBtn.setAttribute('disabled', 'disabled');
    readyAnywayWrap.style.display = 'block';
  }
}

function toggleObject(key) {
  const data = DreamState.getStepData(STEP_N);
  const found = data.found || [];
  const idx = found.indexOf(key);
  const nowFound = idx === -1;

  if (nowFound) {
    found.push(key);
  } else {
    found.splice(idx, 1);
  }
  DreamState.setStepData(STEP_N, { found: found });
  DreamState.markInProgress(STEP_N);

  if (nowFound) {
    showFeedback(FEEDBACK_LINES[feedbackIdx % FEEDBACK_LINES.length]);
    feedbackIdx++;
    pulseArtwork();
  }

  renderObjects();
}

function showFeedback(text) {
  document.getElementById('feedbackSlot').innerHTML = `
    <div class="artchi-bubble">
      <div class="ab-icon">✨</div>
      <div class="ab-text">${text}</div>
    </div>
  `;
}

function pulseArtwork() {
  const ring = document.getElementById('pulseRing');
  ring.classList.remove('pulsing');
  void ring.offsetWidth; // restart animation
  ring.classList.add('pulsing');
}

function goNext() {
  DreamState.markCompleted(STEP_N);
  window.location.href = '../step-3/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'dream-art-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  DreamState.markVisited(STEP_N);
  renderObjects();
}

init();
</script>
</body>
</html>
