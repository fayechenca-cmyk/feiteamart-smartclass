<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 8 · Final Details · Dream Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/studio-style.css">

<!-- Art GPS access control (loaded before this page's script so FEIAccess is available) -->
<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<!-- Shared step/state module -->
<script src="../shared/studio-state.js"></script>

<style>
  /* Background is the shared Matisse Pink Studio default — no
     page-scoped override needed. */
  .details-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .complete-wrap { text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Final Details</p>
  <div class="stops-pill">STEP 8 OF 9</div>
</div>

<div class="content-wrap">

  <div class="page-hero">
    <h1>Add the Finishing Touches</h1>
    <p>Small details make a big difference.</p>
  </div>

  <div class="details-list" id="detailsList"></div>

  <div id="feedbackSlot"></div>

  <div class="complete-wrap">
    <button class="btn btn-gold" id="completeBtn" onclick="toggleComplete()">✓ My studio is finished!</button>
  </div>

  <div class="next-footer">
    <button class="btn btn-ghost" onclick="goNext()">Continue →</button>
  </div>

</div>

<script>
const STEP_N = 8;

const DETAILS = [
  { key: 'patterns', label: 'Add patterns to your objects' },
  { key: 'tinydetails', label: 'Add tiny details (buttons, textures, dots)' },
  { key: 'surprise', label: 'Add a pet or small surprise' },
  { key: 'frame', label: 'Add a frame to a painting' },
  { key: 'signature', label: 'Sign your name somewhere hidden' },
];

const FEEDBACK_LINES = ['Nice touch!', "That's so Matisse!", 'Artists love hidden signatures.'];
let feedbackIdx = 0;

function getChecked() {
  return DreamState.getStepData(STEP_N).checked || [];
}

function renderDetails() {
  const checked = getChecked();
  const listEl = document.getElementById('detailsList');
  listEl.innerHTML = DETAILS.map(d => `
    <div class="check-card ${checked.includes(d.key) ? 'checked' : ''}" onclick="toggleDetail('${d.key}')">
      <div class="check-box">${checked.includes(d.key) ? '✓' : ''}</div>
      <div class="check-label">${d.label}</div>
    </div>
  `).join('');
}

function toggleDetail(key) {
  const checked = getChecked();
  const idx = checked.indexOf(key);
  const nowChecked = idx === -1;
  if (nowChecked) checked.push(key); else checked.splice(idx, 1);
  DreamState.setStepData(STEP_N, { checked: checked });
  DreamState.markInProgress(STEP_N);

  if (nowChecked) {
    showFeedback(FEEDBACK_LINES[feedbackIdx % FEEDBACK_LINES.length]);
    feedbackIdx++;
  }
  renderDetails();
}

function showFeedback(text) {
  document.getElementById('feedbackSlot').innerHTML = `
    <div class="artchi-bubble">
      <div class="ab-icon">✨</div>
      <div class="ab-text">${text}</div>
    </div>
  `;
}

function toggleComplete() {
  DreamState.markInProgress(STEP_N);
  DreamState.markCompleted(STEP_N);
  const btn = document.getElementById('completeBtn');
  btn.textContent = '✓ Studio finished!';
  btn.classList.add('btn-primary');
  btn.classList.remove('btn-gold');
}

function goNext() {
  DreamState.markCompleted(STEP_N);
  window.location.href = '../step-9/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'dream-art-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  DreamState.markVisited(STEP_N);
  if (DreamState.getStatus(STEP_N) === 'completed') {
    const btn = document.getElementById('completeBtn');
    btn.textContent = '✓ Studio finished!';
    btn.classList.add('btn-primary');
    btn.classList.remove('btn-gold');
  }
  renderDetails();
}

init();
</script>
</body>
</html>
