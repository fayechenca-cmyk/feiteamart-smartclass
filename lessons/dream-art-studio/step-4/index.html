<style>
  /* Background is the shared Matisse Pink Studio default from
     studio-style.css now — no page-scoped override needed here any
     more (2026-09-03 redesign). */

  .inspo-image-wrap {
    margin: 0 0 22px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(26,29,43,0.14);
    line-height: 0;
  }
  .inspo-image { display: block; width: 100%; height: auto; }

  .objects-progress {
    text-align: center; font-size: 12.5px; font-weight: 800; color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .empty-hint {
    text-align: center; font-size: 13px; color: var(--ink-soft);
    background: #fff; border-radius: 16px; padding: 20px; line-height: 1.6;
  }
  .empty-hint a { color: var(--gold); font-weight: 800; text-decoration: none; }

  /* ── Object accordion card ─────────────────────────────────── */
  .obj-card {
    background: #fff; border-radius: 18px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(26,29,43,0.08);
    overflow: hidden;
    border: 2px solid transparent;
  }
  .obj-card.done { border-color: rgba(29,158,117,0.4); }

  .obj-card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .obj-card-header .oc-emoji { font-size: 26px; flex-shrink: 0; }
  .obj-card-header .oc-body { flex: 1; min-width: 0; }
  .obj-card-header .oc-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14.5px; }
  .obj-card-header .oc-summary {
    font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4;
  }
  .obj-card-header .oc-check {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--green); color: #fff; font-weight: 900; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .obj-card-header .oc-chevron { flex-shrink: 0; font-size: 13px; color: var(--ink-muted); transition: transform .2s ease; }
  .obj-card.expanded .oc-chevron { transform: rotate(180deg); }

  /* Body HTML is only rendered at all for the expanded card now (see
     renderList()) — no CSS display:none toggle needed for 10-15 objects'
     worth of pills+preview+canvas to sit inert in the DOM. */
  .obj-card-body { padding: 0 18px 20px; }

  .category-block { margin-bottom: 16px; }
  .category-label {
    font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 8px;
  }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(26,29,43,0.05);
    border: 2px solid transparent;
    border-radius: 16px; padding: 6px 10px;
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .choice-pill:active { transform: scale(0.96); }
  .choice-pill.selected {
    background: rgba(43,76,214,0.16); border-color: var(--gold); color: var(--ink);
  }
  .choice-pill .cp-icon { font-size: 13px; line-height: 1; flex-shrink: 0; }

  /* ── Color category: real color swatches instead of text pills ── */
  .color-row { gap: 10px; padding-top: 2px; }
  .color-chip {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(26,29,43,0.12);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .color-chip:active { transform: scale(0.92); }
  .color-chip.selected { box-shadow: 0 0 0 2.5px var(--gold); }

  .summary-box {
    background: rgba(43,76,214,0.1); border-radius: 14px; padding: 14px 16px;
    margin: 6px 0 16px;
  }
  .summary-box .sb-label {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 5px;
  }
  .summary-box .sb-text { font-size: 13.5px; color: var(--ink); line-height: 1.55; font-style: italic; }
  .summary-box .sb-text.sb-empty { color: var(--ink-muted); font-style: normal; }

  .done-btn {
    width: 100%; padding: 13px; border: none; border-radius: 14px;
    background: var(--green); color: #fff; font-family: 'Montserrat', sans-serif;
    font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .done-btn:active { transform: scale(0.98); }

  .skip-wrap { text-align: center; margin-top: 10px; }

  /* ── Description sentence (2026-09-07 — replaces the deleted SVG
     auto-preview) — builds live as the pills above get picked, same
     word-form helpers as buildSummary(). Plain text, no shape box. ── */
  .description-sentence {
    text-align: center; font-size: 13.5px; color: var(--ink-soft);
    font-style: italic; margin: 4px 0 16px; line-height: 1.5; min-height: 18px;
  }

  /* ── Color palette callout — same Color pills as the category block
     above, just re-surfaced right by the canvas as a reminder that
     picking one also sets the brush. ── */
  .brush-color-hint {
    text-align: center; font-size: 11.5px; color: var(--ink-muted); margin: 0 0 10px;
  }

  /* ── Drawing canvas card ──────────────────────────────────────── */
  .canvas-card {
    background: var(--cream); border-radius: 16px; padding: 16px;
    box-shadow: 0 2px 10px rgba(44,30,16,0.08);
  }
  .canvas-label { font-size: 13px; font-weight: 800; color: var(--ink); text-align: center; margin: 0 0 10px; }
  .canvas-controls { margin-bottom: 10px; }
  .canvas-tool-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .brush-size-row { display: flex; align-items: center; gap: 8px; }
  .brush-size-dot {
    background: var(--ink); border-radius: 50%; cursor: pointer; flex-shrink: 0;
    border: 2px solid #fff; box-shadow: 0 0 0 1.5px rgba(44,30,16,.18);

  .brush-size-dot.picked { box-shadow: 0 0 0 2.5px var(--gold); }
  .eraser-btn, .clear-btn {

  .eraser-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .mini-canvas-wrap {
    width: 100%; max-width: 300px; aspect-ratio: 1/1; margin: 0 auto;
    border-radius: 12px; overflow: hidden; border: 2.5px solid var(--ink);
    box-shadow: 0 4px 14px rgba(44,30,16,.14); touch-action: none;
  }
  .mini-canvas-wrap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .canvas-hint { text-align: center; font-size: 11.5px; color: var(--ink-muted); margin: 8px 0 0; }

  .save-drawing-wrap { text-align: center; margin-top: 12px; }
  .save-drawing-btn {
    border: 2px solid var(--ink); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 10px 18px; font-family: 'Montserrat', sans-serif;
    font-weight: 800; font-size: 12.5px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease;
  }
  .save-drawing-btn:active { transform: scale(0.97); }

    border-radius: 16px; padding: 16px; margin-bottom: 16px;
    font-weight: 800; font-size: 13.5px; color: var(--green);
  }
</style>

<script>
const STEP_N = 4;

// Same object catalog as Step 3 (each page is self-contained, matching
// the rest of this course) — only icon/label are needed here.
// Matches Step 3's actual HOTSPOTS names exactly (2026-09-07 fix — this
// catalog still had its original slug keys like 'plants'/'sofa' from
// before Step 3's objects were renamed to 'Plants'/'Sofa'/etc., so every
// object was silently falling back to the generic ✨ icon below).
const DREAM_OBJECTS = [
  { key: 'Rug', icon: '🟥', label: 'Rug' },
  { key: 'Lamp', icon: '💡', label: 'Lamp' },
  { key: 'Sofa', icon: '🛋️', label: 'Sofa' },
  { key: 'Cat', icon: '🐱', label: 'Cat' },
  { key: 'Plants', icon: '🪴', label: 'Plants' },
  { key: 'Easel', icon: '🎨', label: 'Easel' },
  { key: 'Vase', icon: '🏺', label: 'Vase' },
  { key: 'Cabinet', icon: '🗄️', label: 'Cabinet' },
  { key: 'Stool', icon: '🪑', label: 'Stool' },
  { key: 'Sculpture', icon: '🗿', label: 'Sculpture' },
  { key: 'Pen Cup', icon: '✏️', label: 'Pen Cup' },
  { key: 'Table', icon: '🍽️', label: 'Table' },
  { key: 'Painting', icon: '🖼️', label: 'Painting' },
];
const OBJECT_BY_KEY = {};
DREAM_OBJECTS.forEach(o => { OBJECT_BY_KEY[o.key] = o; });

const CATEGORIES = [
  { key: 'shape', label: 'Shape?', options: ['Round', 'Tall', 'Floating', 'Funny', 'Curved', 'Tiny', 'Giant'] },
  { key: 'color', label: 'Color?', options: ['Blue', 'Pink', 'Yellow', 'Green', 'Red', 'Rainbow', 'Monochrome', 'Gold'] },
  { key: 'pattern', label: 'Pattern?', options: ['Stars', 'Egyptian', 'Floral', 'Checkerboard', 'Dots', 'Stripes', 'Leaves', 'Plain'] },
  { key: 'material', label: 'Material?', options: ['Wood', 'Cloud', 'Glass', 'Fabric', 'Stone', 'Metal', 'Paper', 'Magic'] },
  { key: 'magic', label: 'Magic Detail?', options: ['Can fly', 'Changes color', 'Grows flowers', 'Has tiny wheels', 'Glows in dark', 'Plays music', 'Talks', 'Invisible sometimes'] },
];

// Compact-pill icons (all categories except color, which uses real
// swatches below) — purely visual, keyed by the same option strings
// CATEGORIES already uses, so selection/summary logic is untouched.
const OPTION_ICONS = {
  Round: '⚪', Tall: '📏', Floating: '☁️', Funny: '🤪', Curved: '🌀', Tiny: '🔬', Giant: '🦣',
  Stars: '⭐', Egyptian: '𓋹', Floral: '🌸', Checkerboard: '♟️', Dots: '🔴', Stripes: '〰️', Leaves: '🍃', Plain: '⬜',
  Wood: '🪵', Cloud: '☁️', Glass: '🔷', Fabric: '🧵', Stone: '🪨', Metal: '🔩', Paper: '📄', Magic: '✨',
  'Can fly': '🕊️', 'Changes color': '🌈', 'Grows flowers': '🌷', 'Has tiny wheels': '🛞',
  'Glows in dark': '🌟', 'Plays music': '🎵', 'Talks': '💬', 'Invisible sometimes': '👻',
};

// Matches the site's actual Matisse Pink Studio palette now (2026-09-05
// fix — these used to be leftover pre-redesign colors that didn't match
// anything else on the page). Same map drives Section 1's swatches,
// Section 2's live preview fill, and Section 3's brush-color picker.
const COLOR_SWATCHES = {
  Blue: '#2b4cd6', Pink: '#e88ca0', Yellow: '#e8c030', Green: '#2b8a3e',
  Red: '#c92a2a', Gold: '#c8a96e',
  Rainbow: 'linear-gradient(45deg,red,orange,yellow,green,blue,purple)',
  Monochrome: '#555',
};
// A single solid color to draw with when the chosen "color" is really a
// multi-color concept (a canvas brush can't stroke in a gradient without
// real complexity the spec explicitly said to skip).
const COLOR_SOLID_FOR_BRUSH = Object.assign({}, COLOR_SWATCHES, {
  Rainbow: '#c92a2a', Monochrome: '#555'
});

const BRUSH_SIZES = [
  { key: 'thin', width: 2, dotPx: 10 },
  { key: 'medium', width: 5, dotPx: 16 },
  { key: 'thick', width: 10, dotPx: 22 },
];

// Small grammar helpers so the auto-generated sentence reads naturally —
// most options already work as plain lowercase adjectives, these three
// just fix the handful that wouldn't ("Wood" -> "wooden", "Stars" ->
// "star patterns", "Grows flowers" -> "can grow flowers").
const MATERIAL_ADJ = { Wood: 'wooden', Magic: 'magical' };
const PATTERN_NOUN = { Stars: 'star', Dots: 'dot', Stripes: 'stripe', Leaves: 'leaf' };
const MAGIC_VERB = {
  'Can fly': 'fly',
  'Changes color': 'change color',
  'Grows flowers': 'grow flowers',
  'Has tiny wheels': 'have tiny wheels',
  'Glows in dark': 'glow in the dark',
  'Plays music': 'play music',
  'Talks': 'talk',
  'Invisible sometimes': 'be invisible sometimes',
};

let expandedKey = null;

function buildSummary(objectLabel, c) {
  if (!c.shape || !c.color || !c.material || !c.pattern || !c.magic) return null;
  const material = (MATERIAL_ADJ[c.material] || c.material).toLowerCase();
  const patternWord = PATTERN_NOUN[c.pattern] || c.pattern;
  const pattern = patternWord === 'Egyptian' ? patternWord : patternWord.toLowerCase();
  const magic = MAGIC_VERB[c.magic] || c.magic.toLowerCase();
  return `A ${c.shape.toLowerCase()} ${c.color.toLowerCase()} ${material} ${objectLabel.toLowerCase()} `
    + `with ${pattern} patterns that can ${magic}.`;
}

// A short live sentence under the pills — updates as soon as ANY
// category is picked, unlike buildSummary() above (which stays null,
// and gates the Done button, until all 5 are chosen). No visual shape
// box any more (2026-09-07 — the auto-preview was cut as meaningless
// abstract rectangles); this is plain text only. Reuses the same
// word-form helpers so the phrasing matches once both are showing.
function buildDescriptionSentence(c) {
  const parts = [];
  if (c.shape) parts.push(c.shape.toLowerCase());
  if (c.color) parts.push(c.color.toLowerCase());
  if (c.material) parts.push((MATERIAL_ADJ[c.material] || c.material).toLowerCase());
  let sentence = parts.length ? 'A ' + parts.join(' ') : 'Pick some options above';
  if (c.pattern && c.pattern !== 'Plain') {
    const patternWord = PATTERN_NOUN[c.pattern] || c.pattern;
    sentence += ' with ' + (patternWord === 'Egyptian' ? patternWord : patternWord.toLowerCase()) + ' patterns';
  }
  return sentence + (parts.length ? '...' : ' to see your object come together!');
}

/* ============================================================
   SECTION 3 — mini drawing canvas. Lazy: markup only exists for the
   currently-expanded object (see renderList()'s isExpanded gate), and
   initCanvasForExpanded() (re)wires + restores it every render — no
   more than one <canvas> is ever in the DOM at once.
============================================================ */
// Brush color is no longer picked here — it comes straight from the
// Color pill above (2026-09-07: those five pill rows are now purely
// color pickers for the brush, not shape-generator inputs), so this
// card only needs brush size + eraser + clear + the canvas itself.
function renderCanvasCard(key, c) {
  const sizeDots = BRUSH_SIZES.map(s => `
    <div class="brush-size-dot" data-width="${s.width}" style="width:${s.dotPx}px;height:${s.dotPx}px;" title="${s.key}" onclick="event.stopPropagation(); pickBrushSize('${key}',${s.width},this)"></div>
  `).join('');
  return `
    <div class="canvas-card">
      <p class="canvas-label">✏️ Now draw it your way!</p>
      ${c.color ? `<p class="brush-color-hint">Brush color: <strong>${c.color}</strong> — pick a different Color pill above to change it</p>` : `<p class="brush-color-hint">Pick a Color above to set your brush</p>`}
      <div class="canvas-controls">
        <div class="canvas-tool-row">
          <div class="brush-size-row">${sizeDots}</div>
          <button class="eraser-btn" id="eraserBtn-${key}" onclick="event.stopPropagation(); toggleEraser('${key}')">🧹 Eraser</button>
          <button class="clear-btn" onclick="event.stopPropagation(); clearMiniCanvas('${key}')">🗑 Clear</button>
        </div>
      </div>
      <div class="mini-canvas-wrap" onclick="event.stopPropagation();">
        <canvas id="canvas-${key}"></canvas>
      </div>
      <p class="canvas-hint">Use the color you chose above — or switch it any time</p>
      <div class="save-drawing-wrap">
        <button class="save-drawing-btn" id="saveDrawingBtn-${key}" onclick="event.stopPropagation(); saveDrawingWithFeedback('${key}')">💾 Save this drawing</button>
      </div>
    </div>
  `;
}

let drawState = { color: '#2c1e10', width: 5, eraser: false, drawing: false, last: null };

function paintCanvasBackground(ctx, w, h) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(44,30,16,0.1)';
  const spacing = Math.max(16, Math.round(w / 16));
  for (let y = spacing; y < h; y += spacing) {
    for (let x = spacing; x < w; x += spacing) {
      ctx.beginPath();
      ctx.arc(x, y, Math.max(1, w / 220), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
function canvasPos(canvas, e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}

// Only ever one canvas in the DOM (the expanded object's) — called
// after every renderList(), a no-op when there's nothing to wire up.
function initCanvasForExpanded() {
  if (!expandedKey) return;
  const canvas = document.getElementById('canvas-' + expandedKey);
  if (!canvas) return;

  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth || 300;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  paintCanvasBackground(ctx, canvas.width, canvas.height);

  const customizations = getCustomizations();
  const c = customizations[expandedKey] || {};
  const saved = c.drawingDataUrl;
  if (saved) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = saved;
  }

  // Brush pre-seeded from Section 1's chosen color, same as any other
  // fresh open of this object — doesn't retroactively follow later
  // color-pill edits mid-drawing.
  const seedColor = c.color ? (COLOR_SOLID_FOR_BRUSH[c.color] || '#2c1e10') : '#2c1e10';
  drawState = { color: seedColor, width: 5, eraser: false, drawing: false, last: null };
  syncCanvasControlHighlights(expandedKey);

  canvas.onpointerdown = (e) => {
    drawState.drawing = true;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    drawState.last = canvasPos(canvas, e);
  };
  canvas.onpointermove = (e) => {
    if (!drawState.drawing) return;
    const p = canvasPos(canvas, e);
    ctx.strokeStyle = drawState.eraser ? '#ffffff' : drawState.color;
    ctx.lineWidth = drawState.width * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(drawState.last.x, drawState.last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    drawState.last = p;
  };
  canvas.onpointerup = () => { drawState.drawing = false; saveCanvasDrawing(expandedKey); };
  canvas.onpointercancel = () => { drawState.drawing = false; };
}

function syncCanvasControlHighlights(key) {
  document.querySelectorAll('.brush-size-dot').forEach(el => {
    el.classList.toggle('picked', Number(el.dataset.width) === drawState.width);
  });
  const eraserBtn = document.getElementById('eraserBtn-' + key);
  if (eraserBtn) eraserBtn.classList.toggle('active', drawState.eraser);
}

function pickBrushSize(key, width, el) {
  drawState.width = width;
  syncCanvasControlHighlights(key);
}
function toggleEraser(key) {
  drawState.eraser = !drawState.eraser;
  syncCanvasControlHighlights(key);
}
function clearMiniCanvas(key) {
  if (!confirm('Clear your drawing? This cannot be undone.')) return;
  const canvas = document.getElementById('canvas-' + key);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  paintCanvasBackground(ctx, canvas.width, canvas.height);
  saveCanvasDrawing(key);
}
function saveCanvasDrawing(key) {
  const canvas = document.getElementById('canvas-' + key);
  if (!canvas) return;
  try {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    const customizations = getCustomizations();
    const current = customizations[key] || {};
    current.drawingDataUrl = dataUrl;
    customizations[key] = current;
    DreamState.setStepData(STEP_N, { customizations: customizations });
  } catch (e) {
    console.warn('[canvas] save failed', e);
  }
}
// Explicit "💾 Save this drawing" button (spec item 4) — same save as
// the automatic pointerup/toggleExpanded/markDone saves, just with a
// visible confirmation so a student who wants to be sure can tap it.
function saveDrawingWithFeedback(key) {
  saveCanvasDrawing(key);
  const btn = document.getElementById('saveDrawingBtn-' + key);
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = '✓ Saved!';
  btn.classList.add('saved');
  setTimeout(() => {
    if (document.getElementById('saveDrawingBtn-' + key)) {
      btn.textContent = original;
      btn.classList.remove('saved');
    }
  }, 1200);
}

function getCustomizations() {
  return DreamState.getStepData(STEP_N).customizations || {};
}

function renderList() {
  const selected = DreamState.getStepData(3).selected || [];
  const customizations = getCustomizations();
  const listEl = document.getElementById('objectsList');
  const emptyHintSlot = document.getElementById('emptyHintSlot');

  if (selected.length === 0) {
    listEl.innerHTML = '';
    emptyHintSlot.innerHTML = `
      <div class="empty-hint">You didn't pick any objects yet — <a href="../step-3/">go back to Step 3</a> to choose a few first.</div>
    `;
    document.getElementById('objectsProgress').textContent = '';
    document.getElementById('nextFooter').style.display = 'none';
    return;
  }
  emptyHintSlot.innerHTML = '';

  const doneCount = selected.filter(k => customizations[k] && customizations[k].done).length;
  document.getElementById('objectsProgress').textContent = doneCount + ' of ' + selected.length + ' objects designed';

  const banner = document.getElementById('allDoneBanner');
  banner.innerHTML = (selected.length > 0 && doneCount >= selected.length)
    ? `<div class="all-done-banner">🎉 All objects designed! Continue →</div>`
    : '';

  listEl.innerHTML = selected.map(key => {
    const obj = OBJECT_BY_KEY[key] || { icon: '✨', label: key };
    const c = customizations[key] || {};
    const isDone = !!c.done;
    const isExpanded = expandedKey === key;
    const summary = buildSummary(obj.label, c);

    return `
      <div class="obj-card ${isDone ? 'done' : ''} ${isExpanded ? 'expanded' : ''}" id="card-${key}">
        <div class="obj-card-header" onclick="toggleExpanded('${key}')">
          <div class="oc-emoji">${obj.icon}</div>
          <div class="oc-body">
            <div class="oc-name">Design Your ${obj.label}</div>
            ${isDone && summary ? `<div class="oc-summary">${summary}</div>` : ''}
          </div>
          ${isDone ? '<div class="oc-check">✓</div>' : '<div class="oc-chevron">▾</div>'}
        </div>
        ${isExpanded ? `
        <div class="obj-card-body">
          ${CATEGORIES.map(cat => `
            <div class="category-block">
              <div class="category-label">${cat.label}</div>
              <div class="pill-row ${cat.key === 'color' ? 'color-row' : ''}">
                ${cat.key === 'color'
                  ? cat.options.map(opt => `
                      <div class="color-chip ${c[cat.key] === opt ? 'selected' : ''}" style="background:${COLOR_SWATCHES[opt]};" title="${opt}" onclick="event.stopPropagation(); selectOption('${key}', '${cat.key}', '${opt}')"></div>
                    `).join('')
                  : cat.options.map(opt => `
                      <div class="choice-pill ${c[cat.key] === opt ? 'selected' : ''}" onclick="event.stopPropagation(); selectOption('${key}', '${cat.key}', '${opt}')">
                        <span class="cp-icon">${OPTION_ICONS[opt] || '•'}</span>${opt}
                      </div>
                    `).join('')}
              </div>
            </div>
          `).join('')}

          <p class="description-sentence">${buildDescriptionSentence(c)}</p>

          ${renderCanvasCard(key, c)}

          <button class="done-btn" onclick="event.stopPropagation(); markDone('${key}')">✓ Done with this object</button>
        </div>
        ` : ''}
      </div>
    `;
  }).join('');

  const footer = document.getElementById('nextFooter');
  const skipWrap = document.getElementById('skipWrap');
  if (doneCount > 0) {
    footer.style.display = 'block';
    skipWrap.style.display = doneCount >= selected.length ? 'none' : 'block';
  } else {
    footer.style.display = 'none';
  }

  // The expanded card's canvas (if any) is a fresh DOM node every render
  // — reinitialize + restore it every time.
  initCanvasForExpanded();
}

function toggleExpanded(key) {
  // Flush any in-progress drawing before the canvas element it lives on
  // gets torn down by the re-render below.
  if (expandedKey) saveCanvasDrawing(expandedKey);
  expandedKey = (expandedKey === key) ? null : key;
  renderList();
  if (expandedKey) {
    const el = document.getElementById('card-' + key);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function selectOption(key, categoryKey, option) {
  const customizations = getCustomizations();
  const current = customizations[key] || {};
  current[categoryKey] = option;
  customizations[key] = current;
  DreamState.setStepData(STEP_N, { customizations: customizations });
  DreamState.markInProgress(STEP_N);
  renderList();
}

function markDone(key) {
  saveCanvasDrawing(key);
  const customizations = getCustomizations();
  const current = customizations[key] || {};
  current.done = true;
  customizations[key] = current;
  DreamState.setStepData(STEP_N, { customizations: customizations });

  // Auto-advance the accordion to the next not-yet-done object.
  const selected = DreamState.getStepData(3).selected || [];
  const next = selected.find(k => k !== key && !(customizations[k] && customizations[k].done));
  expandedKey = next || null;

  const allDone = selected.every(k => customizations[k] && customizations[k].done);
  if (allDone) DreamState.markCompleted(STEP_N);

  renderList();
}

function goNext() {
  DreamState.markCompleted(STEP_N);
  window.location.href = '../step-5/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'dream-art-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  DreamState.markVisited(STEP_N);
  renderStepNavBar('stepNavBar', STEP_N, goNext);

  // Default the accordion open on the first not-yet-done object.
  const selected = DreamState.getStepData(3).selected || [];
  const customizations = getCustomizations();
  expandedKey = selected.find(k => !(customizations[k] && customizations[k].done)) || null;

  renderList();
}

init();
</script>
</body>
</html>
