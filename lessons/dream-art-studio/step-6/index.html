<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 6 · Assemble Your Studio · Dream Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/studio-style.css">

<!-- Art GPS access control (loaded before this page's script so FEIAccess is available) -->
<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<!-- Shared step/state module -->
<script src="../shared/studio-state.js"></script>

<style>
  /* Background is the shared Matisse Pink Studio default — no
     page-scoped override needed. */
  .complete-wrap { text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Assemble Your Studio</p>
  <div class="stops-pill">STEP 6 OF 9</div>
</div>

<div class="content-wrap">

  <div class="page-hero">
    <h1>Assemble Your Studio</h1>
    <p>Cut out your objects, set up your box, and bring your studio to life.</p>
  </div>

  <!-- NOTE for Faye: this video ID is the same one used for Step 6's
       "Marker Details" video (8cb2e44a95f0efcaf5f033995946f8b5) — the
       prompt that specified this step flagged it might not be the
       right assembly video. Left as given; swap VIDEO_ID below once
       you send the correct one. -->
  <div class="video-frame">
    <iframe src="https://customer-a78os4oj56dr67ab.cloudflarestream.com/8cb2e44a95f0efcaf5f033995946f8b5/iframe?poster=https%3A%2F%2Fcustomer-a78os4oj56dr67ab.cloudflarestream.com%2F8cb2e44a95f0efcaf5f033995946f8b5%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
      loading="lazy" title="Assemble Your Studio — teacher demo"
      allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;"
      allowfullscreen="true"></iframe>
  </div>

  <div class="complete-wrap">
    <button class="btn btn-gold" id="completeBtn" onclick="toggleComplete()">✓ I assembled my studio!</button>
  </div>

  <div class="next-footer">
    <button class="btn btn-ghost" onclick="goNext()">Continue →</button>
  </div>

</div>

<div class="step-nav-bar" id="stepNavBar"></div>

<script>
const STEP_N = 6;

function toggleComplete() {
  DreamState.markInProgress(STEP_N);
  DreamState.markCompleted(STEP_N);
  const btn = document.getElementById('completeBtn');
  btn.textContent = '✓ Studio assembled!';
  btn.classList.add('btn-primary');
  btn.classList.remove('btn-gold');
}

function goNext() {
  DreamState.markCompleted(STEP_N);
  window.location.href = '../step-7/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'dream-art-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  DreamState.markVisited(STEP_N);
  renderStepNavBar('stepNavBar', STEP_N, goNext);
  if (DreamState.getStatus(STEP_N) === 'completed') {
    const btn = document.getElementById('completeBtn');
    btn.textContent = '✓ Studio assembled!';
    btn.classList.add('btn-primary');
    btn.classList.remove('btn-gold');
  }
}

init();
</script>
</body>
</html>
