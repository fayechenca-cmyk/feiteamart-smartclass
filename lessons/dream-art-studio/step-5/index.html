<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Step 5 · Build Your Background · Dream Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/studio-style.css">

<!-- Art GPS access control (loaded before this page's script so FEIAccess is available) -->
<script src="../../../core/auth.js"></script>
<script src="../../../core/access.js"></script>
<!-- Shared step/state module -->
<script src="../shared/studio-state.js"></script>

<style>
  /* Background is the shared Matisse Pink Studio default (2026-09-03
     redesign) — no page-scoped override here any more. */
  .complete-wrap { text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../">← Map</a>
  <p class="topbar-title">Build Your Background</p>
  <div class="stops-pill">STEP 5 OF 9</div>
</div>

<div class="content-wrap">

  <div class="page-hero">
    <h1>Build Your Background</h1>
    <p>Two steps: watercolour base, then marker details.</p>
  </div>

  <p class="video-label">Step 1: Watercolour Foundation</p>
  <div class="video-frame">
    <iframe src="https://customer-a78os4oj56dr67ab.cloudflarestream.com/6eb6587390e185a7ffa1d68bfedb4079/iframe?poster=https%3A%2F%2Fcustomer-a78os4oj56dr67ab.cloudflarestream.com%2F6eb6587390e185a7ffa1d68bfedb4079%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
      loading="lazy" title="Step 1: Watercolour Foundation — teacher demo"
      allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;"
      allowfullscreen="true"></iframe>
  </div>

  <p class="video-label">Step 2: Marker Details (windows, frames, patterns)</p>
  <div class="video-frame">
    <iframe src="https://customer-a78os4oj56dr67ab.cloudflarestream.com/7400eb3418f069f57f2077bc39e538ea/iframe?poster=https%3A%2F%2Fcustomer-a78os4oj56dr67ab.cloudflarestream.com%2F7400eb3418f069f57f2077bc39e538ea%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
      loading="lazy" title="Step 2: Marker Details — teacher demo"
      allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;"
      allowfullscreen="true"></iframe>
  </div>

  <div class="complete-wrap">
    <button class="btn btn-gold" id="completeBtn" onclick="toggleComplete()">✓ I finished my background</button>
  </div>

  <div class="next-footer">
    <button class="btn btn-ghost" onclick="goNext()">Continue →</button>
  </div>

</div>

<script>
const STEP_N = 5;

function toggleComplete() {
  DreamState.markInProgress(STEP_N);
  DreamState.markCompleted(STEP_N);
  const btn = document.getElementById('completeBtn');
  btn.textContent = '✓ Background finished!';
  btn.classList.add('btn-primary');
  btn.classList.remove('btn-gold');
}

function goNext() {
  DreamState.markCompleted(STEP_N);
  window.location.href = '../step-6/';
}

async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'dream-art-studio');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  DreamState.markVisited(STEP_N);
  if (DreamState.getStatus(STEP_N) === 'completed') {
    const btn = document.getElementById('completeBtn');
    btn.textContent = '✓ Background finished!';
    btn.classList.add('btn-primary');
    btn.classList.remove('btn-gold');
  }
}

init();
</script>
</body>
</html>
