<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* "Painted paper" raw-material palette — not one fixed theme, screens
     lean into different subsets/intensities of this range on purpose. */
  --paper:#f6f1e2;
  --paper-deep:#ece0c4;
  --ink:#241f1a;
  --yellow:#f4b942;
  --red:#e2492f;
  --blue:#2f6fa8;
  --green:#2f8f5b;
  --purple:#7b5ea8;
  --brown:#8a5a34;
  --ink-soft:rgba(36,31,26,.66);
  --ink-faint:rgba(36,31,26,.42);
  --line:rgba(36,31,26,.14);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Quicksand',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden;
}
.display{font-family:'Baloo 2',sans-serif;}
button{font-family:'Quicksand',sans-serif;}

/* Reusable torn-paper silhouette — applied to buttons/tags/cards
   throughout instead of clean rounded corners. Cheap (pure clip-path,
   no per-element SVG filter cost). */
.torn{
  clip-path: polygon(0% 4%, 3% 0%, 9% 3%, 15% 0%, 22% 2%, 30% 0%, 38% 3%, 46% 0%, 55% 2%, 64% 0%, 73% 3%, 82% 0%, 90% 2%, 97% 0%, 100% 5%, 98% 12%, 100% 20%, 97% 28%, 100% 36%, 98% 45%, 100% 54%, 97% 63%, 100% 72%, 98% 81%, 100% 90%, 97% 96%, 100% 100%, 90% 98%, 82% 100%, 73% 97%, 64% 100%, 55% 98%, 46% 100%, 38% 97%, 30% 100%, 22% 98%, 15% 100%, 9% 97%, 3% 100%, 0% 96%, 2% 88%, 0% 80%, 3% 72%, 0% 64%, 2% 56%, 0% 48%, 3% 40%, 0% 32%, 2% 24%, 0% 16%, 3% 8%);
}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;position:sticky;top:0;z-index:500;
  background:linear-gradient(var(--paper) 78%, transparent);
}
.back-link{font-size:12px;color:var(--blue);text-decoration:none;font-weight:700;letter-spacing:.2px;}
.map-btn{
  border:2px solid var(--ink);background:var(--yellow);border-radius:0;
  padding:7px 15px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
}
.map-btn.torn{}
.map-btn:active{transform:scale(.95);}
.zone-tag{
  font-family:'Baloo 2',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;
  color:#fff;background:var(--green);padding:5px 11px;
}

/* ---------- Screens ---------- */
.screen{display:none;max-width:640px;margin:0 auto;padding:6px 20px 40px;position:relative;}
@media(min-width:700px){.screen{max-width:820px;}}
@media(min-width:1000px){.screen{max-width:960px;}}
.screen.active{display:block;animation:paperIn .42s ease;}
@keyframes paperIn{from{opacity:0;transform:translateY(14px) rotate(-.4deg);}to{opacity:1;transform:translateY(0) rotate(0);}}

.stage-tag{
  display:inline-block;font-family:'Baloo 2',sans-serif;font-size:10.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;background:var(--brown);padding:4px 12px;margin:0 auto 10px;
}
.stage-tag-row{text-align:center;}
.stage-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:2rem;text-align:center;margin:0 0 6px;color:var(--ink);}
.stage-sub{text-align:center;font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;font-weight:500;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.paper-btn{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;padding:12px 22px;cursor:pointer;
  border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);transition:transform .12s ease;
}
.paper-btn:active{transform:scale(.96) rotate(-.6deg);}
.paper-btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.paper-btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;}
.paper-btn.green{background:var(--green);border-color:var(--green);color:#fff;}
.paper-btn:disabled{opacity:.32;cursor:not-allowed;}
.paper-btn.wide{width:100%;text-align:center;display:block;text-decoration:none;}

/* ---------- Chips (reused across many screens: hotspots, idea chips,
   tool chips, answer chips) ---------- */
.paper-chip{
  font-family:'Baloo 2',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2px;
  padding:9px 15px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;
}
.paper-chip.active{background:var(--yellow);}
.chip-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0;}

/* ---------- Shared hero-artwork frame (Screens 1, 3, 14, 16) ---------- */
.hero-frame{position:relative;max-width:520px;margin:10px auto;aspect-ratio:4/3;background:var(--paper-deep);border:3px solid var(--ink);overflow:hidden;box-shadow:6px 7px 0 rgba(36,31,26,.16);}
.hero-frame-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-frame-missing-note{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:13px;color:var(--ink-faint);font-weight:600;text-align:center;padding:20px;}
.hero-frame.img-missing .hero-frame-missing-note{display:flex;}
.hero-frame-caption{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:11px;letter-spacing:.6px;color:var(--green);margin:6px 0 0;text-transform:uppercase;}

/* ---------- Screen 1 — Opening ---------- */
.hero-blink-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:rgba(36,31,26,.55);left:61%;top:29%;animation:blink 5.5s ease-in-out infinite;pointer-events:none;}
@keyframes blink{0%,90%,100%{transform:scaleY(1);}94%{transform:scaleY(.1);}}
.opening-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.1rem;line-height:1.05;text-align:center;margin:16px 0 4px;}
.opening-artist{text-align:center;font-weight:600;color:var(--green);margin:0 0 14px;font-size:14px;}
.opening-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.3px;margin:0 0 6px;}

/* ---------- Screen 2 — Find the Textures ---------- */
.texture-hotspot{
  position:absolute;transform:translate(-50%,-50%);padding:6px 11px;font-family:'Baloo 2',sans-serif;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;border:2px solid var(--ink);background:rgba(246,241,226,.94);
  cursor:pointer;box-shadow:2px 3px 0 rgba(36,31,26,.18);
}
.texture-hotspot:active{transform:translate(-50%,-50%) scale(.92);}
.found-counter{text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:600;margin:10px 0 0;}
.found-tag-list{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 0;min-height:30px;}
.found-tag{font-family:'Baloo 2',sans-serif;font-size:10.5px;font-weight:700;background:var(--yellow);padding:5px 10px;}

/* ---------- Screen 3 — Reveal ---------- */
.howmade-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0;}
.howmade-chip{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;padding:12px 18px;border:2.5px solid var(--ink);background:#fff;cursor:pointer;}
.howmade-chip.correct{background:var(--green);color:#fff;border-color:var(--green);}
.disassembly-wrap{position:relative;max-width:460px;height:180px;margin:16px auto;background:var(--paper-deep);border:2px dashed var(--line);overflow:hidden;}
.disassembly-piece{position:absolute;width:30px;height:30px;opacity:0;animation:pieceScatter 1s ease forwards;}
@keyframes pieceScatter{from{opacity:0;transform:translate(50%,50%) scale(.4) rotate(0deg);}to{opacity:1;transform:translate(0,0) scale(1) rotate(var(--rot,10deg));}}
.reveal-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;line-height:1.5;margin:16px 0 4px;}

/* ---------- Screen 4 — Meet Eric Carle ---------- */
.carle-lines p{text-align:center;font-size:14px;margin:2px 0;font-weight:600;}
.process-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:18px 0 6px;}
.process-chip{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;letter-spacing:.3px;background:#fff;border:2px solid var(--ink);padding:9px 14px;}
.process-arrow{color:var(--red);font-weight:900;font-size:16px;}

/* ---------- Texture-swatch system (CSS/SVG only, no photos) — reused
   across Screens 5-8 and again later wherever "texture" needs to be
   shown. Six genuinely distinct looks, not color variants of one
   pattern. ---------- */
.tex-swatch{width:100%;height:100%;position:relative;overflow:hidden;}
.tex-watercolor{background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 55%,var(--green) 100%);}
.tex-bubble{background-color:var(--blue);background-image:
  radial-gradient(circle at 20% 20%, rgba(255,255,255,.55) 0 6px, transparent 7px),
  radial-gradient(circle at 55% 15%, rgba(255,255,255,.5) 0 5px, transparent 6px),
  radial-gradient(circle at 80% 30%, rgba(255,255,255,.5) 0 6px, transparent 7px),
  radial-gradient(circle at 30% 55%, rgba(255,255,255,.5) 0 5px, transparent 6px),
  radial-gradient(circle at 65% 60%, rgba(255,255,255,.55) 0 6px, transparent 7px),
  radial-gradient(circle at 15% 85%, rgba(255,255,255,.5) 0 5px, transparent 6px),
  radial-gradient(circle at 85% 80%, rgba(255,255,255,.5) 0 6px, transparent 7px),
  radial-gradient(circle at 50% 92%, rgba(255,255,255,.5) 0 5px, transparent 6px);}
.tex-press{background:var(--red);background-image:
  radial-gradient(ellipse at 30% 30%, rgba(0,0,0,.16) 0 14px, transparent 16px),
  radial-gradient(ellipse at 70% 60%, rgba(255,255,255,.22) 0 12px, transparent 15px),
  radial-gradient(ellipse at 45% 82%, rgba(0,0,0,.13) 0 10px, transparent 13px);}
.tex-scratch{background:var(--brown);background-image:repeating-linear-gradient(78deg, rgba(255,255,255,.35) 0 2px, transparent 2px 9px);}
.tex-brush{background:var(--green);background-image:repeating-linear-gradient(4deg, rgba(255,255,255,.18) 0 5px, rgba(0,0,0,.08) 5px 9px, transparent 9px 16px);}
.tex-layer{background:var(--yellow);}
.tex-layer::after{content:'';position:absolute;inset:0;background-image:
  radial-gradient(circle at 25% 30%, rgba(255,255,255,.4) 0 5px, transparent 6px),
  radial-gradient(circle at 60% 65%, rgba(255,255,255,.4) 0 5px, transparent 6px),
  radial-gradient(circle at 80% 25%, rgba(255,255,255,.4) 0 5px, transparent 6px);opacity:.85;}

/* ---------- Screen 5 — Texture Lab ---------- */
.lab-object-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
@media(min-width:480px){.lab-object-grid{grid-template-columns:repeat(4,1fr);}}
.lab-object{background:#fff;border:2px solid var(--ink);padding:14px 6px;text-align:center;cursor:pointer;box-shadow:2px 3px 0 rgba(36,31,26,.14);}
.lab-object .lo-icon{font-size:1.6rem;}
.lab-object .lo-label{font-size:9.5px;font-weight:700;margin-top:5px;font-family:'Baloo 2',sans-serif;}
.lab-tap-note{text-align:center;font-size:11.5px;color:var(--ink-faint);min-height:18px;margin-top:6px;font-weight:600;}

/* ---------- Screen 6 — Mission 1 Video ---------- */
.tech-preview-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px;}
.tech-preview{width:52px;height:52px;border:2px solid var(--ink);position:relative;}
.tech-preview-label{font-size:8.5px;font-weight:700;text-align:center;margin-top:4px;font-family:'Baloo 2',sans-serif;}
.tech-preview-item{display:flex;flex-direction:column;align-items:center;width:60px;}

/* ---------- Screen 7 — My Texture Collection ---------- */
.swatch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;}
.swatch-slot{aspect-ratio:1/1;border:2.5px dashed var(--line);position:relative;}
.swatch-slot.revealed{border:2.5px solid var(--ink);box-shadow:3px 4px 0 rgba(36,31,26,.16);animation:swatchPop .5s ease;}
@keyframes swatchPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.swatch-slot-label{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:9px;font-weight:700;font-family:'Baloo 2',sans-serif;}
.collection-ready-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.1rem;margin:28px 0 6px;min-height:1.4em;}
.drawer-toggle{display:block;margin:6px auto 0;}
.drawer-list{max-width:360px;margin:12px auto 0;text-align:center;font-size:12.5px;color:var(--ink-soft);line-height:1.8;display:none;}
.drawer-list.open{display:block;}

/* ---------- Screen 8 — Texture Detective ---------- */
.detective-sample{width:150px;height:150px;margin:14px auto;border:3px solid var(--ink);box-shadow:5px 6px 0 rgba(36,31,26,.16);}
.detective-round-note{text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;margin:0 0 6px;}
.detective-feedback{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;min-height:1.4em;margin:12px 0 0;}
.detective-feedback.correct{color:var(--green);}
.detective-feedback.retry{color:var(--red);}

/* ---------- Screen 9 — Transition to Collage ---------- */
.slide-in-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0;}
.slide-in-piece{width:46px;height:46px;border:2px solid var(--ink);opacity:0;animation:slideIn .5s ease forwards;}
@keyframes slideIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.transition-reveal{text-align:center;margin-top:22px;min-height:70px;}
.transition-reveal-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.6rem;opacity:0;}
.transition-reveal-title.show{opacity:1;animation:paperIn .4s ease;}
.transition-reveal-sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:4px;opacity:0;}
.transition-reveal-sub.show{opacity:1;}

/* ---------- Screen 10 — Mission 2 Video ---------- */
.mission2-chip-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px 0 4px;}

/* ---------- Screen 11 — Choose ---------- */
.silhouette-wrap{width:180px;height:180px;margin:16px auto;position:relative;}
.silhouette-clip{width:100%;height:100%;clip-path:path('M90,10 C130,10 165,45 165,85 C165,110 150,125 155,145 C158,155 148,160 138,152 C125,142 118,150 100,150 C75,150 40,145 25,115 C12,90 15,55 40,30 C55,15 72,10 90,10 Z');}
.silhouette-caption{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;margin-top:6px;}
.choose-cycle-btn{display:block;margin:10px auto 0;}
.pair-question{text-align:center;margin:14px 0 0;}
.pair-question-label{font-size:11px;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
.pair-btn-row{display:flex;justify-content:center;gap:8px;}
.choose-feedback{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;color:var(--green);min-height:1.4em;margin-top:14px;}

/* ---------- Screen 12 — Cut ---------- */
.cut-part-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0;}
@media(min-width:480px){.cut-part-grid{grid-template-columns:repeat(4,1fr);}}
.cut-part{background:#fff;border:2.5px solid var(--ink);padding:16px 8px;text-align:center;cursor:pointer;box-shadow:3px 4px 0 rgba(36,31,26,.16);transition:transform .3s ease;}
.cut-part.done{background:var(--paper-deep);transform:rotate(-2deg) scale(.97);}
.cut-part .cp-icon{font-size:1.6rem;}
.cut-part .cp-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:11px;margin-top:6px;}
.cut-part .cp-status{font-size:9px;color:var(--green);font-weight:700;margin-top:3px;min-height:11px;}
.cut-note{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:12px;font-style:italic;}

/* ---------- Screen 13 — Arrange ---------- */
.dont-glue{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.5rem;color:var(--red);margin:4px 0 2px;}
.arrange-directions{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:13px;letter-spacing:.3px;margin:0 0 14px;}
.arrange-canvas{position:relative;max-width:420px;height:260px;margin:0 auto 12px;background:var(--paper-deep);border:2px dashed var(--line);touch-action:none;overflow:hidden;}
.arrange-piece{position:absolute;width:56px;height:56px;cursor:grab;touch-action:none;box-shadow:2px 3px 0 rgba(36,31,26,.18);}
.arrange-piece:active{cursor:grabbing;}
.arrange-tools-row{display:flex;justify-content:center;gap:10px;margin-top:4px;}
.glue-btn{margin-top:14px;}

/* ---------- Screen 14 — Details ---------- */
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
@media(min-width:480px){.detail-grid{grid-template-columns:repeat(5,1fr);}}
.detail-item{background:#fff;border:2px solid var(--ink);padding:14px 4px;text-align:center;cursor:pointer;box-shadow:2px 3px 0 rgba(36,31,26,.14);}
.detail-item.done{background:var(--yellow);}
.detail-item .di-icon{font-size:1.4rem;}
.detail-item .di-label{font-size:9px;font-weight:700;margin-top:4px;font-family:'Baloo 2',sans-serif;}
.make-it-yours-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.2rem;margin:20px 0 14px;min-height:1.4em;}
.mrs-dawn-reference{margin-top:18px;}

/* ---------- Screen 15 — Scrap Challenge ---------- */
.scraps-row{display:flex;justify-content:center;gap:14px;margin:16px 0;}
.scrap-shape{width:56px;height:56px;}
.scrap-prompt{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;margin:10px 0 4px;}
.scrap-close-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;color:var(--green);margin:20px 0 4px;min-height:1.4em;}

/* ---------- Screen 16 — Completion Reveal ---------- */
.hero-frame-big{max-width:600px;}
.completion-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.3px;margin:14px 0 4px;color:var(--ink-soft);}

/* ---------- Screen 17 — Upload ---------- */
.upload-slot-wrap{display:flex;justify-content:center;margin:16px 0 4px;}
.upload-slot{width:220px;height:220px;border:3px dashed var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:#fffdf7;}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-slot .slot-plus{font-size:30px;color:var(--red);}
.upload-slot .slot-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:6px;padding:0 16px;text-align:center;font-family:'Baloo 2',sans-serif;}
.title-input{display:block;width:100%;max-width:340px;margin:14px auto 0;padding:11px 14px;border:2px solid var(--ink);font-family:'Quicksand',sans-serif;font-size:14px;background:#fff;}
.upload-status-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.1rem;margin:16px 0 2px;}
.upload-status-line.error{color:var(--red);font-size:13px;}
.upload-substatus{text-align:center;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:0;}

/* ---------- Screen 18 — Teacher Feedback ---------- */
.note-card{max-width:420px;margin:16px auto;background:#fffdf0;border:2px solid var(--ink);padding:16px 18px;box-shadow:5px 6px 0 rgba(36,31,26,.16);}
.note-from{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:11px;color:var(--green);margin-bottom:6px;}
.note-text{font-size:14px;line-height:1.6;margin:0;}
.note-audio{width:100%;margin-top:10px;}
.note-waiting{text-align:center;font-size:13px;color:var(--ink-soft);font-weight:600;margin:0;}
.feedback-empty-note{text-align:center;font-size:13px;color:var(--ink-faint);margin-top:14px;}

/* ---------- Screen 19 — Gallery Parade ---------- */
.parade-scroll{display:flex;gap:14px;overflow-x:auto;padding:12px 6px 22px;-webkit-overflow-scrolling:touch;}
.parade-item{flex:0 0 auto;}
.parade-img{width:120px;height:120px;object-fit:cover;border:2.5px solid var(--ink);display:block;box-shadow:3px 4px 0 rgba(36,31,26,.16);}
.parade-empty-note{text-align:center;font-size:13px;color:var(--ink-faint);margin-top:16px;}
.parade-close-line{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;margin-top:8px;}

/* ---------- Screen 20 — Badge ---------- */
.badge-medal{width:120px;height:120px;margin:22px auto 6px;position:relative;}
.bl{position:absolute;display:block;}
.bl1{inset:8px;background:var(--yellow);transform:rotate(-8deg);}

/* ============================================================
   REAL SUPABASE BACKEND (Screens 17-19) — this is the first Creation
   course wired into the same student_submissions/teacher_feedback
   backend the 10 Foundation-A lessons already use (confirmed reusable
   in Step 0: teacher-admin queries with zero course_id filtering, no
   admin-side change needed). Every other Creation course uses local
   IndexedDB instead — this is a deliberate, Faye-confirmed choice, not
   the default pattern for this codebase.
============================================================ */
const CHAMELEON_LESSON_ID = 'carle-colorful-chameleon';
let uploadPreviewFile = null;
let uploadPreviewUrl = null;
let uploadTitleText = '';
let uploadSaving = false;
let teacherFeedbackRows = [];
let galleryRows = [];

function escapeHtmlLocal(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function triggerUpload(){ document.getElementById('fileInput').click(); }
function onFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please choose an image file (JPG or PNG).'); return; }
  if (uploadPreviewUrl) URL.revokeObjectURL(uploadPreviewUrl);
  uploadPreviewFile = file;
  uploadPreviewUrl = URL.createObjectURL(file);
  renderCurrentStage();
}
function onTitleInput(e){ uploadTitleText = e.target.value; }
async function submitChameleonUpload(){
  if (!uploadPreviewFile || uploadSaving) return;
  uploadSaving = true;
  const btn = document.getElementById('submitUploadBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  const statusArea = document.getElementById('uploadStatusArea');
  if (statusArea) statusArea.innerHTML = '<p class="upload-status-line">Uploading…</p>';
  try {
    if (!window.FEISubmissions) throw new Error('Upload not available right now.');
    const result = await window.FEISubmissions.submit({
      imageFile: uploadPreviewFile,
      lessonId: CHAMELEON_LESSON_ID,
      lessonTitle: 'The Colorful Chameleon' + (uploadTitleText ? ' — ' + uploadTitleText : ''),
      courseId: 'creation',
      reflectionText: uploadTitleText || ''
    });
    if (!result.ok) throw new Error(result.error || 'Upload failed');
    STATE.submissionId = result.submission.id;
    STATE.submissionImageUrl = result.submission.image_url;
    saveState();
    uploadSaving = false;
    renderCurrentStage();
  } catch (e) {
    uploadSaving = false;
    console.warn('[upload] failed', e);
    if (statusArea) statusArea.innerHTML = `<p class="upload-status-line error">${escapeHtmlLocal((e && e.message) || "Couldn't send — please try again.")}</p>`;
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
  }
}

async function fetchTeacherFeedback(){
  if (!STATE.submissionId || !window.FEISubmissions) return [];
  try {
    const client = window.FEISubmissions._getClient();
    if (!client) return [];
    const { data, error } = await client.from('teacher_feedback').select('*').eq('submission_id', STATE.submissionId).order('created_at', { ascending: false });
    if (error) { console.warn('[feedback] fetch error', error); return []; }
    return data || [];
  } catch (e) { console.warn('[feedback] fetch threw', e); return []; }
}

async function fetchGalleryRows(){
  try {
    if (!window.FEISubmissions) return [];
    const client = window.FEISubmissions._getClient();
    if (!client) return [];
    const { data, error } = await client.from('student_submissions').select('*').eq('lesson_id', CHAMELEON_LESSON_ID).order('created_at', { ascending: false }).limit(30);
    if (error) { console.warn('[gallery] fetch error', error); return []; }
    return data || [];
  } catch (e) { console.warn('[gallery] fetch threw', e); return []; }
}

// Real account-wide badge (Faye-confirmed). Pushes into
// fei_user_profile.completedLessons via sessionStorage — the correct
// storage for this key (see the course-badge-registry.js fix bundled
// into this same commit).
function awardCollageCreatorBadge(){
  if (STATE.badgeAwarded) return;
  try {
    const raw = sessionStorage.getItem('fei_user_profile');
    const profile = raw ? JSON.parse(raw) : null;
    if (profile) {
      profile.completedLessons = Array.isArray(profile.completedLessons) ? profile.completedLessons : [];
      if (!profile.completedLessons.includes(CHAMELEON_LESSON_ID)) {
        profile.completedLessons.push(CHAMELEON_LESSON_ID);
        sessionStorage.setItem('fei_user_profile', JSON.stringify(profile));
      }
    }
  } catch (e) { console.warn('[badge] could not update fei_user_profile', e); }
  STATE.badgeAwarded = true;
  saveState();
}

/* ============================================================

============================================================ */
let currentStageId = 'opening';
function stageIndex(id){ return STAGES.findIndex(s => s.id === id); }
function goStage(id){ currentStageId = id; renderCurrentStage(); }
function goNext(){
  const i = stageIndex(currentStageId);
  if (i > -1 && i < STAGES.length - 1) goStage(STAGES[i + 1].id);
}
function goPrev(){ const i = stageIndex(currentStageId); if (i > 0) goStage(STAGES[i - 1].id); }
function goMap(){ currentStageId = 'screen-map'; renderCurrentStage(); }
function goZoneFirst(zoneId){ const first = STAGES.find(s => s.zone === zoneId); if (first) goStage(first.id); }

// Every screen's Next is always enabled in this course — no stroke/score
// gate like Miró's automatism canvas. Kept as its own function anyway so
// a future screen can add a real gate without touching renderNav.
function canAdvance(stage){ return true; }

function renderNav(stage){
  const idx = stageIndex(stage.id);
  const isFirst = idx === 0;
  const isLast = idx === STAGES.length - 1;
  const can = canAdvance(stage);
  const nextLabel = stage.id === 'opening' ? 'EXPLORE THE CHAMELEON →' : 'Next →';
  return `<div class="nav-footer">
    <button class="paper-btn torn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>← Back</button>
    ${isLast ? '<span></span>' : `<button class="paper-btn primary torn" id="nextBtn" onclick="goNext()" ${!can ? 'disabled' : ''}>${nextLabel}</button>`}
  </div>`;
}

function renderVideoEmbed(src, title){
  if (src) {
    return `<div class="video-embed-wrap"><div class="video-embed-inner">
      <iframe src="${src}" loading="lazy" title="${title}"
        style="border:none;position:absolute;top:0;left:0;height:100%;width:100%;"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
    </div></div>`;
  }
  return `<div class="video-embed-wrap"><div class="video-embed-inner" style="background:linear-gradient(135deg,var(--green),var(--blue));">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
      <div style="font-size:2.2rem;">🎥</div><div style="font-size:13px;margin-top:6px;font-weight:600;">Video coming soon!</div>
    </div>
  </div></div>`;
}

    </div>
    <button class="paper-btn primary torn wide glue-btn" onclick="glueArrangement()">LIKE IT? NOW GLUE IT!</button>
  `;

let arrangeDragState = null;
function mountArrangeCanvas(){
  const canvas = document.getElementById('arrangeCanvas');
  if (!canvas) return;
  canvas.querySelectorAll('.arrange-piece').forEach(el => {
    el.addEventListener('pointerdown', onArrangePointerDown);
  });
}
function onArrangePointerDown(e){
  const canvas = document.getElementById('arrangeCanvas');
  const el = e.currentTarget;
  el.setPointerCapture && el.setPointerCapture(e.pointerId);
  const canvasRect = canvas.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  arrangeDragState = {
    el,
    offsetX: e.clientX - elRect.left,
    offsetY: e.clientY - elRect.top,
    canvasRect
  };
  el.addEventListener('pointermove', onArrangePointerMove);
  el.addEventListener('pointerup', onArrangePointerUp);
  el.addEventListener('pointercancel', onArrangePointerUp);
}
function onArrangePointerMove(e){
  if (!arrangeDragState || arrangeDragState.el !== e.currentTarget) return;
  const { el, offsetX, offsetY, canvasRect } = arrangeDragState;
  let x = e.clientX - canvasRect.left - offsetX;
  let y = e.clientY - canvasRect.top - offsetY;
  x = Math.max(0, Math.min(canvasRect.width - el.offsetWidth, x));
  y = Math.max(0, Math.min(canvasRect.height - el.offsetHeight, y));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}
function onArrangePointerUp(e){
  const el = e.currentTarget;
  el.removeEventListener('pointermove', onArrangePointerMove);
  el.removeEventListener('pointerup', onArrangePointerUp);
  el.removeEventListener('pointercancel', onArrangePointerUp);
  arrangeDragState = null;
}
// Tap alternative to dragging (mobile UX rule: don't require precise
// drag-and-drop) — swaps two pieces' positions with one tap.
function swapArrangePieces(){
  const a = document.getElementById('piece-head');
  const b = document.getElementById('piece-tail');
  if (!a || !b) return;
  const aLeft = a.style.left, aTop = a.style.top;
  a.style.left = b.style.left; a.style.top = b.style.top;
  b.style.left = aLeft; b.style.top = aTop;
}

    <p class="parade-close-line">SAME PROCESS. DIFFERENT CHAMELEONS.</p>
  `;
}

/* ============================================================
   SCREEN 20 — Badge (real account-wide badge — see
   awardCollageCreatorBadge() above and core/course-badge-registry.js)
============================================================ */
function renderBadge(){
  return `
    ${screenHeader('SHARE', 'Collage Creator')}
    <div class="badge-medal">
      <span class="bl bl1 torn"></span><span class="bl bl2 torn"></span><span class="bl bl3 torn"></span>
      <div class="badge-icon">🦎</div>
    </div>
    <p class="badge-name display">COLLAGE CREATOR</p>
    <p class="badge-completion-line">YOU TURNED PAINTED PAPER INTO A PICTURE!</p>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
async function renderCurrentStage(){
  const contentEl = document.getElementById('screen-content');
  const zoneTag = document.getElementById('zoneTag');

  if (currentStageId === 'screen-map') {
    zoneTag.textContent = '';
    contentEl.innerHTML = `<div class="screen active">${renderMap()}</div>`;
    window.scrollTo(0, 0);
    return;
  }

  const stage = STAGES.find(s => s.id === currentStageId);
  if (!stage) { goMap(); return; }
  zoneTag.textContent = ZONES.find(z => z.id === stage.zone).label;

  // Screens 18/19 need a real fetch before painting (feedback for this
  // student's own submission; the gallery's recent rows) — same
  // pre-fetch-before-render pattern Kandinsky/Miró use for their share
  // screen, extended here to a real backend query instead of IndexedDB.
  if (stage.id === 'teacher-feedback') {
    teacherFeedbackRows = await fetchTeacherFeedback();
  }
  if (stage.id === 'gallery-parade') {
    galleryRows = await fetchGalleryRows();
  }

  contentEl.innerHTML = `<div class="screen active">
    ${stage.render()}
    ${renderNav(stage)}
  </div>`;
  if (stage.afterRender) stage.afterRender();
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'carle-colorful-chameleon');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  await renderCurrentStage();
}

init();
</script>
