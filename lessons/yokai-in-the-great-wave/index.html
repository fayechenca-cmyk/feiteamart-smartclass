<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Yōkai in the Great Wave</title>
<meta name="description" content="A continuous printmaking-journey Creation lesson built around two real ukiyo-e artworks: Hokusai's Great Wave and Kuniyoshi's Cat Demon. Look, imagine, then draw and paint your own yōkai story.">
<meta name="keywords" content="Creation, Books & Stories, Ukiyo-e, Hokusai, Kuniyoshi, Japanese Printmaking, Watercolor, Character Design">

  "series": "Books & Stories",
  "tags": ["Ukiyo-e", "Hokusai", "Kuniyoshi", "Japanese Printmaking", "Watercolor", "Character Design"],
  "ageRange": "8+",
  "materials": ["Pencil", "Watercolor Paper", "Watercolor", "Brushes", "Water"],
  "stageCount": 9
}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1e3a5f;
  --prussian:#143d5c;
  --turquoise:#6f9c98;
  --turquoise-soft:#c3d9d5;
  --vermilion:#c0472f;
  --yellow:#d9a441;
  --sumi:#1c1712;
  --washi:#ece0c4;
  --washi-deep:#ddd0ac;
  --ink-soft:rgba(28,23,18,.68);
  --ink-faint:rgba(28,23,18,.44);
  --line:rgba(28,23,18,.2);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Montserrat',sans-serif;background:var(--washi);color:var(--sumi);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden;
}
.display{font-family:'Noto Serif SC',serif;}
button{font-family:'Montserrat',sans-serif;}

/* woodblock / washi paper grain, whole page */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background-image:
    repeating-linear-gradient(112deg, rgba(28,23,18,.028) 0px, rgba(28,23,18,.028) 1px, transparent 1px, transparent 3px),
    radial-gradient(rgba(28,23,18,.05) 1px, transparent 1.3px);
  background-size:auto, 5px 5px;
  opacity:.55;mix-blend-mode:multiply;
}

/* ---------- fixed chrome ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:500;background:linear-gradient(var(--washi) 72%, transparent);padding:12px 16px 8px;pointer-events:none;}
#topbar a, #topbar .dots-row{pointer-events:auto;}
.back-link{font-size:12px;color:var(--indigo);text-decoration:none;font-weight:700;letter-spacing:.3px;}
.phase-bar{display:flex;justify-content:center;gap:4px;margin-top:9px;flex-wrap:wrap;pointer-events:auto;}
.phase-pip{font-size:8.5px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:2px;color:var(--ink-faint);background:rgba(28,23,18,.06);transition:background .3s ease,color .3s ease;}
.phase-pip.active{color:#fff;background:var(--indigo);}
.phase-pip.past{color:var(--indigo);background:var(--turquoise-soft);}
.progress-dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:7px;}
.p-dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:transform .2s ease,background .3s ease;}
.p-dot.done{background:var(--indigo);}
.p-dot.current{transform:scale(1.9);box-shadow:0 0 0 3px rgba(30,58,95,.18);}

/* ---------- scroll world ---------- */
#scrollWorld{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;position:relative;z-index:1;}
.sheet{
  min-height:100vh;max-width:680px;margin:0 auto;padding:78px 20px 50px;
  scroll-snap-align:start;position:relative;
  opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;
}
.sheet.in-view{opacity:1;transform:translateY(0);}

/* torn/registration joint between sheets */
.joint{width:100%;height:34px;margin:0 auto;max-width:680px;opacity:.6;}
.joint svg{width:100%;height:100%;display:block;}

.kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--vermilion);text-align:center;font-weight:800;margin-bottom:6px;}
.stage-title{
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.9rem;text-align:center;margin:0 0 6px;color:var(--prussian);
  letter-spacing:.4px;text-shadow:1.5px 0 0 rgba(192,71,47,.28), -1.5px 0 0 rgba(20,61,92,.22);
}
.stage-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.55;}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.yk-btn{
  font-weight:700;font-size:13px;padding:11px 18px;border-radius:2px;cursor:pointer;
  transition:transform .12s ease;border:1.5px solid var(--sumi);background:transparent;color:var(--sumi);letter-spacing:.3px;
}
.yk-btn:active{transform:scale(.96);}
.yk-btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.yk-btn.vermilion{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.yk-btn:disabled{opacity:.28;cursor:not-allowed;}
.yk-btn.wide{width:100%;text-align:center;display:block;text-decoration:none;}

.credit-line{font-size:9.5px;color:var(--ink-faint);text-align:center;margin-top:6px;line-height:1.5;font-style:italic;padding:0 8px;}

/* ---------- Sheet 0: Enter the Print World ---------- */
.opener-stage{height:44vh;min-height:230px;max-height:340px;position:relative;display:flex;align-items:center;justify-content:center;}
.ripple{transform-origin:center;transform-box:fill-box;opacity:0;animation:rippleOut 2.4s ease-out infinite;}
.ripple.r2{animation-delay:.55s;}
.ripple.r3{animation-delay:1.1s;}
@keyframes rippleOut{0%{transform:scale(.3);opacity:.5;}100%{transform:scale(2.7);opacity:0;}}
.opener-mark{animation:markIn 1s ease-out forwards;opacity:0;transform:scale(.55);transform-origin:center;transform-box:fill-box;}
@keyframes markIn{0%{opacity:0;transform:scale(.5);}60%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
.opener-title{text-align:right;font-size:2.5rem;margin:4px 0 2px;padding-right:6%;}
.opener-sub{text-align:right;font-size:13px;color:var(--ink-soft);max-width:380px;margin:0 0 0 auto;padding-right:6%;line-height:1.6;}
.ukiyoe-line{text-align:center;font-size:14px;color:var(--prussian);font-weight:700;margin-top:26px;}

/* ---------- Sheet 1: How Prints Are Made ---------- */
.process-row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 0;}
.process-icon{font-size:1.4rem;opacity:.45;transition:opacity .3s ease;}
.process-icon.lit{opacity:1;}
.process-arrow{font-size:11px;color:var(--ink-faint);}

.press-stage{width:150px;height:150px;margin:10px auto 12px;position:relative;}
.press-block{
  position:absolute;left:50%;top:6px;width:100px;height:58px;transform:translateX(-50%);
  background:var(--sumi);border-radius:1px;transition:transform .5s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;z-index:3;
}
.press-stage.pressed .press-block{transform:translateX(-50%) translateY(56px) scaleY(.85);}
.press-paper{
  position:absolute;left:50%;bottom:6px;width:120px;height:70px;transform:translateX(-50%);
  background:var(--washi);border:1.5px solid var(--line);overflow:hidden;z-index:1;
}
.press-paper-reveal{position:absolute;inset:0;opacity:0;transition:opacity .4s ease .35s;background:linear-gradient(160deg,var(--turquoise),var(--indigo));}
.press-stage.pressed .press-paper-reveal{opacity:.85;}
.press-caption{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:8px;}

.layer-section{margin-top:32px;text-align:center;}
.layer-heading{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--prussian);margin-bottom:12px;}
.layer-stage{width:220px;height:150px;margin:0 auto 14px;position:relative;background:#fff;border:1.5px solid var(--line);box-shadow:3px 4px 0 rgba(28,23,18,.12);}
.layer-stage svg{position:absolute;inset:0;width:100%;height:100%;}
.layer-svg-layer{opacity:0;transition:opacity .35s ease;}
.layer-svg-layer.on{opacity:1;}
.layer-btn-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.layer-btn{
  border:1.5px solid var(--line);background:var(--washi-deep);border-radius:999px;
  padding:8px 13px;font-size:10.5px;font-weight:800;cursor:pointer;letter-spacing:.3px;
}
.layer-btn.on{color:#fff;}
.layer-btn.on[data-c="black"]{background:var(--sumi);border-color:var(--sumi);}
.layer-btn.on[data-c="blue"]{background:var(--indigo);border-color:var(--indigo);}
.layer-btn.on[data-c="red"]{background:var(--vermilion);border-color:var(--vermilion);}
.layer-btn.on[data-c="yellow"]{background:var(--yellow);border-color:var(--yellow);color:var(--sumi);}
.layer-complete{font-size:12.5px;color:var(--vermilion);font-weight:800;margin-top:12px;min-height:18px;}

.collab-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
.collab-card{text-align:center;width:76px;}
.collab-card .cc-icon{font-size:1.5rem;}
.collab-card .cc-role{font-size:9px;font-weight:800;letter-spacing:.3px;margin-top:4px;color:var(--prussian);}
.collab-card .cc-action{font-size:9px;color:var(--ink-soft);margin-top:1px;}

/* ---------- Sheet 2: Visual Language ---------- */
.vislang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
@media(min-width:480px){.vislang-grid{grid-template-columns:1fr 1fr 1fr;}}
.vl-card{position:relative;cursor:pointer;border:1.5px solid var(--sumi);overflow:hidden;aspect-ratio:1/1;}
.vl-card img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05);}
.vl-card .vl-icon-only{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--washi-deep);}
.vl-label{position:absolute;left:0;right:0;bottom:0;background:rgba(28,23,18,.72);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-align:center;padding:5px 3px;}
.vl-note{position:absolute;inset:0;background:rgba(30,58,95,.94);color:#fff;font-size:10.5px;line-height:1.4;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;opacity:0;transition:opacity .3s ease;}
.vl-card.flipped .vl-note{opacity:1;}

.vangogh-aside{margin-top:30px;text-align:center;}
.vg-route{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--prussian);margin-bottom:4px;}
.vg-line{font-size:12px;color:var(--ink-soft);margin:0 0 14px;}
.vg-pair-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.vg-pair{width:130px;}
.vg-pair img{width:100%;display:block;border:1.5px solid var(--sumi);}
.vg-pair-cap{font-size:9.5px;color:var(--ink-faint);margin-top:4px;text-align:center;line-height:1.4;}

/* ---------- Sheets 3/4: hero artwork investigation ---------- */
.detective-kicker{text-align:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.05rem;color:var(--vermilion);margin-bottom:2px;}
.hero-stage{position:relative;overflow:hidden;box-shadow:0 14px 32px rgba(20,37,58,.32);border:2px solid var(--sumi);}
.hero-stage img{display:block;width:100%;height:auto;}
.hero-hotspot{position:absolute;border-radius:8px;cursor:pointer;}
.hero-hotspot.active{box-shadow:0 0 0 2px var(--vermilion);animation:hotspotPulse 1s ease-in-out infinite;}
@keyframes hotspotPulse{0%,100%{box-shadow:0 0 0 2px var(--vermilion);}50%{box-shadow:0 0 0 5px rgba(192,71,47,.4);}}
.hero-callout{margin-top:10px;background:#fff;padding:12px 14px;font-size:12.5px;line-height:1.5;min-height:20px;border:1.5px solid var(--line);}
.hero-callout .hc-label{font-weight:800;color:var(--indigo);margin-right:6px;}

/* ---------- Sheet 4: Meet the Yōkai — three real prints as a small
   museum discovery wall (overlapping/offset sheets, not cards) ---------- */
.yokai-wall{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 16px;margin-top:12px;padding:8px 0 6px;}
.yokai-print{position:relative;cursor:pointer;flex:0 1 210px;max-width:230px;}
.yokai-print:nth-child(1){transform:rotate(-3deg);}
.yokai-print:nth-child(2){transform:rotate(2deg);margin-top:16px;}
.yokai-print:nth-child(3){transform:rotate(-1.5deg);}
.yokai-print-inner{position:relative;border:2px solid var(--sumi);box-shadow:5px 7px 0 rgba(28,23,18,.18);overflow:hidden;}
.yokai-print img{display:block;width:100%;height:auto;}
.yokai-print .mood-veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%, transparent 32%, rgba(20,37,58,.6) 100%);opacity:0;transition:opacity .4s ease;pointer-events:none;}
.yokai-print .mood-veil.on{opacity:1;}
.yokai-print .change-zone{
  position:absolute;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .3s ease;
  box-shadow:0 0 0 2px var(--vermilion), 0 0 22px 6px rgba(192,71,47,.5);
}
.yokai-print .change-zone.on{opacity:1;}
.yokai-print .spotlight{position:absolute;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .5s ease;}
.yokai-print.found .spotlight{opacity:1;animation:spotlightPulse 1.6s ease-in-out infinite;}
@keyframes spotlightPulse{
  0%,100%{box-shadow:0 0 0 2px var(--vermilion), 0 0 24px 8px rgba(192,71,47,.4);}
  50%{box-shadow:0 0 0 3px var(--vermilion), 0 0 34px 12px rgba(192,71,47,.6);}
}
.yokai-print.found .yokai-print-inner::after{
  content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--vermilion);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.yokai-print-credit{font-size:9px;color:var(--ink-faint);text-align:center;margin-top:7px;line-height:1.4;font-style:italic;}

.discovery-counter{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.2rem;color:var(--vermilion);margin-top:16px;min-height:26px;}

.changed-intro{text-align:center;font-size:12px;color:var(--ink-soft);margin:24px 0 10px;}
.changed-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.changed-chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:11px;cursor:pointer;font-weight:700;}
.changed-chip .cc-word{opacity:.65;font-weight:500;margin-left:3px;}
.changed-chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.changed-chip.active .cc-word{opacity:.85;}

.evolution-row{display:flex;justify-content:center;align-items:center;gap:8px;margin:28px 0 8px;flex-wrap:wrap;}
.evolution-icon{font-size:1.6rem;opacity:.3;transition:opacity .4s ease, font-size .4s ease;}
.evolution-icon.lit{opacity:1;}
.evolution-icon.evolution-giant.lit{font-size:2.3rem;}
.evolution-arrow{font-size:12px;color:var(--ink-faint);}
.evolution-caption{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:6px;}
.yokai-reveal-line{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.1rem;color:var(--prussian);margin-top:16px;font-weight:700;}
.yokai-transition{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.15rem;color:var(--vermilion);margin-top:26px;font-style:italic;}

/* ---------- Sheet 5: Invent Your Yokai ---------- */
.type-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.type-btn{background:#fff;border:1.5px solid var(--line);border-radius:2px;padding:10px 8px;text-align:center;cursor:pointer;width:66px;}
.type-btn.picked{border-color:var(--indigo);background:var(--turquoise-soft);}
.type-btn .tb-emoji{font-size:1.4rem;}
.type-btn .tb-label{font-size:9px;font-weight:800;margin-top:3px;letter-spacing:.3px;}
.strange-label{text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.5px;margin:4px 0 8px;}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:11.5px;cursor:pointer;font-weight:700;}
.chip.picked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}

/* ---------- Sheet 6: Build Your Story ---------- */
.place-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px;}
.place-tile{background:#fff;border:1.5px solid var(--line);border-radius:2px;padding:14px 4px;text-align:center;cursor:pointer;}
.place-tile.picked{border-color:var(--indigo);background:var(--turquoise-soft);}
.place-tile .pt-icon{font-size:1.4rem;}
.place-tile .pt-label{font-size:9px;font-weight:800;margin-top:4px;}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.action-tile{background:#fff;border:1.5px solid var(--line);border-radius:2px;padding:14px 4px;text-align:center;cursor:pointer;}
.action-tile.picked{border-color:var(--vermilion);background:var(--turquoise-soft);}
.action-tile .at-icon{font-size:1.4rem;}
.action-tile .at-label{font-size:9px;font-weight:800;margin-top:4px;}
.story-done-line{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.1rem;color:var(--prussian);margin-top:20px;min-height:24px;font-style:italic;}

/* ---------- Sheet 7: Create With Mrs. Dawn ---------- */
.materials-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;}
@media(max-width:480px){.materials-grid{grid-template-columns:repeat(3,1fr);}}
.mat-tile{background:#fff;border:1.5px solid var(--line);border-radius:2px;padding:12px 4px;text-align:center;cursor:pointer;position:relative;}
.mat-tile.checked{border-color:var(--indigo);background:var(--turquoise-soft);}
.mat-tile .m-icon{font-size:1.3rem;}
.mat-tile .m-label{font-size:9.5px;font-weight:700;margin-top:4px;}
.mat-check{display:none;position:absolute;top:3px;right:5px;color:var(--indigo);font-weight:900;font-size:11px;}
.mat-tile.checked .mat-check{display:block;}
.ready-wrap{text-align:center;margin-top:20px;}

.video-block{margin-top:44px;padding-top:20px;border-top:1.5px dashed var(--line);}
.video-mini-progress{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--ink-faint);margin-bottom:4px;}
.video-block-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.35rem;text-align:center;color:var(--prussian);margin:0 0 12px;}
.video-embed-wrap{border-radius:1px;overflow:hidden;box-shadow:0 10px 26px rgba(20,37,58,.28);}
.studio-image-wrap{border-radius:1px;overflow:hidden;box-shadow:0 10px 26px rgba(20,37,58,.28);}
.studio-image-wrap img{display:block;width:100%;height:auto;}
.studio-image-credit{text-align:center;font-size:10px;color:var(--ink-faint);margin-top:8px;font-style:italic;}
.part-indicator{text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--vermilion);margin-bottom:6px;}
.part-nav{display:flex;justify-content:center;gap:8px;margin-top:10px;}
.part-nav-btn{border:1.5px solid var(--vermilion);background:#fff;border-radius:999px;padding:6px 13px;font-size:10.5px;font-weight:700;cursor:pointer;color:var(--vermilion);}
.part-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.reminder-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.reminder-chip{background:var(--turquoise-soft);border-radius:999px;padding:6px 13px;font-size:11px;font-weight:700;color:var(--prussian);}
.palette-row{display:flex;gap:14px;justify-content:center;margin:14px 0 6px;}
.palette-swatch-group{text-align:center;cursor:pointer;padding:8px;border:1.5px solid transparent;}
.palette-swatch-group.picked{border-color:var(--indigo);background:#fff;}
.palette-dots{display:flex;gap:4px;justify-content:center;margin-bottom:4px;}
.palette-dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
.palette-name{font-size:10px;font-weight:700;}
.video-note{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:6px;}
.mini-nav{display:flex;justify-content:center;gap:8px;margin-top:16px;}
.mini-nav-btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.mini-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.complete-wrap{text-align:center;margin-top:16px;}
.complete-btn{background:#fff;border:2px dashed var(--line);border-radius:999px;padding:10px 22px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
.complete-btn.done{background:var(--indigo);border-style:solid;border-color:var(--indigo);color:#fff;}

/* ---------- Sheet 8: Share Your Artwork ---------- */
.teacher-ref-frame{width:190px;margin:14px auto;padding:9px;background:#fff;border:2px solid var(--sumi);}

/* ============================================================
   IndexedDB — finished-artwork photo storage
============================================================ */
const DB_NAME = 'fei_yokai_great_wave_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const PIECE_ID = 'piece_001';
const MAX_EDGE = 1400;
const JPEG_QUALITY = 0.87;
let _dbPromise = null;
function isStorageSupported(){ return !!window.indexedDB; }
function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}
function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileOrBlob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      const longestEdge = Math.max(width, height);
      if (longestEdge > MAX_EDGE) {
        const scale = MAX_EDGE / longestEdge;
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
    img.src = url;
  });
}
async function saveArtwork(pieceId, fileOrBlob){
  const compressed = await compressImage(fileOrBlob);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId + '::' + Date.now(), pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => { const rows = req.result || []; rows.sort((a, b) => b.savedAt - a.savedAt); resolve(rows); };
    req.onerror = () => reject(req.error);
  });
}

let yokaiChangeActive = null;
let yokaiEvolutionPlayed = false;

function tapYokaiPrint(idx){
  const artwork = YOKAI_ARTWORKS[idx];
  if (!STATE.yokaiCatsFound.includes(artwork.id)) {
    STATE.yokaiCatsFound.push(artwork.id);
    saveState();
  }
  document.getElementById('yokai-print-' + idx).classList.add('found');
  updateDiscoveryCounter();
  playEvolutionOnce();
}
function updateDiscoveryCounter(){
  const n = STATE.yokaiCatsFound.length;
  const el = document.getElementById('discoveryCounter');
  if (!el) return;
  if (n === 0) el.textContent = '';
  else if (n < 3) el.textContent = 'YOU FOUND ONE! 🐱 ' + n + '/3';
  else el.textContent = 'YOU FOUND THEM ALL!';
}
function tapChangedChip(id){
  yokaiChangeActive = (yokaiChangeActive === id) ? null : id;
  document.querySelectorAll('.changed-chip').forEach(el => el.classList.toggle('active', el.dataset.change === yokaiChangeActive));
  const change = YOKAI_CHANGES.find(c => c.id === yokaiChangeActive);
  YOKAI_ARTWORKS.forEach((a, i) => {
    const veil = document.getElementById('mood-veil-' + i);
    const zone = document.getElementById('change-zone-' + i);
    if (veil) veil.classList.remove('on');
    if (zone) zone.classList.remove('on');
    if (!change) return;
    if (change.id === 'mood') {
      if (veil) veil.classList.add('on');
    } else if (change.zones && zone) {
      const z = change.zones[i];
      zone.style.left = z.left + '%'; zone.style.top = z.top + '%'; zone.style.width = z.w + '%'; zone.style.height = z.h + '%';
      zone.classList.add('on');
    }
  });
}
function playEvolutionOnce(){
  if (yokaiEvolutionPlayed) return;
  yokaiEvolutionPlayed = true;
  ['eco-cat', 'eco-giant', 'eco-yokai'].forEach((id, i) => {
    setTimeout(() => { const el = document.getElementById(id); if (el) el.classList.add('lit'); }, i * 500);
  });
}

// Which video "part" is showing per step — in-memory only (not persisted,
// like the other one-off UI state in this file). Switching parts never
// touches the step/progress-dot count; only Previous/Next between steps
// 1-4 does that.
let studioPartIndex = STUDIO_STEPS.map(() => 0);
function showVideoPart(idx, partIdx){
  const s = STUDIO_STEPS[idx];
  const clamped = Math.max(0, Math.min(s.videoSrcs.length - 1, partIdx));
  studioPartIndex[idx] = clamped;
  const title = s.title + (s.videoSrcs.length > 1 ? ' — Part ' + (clamped + 1) : '') + ' — teacher demo';
  document.getElementById('videoEmbed-' + idx).innerHTML = renderVideoEmbed(s.videoSrcs[clamped], title);
  const label = document.getElementById('partLabel-' + idx);
  if (label) label.textContent = 'PART ' + (clamped + 1) + ' OF ' + s.videoSrcs.length;
  const prevBtn = document.getElementById('partPrev-' + idx);
  const nextBtn = document.getElementById('partNext-' + idx);
  if (prevBtn) prevBtn.disabled = clamped === 0;
  if (nextBtn) nextBtn.disabled = clamped === s.videoSrcs.length - 1;
}

// A studio step is either image-based (imageSrc/imageAlt/imageCredit — a
// static reference, no video/part UI) or video-based (videoSrcs[] — the
// existing part-navigation UI). Exactly one of the two should be present.
function renderStudioMedia(s, idx){
  if (s.imageSrc) {
    return `
      <div class="studio-image-wrap">
        <img src="${s.imageSrc}" alt="${s.imageAlt || s.title}">
      </div>
      <p class="studio-image-credit">${s.imageCredit || ''}</p>
    `;
  }
  const multi = s.videoSrcs.length > 1;
  const partNav = multi ? `
    <div class="part-nav">
      <button class="part-nav-btn" id="partPrev-${idx}" onclick="showVideoPart(${idx}, studioPartIndex[${idx}] - 1)" disabled>← Part</button>
      <button class="part-nav-btn" id="partNext-${idx}" onclick="showVideoPart(${idx}, studioPartIndex[${idx}] + 1)">Next Part →</button>
    </div>
  ` : '';
  return `
    ${multi ? `<div class="part-indicator" id="partLabel-${idx}">PART 1 OF ${s.videoSrcs.length}</div>` : ''}
    <div id="videoEmbed-${idx}">${renderVideoEmbed(s.videoSrcs[0], s.title + ' — teacher demo')}</div>
    ${partNav}
  `;
}

function renderVideoBlock(s, idx){
  const extra = s.prompt ? `<p class="video-note">${s.prompt}</p>` : '';
  const isFirst = idx === 0, isLast = idx === STUDIO_STEPS.length - 1;
  return `
    <div class="video-block" id="video-block-${idx}" data-phase="${s.phase}">
      <div class="video-mini-progress">STEP ${s.step} OF ${STUDIO_STEPS.length}</div>
      <h3 class="video-block-title">${s.title}</h3>
      ${renderStudioMedia(s, idx)}
      ${extra}
      <div class="complete-wrap">
        <button class="complete-btn" id="completeBtn-${idx}" onclick="toggleStudioDone(${idx})">I'm done with this step</button>
      </div>
      <div class="mini-nav">
        <button class="mini-nav-btn" onclick="scrollToVideoBlock(${idx - 1})" ${isFirst ? 'disabled' : ''}>← Previous</button>
        <button class="mini-nav-btn" onclick="scrollToVideoBlock(${idx + 1})" ${isLast ? 'disabled' : ''}>Next →</button>
      </div>
    </div>
  `;
}

function triggerUpload(){ document.getElementById('fileInput').click(); }
async function onFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please choose an image file (JPG or PNG).'); return; }
  saving = true;
  refreshUploadUI();
  try {
    const record = await saveArtwork(PIECE_ID, file);
    artworkRecord = record;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(record.blob);
  } catch (e) {
    console.warn('[gallery] saveArtwork failed', e);
    alert("Couldn't save that photo — want to try a different one?");
  }
  saving = false;
  refreshUploadUI();
}
function refreshUploadUI(){
  const wrap = document.getElementById('uploadSlotWrap');
  const frameWrap = document.getElementById('studentFrameWrap');
  if (!wrap) return;
  if (saving) {
    wrap.innerHTML = `<div class="upload-slot saving"><div class="slot-plus">⏳</div><div class="slot-label">Saving…</div></div>`;
  } else if (artworkRecord) {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><img src="${objectUrl}" alt="Your finished yōkai artwork"></div>`;
    if (frameWrap) frameWrap.innerHTML = `<div class="student-frame"><img src="${objectUrl}" alt="Your finished yōkai artwork"></div>`;
  } else {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><div class="slot-plus">+</div><div class="slot-label">Upload My Artwork</div></div>`;
  }
}

/* ============================================================
   BUILD THE SCROLL WORLD (once) + SCROLL TRACKING
============================================================ */
function buildScrollWorld(){
  const world = document.getElementById('scrollWorld');
  let html = '';
  STAGES.forEach((stage, i) => {
    html += `<section class="sheet" id="sheet-${i}" data-track data-stage="${i}" data-phase="${stage.phase}">
      ${stage.render()}
      ${renderNav(i)}
    </section>`;
    if (i < STAGES.length - 1) html += jointSVG();
  });
  world.innerHTML = html;

  // re-apply persisted state onto the freshly-built DOM
  Object.keys(STATE.layersOn).forEach(c => { if (STATE.layersOn[c]) toggleLayerVisualOnly(c); });
  STATE.strangeChips.forEach(label => { const idx = STRANGE_CHIPS.indexOf(label); if (idx > -1) document.getElementById('chip-'+idx).classList.add('picked'); });
  if (STATE.creatureType) { const el = document.getElementById('type-'+STATE.creatureType); if (el) el.classList.add('picked'); }
  if (STATE.place) { const el = document.getElementById('place-'+STATE.place); if (el) el.classList.add('picked'); }
  if (STATE.action) { const el = document.getElementById('action-'+STATE.action); if (el) el.classList.add('picked'); }
  updateStoryLine();
  STATE.materialsChecked.forEach(id => { const el = document.getElementById('mat-'+id); if (el) el.classList.add('checked'); });
  if (STATE.studioPalettePick) { const el = document.getElementById('palette-'+STATE.studioPalettePick); if (el) el.classList.add('picked'); }
  STATE.studioDone.forEach((done, i) => { if (done) { const btn = document.getElementById('completeBtn-'+i); if (btn) { btn.classList.add('done'); btn.textContent = STUDIO_STEPS[i].completionLabel; } } });
  if (STATE.reflectPick) { const el = document.getElementById('reflect-' + STATE.reflectPick.replace(/\s+/g,'')); if (el) el.classList.add('picked'); }
  STATE.yokaiCatsFound.forEach(id => {
    const idx = YOKAI_ARTWORKS.findIndex(a => a.id === id);
    if (idx > -1) { const el = document.getElementById('yokai-print-' + idx); if (el) el.classList.add('found'); }
  });
  updateDiscoveryCounter();
  if (STATE.yokaiCatsFound.length > 0) playEvolutionOnce();

  refreshUploadUI();
  setupObserver();
}
function toggleLayerVisualOnly(color){
  const layer = document.getElementById('layer-' + color);
  const btn = document.getElementById('layerBtn-' + color);
  if (layer) layer.classList.add('on');
  if (btn) btn.classList.add('on');
  const all = STATE.layersOn.black && STATE.layersOn.blue && STATE.layersOn.red && STATE.layersOn.yellow;
  const lc = document.getElementById('layerComplete');
  if (lc && all) lc.textContent = '= FULL COLOR PRINT';
}

let lastStage = -1, lastPhase = '';
function setupObserver(){
  const tracked = document.querySelectorAll('[data-track], .video-block, #materialsTray');
  const observer = new IntersectionObserver((entries) => {
    let best = null, bestRatio = 0;
    entries.forEach(e => { if (e.isIntersecting && e.intersectionRatio > bestRatio) { bestRatio = e.intersectionRatio; best = e.target; } });
    if (!best) return;
    const stageEl = best.closest('.sheet');
    const stageIdx = stageEl ? parseInt(stageEl.dataset.stage, 10) : lastStage;
    const phase = best.dataset.phase || (stageEl ? stageEl.dataset.phase : lastPhase);
    if (stageIdx !== lastStage || phase !== lastPhase) {
      lastStage = stageIdx; lastPhase = phase;
      renderDotsAndPhase(stageIdx, phase);
    }
    if (stageEl && !stageEl.classList.contains('in-view')) stageEl.classList.add('in-view');
  }, { threshold: [0.15, 0.3, 0.5, 0.7] });
  tracked.forEach(el => observer.observe(el));
  document.querySelectorAll('.sheet').forEach(el => observer.observe(el));
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'yokai-in-the-great-wave');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  buildScrollWorld();
  if (isStorageSupported()) {
    try {
      const rows = await listArtworks(PIECE_ID);
      if (rows.length) {
        artworkRecord = rows[0];
        objectUrl = URL.createObjectURL(artworkRecord.blob);
        refreshUploadUI();
      }
    } catch (e) { console.warn('[gallery] listArtworks failed', e); }
  }
}

init();
