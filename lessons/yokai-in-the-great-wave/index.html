<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Yōkai in the Great Wave</title>
<meta name="description" content="A museum-discovery + creature-invention Creation lesson built around two real ukiyo-e artworks: Hokusai's Great Wave and Kuniyoshi's Cat Demon. Look, imagine, then draw and paint your own yōkai story.">
<meta name="keywords" content="Creation, Books & Stories, Ukiyo-e, Hokusai, Kuniyoshi, Japanese Printmaking, Watercolor, Character Design">

  "series": "Books & Stories",
  "tags": ["Ukiyo-e", "Hokusai", "Kuniyoshi", "Japanese Printmaking", "Watercolor", "Character Design"],
  "ageRange": "8+",
  "materials": ["Pencil", "Watercolor Paper", "Watercolor", "Brushes", "Water"],

}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1e3a5f;
  --indigo-deep:#12253d;
  --turquoise:#6f9c98;
  --turquoise-soft:#c3d9d5;
  --vermilion:#c0472f;
  --cream:#f0e6d2;
  --paper:#e9dfc4;
  --ink:#241d17;
  --ink-soft:rgba(36,29,23,.66);
  --ink-faint:rgba(36,29,23,.42);
  --line:rgba(36,29,23,.18);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Montserrat',sans-serif;background:var(--paper);color:var(--ink);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;
}
.display{font-family:'Noto Serif SC',serif;}
button{font-family:'Montserrat',sans-serif;}

/* subtle woodblock-print / washi paper grain */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(115deg, rgba(36,29,23,.025) 0px, rgba(36,29,23,.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(rgba(36,29,23,.05) 1px, transparent 1.3px);
  background-size:auto, 5px 5px;
  opacity:.6;
}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

/* ---------- Top bar ---------- */
#topbar{position:sticky;top:0;z-index:500;background:linear-gradient(var(--paper) 78%, transparent);padding:12px 18px 6px;}
.back-link{font-size:12.5px;color:var(--indigo);text-decoration:none;font-weight:700;letter-spacing:.3px;}

/* phase bar (LOOK -> IMAGINE -> DRAW -> COLOR -> DETAIL) */
.phase-bar{display:flex;justify-content:center;gap:4px;margin-top:10px;flex-wrap:wrap;}
.phase-pip{font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:999px;color:var(--ink-faint);background:rgba(36,29,23,.06);}
.phase-pip.active{color:#fff;background:var(--indigo);}
.phase-pip.past{color:var(--indigo);background:var(--turquoise-soft);}

.progress-dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:8px;}
.p-dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:transform .15s ease;}
.p-dot.done{background:var(--indigo);}
.p-dot.current{transform:scale(1.8);box-shadow:0 0 0 3px rgba(30,58,95,.16);}

/* ---------- Screens ---------- */
.screen{display:none;max-width:660px;margin:0 auto;padding:8px 18px 40px;}
.screen.active{display:block;animation:ykFadeIn .4s ease;}
@keyframes ykFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--vermilion);text-align:center;font-weight:800;margin-bottom:6px;}
.s-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.75rem;text-align:center;margin:0 0 4px;color:var(--indigo-deep);letter-spacing:.5px;}
.s-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5;}

/* wave divider */
.wave-divider{width:60px;height:12px;margin:8px auto 16px;opacity:.55;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
.yk-btn{
  font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:3px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease, opacity .15s ease;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);letter-spacing:.3px;
}
.yk-btn:active{transform:scale(.96);}
.yk-btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.yk-btn.vermilion{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.yk-btn:disabled{opacity:.3;cursor:not-allowed;}
.yk-btn.wide{width:100%;text-align:center;display:block;text-decoration:none;}

/* museum credit line */
.credit-line{font-size:10px;color:var(--ink-faint);text-align:center;margin-top:6px;line-height:1.5;font-style:italic;padding:0 10px;}

/* video embed (studio steps) */
.video-embed-wrap{margin:14px 0 8px;border-radius:2px;overflow:hidden;box-shadow:0 10px 26px rgba(18,37,61,.25);}

/* ---------- Part 1: What is Ukiyo-e ---------- */
.uk-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px;}
@media(min-width:520px){.uk-grid{grid-template-columns:1fr 1fr 1fr;}}
.uk-card{perspective:900px;height:118px;cursor:pointer;}
.uk-card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.uk-card.flipped .uk-card-inner{transform:rotateY(180deg);}
.uk-card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;border:1.5px solid var(--line);}
.uk-card-front{background:var(--cream);}
.uk-card-front .uk-icon{font-size:1.5rem;}
.uk-card-front .uk-label{font-weight:800;font-size:10.5px;margin-top:5px;letter-spacing:.5px;}
.uk-card-back{background:var(--indigo);color:#fff;transform:rotateY(180deg);font-size:11px;line-height:1.4;font-weight:500;}

.print-demo{margin-top:26px;text-align:center;}
.print-steps-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:14px;}
.print-step-icon{font-size:1.5rem;opacity:.5;transition:opacity .3s ease;}
.print-step-icon.lit{opacity:1;}
.print-arrow{font-size:12px;color:var(--ink-faint);}
.press-stage{width:150px;height:150px;margin:0 auto 14px;position:relative;}
.press-block{
  position:absolute;left:50%;top:8px;width:100px;height:60px;transform:translateX(-50%);
  background:var(--indigo);border-radius:2px;transition:transform .5s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;z-index:3;
}
.press-stage.pressed .press-block{transform:translateX(-50%) translateY(58px) scaleY(.85);}
.press-paper{
  position:absolute;left:50%;bottom:8px;width:120px;height:70px;transform:translateX(-50%);
  background:var(--cream);border:1.5px solid var(--line);border-radius:2px;overflow:hidden;z-index:1;
}
.press-paper-reveal{position:absolute;inset:0;opacity:0;transition:opacity .4s ease .35s;background:linear-gradient(160deg,var(--turquoise),var(--indigo));}
.press-stage.pressed .press-paper-reveal{opacity:.85;}
.print-caption{font-size:12.5px;color:var(--ink-soft);font-style:italic;}

/* ---------- Part 2 / Part 3: hero artwork investigation ---------- */
.detective-kicker{text-align:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.1rem;color:var(--vermilion);margin-bottom:2px;}
.hero-stage{position:relative;border-radius:2px;overflow:hidden;box-shadow:0 12px 30px rgba(18,37,61,.3);border:2px solid var(--ink);}
.hero-stage img{display:block;width:100%;height:auto;}
.hero-hotspot{position:absolute;border-radius:8px;cursor:pointer;}
.hero-hotspot.active{box-shadow:0 0 0 2px var(--vermilion);animation:hotspotPulse 1s ease-in-out infinite;}
@keyframes hotspotPulse{0%,100%{box-shadow:0 0 0 2px var(--vermilion);}50%{box-shadow:0 0 0 5px rgba(192,71,47,.4);}}
.hero-callout{margin-top:10px;background:var(--cream);border-radius:2px;padding:12px 14px;font-size:13px;line-height:1.5;min-height:20px;border:1.5px solid var(--line);}
.hero-callout .hc-label{font-weight:800;color:var(--indigo);margin-right:6px;}
.hero-img-missing{
  display:none;aspect-ratio:3/2;background:linear-gradient(135deg,var(--indigo),var(--vermilion));
  color:#fff;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:20px;
}
.img-missing .hero-img-missing{display:flex;}
.img-missing img{display:none;}

.still-moving-row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.sm-btn{border:1.5px solid var(--line);background:var(--cream);border-radius:3px;padding:10px 20px;font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer;}
.sm-btn.picked{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.sm-reveal{text-align:center;font-size:13px;color:var(--indigo);margin-top:10px;min-height:18px;font-style:italic;}

/* yokai info card */
.yokai-info-card{margin-top:22px;background:var(--cream);border:1.5px solid var(--line);border-radius:2px;padding:16px;text-align:center;}
.yokai-info-card h3{font-family:'Noto Serif SC',serif;font-size:1.05rem;color:var(--indigo-deep);margin:0 0 4px;}
.yokai-info-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;}
.yokai-cat-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.yokai-cat{background:var(--paper);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;}
.yokai-info-card .line{font-size:12px;color:var(--vermilion);font-weight:700;margin-top:12px;}

/* ---------- Part 4: Build Your Creature ---------- */
.type-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.type-btn{background:var(--cream);border:1.5px solid var(--line);border-radius:3px;padding:10px 8px;text-align:center;cursor:pointer;width:66px;}
.type-btn.picked{border-color:var(--indigo);background:var(--turquoise-soft);}
.type-btn .tb-emoji{font-size:1.4rem;}
.type-btn .tb-label{font-size:9.5px;font-weight:800;margin-top:3px;letter-spacing:.3px;}
.strange-label{text-align:center;font-size:12px;color:var(--ink-faint);font-weight:700;letter-spacing:.5px;margin:4px 0 8px;}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.chip{background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:700;}
.chip.picked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}

/* ---------- Part 5: Build Your Story ---------- */
.place-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px;}
.place-tile{background:var(--cream);border:1.5px solid var(--line);border-radius:3px;padding:14px 4px;text-align:center;cursor:pointer;}
.place-tile.picked{border-color:var(--indigo);background:var(--turquoise-soft);}
.place-tile .pt-icon{font-size:1.4rem;}
.place-tile .pt-label{font-size:9.5px;font-weight:800;margin-top:4px;}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.action-tile{background:var(--cream);border:1.5px solid var(--line);border-radius:3px;padding:14px 4px;text-align:center;cursor:pointer;}
.action-tile.picked{border-color:var(--vermilion);background:var(--turquoise-soft);}
.action-tile .at-icon{font-size:1.4rem;}
.action-tile .at-label{font-size:9.5px;font-weight:800;margin-top:4px;}
.story-done-line{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.15rem;color:var(--indigo-deep);margin-top:20px;min-height:24px;font-style:italic;}

/* ---------- Part 6: Materials ---------- */
.materials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px;}
@media(max-width:420px){.materials-grid{grid-template-columns:repeat(2,1fr);}}
.mat-tile{background:var(--cream);border:1.5px solid var(--line);border-radius:3px;padding:14px 6px;text-align:center;cursor:pointer;position:relative;}
.mat-tile.checked{border-color:var(--indigo);background:var(--turquoise-soft);}
.mat-tile .m-icon{font-size:1.5rem;}
.mat-tile .m-label{font-size:10.5px;font-weight:700;margin-top:5px;}
.mat-check{display:none;position:absolute;top:4px;right:6px;color:var(--indigo);font-weight:900;}
.mat-tile.checked .mat-check{display:block;}
.ready-wrap{text-align:center;margin-top:22px;}

/* ---------- Studio steps ---------- */
.studio-kicker{text-align:center;font-size:11px;color:var(--ink-faint);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.reminder-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.reminder-chip{background:var(--turquoise-soft);border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--indigo-deep);}
.palette-row{display:flex;gap:14px;justify-content:center;margin:14px 0 6px;}
.palette-swatch-group{text-align:center;cursor:pointer;padding:8px;border-radius:3px;border:1.5px solid transparent;}
.palette-swatch-group.picked{border-color:var(--indigo);background:var(--cream);}
.palette-dots{display:flex;gap:4px;justify-content:center;margin-bottom:4px;}
.palette-dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
.palette-name{font-size:10.5px;font-weight:700;}
.studio-note{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:6px;}
.complete-wrap{text-align:center;margin-top:20px;}
.complete-btn{background:var(--cream);border:2px dashed var(--line);border-radius:999px;padding:11px 24px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-soft);}
.complete-btn.done{background:var(--indigo);border-style:solid;border-color:var(--indigo);color:#fff;}

/* ---------- Part 8: Your Artwork ---------- */
.teacher-ref-frame{width:200px;margin:14px auto;padding:10px;background:var(--cream);border:2px solid var(--ink);}
.teacher-ref-frame img{width:100%;display:block;}
.teacher-ref-placeholder{
  width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,var(--indigo),var(--vermilion));
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:10px;
}
.teacher-ref-placeholder .tp-emoji{font-size:1.8rem;}
.teacher-ref-placeholder .tp-text{font-size:11px;margin-top:6px;}
.reveal-line{text-align:center;font-family:'Noto Serif SC',serif;font-size:1.3rem;color:var(--indigo-deep);margin:8px 0 18px;}
.upload-slot-wrap{display:flex;flex-direction:column;align-items:center;margin-top:8px;}
.upload-slot{
  position:relative;width:220px;height:220px;border-radius:2px;border:2px dashed var(--indigo);background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
}
.upload-slot.saving{border-color:var(--vermilion);}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-slot .slot-plus{font-size:32px;color:var(--indigo);}
.upload-slot .slot-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:6px;padding:0 16px;text-align:center;}
.student-frame{width:240px;margin:18px auto 6px;padding:14px;background:var(--cream);border:2px solid var(--ink);box-shadow:6px 7px 0 rgba(36,29,23,.15);}
.student-frame img{width:100%;display:block;}
.reflect-label{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.5px;color:var(--ink-faint);margin:20px 0 8px;text-transform:uppercase;}
.reflect-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.reflect-chip{background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:700;}
.reflect-chip.picked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.gallery-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:22px;}
</style>
</head>
<body>

<div id="grain"></div>

<div id="app">
  <div id="topbar">
    <a class="back-link" href="../../creation/">← Studio</a>
    <div class="phase-bar" id="phaseBar"></div>
    <div class="progress-dots" id="progressDots"></div>
  </div>
  <div id="screen-content"></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileSelected(event)">

<script src="../../core/auth.js"></script>
<script src="../../core/access.js"></script>

<script>
/* ============================================================
   DATA
============================================================ */
const PHASES = ['LOOK','IMAGINE','DRAW','COLOR','DETAIL'];

const STEPS = [
  { id:'what-is-ukiyoe', step:1,  title:'What Is Ukiyo-e?',                  phase:'LOOK' },
  { id:'wave-detective',  step:2,  title:'Wave Detective',                   phase:'LOOK' },
  { id:'meet-yokai',      step:3,  title:'Meet the Yōkai',                   phase:'LOOK' },
  { id:'build-creature',  step:4,  title:'Build Your Yōkai',                 phase:'IMAGINE' },
  { id:'build-story',     step:5,  title:'Where Does Your Yōkai Go?',        phase:'IMAGINE' },
  { id:'get-ready',       step:6,  title:'Get Ready to Create',              phase:'DRAW', nextLabel:'Start Creating →' },
  { id:'studio-1',        step:7,  title:'Draw the Lines',                   phase:'DRAW', studioIndex:0 },
  { id:'studio-2',        step:8,  title:'Color the Creatures & Background', phase:'COLOR', studioIndex:1 },
  { id:'studio-3',        step:9,  title:'Paint the Waves',                  phase:'COLOR', studioIndex:2 },
  { id:'studio-4',        step:10, title:'Add Details & Ink',                phase:'DETAIL', studioIndex:3 },
  { id:'gallery',         step:11, title:'Your Artwork',                     phase:'DETAIL' }
];

const UKIYOE_CARDS = [
  { id:'lines',   label:'BOLD LINES',         icon:'〰️', note:'Lines make shapes easy to see.' },
  { id:'color',   label:'FLAT COLORS',        icon:'🎨', note:'Colors sit in clear, strong areas.' },
  { id:'pattern', label:'PATTERNS',           icon:'✳',  note:'Look! Patterns are everywhere.' },
  { id:'nature',  label:'NATURE',             icon:'⛰',  note:'Mountains, waves, flowers, animals, weather.' },
  { id:'people',  label:'PEOPLE & CREATURES', icon:'🎭', note:'Actors, warriors, ordinary people, animals, ghosts, yōkai.' },
  { id:'stories', label:'STORIES',            icon:'📖', note:'One picture can tell a whole story.' }
];

// Hotspot boxes are positioned in % over the actual Hokusai photograph.
const WAVE_HOTSPOTS = [
  { id:'curve', emoji:'〰',  label:'Curved Lines', left:12, top:3,  w:48, h:24, note:'Repeated curved lines make the water feel alive.' },
  { id:'wave',  emoji:'🌊', label:'The Giant Wave', left:24, top:22, w:26, h:22, note:'This is the wave the whole print is named after.' },
  { id:'foam',  emoji:'💦', label:'Wave Foam',     left:2,  top:30, w:15, h:15, note:'Tiny claw-like foam shapes show the wave breaking apart.' },

  { id:'fuji',  emoji:'🗻', label:'Mt. Fuji',      left:55, top:58, w:16, h:20, note:"Mount Fuji is small and still — even in a giant storm." }
];

// Hotspot boxes for the Kuniyoshi Cat Demon (approximate — recheck once
// the real file is dropped into assets/, see assets/README.md).
const YOKAI_HOTSPOTS = [
  { id:'eyes',       emoji:'👀', label:'Eyes',       q:'Where is it looking?',            left:30, top:8,  w:34, h:20 },
  { id:'size',       emoji:'🐾', label:'Size',       q:'Is this an ordinary cat?',         left:10, top:14, w:80, h:40 },
  { id:'expression', emoji:'😼', label:'Expression', q:'Friendly… or dangerous?',          left:32, top:20, w:30, h:18 },
  { id:'shape',      emoji:'🌀', label:'Shape',      q:'Look at its strange silhouette.',  left:5,  top:5,  w:90, h:70 },
  { id:'story',      emoji:'🎭', label:'Story',      q:'What do you think is happening?',  left:15, top:60, w:70, h:35 }
];

const YOKAI_CATEGORIES = [
  { emoji:'🐱', label:'CAT' }, { emoji:'🦊', label:'FOX' }, { emoji:'🐟', label:'FISH' },
  { emoji:'🐉', label:'DRAGON' }, { emoji:'🐦', label:'BIRD' }, { emoji:'👻', label:'STRANGE THING' }
];

const CREATURE_TYPES = [
  { id:'cat',   emoji:'🐱', label:'CAT' },
  { id:'fox',   emoji:'🦊', label:'FOX' },
  { id:'fish',  emoji:'🐟', label:'FISH' },
  { id:'dragon',emoji:'🐉', label:'DRAGON' },
  { id:'bird',  emoji:'🐦', label:'BIRD' },
  { id:'own',   emoji:'✨', label:'YOUR OWN' }
];
const STRANGE_CHIPS = ['BIG EYES','LONG TAIL','HORNS','FANGS','WINGS','PATTERNS','EXTRA EYES','GIANT EARS','WHATEVER YOU INVENT'];

const PLACES = [
  { id:'waves',    emoji:'🌊', label:'INTO THE WAVES' },
  { id:'moon',     emoji:'🌙', label:'UNDER THE MOON' },

/* ============================================================
   IndexedDB — finished-artwork photo storage, scoped to this course
============================================================ */
const DB_NAME = 'fei_yokai_great_wave_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const PIECE_ID = 'piece_001';
const MAX_EDGE = 1400;
const JPEG_QUALITY = 0.87;
let _dbPromise = null;

function isStorageSupported(){ return !!window.indexedDB; }

function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}

function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileOrBlob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      const longestEdge = Math.max(width, height);
      if (longestEdge > MAX_EDGE) {
        const scale = MAX_EDGE / longestEdge;
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
    img.src = url;
  });
}

async function saveArtwork(pieceId, fileOrBlob){
  const compressed = await compressImage(fileOrBlob);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId + '::' + Date.now(), pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}

async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => {
      const rows = req.result || [];
      rows.sort((a, b) => b.savedAt - a.savedAt);
      resolve(rows);
    };
    req.onerror = () => reject(req.error);
  });
}

    <div class="teacher-ref-frame">${TEACHER_ARTWORK_SRC
      ? `<img src="${TEACHER_ARTWORK_SRC}" alt="Mrs. Dawn's finished yōkai artwork">`
      : `<div class="teacher-ref-placeholder"><div class="tp-emoji">🖼</div><div class="tp-text">Teacher's finished artwork coming soon</div></div>`}</div>
    <p class="reveal-line">Now show us yours.</p>
    <div class="upload-slot-wrap">${uploadHtml}</div>
    ${artworkRecord ? `<div class="student-frame"><img src="${objectUrl}" alt="Your finished yōkai artwork"></div>` : ''}
    <div class="reflect-label">My Creature Is…</div>
    <div class="reflect-row">${reflectChips}</div>
    <div class="gallery-actions">
      <a class="yk-btn primary wide" href="../../creation/">Add to the Gallery</a>
    </div>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
function renderStepBody(step){
  switch (step.id) {
    case 'what-is-ukiyoe': return renderPart1();
    case 'wave-detective': return renderPart2();
    case 'meet-yokai':     return renderPart3();
    case 'build-creature': return renderPart4();
    case 'build-story':    return renderPart5();
    case 'get-ready':      return renderPart6();
    case 'studio-1':
    case 'studio-2':
    case 'studio-3':
    case 'studio-4':       return renderStudioStep(step);
    case 'gallery':        return renderPart8();
    default: return '';
  }
}

async function renderCurrentScreen(){
  const idx = STATE.currentStep;
  const step = STEPS[idx];
  document.getElementById('phaseBar').innerHTML = renderPhaseBar(step.phase);
  document.getElementById('progressDots').innerHTML = renderDots();

  if (step.id === 'gallery' && !artworkRecord && isStorageSupported()) {
    try {
      const rows = await listArtworks(PIECE_ID);
      if (rows.length) {
        artworkRecord = rows[0];
        objectUrl = URL.createObjectURL(artworkRecord.blob);
      }
    } catch (e) { console.warn('[gallery] listArtworks failed', e); }
  }

  const body = renderStepBody(step);
  const footer = renderNavFooter(step, idx);
  document.getElementById('screen-content').innerHTML = `<div class="screen active">${body}${footer}</div>`;
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'yokai-in-the-great-wave');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  renderCurrentScreen();
}

init();
</script>
</body>
</html>
