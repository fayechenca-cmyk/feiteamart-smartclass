<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet the Apple · Interactive Intro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#1a1512; overflow:hidden; font-family:-apple-system,'Segoe UI',sans-serif; }
  #stage { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #apple-img { max-width:92%; max-height:78%; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #clip-img { position:absolute; max-width:70%; max-height:60%; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); opacity:0; transition:opacity .8s; }
  #clip-img.show { opacity:1; }
  /* Caption safe area: top third, never blocked by controls */
  #caption { position:absolute; top:6%; left:50%; transform:translateX(-50%); width:88%; text-align:center;
    color:#fff; font-size:clamp(18px,3.2vw,30px); font-weight:600; line-height:1.4;
    text-shadow:0 2px 12px rgba(0,0,0,.8); opacity:0; transition:opacity .5s; pointer-events:none; z-index:20; }
  #caption.show { opacity:1; }
  /* Highlight pulses */
  #highlights { position:absolute; inset:0; pointer-events:none; z-index:15; }
  .hl { position:absolute; width:72px; height:72px; margin:-36px 0 0 -36px; border-radius:50%;
    border:3px solid #ffd54a; box-shadow:0 0 0 6px rgba(255,213,74,.25), 0 0 24px rgba(255,213,74,.6);
    opacity:0; transform:scale(.6); transition:opacity .4s, transform .4s; pointer-events:auto; cursor:pointer;
    animation:pulse 1.6s ease-in-out infinite; }
  .hl.show { opacity:1; transform:scale(1); }
  .hl .tag { position:absolute; bottom:110%; left:50%; transform:translateX(-50%); white-space:nowrap;
    background:rgba(20,16,12,.92); color:#ffd54a; font-size:14px; font-weight:700; padding:6px 12px;
    border-radius:20px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .hl.show .tag, .hl:hover .tag { opacity:1; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 6px rgba(255,213,74,.25),0 0 24px rgba(255,213,74,.6);} 50%{ box-shadow:0 0 0 12px rgba(255,213,74,.12),0 0 36px rgba(255,213,74,.9);} }
  /* Title card */
  #title-card { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(18,14,11,.72); z-index:30; transition:opacity .8s; }
  #title-card.hide { opacity:0; pointer-events:none; }
  #title-card h1 { color:#fff; font-size:clamp(36px,7vw,64px); font-weight:800; letter-spacing:.02em; margin-bottom:12px; }
  #title-card p { color:#d8cfc4; font-size:clamp(15px,2.4vw,20px); margin-bottom:32px; }
  #begin-btn { background:#ffd54a; color:#221a10; border:none; font-size:20px; font-weight:800; padding:16px 52px;
    border-radius:40px; cursor:pointer; box-shadow:0 8px 30px rgba(255,213,74,.35); transition:transform .2s; }
  #begin-btn:hover { transform:scale(1.05); }
  /* End card */
  #end-card { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(18,14,11,.78); z-index:30; }
  #end-card.show { display:flex; }
  #end-card h2 { color:#fff; font-size:clamp(28px,5vw,44px); margin-bottom:24px; }
  #enter-btn { background:#ffd54a; color:#221a10; border:none; font-size:19px; font-weight:800; padding:15px 48px;
    border-radius:40px; cursor:pointer; }
  /* Progress dots */
  #dots { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:20; }
  #dots span { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.28); transition:background .3s; }
  #dots span.on { background:#ffd54a; }
  #mute-btn { position:absolute; top:4%; right:4%; z-index:40; background:rgba(255,255,255,.14); color:#fff;
    border:none; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<div id="stage">
  <img id="apple-img" src="" alt="Apple study">
  <img id="clip-img" src="" alt="">
  <div id="highlights"></div>
  <div id="caption"></div>
  <div id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <button id="mute-btn" title="Mute">🔊</button>
  <div id="title-card">
    <h1>🍎 The Apple</h1>
    <p>Your first real still life · with light background music</p>
    <button id="begin-btn">Begin ▸</button>
  </div>
  <div id="end-card">
    <h2>Let's draw it together.</h2>
    <button id="enter-btn">Enter the lesson ▸</button>
  </div>
</div>
<audio id="music" loop preload="auto"></audio>
<audio id="narr" preload="auto"></audio>
<script>
(function(){
  const BASE = document.currentScript ? document.currentScript.src.replace(/\/[^\/]*$/,'') : '.';
  const $ = id => document.getElementById(id);
  const appleImg = $('apple-img'), clipImg = $('clip-img'), caption = $('caption'),
        hlBox = $('highlights'), dots = [...document.querySelectorAll('#dots span')],
        music = $('music'), narr = $('narr');

  // Apple image: use the finished study already in the repo
  appleImg.src = '../../assets/sketch-support/finals/apple.jpg';
  music.src = BASE + '/music.mp3';
  music.volume = 0.35;

  const LINES = [
    { audio:'narr-0.mp3', text:'Meet the apple — your first real still life.',
      show:'apple', caption:'Meet the apple — your first real still life.' },
    { audio:'narr-1.mp3', text:'Underneath, it\'s a sphere. But a sphere with personality.',
      show:'clips', clips:['clip-c-15.jpg','clip-c-90.jpg'],
      caption:'Underneath, it\'s a sphere — with personality.' },
    { audio:'narr-2.mp3', text:'A dent at the top. A lean to one side. A stem.',
      show:'apple-hl',
      highlights:[
        { x:50, y:30, label:'The dent — where the stem sits' },
        { x:36, y:58, label:'The lean — no apple is symmetrical' },
        { x:50, y:22, label:'The stem' }
      ],
      caption:'A dent at the top. A lean to one side. A stem.' },
    { audio:'narr-3.mp3', text:'Watch how light wraps around the form.',
      show:'apple', caption:'Watch how light wraps around the form.' },
    { audio:'narr-4.mp3', text:'You\'ll build it yourself — step by step.',
      show:'clips', clips:['clip-c-130.jpg','clip-c-45.jpg'],
      caption:'You\'ll build it yourself — step by step.' },
    { audio:'narr-5.mp3', text:'Let\'s begin.',
      show:'apple', caption:'Let\'s begin.' }
  ];

  let idx = -1, muted = false;
  $('mute-btn').onclick = () => {
    muted = !muted;
    music.muted = narr.muted = muted;
    $('mute-btn').textContent = muted ? '🔇' : '🔊';
  };

  function setDot(i){ dots.forEach((d,k)=>d.classList.toggle('on', k===i)); }
  function setCaption(t){
    caption.classList.remove('show');
    setTimeout(()=>{ caption.textContent = t; caption.classList.add('show'); }, 250);
  }
  function clearHL(){ hlBox.innerHTML=''; }
  function showHL(list, staggerMs){
    clearHL();
    list.forEach((h,i)=>{
      setTimeout(()=>{
        const d = document.createElement('div');
        d.className='hl';
        d.style.left = h.x+'%'; d.style.top = h.y+'%';
        d.innerHTML = '<span class="tag">'+h.label+'</span>';
        d.onclick = ()=>{ d.querySelector('.tag').style.opacity='1'; };
        hlBox.appendChild(d);
        requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));
      }, i*(staggerMs||900));
    });
  }

  let clipTimer = null;
  function playClips(files){
    appleImg.style.opacity = '0.25';
    let ci = 0;
    const next = ()=>{
      clipImg.src = BASE + '/' + files[ci % files.length];
      clipImg.classList.add('show');
      ci++;
    };
    next();
    clipTimer = setInterval(next, 2200);
  }
  function stopClips(){
    if (clipTimer){ clearInterval(clipTimer); clipTimer=null; }
    clipImg.classList.remove('show');
    appleImg.style.opacity = '1';
  }

  function playLine(i){
    if (i >= LINES.length){ finish(); return; }
    idx = i;
    const L = LINES[i];
    setDot(i); setCaption(L.text); clearHL(); stopClips();
    if (L.show==='clips') playClips(L.clips);
    if (L.show==='apple-hl'){
      // highlights appear staggered, timed inside the 4.3s line
      showHL(L.highlights, 1100);
    }
    narr.src = BASE + '/' + L.audio;
    narr.onended = ()=> setTimeout(()=>playLine(i+1), 650);
    narr.play().catch(()=>playLine(i+1));
  }

  function finish(){
    setCaption('');
    $('end-card').classList.add('show');
  }

  $('begin-btn').onclick = ()=>{
    $('title-card').classList.add('hide');
    music.play().catch(()=>{});
    // gentle fade-in for music
    let v = 0;
    const f = setInterval(()=>{ v+=0.05; if(v>=0.35){v=0.35;clearInterval(f);} music.volume=v; },200);
    setTimeout(()=>playLine(0), 600);
  };
  $('enter-btn').onclick = ()=>{
    // Tell parent lesson to advance past the intro
    try{ window.parent.postMessage({type:'apple-intro-done'}, '*'); }catch(e){}
    // Fallback: scroll to lesson
    try{ window.top.postMessage({type:'apple-intro-done'}, '*'); }catch(e){}
  };
})();
</script>
</body>
</html>
