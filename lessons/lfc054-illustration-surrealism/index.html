<!DOCTYPE html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#aec6d8;
  --sky-deep:#7fa0b8;
  --cream:#faf3e6;
  --peach:#f3cfae;
  --violet:#8f7ab5;
  --violet-deep:#5f4a85;
  --ink-blue:#22314f;
  --ink:#2a2438;
  --ink-soft:rgba(42,36,56,.66);
  --ink-faint:rgba(42,36,56,.42);
  --red:#e0453a;
  --yellow:#f0c23e;
  --green:#4d9c72;
  --line:rgba(42,36,56,.16);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden;
}
.display{font-family:'Fraunces',serif;}
button{font-family:'Nunito',sans-serif;}

/* soft drawing-paper grain */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(42,36,56,.045) 1px, transparent 1.3px);
  background-size:5px 5px;opacity:.6;
}

#app{position:relative;min-height:100vh;padding-bottom:44px;z-index:1;}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;position:sticky;top:0;z-index:500;
  background:linear-gradient(var(--cream) 78%, transparent);
}
.back-link{font-size:12px;color:var(--violet-deep);text-decoration:none;font-weight:800;letter-spacing:.2px;}
.map-btn{
  border:2px solid var(--ink-blue);background:var(--cream);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink-blue);
  box-shadow:2px 3px 0 var(--ink-blue);
}
.map-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink-blue);}
.zone-pill{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:#fff;background:var(--violet);padding:4px 9px;border-radius:999px;}

/* ---------- Screens ---------- */
.screen{display:none;max-width:640px;margin:0 auto;padding:6px 20px 40px;position:relative;}
.screen.active{display:block;animation:surrealIn .45s ease;}
@keyframes surrealIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);text-align:center;font-weight:800;margin-bottom:6px;}
.s-title{font-family:'Fraunces',serif;font-weight:700;font-size:1.85rem;text-align:center;margin:0 0 6px;color:var(--ink-blue);}
.s-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
.sur-btn{
  font-weight:800;font-size:13.5px;padding:11px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--ink-blue);background:transparent;color:var(--ink-blue);
  transition:transform .12s ease;
}
.sur-btn:active{transform:scale(.96);}
.sur-btn.primary{background:var(--violet);border-color:var(--violet-deep);color:#fff;}
.sur-btn.red{background:var(--red);border-color:var(--red);color:#fff;}
.sur-btn:disabled{opacity:.3;cursor:not-allowed;}
.sur-btn.wide{width:100%;text-align:center;display:block;text-decoration:none;}

.credit-line{font-size:10px;color:var(--ink-faint);text-align:center;margin-top:6px;line-height:1.5;font-style:italic;padding:0 8px;}
.video-embed-wrap{margin:14px 0 8px;border-radius:6px;overflow:hidden;box-shadow:0 10px 26px rgba(34,49,79,.28);}

/* ---------- COURSE MAP (screen-map) ---------- */
.map-header{text-align:center;margin:6px 0 22px;}
.map-header h1{font-size:2.1rem;margin:4px 0 4px;}
.map-header p{font-size:13px;color:var(--ink-soft);margin:0;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative;}
@media(min-width:480px){.zone-grid{grid-template-columns:1fr 1fr 1fr;}}
.zone-tile{
  position:relative;background:var(--cream);border:2.5px solid var(--ink-blue);border-radius:14px;
  padding:20px 10px 16px;text-align:center;cursor:pointer;overflow:visible;
  box-shadow:4px 5px 0 rgba(34,49,79,.18);transition:transform .15s ease;
}
.zone-tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(34,49,79,.18);}
.zone-tile .zt-icon{font-size:1.9rem;}
.zone-tile .zt-label{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;margin-top:6px;color:var(--ink-blue);}
.zone-tile .zt-count{font-size:10px;color:var(--ink-faint);margin-top:2px;font-weight:700;}
.zone-tile:nth-child(1){transform:rotate(-2deg);}
.zone-tile:nth-child(2){transform:rotate(1.5deg);margin-top:10px;}
.zone-tile:nth-child(3){transform:rotate(-1deg);}
.zone-tile:nth-child(4){transform:rotate(2deg);}
.zone-tile:nth-child(5){transform:rotate(-1.5deg);margin-top:8px;}
.zone-tile:nth-child(6){transform:rotate(1deg);}
/* a fish that swims halfway outside the second tile — the interface
   itself behaves like the lesson it teaches */
.map-fish{position:absolute;font-size:1.5rem;right:-14px;bottom:-10px;animation:fishSwim 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes fishSwim{0%,100%{transform:translateX(0) rotate(0deg);}50%{transform:translateX(-6px) rotate(-8deg);}}
.map-house-float{position:absolute;font-size:1.4rem;left:-16px;top:-14px;animation:houseFloat 4s ease-in-out infinite;pointer-events:none;}
@keyframes houseFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-10px) rotate(3deg);}}

/* ---------- Screen 1: Enter the Surreal World ---------- */
.dream-stage{height:42vh;min-height:240px;max-height:340px;position:relative;overflow:visible;margin-bottom:10px;}
.dream-scene{position:absolute;inset:0;}
.dream-item{position:absolute;}
.di-fish{font-size:2.4rem;left:8%;top:38%;animation:driftFish 6s ease-in-out infinite;}
@keyframes driftFish{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(60px,-14px) rotate(8deg);}}
.di-house{font-size:2.6rem;right:12%;top:14%;animation:driftHouse 5s ease-in-out infinite;}
@keyframes driftHouse{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-22px) rotate(4deg);}}
.di-shoe{font-size:2.1rem;left:14%;bottom:6%;}
.di-person{font-size:1.1rem;left:24%;bottom:9%;animation:tinyBob 3s ease-in-out infinite;}
@keyframes tinyBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.di-cloud{font-size:2.3rem;right:20%;bottom:20%;animation:driftCloud 7s ease-in-out infinite;}
@keyframes driftCloud{0%,100%{transform:translateX(0);}50%{transform:translateX(-18px);}}
.di-eye{font-size:1rem;right:24%;bottom:33%;animation:eyeBlink 4s ease-in-out infinite;}
@keyframes eyeBlink{0%,100%{opacity:1;transform:scale(1);}92%{opacity:1;}95%{opacity:.2;transform:scale(0.8);}98%{opacity:1;transform:scale(1);}}
.enter-title{text-align:center;font-size:2.3rem;margin:2px 0 4px;}
.enter-sub{text-align:center;font-size:13.5px;color:var(--ink-soft);max-width:340px;margin:0 auto 20px;line-height:1.6;}
.enter-cta{text-align:center;}

/* ---------- Screen 2: What Is Surrealism ---------- */
.pair-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.pair-card{
  width:130px;height:130px;border:2.5px solid var(--ink-blue);border-radius:12px;cursor:pointer;
  background:var(--cream);overflow:hidden;position:relative;box-shadow:3px 4px 0 rgba(34,49,79,.16);
}
.pair-card svg{width:100%;height:100%;display:block;}
.pair-card.picked{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,69,58,.3);}
.pair-card.wrong-pick{animation:shakeCard .4s ease;}
@keyframes shakeCard{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.pair-vs{align-self:center;font-family:'Fraunces',serif;font-style:italic;color:var(--ink-faint);font-size:13px;}
.surreal-reveal{text-align:center;font-family:'Fraunces',serif;font-size:1.2rem;color:var(--violet-deep);margin-top:14px;min-height:28px;}

/* ---------- Screen 3 / 5: hero artwork investigation ---------- */
.hero-stage{position:relative;overflow:hidden;border-radius:8px;box-shadow:0 14px 32px rgba(34,49,79,.32);border:2.5px solid var(--ink-blue);}
.hero-stage img{display:block;width:100%;height:auto;}
.hero-hotspot{position:absolute;border-radius:10px;cursor:pointer;}
.hero-hotspot.active{box-shadow:0 0 0 2px var(--red);animation:hotPulse 1s ease-in-out infinite;}
@keyframes hotPulse{0%,100%{box-shadow:0 0 0 2px var(--red);}50%{box-shadow:0 0 0 5px rgba(224,69,58,.4);}}
.hero-callout{margin-top:10px;background:#fff;padding:12px 14px;font-size:12.5px;line-height:1.5;min-height:20px;border:1.5px solid var(--line);border-radius:6px;}
.hero-callout .hc-label{font-weight:800;color:var(--violet-deep);margin-right:6px;}
.old-not-new{text-align:center;font-family:'Fraunces',serif;font-style:italic;font-size:1rem;color:var(--ink-soft);margin-top:16px;}

/* ---------- Screen 4: From Dreams to Surrealism ---------- */
.artist-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.artist-card{width:96px;text-align:center;}
.artist-card svg{width:60px;height:60px;margin:0 auto;}
.artist-card .ac-name{font-size:11px;font-weight:800;margin-top:6px;color:var(--ink-blue);}
.dream-arrow-line{text-align:center;font-size:1.6rem;margin:18px 0 6px;color:var(--violet);}

/* ---------- Screen 5: Alice ---------- */
.alice-room-stage{width:220px;height:220px;margin:14px auto 6px;position:relative;background:var(--peach);border:2.5px solid var(--ink-blue);border-radius:8px;overflow:hidden;}
.alice-room-stage svg{position:absolute;inset:0;width:100%;height:100%;}
#aliceFigure{transform-origin:center bottom;transition:transform .1s linear;}
.alice-slider-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:8px;}
.alice-slider-row input[type=range]{width:200px;}
.alice-slider-caption{display:flex;justify-content:space-between;width:200px;margin:2px auto 0;font-size:10.5px;color:var(--ink-faint);font-weight:800;}
.scale-shift-banner{text-align:center;font-family:'Fraunces',serif;font-size:1.3rem;color:var(--red);margin-top:10px;min-height:26px;font-weight:700;}

/* ---------- Trick screens (6-9) shared ---------- */
.trick-kicker{text-align:center;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--violet);margin-bottom:2px;}
.trick-scene{
  position:relative;width:100%;height:250px;margin:14px 0;border-radius:10px;overflow:hidden;
  border:2.5px solid var(--ink-blue);box-shadow:3px 5px 0 rgba(34,49,79,.15);
}
.wp-scene{background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 55%,#c9a877 55%,#c9a877 100%);}
.wp-bed{position:absolute;left:14%;bottom:8%;width:60%;height:22%;background:var(--peach);border:2px solid var(--ink-blue);border-radius:6px;}
.wp-window{position:absolute;right:8%;top:10%;width:60px;height:70px;background:#fff;border:2px solid var(--ink-blue);border-radius:4px;}
.wp-token{position:absolute;font-size:2rem;cursor:grab;touch-action:none;user-select:none;}
.wp-token.dropped{opacity:.4;pointer-events:none;}
.wp-tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
.wp-reaction{text-align:center;font-family:'Fraunces',serif;font-size:1.15rem;color:var(--red);margin-top:10px;min-height:26px;font-weight:700;}
.trick-prompt{text-align:center;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:10px;}

.fl-scene{background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky) 60%,#8a9c5e 60%,#8a9c5e 100%);}
.fl-object{position:absolute;left:50%;bottom:10%;font-size:3rem;transform:translateX(-50%);cursor:grab;touch-action:none;}
.fl-object.floating{animation:objFloat 2.4s ease-in-out infinite;}
@keyframes objFloat{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-8px);}}
.fl-choice-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.fl-choice{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:1.4rem;cursor:pointer;}
.fl-choice.picked{border-color:var(--violet);background:var(--cream);}
.gravity-toggle-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;}
.gravity-toggle{
  border:2px solid var(--ink-blue);background:#fff;border-radius:999px;padding:7px 16px;
  font-size:11.5px;font-weight:800;cursor:pointer;color:var(--ink-blue);
}
.gravity-toggle.off{background:var(--violet);border-color:var(--violet-deep);color:#fff;}

.ss-scene{background:radial-gradient(circle at 50% 100%, var(--peach) 0%, var(--cream) 70%);display:flex;align-items:center;justify-content:center;}
.ss-object{font-size:3rem;transition:transform .08s linear;}
.ss-choice-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.ss-slider-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px;}
.ss-slider-row input[type=range]{width:220px;}
.ss-caption{display:flex;justify-content:space-between;width:220px;margin:2px auto 0;font-size:10.5px;color:var(--ink-faint);font-weight:800;}
.ss-reaction{text-align:center;font-family:'Fraunces',serif;font-size:1.2rem;color:var(--red);margin-top:8px;min-height:26px;font-weight:700;}

.dc-slots-row{display:flex;justify-content:center;align-items:center;gap:14px;margin:12px 0;}
.dc-slot{width:80px;height:80px;border:2.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:#fff;}
.dc-slot.filled{border-style:solid;border-color:var(--violet);}
.dc-plus{font-size:1.4rem;color:var(--ink-faint);}
.dc-picker-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.dc-pick-btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:1.3rem;cursor:pointer;}
.dc-pick-btn.used{border-color:var(--violet);background:var(--cream);}
.dc-reveal{text-align:center;margin-top:14px;}
.dc-reveal-combo{font-size:2.6rem;position:relative;height:60px;}
.dc-reveal-combo span{position:absolute;left:50%;top:50%;}
.dc-reveal-combo span.a{transform:translate(-70%,-50%);}
.dc-reveal-combo span.b{transform:translate(-20%,-50%);opacity:.85;mix-blend-mode:multiply;}
.dc-reveal-label{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--violet-deep);margin-top:6px;font-weight:700;}
.dc-reveal-reaction{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:2px;}

/* ---------- Screen 10: Mix Your Tricks ---------- */
.trick-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.trick-pick-card{
  border:2.5px solid var(--ink-blue);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;
  background:#fff;box-shadow:3px 4px 0 rgba(34,49,79,.14);
}
.trick-pick-card.picked{background:var(--violet);border-color:var(--violet-deep);color:#fff;}
.trick-pick-card .tpc-icon{font-size:1.7rem;}
.trick-pick-card .tpc-label{font-size:11.5px;font-weight:800;margin-top:6px;}
.mix-result{text-align:center;font-family:'Fraunces',serif;font-size:1.3rem;color:var(--red);margin-top:18px;min-height:32px;font-weight:700;}
.mix-hint{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

/* ---------- Teacher doors hub ---------- */
.doors-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;}
.door-tile{cursor:pointer;text-align:center;}
.door-frame{
  position:relative;width:100%;aspect-ratio:3/4;background:var(--ink-blue);border-radius:50% 50% 6px 6px / 30% 30% 6px 6px;
  border:3px solid var(--ink);overflow:hidden;box-shadow:4px 6px 0 rgba(34,49,79,.2);
  transition:transform .5s cubic-bezier(.3,.7,.3,1.2);
}
.door-frame.opening{transform:rotateY(-65deg);}
.door-panel{
  position:absolute;inset:6px;border-radius:50% 50% 4px 4px / 28% 28% 4px 4px;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
}
.door-tile .dt-label{font-size:11.5px;font-weight:800;margin-top:8px;color:var(--ink-blue);}
.door-tile.visited .door-frame{box-shadow:4px 6px 0 rgba(34,49,79,.2), 0 0 0 3px var(--green);}
.door-tile .dt-check{font-size:10.5px;color:var(--green);font-weight:800;margin-top:2px;min-height:14px;}
.doors-hint{text-align:center;font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:18px;}

/* ---------- Teacher video screens ---------- */
.teacher-example-tag{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:2px;}
.after-prompt{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px;font-style:italic;}
.make-my-own-wrap{text-align:center;margin-top:12px;}

/* ---------- Create screens ---------- */
.idea-chip-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
.idea-chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:700;}
.idea-chip.picked{background:var(--red);border-color:var(--red);color:#fff;}
.surprise-wrap{text-align:center;margin:20px 0;}
.surprise-line{
  background:var(--cream);border:2px dashed var(--violet);border-radius:10px;padding:14px;
  font-family:'Fraunces',serif;font-style:italic;font-size:1.05rem;color:var(--violet-deep);margin-bottom:10px;min-height:26px;
}
.studio-reminders{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.studio-reminder{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;}
.studio-reminder .sr-icon{font-size:1.3rem;}
.need-example-wrap{text-align:center;margin-top:20px;}
.need-example-link{font-size:12.5px;color:var(--violet-deep);font-weight:800;text-decoration:none;}

/* ---------- Share screen ---------- */
.upload-slot-wrap{display:flex;flex-direction:column;align-items:center;margin-top:8px;}
.upload-slot{
  position:relative;width:210px;height:210px;border-radius:10px;border:2.5px dashed var(--violet);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
}
.upload-slot.saving{border-color:var(--red);}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-slot .slot-plus{font-size:30px;color:var(--violet);}
.upload-slot .slot-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:6px;padding:0 16px;text-align:center;}
.surreal-frame{
  width:230px;margin:20px auto 6px;padding:12px;background:#fff;border:2.5px solid var(--ink-blue);
  box-shadow:6px 8px 0 rgba(34,49,79,.16);transform:rotate(-2deg);animation:frameFloat 3.4s ease-in-out infinite;
}
@keyframes frameFloat{0%,100%{transform:rotate(-2deg) translateY(0);}50%{transform:rotate(-1deg) translateY(-6px);}}
.surreal-frame img{width:100%;display:block;}
.reflect-label{text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--ink-faint);margin:22px 0 8px;text-transform:uppercase;}
.reflect-check-row{display:flex;flex-direction:column;gap:8px;max-width:280px;margin:0 auto;}
.reflect-check{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;}
.reflect-check.checked{border-color:var(--violet);background:var(--cream);}
.reflect-check .rc-box{width:18px;height:18px;border:2px solid var(--ink-blue);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.reflect-check.checked .rc-box{background:var(--violet);border-color:var(--violet-deep);color:#fff;}
.share-final-line{text-align:center;font-family:'Fraunces',serif;font-style:italic;font-size:1.15rem;color:var(--ink-blue);margin:22px 0 4px;}

/* ============================================================
   IndexedDB — finished-artwork photo storage
============================================================ */
const DB_NAME = 'fei_illustration_surrealism_storage';
const DB_VERSION = 1;
const STORE_NAME = 'artworks';
const PIECE_ID = 'piece_001';
const MAX_EDGE = 1400;
const JPEG_QUALITY = 0.87;
let _dbPromise = null;
function isStorageSupported(){ return !!window.indexedDB; }
function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!isStorageSupported()) { reject(new Error('IndexedDB not available')); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('pieceId', 'pieceId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB'));
  });
  return _dbPromise;
}
function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileOrBlob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      const longestEdge = Math.max(width, height);
      if (longestEdge > MAX_EDGE) {
        const scale = MAX_EDGE / longestEdge;
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Compression failed')); }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
    img.src = url;
  });
}
async function saveArtwork(pieceId, fileOrBlob){
  const compressed = await compressImage(fileOrBlob);
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const record = { id: pieceId + '::' + Date.now(), pieceId: pieceId, blob: compressed, savedAt: Date.now() };
    const req = store.put(record);
    req.onsuccess = () => resolve(record);
    req.onerror = () => reject(req.error);
  });
}
async function listArtworks(pieceId){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const index = store.index('pieceId');
    const req = index.getAll(IDBKeyRange.only(pieceId));
    req.onsuccess = () => { const rows = req.result || []; rows.sort((a, b) => b.savedAt - a.savedAt); resolve(rows); };
    req.onerror = () => reject(req.error);
  });
}

function wpStartDrag(e, id){
  if (STATE.wpDropped.includes(id)) return;
  const el = document.getElementById('wp-tok-' + id);
  el.setPointerCapture(e.pointerId);
  const scene = document.getElementById('wpScene');
  const sceneRect = scene.getBoundingClientRect();
  function move(ev){
    const x = ev.clientX - sceneRect.left, y = ev.clientY - sceneRect.top;
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.position = 'absolute';
  }
  function up(ev){
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    const x = ev.clientX - sceneRect.left, y = ev.clientY - sceneRect.top;
    if (x > 0 && x < sceneRect.width && y > 0 && y < sceneRect.height) {
      wpDrop(id);
    }
  }
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
}
function wpDrop(id){
  if (STATE.wpDropped.includes(id)) return;
  STATE.wpDropped.push(id);
  saveState();
  const el = document.getElementById('wp-tok-' + id);
  if (el) el.classList.add('dropped');
  const reaction = document.getElementById('wpReaction');
  reaction.textContent = "That shouldn't be there!";
  setTimeout(() => { if (STATE.wpDropped.length > 0) reaction.textContent = 'WRONG PLACE ✓'; STATE.wpDone = true; saveState(); }, 900);
}

  return `

function flStartDrag(e){
  const el = document.getElementById('flObject');
  if (!el) return;
  el.setPointerCapture(e.pointerId);
  const scene = document.getElementById('flScene');
  const sceneRect = scene.getBoundingClientRect();
  const startY = e.clientY;
  function move(ev){
    const dy = startY - ev.clientY;

      STATE.flFloating = true; STATE.flDone = true; saveState();
      el.classList.add('floating');
      el.style.bottom = '';
      el.style.top = '30%';
    }
  }
  function up(){
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
  }
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
}
function flToggleGravity(){
  STATE.flGravityOff = !STATE.flGravityOff;

    if (el) { el.classList.add('floating'); el.style.bottom = ''; el.style.top = '30%'; }
  } else {

async function onFileSelected(event){

  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please choose an image file (JPG or PNG).'); return; }
  saving = true;
  refreshUploadUI();
  try {
    const record = await saveArtwork(PIECE_ID, file);
    artworkRecord = record;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(record.blob);
  } catch (e) {

  saving = false;
  refreshUploadUI();
}
function refreshUploadUI(){
  const wrap = document.getElementById('uploadSlotWrap');
  const frameWrap = document.getElementById('surrealFrameWrap');
  if (!wrap) return;
  if (saving) {
    wrap.innerHTML = `<div class="upload-slot saving"><div class="slot-plus">⏳</div><div class="slot-label">Saving…</div></div>`;
  } else if (artworkRecord) {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><img src="${objectUrl}" alt="Your surreal artwork"></div>`;
    if (frameWrap) frameWrap.innerHTML = `<div class="surreal-frame"><img src="${objectUrl}" alt="Your surreal artwork"></div>`;
  } else {
    wrap.innerHTML = `<div class="upload-slot" onclick="triggerUpload()"><div class="slot-plus">+</div><div class="slot-label">Upload My Artwork</div></div>`;
  }
}

    <p class="share-final-line">Every dream looks different.</p>
    <p class="share-credit">FEI TeamArt · Creation — Led by Mrs. Dawn Wang.</p>
  `;
}

/* ============================================================
   DISPATCH + RENDER
============================================================ */
async function renderCurrentStage(){
  const contentEl = document.getElementById('screen-content');
  const zonePill = document.getElementById('zonePill');

  if (currentStageId === 'screen-map') {
    zonePill.textContent = '';
    contentEl.innerHTML = `<div class="screen active">${renderMap()}</div>`;
    window.scrollTo(0, 0);
    return;
  }

  const stage = STAGES.find(s => s.id === currentStageId);
  if (!stage) { goMap(); return; }
  zonePill.textContent = ZONES.find(z => z.id === stage.zone).label;

  if (stage.id === 'share' && !artworkRecord && isStorageSupported()) {
    try {
      const rows = await listArtworks(PIECE_ID);
      if (rows.length) { artworkRecord = rows[0]; objectUrl = URL.createObjectURL(artworkRecord.blob); }
    } catch (e) { console.warn('[share] listArtworks failed', e); }
  }

  contentEl.innerHTML = `<div class="screen active">${stage.render()}${renderNav(stage)}</div>`;
  window.scrollTo(0, 0);
  if (stage.id === 'share') refreshUploadUI();
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  if (window.FEIAccess) {
    try {
      await window.FEIAccess.init();
      const ok = await window.FEIAccess.gateLessonPage('creation', 'lfc054');
      if (!ok) return;
    } catch (e) {
      console.warn('[init] gateLessonPage failed, continuing', e);
    }
  }
  loadState();
  renderCurrentStage();
}

init();
</script>
