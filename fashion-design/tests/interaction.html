<!doctype html><meta charset="utf-8"><title>Fashion tracing QA</title>
<style>body{font:16px system-ui;padding:20px}iframe{width:100%;height:820px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>Fashion tracing interaction checks</h1><button id="run">Run isolated local checks</button><pre id="results">Ready. Uses a temporary guest progress backup; never submits to a server.</pre><iframe id="lesson" src="../?v=teacher-sequence-2#lesson"></iframe>
<script>
const report=document.querySelector('#results'),frame=document.querySelector('iframe');
const tick=(ms=60)=>new Promise(r=>setTimeout(r,ms));
function assert(value,msg){if(!value)throw Error(msg);report.textContent+='\nPASS '+msg;}
function click(selector){const node=frame.contentDocument.querySelector(selector);if(!node)throw Error('Missing '+selector);if(node.click)node.click();else node.dispatchEvent(new frame.contentWindow.MouseEvent('click',{bubbles:true}));}
async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.contentWindow.location.reload();});await tick();}
document.querySelector('#run').onclick=async()=>{
 if(!['localhost','127.0.0.1','::1'].includes(location.hostname)){report.textContent='仅允许在本地开发服务器运行。';return;}
 const profile=JSON.parse(sessionStorage.getItem('fei_user_profile')||localStorage.getItem('fei_user_profile')||'null');if(profile&&(profile.supabaseUserId||profile.studentCode||profile.learnerId)){report.textContent='请在未登录的本地测试会话运行，避免改动个人进度。';return;}
 const key='fei_fashion_v2:guest:standing-demo',backup=localStorage.getItem(key);document.querySelector('#run').disabled=true;report.textContent='Running…';
 try{
 await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});localStorage.removeItem(key);await new Promise(resolve=>{frame.onload=resolve;frame.src='../?v=guided-voice-flow-2#lesson';});await tick();assert(frame.contentDocument.querySelectorAll('.ratio-example').length===2,'intro compares ordinary and fashion head-unit proportions');assert(frame.contentDocument.querySelector('[data-action="listen-intro"]'),'intro narration starts automatically and can be replayed');click('[data-action="grid"]');assert(frame.contentDocument.querySelector('.grid-figure svg'),'nine-head guide includes the figure');assert(frame.contentDocument.querySelector('[data-action="intro"]'),'guide has a working back control');await tick(12000);assert(frame.contentDocument.querySelectorAll('.unit-grid i.visible').length===10,'ten grid lines build automatically');assert(frame.contentDocument.querySelectorAll('.grid-label.visible').length===8,'body labels appear with the explanation');assert(!frame.contentDocument.querySelector('[data-action="draw"]').disabled,'drawing unlocks after the visual explanation');click('[data-action="draw"]');assert(frame.contentDocument.querySelector('[data-action="listen-step"]'),'every drawing step has replayable narration');assert(!frame.contentDocument.body.textContent.includes('Continue →'),'drawing does not require repetitive continue clicks');
 let w=frame.contentWindow,L=w.FashionLesson,T=w.FEITracing;
 for(const st of L.steps.filter(st=>st.path)){const p=w.document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',st.path);const ref=T.sample(p);assert(T.assess(ref,ref,st,'mouse').ok,st.id+' ideal stroke accepted');const wobbly=ref.map((p,i)=>({x:p.x+Math.sin(i)*7,y:p.y+Math.cos(i)*7}));assert(T.assess(wobbly,ref,st,'touch').ok,st.id+' natural touch wobble accepted');assert(!T.assess(ref.map(p=>({x:p.x+90,y:p.y})),ref,st,'mouse').ok,st.id+' displaced stroke rejected');if(p.getTotalLength()>100)assert(!T.assess([...ref].reverse(),ref,st,'mouse').ok,st.id+' reversed long stroke rejected');}
 async function trace(index,pointerType='mouse',offset=0){w=frame.contentWindow;L=w.FashionLesson;T=w.FEITracing;if(L.steps[index].kind==='locate'){click('[data-point="ankle-free"]');assert(frame.contentDocument.querySelector('#feedback').textContent.includes('other ankle'),'wrong supporting ankle gives a retry');click('[data-point="ankle-support"]');return;}const s=w.document.querySelector('#board svg'),p=w.document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',L.steps[index].path);const ref=T.sample(p);const matrix=s.getScreenCTM();s.setPointerCapture=()=>{};s.releasePointerCapture=()=>{};for(let i=0;i<ref.length;i++){const point=new w.DOMPoint(ref[i].x+offset,ref[i].y).matrixTransform(matrix);s.dispatchEvent(new w.PointerEvent(i===0?'pointerdown':i===ref.length-1?'pointerup':'pointermove',{bubbles:true,pointerId:91,pointerType,clientX:point.x,clientY:point.y,button:0}));}await tick();}
 const boardBefore=frame.contentDocument.querySelector('#board svg');
 assert(Number(boardBefore.viewBox.baseVal.height)<L.canvas.height,'current body area is enlarged instead of showing the tiny full figure');
 await trace(0,'mouse',80);assert(!frame.contentDocument.querySelector('#feedback').textContent.includes('Moving to the next step'),'bad stroke does not auto-pass');
 assert(frame.contentDocument.querySelector('#board svg')===boardBefore,'failed stroke does not rebuild or shake the page');
 assert(frame.contentDocument.querySelectorAll('[data-stroke="head-circle"]').length===1,'failed attempt remains visible for comparison');
 await trace(0);assert(frame.contentDocument.querySelector('#feedback').textContent.includes('Moving to the next step'),'accepted stroke schedules automatic advance');
 assert(frame.contentDocument.querySelector('#board svg')===boardBefore,'successful stroke stays on the same drawing surface');
 assert(frame.contentDocument.querySelectorAll('[data-stroke="head-circle"]').length===1,'redrawing replaces only the current attempt');
 click('[data-action="undo"]');assert(frame.contentDocument.querySelectorAll('[data-stroke="head-circle"]').length===1,'undo restores failed attempt');click('[data-action="redo"]');assert(frame.contentDocument.querySelectorAll('[data-stroke="head-circle"]').length===1,'redo restores accepted stroke');
 await reload();assert(frame.contentDocument.querySelectorAll('[data-stroke="head-circle"]').length===1,'refresh restores head and current step');
 for(let i=0;i<L.steps.length;i++){await trace(i,i%2?'touch':'pen');await tick(950);}
 let saved=JSON.parse(localStorage.getItem(key));assert(L.steps[0].id==='head-circle'&&L.steps[1].id==='jaw'&&L.steps[2].id==='shoulder-line'&&L.steps[3].id==='waist-line'&&L.steps[4].id==='hip-line','head pair precedes shoulder, waist and hip lines');assert(L.steps.findIndex(s=>s.id==='neck-left')>L.steps.findIndex(s=>s.id==='free-foot'),'neck comes after legs and feet');assert(saved.runs.follow.completed&&Object.keys(saved.runs.follow.strokes).length===L.steps.length,'complete all teacher-directed activities and phase reviews');
 assert(frame.contentDocument.querySelectorAll('.pose-card').length===4,'four-pose practice sheet appears after the first figure');assert(frame.contentDocument.querySelector('#pose-thumb-0 svg'),'finished first figure remains visible in the practice sheet');
 const blob=await frame.contentWindow.FEITracing.exportPNG(frame.contentWindow.FashionLesson,saved.runs.follow.strokes);assert(blob.type==='image/png'&&blob.size>1000,'PNG export contains image bytes');
 click('[data-action="practice"]');assert(frame.contentDocument.querySelector('[data-mode="try"]').getAttribute('aria-pressed')==='true','Try Again opens with separate drawing');
 await trace(0,'touch');saved=JSON.parse(localStorage.getItem(key));assert(Object.keys(saved.runs.follow.strokes).length===L.steps.length&&Object.keys(saved.runs.try.strokes).length===1,'mode switch preserves earlier work');
 click('[data-mode="own"]');assert(!frame.contentDocument.querySelector('#guides').checked,'On Your Own starts without guides');
 frame.style.width='390px';await tick();await trace(0,'touch');assert(frame.contentDocument.querySelector('#feedback').textContent.includes('Moving to the next step'),'390px touch pointer coordinates stay aligned');
 frame.style.width='768px';await tick(950);await trace(1,'pen');assert(frame.contentDocument.querySelector('#feedback').textContent.includes('Moving to the next step'),'768px pen coordinates stay aligned');
 click('[data-action="clear"]');assert(!frame.contentDocument.querySelector('[data-stroke="jaw"]'),'clear removes only the current stroke');saved=JSON.parse(localStorage.getItem(key));assert(saved.runs.own.strokes['head-circle'].status==='passed','clear preserves other strokes');click('[data-action="skip"]');assert(frame.contentDocument.querySelector('#feedback').textContent.includes('Moving to the next step'),'skip schedules automatic advance');await reload();saved=JSON.parse(localStorage.getItem(key));assert(saved.runs.own.strokes.jaw.status==='skipped','skip marker survives refresh');assert(frame.contentWindow.getComputedStyle(frame.contentDocument.querySelector('#board svg')).touchAction==='none','drawing surface suppresses touch scrolling');
 frame.contentWindow.location.hash='paper';await tick();assert(frame.contentDocument.querySelectorAll('.paper-sheet').length===3,'three paper levels available');const check=frame.contentDocument.querySelector('#paper-done');check.click();await reload();assert(frame.contentDocument.querySelector('#paper-done').checked,'paper completion survives refresh independently');
 assert(frame.contentDocument.querySelectorAll('.paper-step svg').length===L.steps.length,'paper step diagrams all rendered');
 report.textContent+='\nALL CHECKS PASSED. Synthetic events cover geometry and state; verify a native drag separately.';
 }catch(e){report.textContent+='\nFAIL '+e.stack;}finally{await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);document.querySelector('#run').disabled=false;}
};
if(new URLSearchParams(location.search).get('autorun')==='1')setTimeout(()=>document.querySelector('#run').click(),100);
</script>
